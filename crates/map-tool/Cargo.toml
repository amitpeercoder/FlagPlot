[package]
name = "map-tool"
description = "Flag Plot map tool: generates the hex map from Natural Earth coastlines, and renders and checks it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sim-core.workspace = true
sim-data.workspace = true
# The anchors file is read with the CSV reader sim-data already uses.
csv.workspace = true
# Only the .shp geometry is read; no attribute (.dbf) files are opened.
shapefile = { version = "0.9", default-features = false }

[lints]
workspace = true
