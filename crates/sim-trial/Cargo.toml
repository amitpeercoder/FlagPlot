[package]
name = "sim-trial"
description = "Flag Plot trials: the pictures of a world a side may be tried in, made from its view and what it believed by written rules, and the worlds built from them (decision 0174)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sim-core.workspace = true
sim-staff.workspace = true

[features]
# A means for tests only (decision 0175): `Playing::break_world_on`, which
# makes one world of a trial break an invariant on a day. Never enabled by a
# normal build; only the scenario tests ask for it.
test-means = ["sim-core/test-means"]

[dev-dependencies]
sim-data.workspace = true

[lints]
workspace = true
