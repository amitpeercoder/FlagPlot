[package]
name = "sim-trial"
description = "Flag Plot trials: the pictures of a world a side may be tried in, made from its view and what it believed by written rules, and the worlds built from them (decision 0174)."
version.workspace = true
edition.workspace = true
publish.workspace = true
# One test program for the package, not one for each file under `tests/`:
# building and linking them was most of a build. `tests/integration.rs`
# declares each file as a module.
autotests = false

[dependencies]
sim-core.workspace = true
sim-staff.workspace = true

[dev-dependencies]
sim-data.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
