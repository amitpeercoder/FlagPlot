[package]
name = "sim-cli"
description = "Flag Plot command-line runner."
version.workspace = true
edition.workspace = true
publish.workspace = true
# One test program for the package, not one for each file under `tests/`:
# building and linking them was most of a build. `tests/integration.rs`
# declares each file as a module.
autotests = false

[dependencies]
sim-core.workspace = true
sim-data.workspace = true
sim-staff.workspace = true
sim-trial.workspace = true
sim-agent = { path = "../sim-agent" }
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
toml.workspace = true

[dev-dependencies]
# The door of one seat holds a game as `mcp` does and is tested against
# `play` here, where the program is built (decision 0229, stage 2). A
# dev-dependency cycle: `sim-web` depends on this library.
sim-web = { path = "../sim-web" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
