[package]
name = "oob-derive"
description = "Flag Plot derivation tool: ship class figures for a scenario, derived from the facts in data/oob (decision 0020)."
version.workspace = true
edition.workspace = true
publish.workspace = true
# One test program for the package, not one for each file under `tests/`:
# building and linking them was most of a build. `tests/integration.rs`
# declares each file as a module.
autotests = false

[dependencies]
oob-check = { path = "../oob-check" }
toml.workspace = true
serde.workspace = true
csv.workspace = true

[dev-dependencies]
sim-core.workspace = true
sim-data.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
