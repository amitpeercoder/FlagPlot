[package]
name = "sim-data"
description = "Flag Plot data loading: reference data, maps and scenarios, with validation."
version.workspace = true
edition.workspace = true
publish.workspace = true
# One test program for the package, not one for each file under `tests/`:
# building and linking them was most of a build. `tests/integration.rs`
# declares each file as a module.
autotests = false

[dependencies]
sim-core.workspace = true
serde.workspace = true
toml.workspace = true
csv.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
