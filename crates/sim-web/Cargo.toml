[package]
name = "sim-web"
description = "Flag Plot's door of one seat: one game held and answered as `sim-cli mcp` answers it, for a build in the browser (decision 0229)."
version.workspace = true
edition.workspace = true
publish.workspace = true
# One test program for the package, not one for each file under `tests/`:
# building and linking them was most of a build. `tests/integration.rs`
# declares each file as a module.
autotests = false

[lib]
# The rlib is what the native tests and the program `door` use; the cdylib is
# the module for the browser (decision 0229, ruling 3).
crate-type = ["rlib", "cdylib"]

[dependencies]
sim-cli = { path = "../sim-cli" }
sim-agent = { path = "../sim-agent" }
sim-core.workspace = true
sim-data.workspace = true
serde_json.workspace = true

# The binding for JavaScript, compiled for the browser's target alone
# (decision 0229, ruling 4): pinned to one exact version, the same as the
# `wasm-bindgen` tool that `scripts/web/build.sh` runs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
