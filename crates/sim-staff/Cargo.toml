[package]
name = "sim-staff"
description = "Flag Plot staff: the doctrine a side's staff decides by, from its view alone (decision 0107)."
version.workspace = true
edition.workspace = true
publish.workspace = true
# One test program for the package, not one for each file under `tests/`:
# building and linking them was most of a build. `tests/integration.rs`
# declares each file as a module.
autotests = false

[dependencies]
sim-core.workspace = true

[dev-dependencies]
sim-data.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
