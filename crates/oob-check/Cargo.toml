[package]
name = "oob-check"
description = "Flag Plot checker for the order-of-battle facts files in data/oob."
version.workspace = true
edition.workspace = true
publish.workspace = true
# One test program for the package, not one for each file under `tests/`:
# building and linking them was most of a build. `tests/integration.rs`
# declares each file as a module.
autotests = false

[dependencies]
csv.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
