[package]
name = "sim-agent"
description = "Flag Plot agent interface: the briefing and the queries a player is given (decision 0048). Server mode and the MCP wrapper are still to come."
version.workspace = true
edition.workspace = true
publish.workspace = true
# One test program for the package, not one for each file under `tests/`:
# building and linking them was most of a build. `tests/integration.rs`
# declares each file as a module.
autotests = false

[dependencies]
sim-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
sim-data.workspace = true
sim-staff.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
