[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-data",
    "crates/sim-cli",
    "crates/sim-agent",
    "crates/sim-staff",
    "crates/sim-trial",
    "crates/map-tool",
    "crates/oob-check",
    "crates/oob-derive",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-data = { path = "crates/sim-data" }
sim-staff = { path = "crates/sim-staff" }
sim-trial = { path = "crates/sim-trial" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1"
csv = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# See clippy.toml for the lists these enforce.
disallowed_types = "deny"
disallowed_methods = "deny"

# Integer overflow must behave the same in every build profile, or debug and
# release runs could produce different state hashes.
[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true

# The profile the checks run tests in: optimized, as release is, with debug
# assertions and overflow checks on. The simulation is several times slower
# unoptimized, and running the tests was most of a check run.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
