name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The checks are split into jobs that run at the same time: format and lint,
# the tests in shards, and the command-line runs with the viewer's check. The
# last job, "Format, lint, test", is the check main requires: it waits for
# every other job and passes only when all of them passed, or when the
# commit changes documents alone and they were skipped.
jobs:
  changes:
    name: Decisions index and what changed
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      # Two commits deep, so the commit's first parent is there to compare
      # with.
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 2

      # The decisions index is made from the records' headers (decision
      # 0108, item 9). It runs on every commit, documents alone included,
      # since a new record changes nothing but Markdown.
      - name: Check the decisions index is what the records give
        run: sh scripts/decisions-index.sh --check

      # A change to documents alone cannot break the build: no test reads a
      # Markdown file. The required check still runs and reports, because
      # main requires it; only the jobs below are skipped.
      - name: See whether anything but documents changed
        id: changes
        run: echo "needed=$(sh .github/scripts/needs-checks.sh)" >> "$GITHUB_OUTPUT"

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      # with rustfmt and clippy.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Tests run in the `checked` profile (Cargo.toml): optimized, with debug
  # assertions and overflow checks on. Each package has one integration test
  # program (`tests/integration.rs`, and `tests/all.rs` for the scenario
  # tests), so the tests are not split by program but by test: cargo-nextest
  # (`--partition count:K/4`) gives each test of the workspace to exactly one
  # of shards 0 to 3, so a test added later is in one with no change here.
  # Each shard builds every test program with `--workspace`, so every shard
  # resolves the same features as the whole workspace does. Shard 4 runs the
  # documentation tests, which nextest does not run. Together they are what
  # `cargo test --workspace` runs. Nextest runs each test in a process of its
  # own, as `cargo test` ran each test file in one before the files were
  # joined, so a test that sets a variable or a working directory affects
  # nothing else.
  test:
    name: Test (shard ${{ matrix.shard }} of 5)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      NEXTEST_VERSION: 0.9.150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: shard-${{ matrix.shard }}

      # Built from source (without its self-update, which needs a C library
      # built) at the version pinned above and kept in the cache
      # under that version, as the binding tool of the web job is; no
      # program is downloaded ready made.
      - name: Keep nextest built for the pinned version
        if: matrix.shard != 4
        id: nextest
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cargo-nextest
          key: nextest-${{ env.NEXTEST_VERSION }}-${{ runner.os }}

      - name: Build nextest from source
        if: matrix.shard != 4 && steps.nextest.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --version "$NEXTEST_VERSION" --locked --no-default-features --features default-no-update --root ~/.cargo-nextest

      - name: Put nextest on the path
        if: matrix.shard != 4
        run: echo "$HOME/.cargo-nextest/bin" >> "$GITHUB_PATH"

      - name: Test
        if: matrix.shard != 4
        run: |
          cargo nextest run --workspace --locked --cargo-profile checked \
            --no-fail-fast --partition count:$(( ${{ matrix.shard }} + 1 ))/4

      - name: Documentation tests
        if: matrix.shard == 4
        run: cargo test --workspace --locked --profile checked --doc

  # The command-line program in the same profile as the tests.
  run-and-export:
    name: Run scenario 1, export every scenario, check the viewer
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Run scenario 1 from the command line
        run: cargo run --locked --profile checked -p sim-cli -- run data/scenarios/01_transit.toml --events

      # The export carries the state at each step (replay version 4); the
      # viewer's own rebuild from the events, in JavaScript, is what it
      # still uses for older files. Export every scenario and check the
      # steps end at the final state and agree with the rebuild.
      - name: Export every scenario and check the viewer reads it
        run: |
          mkdir -p viewer/replays
          for scenario in data/scenarios/*.toml; do
            cargo run --locked --profile checked -p sim-cli -- export "$scenario" --out "viewer/replays/$(basename "$scenario" .toml).json"
          done
          node viewer/check.js viewer/replays/*.json

  # The browser's build and its check (decision 0229, rulings 46 and 47): the
  # game as a module for the browser, compared in node with the native `door`
  # program built from the same commit in the same profile. The binding tool
  # is built from source at the version the crate pins and kept in the cache
  # under that version, so it is built once for each version; no program is
  # downloaded ready made. It reads no Markdown.
  web:
    name: Web build and its check
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      # rustup reads rust-toolchain.toml: the pinned toolchain with the
      # target wasm32-unknown-unknown.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Read the version of the binding the crate pins
        id: binding
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9][0-9.]*\)".*/\1/p' crates/sim-web/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Keep the binding tool built for that version
        id: tool
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cargo-wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.binding.outputs.version }}-${{ runner.os }}

      - name: Build the binding tool from source
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.binding.outputs.version }} --locked --root ~/.cargo-wasm-bindgen

      - name: Put the binding tool on the path
        run: echo "$HOME/.cargo-wasm-bindgen/bin" >> "$GITHUB_PATH"

      # The rest of the crate is linted natively by the lint job; the binding
      # module is compiled for the target alone, so it is linted here.
      - name: Lint the module for the target
        run: cargo clippy --locked --target wasm32-unknown-unknown -p sim-web --lib -- -D warnings

      - name: Build the module, the pack and the native door
        run: sh scripts/web/build.sh

      - name: Check the module against the native door
        run: node web/check.mjs

  # The check main requires, by this name. It runs whatever happened above
  # and fails unless the index check passed and every other job passed, or
  # every other job was skipped because only documents changed.
  check:
    name: Format, lint, test
    needs: [changes, lint, test, run-and-export, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.needed }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          EXPORT: ${{ needs.run-and-export.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "decisions index and what changed: $CHANGES (checks needed: $NEEDED)"
          echo "format and lint: $LINT"
          echo "tests: $TEST"
          echo "run and export: $EXPORT"
          echo "web build and its check: $WEB"
          if [ "$CHANGES" != success ]; then
            echo "The first job did not pass."
            exit 1
          fi
          if [ "$NEEDED" = false ]; then
            expected=skipped
          else
            expected=success
          fi
          for result in "$LINT" "$TEST" "$EXPORT" "$WEB"; do
            if [ "$result" != "$expected" ]; then
              echo "A job is $result, and $expected was needed."
              exit 1
            fi
          done
