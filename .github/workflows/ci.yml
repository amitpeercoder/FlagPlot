name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue builds each entry on a branch of its own and runs the
  # required check there; main then gets that very commit.
  merge_group:

permissions:
  contents: read
  # To read whether a commit already has a passing "Format, lint, test".
  checks: read

env:
  CARGO_TERM_COLOR: always
  # The version of cargo-nextest, built from source (.github/actions/nextest).
  NEXTEST_VERSION: 0.9.150

# The checks are split into jobs that run at the same time: format and lint,
# the tests in shards, the command-line runs with the viewer's check, the
# browser's build and the table's screen check. The
# last job, "Format, lint, test", is the check main requires: it waits for
# every other job and passes only when all of them passed, or when the
# commit changes documents alone and they were skipped.
jobs:
  changes:
    name: Decisions index and what changed
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      # Two commits deep, so the commit's first parent is there to compare
      # with.
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 2

      # The decisions index is made from the records' headers (decision
      # 0108, item 9). It runs on every commit, documents alone included,
      # since a new record changes nothing but Markdown.
      - name: Check the decisions index is what the records give
        run: sh scripts/decisions-index.sh --check

      # A change to documents alone cannot break the build: no test reads a
      # Markdown file. The required check still runs and reports, because
      # main requires it; only the jobs below are skipped.
      - name: See whether anything but documents changed
        id: changes
        run: echo "needed=$(sh .github/scripts/needs-checks.sh)" >> "$GITHUB_OUTPUT"

      # A push to main is the commit a merge queue (or a merge) made. If that
      # very commit, by its SHA, already has a passing "Format, lint, test"
      # check run from GitHub Actions, from the run of the queue entry, the
      # work is done and is not repeated. Only a push is asked: a pull
      # request or a queue entry is never skipped on this ground. Any doubt
      # (no answer, no such run) is "not tested", and everything runs.
      - name: See whether this commit has already passed
        id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "Format, lint, test" and .conclusion == "success" and .app.slug == "github-actions")] | length' \
            2>/dev/null) || passed=0
          if [ "${passed:-0}" -gt 0 ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA already has a passing Format, lint, test."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether the heavy jobs run
        id: decide
        env:
          CHANGED: ${{ steps.changes.outputs.needed }}
          ALREADY: ${{ steps.tested.outputs.already }}
        run: |
          if [ "$CHANGED" = true ] && [ "$ALREADY" != true ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      # with rustfmt and clippy.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Tests run in the `checked` profile (Cargo.toml): optimized, with debug
  # assertions and overflow checks on. Each package has one integration test
  # program (`tests/integration.rs`, and `tests/all.rs` for the scenario
  # tests). Building them was most of a run, and building them in every
  # shard repeated it, so they are built once, in `build-tests`, into an
  # archive (`cargo nextest archive`, with `--workspace` so it resolves the
  # same features as the whole workspace does), and the shards only run it.
  # Together with the timing test and the documentation tests (which nextest
  # does not run) these are what `cargo test --workspace` runs; the sorted
  # list of every test is the same.
  build-tests:
    name: Build the tests
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: build-tests

      - uses: ./.github/actions/nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}

      - name: Build the tests into an archive
        run: cargo nextest archive --workspace --locked --cargo-profile checked --archive-file nextest.tar.zst

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nextest-archive
          path: nextest.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # The tests, four shards of the archive. `--partition count:K/4` gives each
  # test of the archive to exactly one shard, so a test added later is in one
  # with no change here. The timing test is the one test taken out: it runs
  # alone, below. A shard needs no toolchain and no cache: it runs programs.
  # Nextest runs each test in a process of its own; its `ci` profile
  # (`.config/nextest.toml`) stands a script in for cargo in the scenario
  # tests that run the command-line program through `cargo run`, so that none
  # of them builds it again: they run the one in the archive.
  test:
    name: Test (shard ${{ matrix.shard }} of 4)
    needs: [changes, build-tests]
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/download-artifact@v4.3.0
        with:
          name: nextest-archive

      # No toolchain: nextest is in the cache the build job saved (cargo, and
      # with it the pinned toolchain, is wanted only on a miss), and it is run
      # as `cargo-nextest nextest`, which does not go through cargo.
      - uses: ./.github/actions/nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}

      - name: Test
        run: |
          # Unpacked into the checkout itself, so that `target/checked` is
          # where the build job had it: the paths `env!("CARGO_BIN_EXE_...")`
          # baked into the tests point there.
          export SIM_CLI_PREBUILT="$PWD/target/checked/sim-cli"
          cargo-nextest nextest run --profile ci --no-fail-fast \
            --archive-file nextest.tar.zst --extract-to . --extract-overwrite --workspace-remap . \
            --partition count:$(( ${{ matrix.shard }} + 1 ))/4 \
            -E 'not (package(sim-cli) and test(=timing::time_reports_its_sections_and_changes_nothing))'

  # `sim-cli time` plays trials, windows and a seat's trials besides the
  # sections the test names on its command line, and takes about five minutes
  # on its own, whatever else runs. As part of a shard it set the time of the
  # whole run, so it is a job of its own, built and run from the one package,
  # at the same time as the rest.
  test-timing:
    name: Test (the timing test)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: test-timing

      - uses: ./.github/actions/nextest
        with:
          version: ${{ env.NEXTEST_VERSION }}

      - name: Test
        run: cargo nextest run -p sim-cli --locked --cargo-profile checked -E 'test(=timing::time_reports_its_sections_and_changes_nothing)'

  # The documentation tests, which nextest does not run.
  test-doc:
    name: Test (documentation tests)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: test-doc

      - name: Documentation tests
        run: cargo test --workspace --locked --profile checked --doc

  # The command-line program in the same profile as the tests.
  run-and-export:
    name: Run scenario 1, export every scenario, check the viewer
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Run scenario 1 from the command line
        run: cargo run --locked --profile checked -p sim-cli -- run data/scenarios/01_transit.toml --events

      # The export carries the state at each step (replay version 4); the
      # viewer's own rebuild from the events, in JavaScript, is what it
      # still uses for older files. Export every scenario and check the
      # steps end at the final state and agree with the rebuild.
      - name: Export every scenario and check the viewer reads it
        run: |
          mkdir -p viewer/replays
          for scenario in data/scenarios/*.toml; do
            cargo run --locked --profile checked -p sim-cli -- export "$scenario" --out "viewer/replays/$(basename "$scenario" .toml).json"
          done
          # The loop walks data/scenarios/*.toml only: the one game on the map about a centre (decision 0242) is in a folder of its own.
          cargo run --locked --profile checked -p sim-cli -- export data/scenarios/wide-map/placeholder_the_wide_sea.toml --out viewer/replays/placeholder_the_wide_sea.json
          node viewer/check.js viewer/replays/*.json

  # The browser's build and its check (decision 0229, rulings 46 and 47): the
  # game as a module for the browser, compared in node with the native `door`
  # program built from the same commit in the same profile. The binding tool
  # is built from source at the version the crate pins and kept in the cache
  # under that version, so it is built once for each version; no program is
  # downloaded ready made. It reads no Markdown.
  web:
    name: Web build and its check
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      # rustup reads rust-toolchain.toml: the pinned toolchain with the
      # target wasm32-unknown-unknown.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Read the version of the binding the crate pins
        id: binding
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9][0-9.]*\)".*/\1/p' crates/sim-web/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Keep the binding tool built for that version
        id: tool
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cargo-wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.binding.outputs.version }}-${{ runner.os }}

      - name: Build the binding tool from source
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.binding.outputs.version }} --locked --root ~/.cargo-wasm-bindgen

      - name: Put the binding tool on the path
        run: echo "$HOME/.cargo-wasm-bindgen/bin" >> "$GITHUB_PATH"

      # The rest of the crate is linted natively by the lint job; the binding
      # module is compiled for the target alone, so it is linted here.
      - name: Lint the module for the target
        run: cargo clippy --locked --target wasm32-unknown-unknown -p sim-web --lib -- -D warnings

      - name: Build the module, the pack and the native door
        run: sh scripts/web/build.sh

      - name: Check the module against the native door
        run: node web/check.mjs

  # The table's check by script (table/check_screen.py, which runs
  # check_watch.py after): it starts the table's bridge and plays every game
  # the new game screen offers, checking the page's text, its own wording run
  # in node and the bridge's answers. It needs `sim-cli` built in release.
  # It does not draw the page: that is still tried by hand in a browser.
  # node and python3 are the ones the runner has; no program is downloaded
  # ready made. It reads no Markdown.
  table-screen:
    name: The table's screen check
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: table-screen

      - name: Build the command-line program in release
        run: cargo build --release --locked -p sim-cli

      - name: Run the table's screen check
        run: python3 table/check_screen.py

  # The check main requires, by this name. It runs whatever happened above
  # and fails unless the index check passed and every other job passed, or
  # every other job was skipped because only documents changed.
  check:
    name: Format, lint, test
    needs: [changes, lint, build-tests, test, test-timing, test-doc, run-and-export, web, table-screen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.needed }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build-tests.result }}
          TEST: ${{ needs.test.result }}
          TIMING: ${{ needs.test-timing.result }}
          DOC: ${{ needs.test-doc.result }}
          EXPORT: ${{ needs.run-and-export.result }}
          WEB: ${{ needs.web.result }}
          SCREEN: ${{ needs.table-screen.result }}
        run: |
          echo "decisions index and what changed: $CHANGES (checks needed: $NEEDED)"
          echo "format and lint: $LINT"
          echo "build of the tests: $BUILD"
          echo "tests: $TEST"
          echo "timing test: $TIMING"
          echo "documentation tests: $DOC"
          echo "run and export: $EXPORT"
          echo "web build and its check: $WEB"
          echo "table screen check: $SCREEN"
          if [ "$CHANGES" != success ]; then
            echo "The first job did not pass."
            exit 1
          fi
          if [ "$NEEDED" = false ]; then
            expected=skipped
          else
            expected=success
          fi
          for result in "$LINT" "$BUILD" "$TEST" "$TIMING" "$DOC" "$EXPORT" "$WEB" "$SCREEN"; do
            if [ "$result" != "$expected" ]; then
              echo "A job is $result, and $expected was needed."
              exit 1
            fi
          done
