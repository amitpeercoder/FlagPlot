# What the table's page loads from nobody else (decision 0229, ruling 40).
# Read by the build and its check, so it is TOML and not Markdown. For each
# thing: its version, where it was taken from (the address the page used before
# it was kept here, or the official repository for the licence text), the
# SHA-256 of each file and its licence. A licence text lies beside what it
# covers, in licences/.

[three]
name = "three.js"
version = "r128"
source = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
licence = "MIT"
licence_file = "licences/three.js-LICENSE.txt"
licence_source = "https://raw.githubusercontent.com/mrdoob/three.js/r128/LICENSE"
licence_sha256 = "7dddf7c5b8fd10ee654db8857d75d104b5557889aa5a91fc4ca545ea7c07062f"

[[three.files]]
path = "three.min.js"
