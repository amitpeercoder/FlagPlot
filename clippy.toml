# Determinism rules, enforced by clippy across the workspace.
# See CLAUDE.md and docs/step1-spec.md ("Determinism and traceability").

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet" },
]

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "no wall clock in the simulation" },
    { path = "std::time::Instant::now", reason = "no wall clock in the simulation" },
    { path = "slice::sort_unstable_by", reason = "the standard library's unstable sort and selection choose their method by the size of what they handle, which differs on the browser's 32-bit target, so two things that compare equal and are not the same could be left in a different order there (decision 0229, ruling 30); use sort_unstable() on whole values, or a stable sort" },
    { path = "slice::sort_unstable_by_key", reason = "the standard library's unstable sort and selection choose their method by the size of what they handle, which differs on the browser's 32-bit target, so two things that compare equal and are not the same could be left in a different order there (decision 0229, ruling 30); use sort_unstable() on whole values, or a stable sort" },
    { path = "slice::select_nth_unstable", reason = "the standard library's unstable sort and selection choose their method by the size of what they handle, which differs on the browser's 32-bit target, so two things that compare equal and are not the same could be left in a different order there (decision 0229, ruling 30); use sort_unstable() on whole values, or a stable sort" },
    { path = "slice::select_nth_unstable_by", reason = "the standard library's unstable sort and selection choose their method by the size of what they handle, which differs on the browser's 32-bit target, so two things that compare equal and are not the same could be left in a different order there (decision 0229, ruling 30); use sort_unstable() on whole values, or a stable sort" },
    { path = "slice::select_nth_unstable_by_key", reason = "the standard library's unstable sort and selection choose their method by the size of what they handle, which differs on the browser's 32-bit target, so two things that compare equal and are not the same could be left in a different order there (decision 0229, ruling 30); use sort_unstable() on whole values, or a stable sort" },
]
