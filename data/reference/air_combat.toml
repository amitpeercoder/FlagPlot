# PLACEHOLDER DATA. These figures are invented so the engine has something to
# run. They are not historical and must not be used for validation.
# See docs/decisions/0026-air-strikes.md.

placeholder = true

# A group strikes a contact no older than this. A contact keeps age 0 through
# the pulse after the one it was reported in (decision 0012, 14), so 0 means
# reported in this pulse or the one before.
strike_contact_max_age_pulses = 0

# Chance one aircraft's weapon hits.
bomb_hit_chance = "0.2"
torpedo_hit_chance = "0.15"

# Chance one fighter's shot brings down an aircraft, and chance one
# anti-aircraft shot does (decision 0027).
fighter_hit_chance = "0.3"
anti_aircraft_hit_chance = "0.05"

# What either chance is multiplied by when the target type has pilot armour,
# and again when it has self-sealing fuel tanks (decision 0029, 11).
pilot_armour_factor = "0.75"
self_sealing_tanks_factor = "0.75"

# Claims from the air (decision 0056). PLACEHOLDER chances, to be set from
# the record in step 2. Each whole shot of fighters (or each whole shot of the
# guns of ships and bases) that missed is claimed as an aircraft shot down with
# the chance given; each whole bomb or torpedo that missed is claimed as a hit
# on a ship, or as an aircraft destroyed on the ground, with the last.
# fighter_false_claim_chance: 0.7 from air round 4 (Nov 13, 2026), sized on
# the Eastern Solomons from 43 claimed by VF-5 and VF-6 (engagement_outcomes
# 257) against the runs' own 16 real kills and 38 missed shots by those
# fighters (an assumption: no row splits the fighters' real kills from the
# guns'). Checked, not tuned, on Rabaul's US claims. The other two stay
# placeholders (docs/validation/tuning/r4-claims.md).
fighter_false_claim_chance = "0.7"
anti_aircraft_false_claim_chance = "0.05"
bomb_false_claim_chance = "0.1"

# Reach beyond the radius and running out of fuel (decision 0059). PLACEHOLDER
# figures, to be set from the record in step 2.
# An air group on extended reach strikes, and sends its escorts, out to its
# type's strike radius times (1 + extended_reach_share), cut to a whole mile.
extended_reach_share = "0.25"
# An aircraft that came back from a sortie beyond its radius runs out of fuel
# with this chance for each whole radius beyond it: the chance is this figure
# times (distance - radius) over radius, 1 at most. It may be more than 1.
ditch_chance_per_radius_beyond = "2"
# The chance the crew of such an aircraft is recovered. A crew not recovered
# is a pilot lost, where the group's pilots are counted.
crew_recovered_short_of_home = "0.7"
# The chance the pilot of a patrol aircraft shot down over its own hex is
# recovered (decision 6a of 0059): over a base of its side, and over its own
# ships at sea. A pilot not recovered is lost. PLACEHOLDERS: the record has 12
# of 23 pilots recovered over their own base and 19 of 19 beside their own
# force, samples that favour those who lived to be written of.
crew_recovered_over_own_base = "0.6"
crew_recovered_beside_own_force = "0.95"
# The chance the crew of an aircraft that came down in the sea for want of a
# deck (decision 9 of 0059) is recovered when no ship of its side is in the
# hex. With a ship of its side there, crew_recovered_beside_own_force applies.
# PLACEHOLDER: the record has 6 to 9 of 13 to 16 recovered in open sea.
crew_recovered_open_sea = "0.5"

# The share of the guns' shots of the raid's target (ships or base) that are
# worked before the attack, the rest after it (decision 0079). 1 is step 1's
# rule: every shot before. PLACEHOLDER: decision 0079 sets it to 0, all after
# the attack. The record has the guns opening on the dive, after the fighters
# had met the strike (events 222 and 223); no source sizes it.
anti_aircraft_before_attack_share = "0"

# The share of a raid's patrol that the escorts draw off one for one; the rest
# is split between the escorts not drawn off and the bombers in proportion to
# their numbers (decision 0080). 1 is step 1's rule: the escorts draw the
# patrol off the bombers one for one. PLACEHOLDER: decision 0080 sets it to 0.
# Support for the direction: decision 0042's sentence, the forms' losses (12
# bombers against 6 to 10 fighters) and row 271 (4 attack planes and 3
# fighters lost at Henderson Field); no source sizes it.
patrol_drawn_off_share = "0"

# The share of the patrol's shots at a raid's bombers that are worked before the
# attack, the rest after it (decision 0087). 1 is step 1's rule: every shot
# before. PLACEHOLDER: decision 0087 sets it to 0.4. Simpler's study of 38
# fighters at the Eastern Solomons (engagement_outcomes 3979 to 3981): of the 18
# who first engaged the bombers, 4 did so before the push-over, 7 at it or in
# the dive and 7 in retirement. The supported range is 0.22 (before the
# push-over only) to 0.61 (the whole dive); no row divides the seven in the
# dive, so 0.4 is a placeholder inside the range, chosen before any result was
# read. A later round may move it only inside 0.22 to 0.61.
patrol_before_attack_share = "0.4"

# Whether a bomb or torpedo hit also knocks a system down one level follows
# surface_combat.toml's system_hit_chance_per_point (decision 0033).

# Raids on a base (decision 0034). PLACEHOLDER figures.
# A hit on a base's supply destroys this many tons, and no more than the base
# has (decision 9).
base_supply_destroyed_per_hit_t = 50

# Which system a bomb's system hit lands on. Adds to 1.
[bomb_system_hit]
flight_deck = "0.5"
propulsion = "0.2"
fire_control = "0.1"
main_battery = "0.2"

# Where a bomb hit on a base lands (decision 7 of 0034): one draw for each hit.
# The two chances add to 1 at most; the rest of the hits land on nothing.
[base_hit]
aircraft = "0.3"
supply = "0.3"
