# FROZEN: a copy of data/reference/air_upkeep.toml
# as it stood at the end of step 1, on Nov 12, 2026, for the hand-calculation tests
# (docs/step2-spec.md, "Tests while figures move"). Do not edit. A rule that adds a
# new figure adds it here too, with its first value. Otherwise byte for byte the live file.
# PLACEHOLDER DATA. These figures are invented so the engine has something to
# run. They are not historical and must not be used for validation.
# See docs/decisions/0035-wear-repair-and-operational-losses.md.

placeholder = true

# Chance an aircraft that flew comes back worn: the base chance, plus this
# much for each 100 nm of the sortie.
wear_base_chance = "0.05"
wear_chance_per_100_nm = "0.02"

# Share of the worn aircraft that are written off. The rest are damaged.
write_off_share = "0.2"

# Damaged aircraft a carrier repairs each day, for the groups aboard it.
carrier_repairs_per_day = 2
