# FROZEN: a copy of data/reference/trial_placeholder_scenario_100.toml
# as first made, on Nov 20, 2026, for scenario 100's hand calculation (decision
# 0181). Do not edit. A rule that adds a new figure adds it here too, with its
# first value. Otherwise byte for byte the live file.
# A TRIAL'S FIGURES of scenario 100 (decision 0181): what the Allied side is
# taken to assume, when the enemy's half of a picture is made, of what it
# cannot see, and the sizes of a trial. Named by scenario 100 with its `trial`
# key. Only scenario 100 names it.
#
# PLACEHOLDER DATA. Every figure is set by the architect for scenario 100's
# hand calculation and rests on no source. They are scenario 96's, but for the
# sizes: small is 4 worlds for 5 days, standard 8 worlds for 5 days and full
# 16 worlds for 5 days, so that a seat's window at the size small is scenario
# 96's window of its second case. An enemy base is assumed to hold 200 t of
# supply, scenario 68's base 2, and no fuel.

placeholder = true

# The supply a base of the enemy's on the side's map is given, in tons
# (decision 0174, 5). Placeholder: scenario 68's base 2.
enemy_base_supply_t = 200

# The fuel for ships a base of the enemy's on the side's map is given, in
# tons (decision 0174, 5). Placeholder: none.
enemy_base_fuel_t = 0

# The seed every trial draws on (decision 0175, amended point 7): the
# trial's, never the live game's. Placeholder: any whole number would do.
seed = 1942

# The three sizes of a trial (decision 0175, 2). Placeholders: scenario 100's
# hand calculation's.
[small]
worlds = 4
days = 5

[standard]
worlds = 8
days = 5

[full]
worlds = 16
days = 5
