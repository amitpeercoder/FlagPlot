# The figures of contacts and reports, at the close of step 2. Every one is a
# placeholder: invented so the engine has something to run, not historical.
# No tuning round looked at them; finding and searching were set otherwise
# (decisions 0073, 0075 and 0077, and round 0 on the figures of
# surface_combat.toml). The note above each figure says what it rests on.
# Every figure, with its record, is listed in
# docs/validation/tuning/surface-and-search-figures-closed.md. The frozen step 1
# figures are in data/reference/step1. See docs/decisions/0012-search-and-contacts.md.

# Required by the loader and ignored once read: the scenario carries the flag.
placeholder = true

# A contact that goes this many pulses without a fresh report is dropped
# (decision 0032).
# Placeholder: decision 0032 kept the age the earlier rule of confidence gave.
# No row sizes it.
contact_drop_age_pulses = 5

# A report refreshes a contact this close, and a contact this fresh also
# alerts a force nearby (decisions 0012 and 0021, merged by 0032).
# Placeholder (decision 0012). No row sizes it.
merge_distance_hexes = 2
# Placeholder (decisions 0012 and 0021). No row sizes it. Through alertness it
# also reaches the surface fight.
fresh_contact_max_age_pulses = 2

# Chance a report names a neighbouring hex.
# Placeholder (decision 0012). The air search note names position error as a
# thing to model and gives no size.
position_error_chance = "0.3"

# Chance a report counts one ship too many, or one too few.
# Both placeholders (decision 0012). No row sizes either.
count_over_chance = "0.2"
count_under_chance = "0.2"

# For each true kind, the chance of each reported kind. Each row adds to 1.
# Placeholders (decision 0012). No row sizes any entry. The rows for a true
# carrier and battleship are read at the Eastern Solomons, those for a true
# cruiser and destroyer there and at Savo Island. The rows for a true transport
# and auxiliary are read by no battle of the slice, which has no ship of
# either kind. The first Hudson report at Savo Island gave three cruisers,
# three destroyers and two "seaplane tenders or gunboats" for a force of seven
# cruisers and one destroyer (docs/research/oob/air-search.md), which this
# table cannot give.
[kind_confusion.carrier]
carrier = "0.7"
battleship = "0.1"
cruiser = "0.1"
transport = "0.1"

[kind_confusion.battleship]
battleship = "0.7"
carrier = "0.1"
cruiser = "0.2"

[kind_confusion.cruiser]
cruiser = "0.7"
battleship = "0.1"
destroyer = "0.1"
carrier = "0.1"

[kind_confusion.destroyer]
destroyer = "0.7"
cruiser = "0.2"
transport = "0.1"

[kind_confusion.transport]
transport = "0.7"
auxiliary = "0.2"
carrier = "0.1"

[kind_confusion.auxiliary]
auxiliary = "0.7"
transport = "0.3"
