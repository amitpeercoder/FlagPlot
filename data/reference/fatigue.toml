# Fatigue and rest, at the close of step 2. Every figure is a placeholder:
# invented so the engine has something to run, not historical. Rabaul against
# Guadalcanal reads the air figures and has no check battle; Rabaul round 2
# looked at them and moved nothing. No battle of the slice reads the task force
# figures. The note above each figure says what it rests on;
# docs/validation/tuning/air-figures-closed.md lists them all. The frozen step 1
# figures are in data/reference/step1.
# See docs/decisions/0036-fatigue-and-rest.md.

placeholder = true

# The three air fatigue figures are placeholders that no row sizes. Rabaul
# round 2 looked at them and moved none (docs/validation/tuning/rabaul-r2-fatigue.md):
# the forms' raid sizes by day cannot size them, and rows 3976 and 3977 are one
# officer's recollection, named only. Nothing else was found
# (docs/research/oob/outside-research-nov-13.md, "What each slow figure now has").
#
# Fatigue an air group gains in a daylight pulse in which it flew: this much
# for the sortie, plus this much for each 100 nm of it.
air_fatigue_per_sortie = 3
air_fatigue_per_100_nm = 2

# A search tires a group by this figure for each 100 nm of it, in place of
# air_fatigue_per_100_nm (decision 0131, 3 and 4); the figure for the sortie is
# the same. Sized so that a search to 700 nm flown once a day gains
# 3 + 14 x 0.14 = 4.96 in the morning and loses 5 in the afternoon: Midway's
# flying boats searched every day (docs/research/oob/search-tempo.md). A
# placeholder in every other respect. Strikes, raids, patrols and escorts keep
# air_fatigue_per_100_nm. The frozen step 1 figures give none.
search_fatigue_per_100_nm = "0.14"

# Fatigue an air group loses in a daylight pulse in which it did not fly.
air_rest_per_pulse = 5

# The two task force figures are placeholders that no battle of the slice
# reads: scenarios 4 and 5 do not load this file and scenario 6 has no task
# forces (docs/step2-spec.md, "Tuning").
# Fatigue a task force gains at the start of a pulse in which it is alert,
# and loses at the start of one in which it is not (decision 0037).
force_fatigue_per_pulse_alert = 5
force_rest_per_pulse = 3
