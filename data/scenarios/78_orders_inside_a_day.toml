# Scenario 78: scenario 1's transit, with an order given inside a day.
#
# Scenario 1's setup (same map, bases, force, ships, reference files, seed
# and days, and its two orders at dusk of day 1), with orders inside a day
# on, and one more order: at 0600 of day 1 the force slows to 8 knots.
# Proves an order given inside a day against the hand calculation of
# decision 0156, written out in tests/scenario_78_orders_inside_a_day.rs.
#
# PLACEHOLDER DATA. The ships, their figures and the map are invented.

name = "Scenario 78: Orders inside a day, Noumea to Espiritu Santo"
placeholder = true
seed = 1942
days = 3
orders_inside_a_day = true
map = "../map/placeholder_transit.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"

[[base]]
id = 1
name = "Noumea"
side = "allied"
q = 0
r = 0

[[base]]
id = 2
name = "Espiritu Santo"
side = "allied"
q = 8
r = 3

[[task_force]]
id = 1
name = "Placeholder transit force"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder cruiser 1"
class = 1
side = "allied"
fuel_t = 2000
task_force = 1

[[ship]]
id = 2
name = "Placeholder destroyer 1"
class = 2
side = "allied"
fuel_t = 500
task_force = 1

# Day 1: steam to Espiritu Santo at cruise speed.
[[order]]
day = 1
side = "allied"
task_force = 1
kind = "set_route"
waypoints = [[8, 3]]

[[order]]
day = 1
side = "allied"
task_force = 1
kind = "set_speed"
speed = "cruise"

# Day 1, at 0600: slow to 8 knots, given inside the day and taken in at
# the start of the morning pulse.
[[order]]
day = 1
pulse = "morning"
side = "allied"
task_force = 1
kind = "set_speed"
knots = 8

# Days 2 and 3 have no new orders. The standing ones continue.
