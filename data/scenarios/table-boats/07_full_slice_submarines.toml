# GUADALCANAL, THE 39 DAYS, 7 AUGUST TO 14 SEPTEMBER 1942, WITH SUBMARINES
# (decision 0227, as amended on review).
#
# This file is the table's file d, neither side given orders, with boats. The
# table plays it for those pairings. It is built on
# ../table-hunger/07_full_slice.toml.
#
# Built on that file (`built_on`, decision 0234): it states the three keys of
# the submarine files and the section SUBMARINES, which opens with the two
# [side] tables, and nothing else. Its `name` is the name of the file it is
# built on.
#
# IT HAS SUBMARINES: thirteen boats, each in a section of her own at the end
# with her rows. American: USS S-38 (-5,-12), USS S-44 (-3,-17), USS S-37
# (2,-5), USS S-42 (2,-5) and USS S-45 (-2,-8). Japanese: I-122 (3,-5), I-123
# (2,-4), RO-34 (2,-4), I-19 (7,-8), I-17 (9,-9), I-33 (8,-5), I-26 (8,-3) and
# I-11 (4,-2). Most enter after day 1, on the day of their row. Each name is
# the name of her row of ships.csv. The rows named are by file:
# engagement_positions.csv, engagement_events.csv and ship_facts.csv, by their
# ids; a place row is a row of place_positions.csv.
#   - Each start is a PLACEHOLDER start (decision 0227, rule 2), one of three
#     readings: a stated latitude and longitude, the hex the point falls in
#     (where the position is her target's, it is read as hers); a bearing and
#     a distance from a place with a preferred row in place_positions.csv, the
#     point laid off flat in the map's frame; or at or off a place with no
#     distance, the hex of the place. Where the rows give a boat two patrols
#     in the days, the longer is read. She enters on the day of that position,
#     on day 1 where a row has her in the same waters on or before the game's
#     first day.
#   - THE HOMES ARE STAND-INS, named on each boat: the true homes are off the
#     map, or are not read from the rows. Espiritu Santo is every Allied
#     boat's; Rabaul is every Japanese boat's.
#   - NO ORDER is given to any boat: each keeps her station. A person orders
#     his own boats; a side the staff plays leaves its boats where they start,
#     since the staff moves a boat only on a patrol order of the commander's
#     (decision 0223, as amended). The two [side] tables at the head of the
#     section state each navy's pattern: the Allied side's is off bases and it
#     expects boats off its own bases; the Japanese side's is lines and it
#     does not (decision 0227). Neither moves a boat: the pattern is read only
#     when a commander orders a patrol.
#   - ACCEPTED EFFECTS, each counted by the measure of decision 0227 (which
#     reports who held each such base on each day): a boat in the hex of a
#     base the enemy holds is looked for at the full count of that base's
#     search where the base flies one. In these days Lunga and Tulagi start
#     Japanese and with no airfield, and Shortland has none: I-123 and RO-34
#     at Lunga and I-122 at Tulagi lie at a base of their own side until it is
#     taken, and S-45 at Shortland is looked for only by what search the base
#     has. A force in the hex of a base its own side holds is not attacked:
#     I-122, I-123 and RO-34 may attack an Allied force in their hex while the
#     base is Japanese and not after it is Allied; S-45 attacks nothing lying
#     at Shortland; S-37 and S-42, in the hex of the Japanese stock west of
#     the Lunga, attack no run that ends there. I-19, I-17 and I-33 start
#     where they were sighted on passage and do not go on to their line; a
#     boat with one start stands there for the game unless ordered.
#   - LEAVE DAYS, said in full: I-19, I-17, I-33 and I-26 have none because
#     the rows have them leave on 20 September, after the game. I-123 has
#     none: the rows have her sunk on 29 August, day 23, an outcome and not
#     scripted; she is kept as long as she lives. I-122, S-38, S-44, S-42 and
#     S-45 have none because no row gives one, a gap. S-37 (day 38), RO-34
#     (day 31) and I-11 (day 36) have the day the rows give.
#   - NO SUSPECTED WATERS. The rows of what each side believed of the other's
#     boats are left out: Allied, engagement_events 16298, 16584, 16608,
#     16589, 16590, 16303, 16610 and 16613; Japanese, none on file, a gap.
#     They give no distance, and waters would change where the staff stands
#     its forces.
#   - LEFT OUT: RO-34's first patrol (off Tulagi on 10 August, back at Rabaul
#     on 16 August; the longer second patrol is read). I-121 and I-31, whose
#     positions are bearings from San Cristobal, a place with no row (owed);
#     I-175, whose first patrol ended the day the rows first place her (12
#     August) and whose second has one position, three days before the end;
#     I-15, I-174, I-9, I-21 and I-24, with no position; S-41, S-46, S-47,
#     S-43, Amberjack and the boats off Truk, with none on the map; S-39,
#     aground on her way.
#   - ESTIMATED FIGURES (decision 0207, rule 12; decision 0227). The classes
#     are those derived as of 7 August 1942
#     (data/reference/submarine_classes_1942.csv), read for earlier dates; no
#     boat here is of a class whose rows change between May and August.
#     Figures that load estimated from like boats by decision 0207, not stated
#     by any row: class 6003, I-15 class (I-19, I-17, I-33, I-26), its
#     torpedo; class 6008, I-121 group (I-122, I-123), its torpedo; class
#     6009, S-1 group (USS S-38, USS S-37), its passage speed; class 6010,
#     S-42 group (USS S-44, USS S-42, USS S-45), its passage speed. An
#     estimate is never evidence. Classes 6007, 6014 have none.
#   - THE FIGURES OF THE SUBMARINES ARE PLAYED UNSET (decision 0225, amended
#     rule 7): data/reference/submarines.toml, every one a placeholder, on the
#     designer's word of Nov 23, 2026 that the table offers one game of each
#     battle and where the battle has boats that game has them. No objective
#     counts a boat sunk.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE GAME IT IS BUILT ON. Its header, and the header of each file below it,
# follow in that file. They hold of this file, but where they say the
# submarines are left out or not modelled: the boats above are in.

built_on = "../table-hunger/07_full_slice.toml"
submarine_classes = "../../reference/submarine_classes_1942.csv"
submarine_torpedoes = "../../reference/submarine_torpedoes_1942.csv"
submarines = "../../reference/submarines.toml"

# SUBMARINES (decisions 0225 and 0227).
# Each boat starts on her station, her hex (no station key), with her class's
# salvoes, sound, and is ordered nowhere. The rule that reads each start is in
# the header; the hexes are worked by hand in decisions 0225 and 0227,
# "The hexes, worked by hand".

# How each side's staff uses its boats (decision 0223, stage 0; decision 0227).
[side.allied]
submarine_pattern = "off_bases"
expects_boats_off_own_bases = true
staff_chooses_supply_sources = true

[side.japanese]
submarine_pattern = "lines"
expects_boats_off_own_bases = false
staff_chooses_supply_sources = true

# USS S-38 (ships.csv 16000; class 6009, S-1 group, by ship_facts 16015).
# PLACEHOLDER start (-5,-12): engagement_events 16119 (off Cape St George on 7
# August) and 16122 (eight miles south of it on 8 August);
# engagement_positions 16006, Meiyo Maru's position, 4-52 S 152-43 E, read as
# hers since it is her target's: the point lies 17.6 nm from the centre of
# (-5,-12) and 23.5 nm from that of (-4,-13). She starts on day 1 and has no
# leave day: no row gives one. Home: Espiritu Santo (base 3), a stand-in (the
# S-boats' own is Brisbane, off the map).
[[submarine]]
id = 1
name = "USS S-38"
side = "allied"
class = 6009
q = -5
r = -12
home = 3

# USS S-44 (ships.csv 16001; class 6010, S-42 group, by ship_facts 16016).
# PLACEHOLDER start (-3,-17): engagement_positions 16008, Kako's position of
# 10 August (day 4), 02-28 S 152-11 E, read as hers since it is her target's:
# the point lies 16.9 nm from the centre of (-3,-17) and 25.8 nm from that of
# (-3,-16); row 16004 (2-15 S 152-15 E) is in the same hex. She enters on day
# 4 and has no leave day: no row gives one. Home: Espiritu Santo (base 3), a
# stand-in (the S-boats' own is Brisbane, off the map).
[[submarine]]
id = 2
name = "USS S-44"
side = "allied"
class = 6010
q = -3
r = -17
home = 3
enters = 4

# USS S-37 (ships.csv 17200; class 6009, S-1 group, by ship_facts 17200).
# PLACEHOLDER start (2,-5): engagement_events 16150, north of Savo on 2
# September (day 27); place row 10 (Savo Island): the point lies 9.3 nm from
# the centre of (2,-5). Her leave day is 38, 13 September, on which
# engagement_events 17239 ends her patrol; where the rows give only the end of
# a patrol she is kept on her station longer than she was. The hex is the hex
# of the Japanese stock west of the Lunga (base 6): she attacks no run that
# ends there. Home: Espiritu Santo (base 3), a stand-in (the S-boats' own is
# Brisbane, off the map).
[[submarine]]
id = 3
name = "USS S-37"
side = "allied"
class = 6009
q = 2
r = -5
home = 3
enters = 27
leave_day = 38

