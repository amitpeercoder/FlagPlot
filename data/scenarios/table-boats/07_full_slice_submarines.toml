# GUADALCANAL, THE 39 DAYS, 7 AUGUST TO 14 SEPTEMBER 1942, WITH SUBMARINES
# (decision 0227, as amended on review).
#
# This file is a copy of the table's copy of file d, neither side given
# orders. The table plays it for those pairings. It copies
# data/scenarios/table-hunger/07_full_slice.toml.
#
# Made by scripts/table-boats/make_files.py. Do not edit by hand: change the
# file it copies or the script and make the files again (`python3
# scripts/table-boats/make_files.py --check` says whether each file is still
# the one it makes). Each copy is the file it copies with this header, the
# three keys of the submarine files and the section SUBMARINES at the end,
# which opens with the two [side] tables, and nothing else (file a also names
# the table's ground figures). Its `name` is the name of the file it copies.
#
# IT HAS SUBMARINES: thirteen boats, each in a section of her own at the end
# with her rows. American: USS S-38 (-5,-12), USS S-44 (-3,-17), USS S-37
# (2,-5), USS S-42 (2,-5) and USS S-45 (-2,-8). Japanese: I-122 (3,-5), I-123
# (2,-4), RO-34 (2,-4), I-19 (7,-8), I-17 (9,-9), I-33 (8,-5), I-26 (8,-3) and
# I-11 (4,-2). Most enter after day 1, on the day of their row. Each name is
# the name of her row of ships.csv. The rows named are by file:
# engagement_positions.csv, engagement_events.csv and ship_facts.csv, by their
# ids; a place row is a row of place_positions.csv.
#   - Each start is a PLACEHOLDER start (decision 0227, rule 2), one of three
#     readings: a stated latitude and longitude, the hex the point falls in
#     (where the position is her target's, it is read as hers); a bearing and
#     a distance from a place with a preferred row in place_positions.csv, the
#     point laid off flat in the map's frame; or at or off a place with no
#     distance, the hex of the place. Where the rows give a boat two patrols
#     in the days, the longer is read. She enters on the day of that position,
#     on day 1 where a row has her in the same waters on or before the game's
#     first day.
#   - THE HOMES ARE STAND-INS, named on each boat: the true homes are off the
#     map, or are not read from the rows. Espiritu Santo is every Allied
#     boat's; Rabaul is every Japanese boat's.
#   - NO ORDER is given to any boat: each keeps her station. A person orders
#     his own boats; a side the staff plays leaves its boats where they start,
#     since the staff moves a boat only on a patrol order of the commander's
#     (decision 0223, as amended). The two [side] tables at the head of the
#     section state each navy's pattern: the Allied side's is off bases and it
#     expects boats off its own bases; the Japanese side's is lines and it
#     does not (decision 0227). Neither moves a boat: the pattern is read only
#     when a commander orders a patrol.
#   - ACCEPTED EFFECTS, each counted by the measure of decision 0227 (which
#     reports who held each such base on each day): a boat in the hex of a
#     base the enemy holds is looked for at the full count of that base's
#     search where the base flies one. In these days Lunga and Tulagi start
#     Japanese and with no airfield, and Shortland has none: I-123 and RO-34
#     at Lunga and I-122 at Tulagi lie at a base of their own side until it is
#     taken, and S-45 at Shortland is looked for only by what search the base
#     has. A force in the hex of a base its own side holds is not attacked:
#     I-122, I-123 and RO-34 may attack an Allied force in their hex while the
#     base is Japanese and not after it is Allied; S-45 attacks nothing lying
#     at Shortland; S-37 and S-42, in the hex of the Japanese stock west of
#     the Lunga, attack no run that ends there. I-19, I-17 and I-33 start
#     where they were sighted on passage and do not go on to their line; a
#     boat with one start stands there for the game unless ordered.
#   - LEAVE DAYS, said in full: I-19, I-17, I-33 and I-26 have none because
#     the rows have them leave on 20 September, after the game. I-123 has
#     none: the rows have her sunk on 29 August, day 23, an outcome and not
#     scripted; she is kept as long as she lives. I-122, S-38, S-44, S-42 and
#     S-45 have none because no row gives one, a gap. S-37 (day 38), RO-34
#     (day 31) and I-11 (day 36) have the day the rows give.
#   - NO SUSPECTED WATERS. The rows of what each side believed of the other's
#     boats are left out: Allied, engagement_events 16298, 16584, 16608,
#     16589, 16590, 16303, 16610 and 16613; Japanese, none on file, a gap.
#     They give no distance, and waters would change where the staff stands
#     its forces.
#   - LEFT OUT: RO-34's first patrol (off Tulagi on 10 August, back at Rabaul
#     on 16 August; the longer second patrol is read). I-121 and I-31, whose
#     positions are bearings from San Cristobal, a place with no row (owed);
#     I-175, whose first patrol ended the day the rows first place her (12
#     August) and whose second has one position, three days before the end;
#     I-15, I-174, I-9, I-21 and I-24, with no position; S-41, S-46, S-47,
#     S-43, Amberjack and the boats off Truk, with none on the map; S-39,
#     aground on her way.
#   - ESTIMATED FIGURES (decision 0207, rule 12; decision 0227). The classes
#     are those derived as of 7 August 1942
#     (data/reference/submarine_classes_1942.csv), read for earlier dates; no
#     boat here is of a class whose rows change between May and August.
#     Figures that load estimated from like boats by decision 0207, not stated
#     by any row: class 6003, I-15 class (I-19, I-17, I-33, I-26), its
#     torpedo; class 6008, I-121 group (I-122, I-123), its torpedo; class
#     6009, S-1 group (USS S-38, USS S-37), its passage speed; class 6010,
#     S-42 group (USS S-44, USS S-42, USS S-45), its passage speed. An
#     estimate is never evidence. Classes 6007, 6014 have none.
#   - THE FIGURES OF THE SUBMARINES ARE PLAYED UNSET (decision 0225, amended
#     rule 7): data/reference/submarines.toml, every one a placeholder, on the
#     designer's word of Nov 23, 2026 that the table offers one game of each
#     battle and where the battle has boats that game has them. No objective
#     counts a boat sunk.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE GAME IT COPIES. What follows, to the first key, is the header of the
# file it copies, as it stands there. It holds of this file, but where it says
# the submarines are left out or not modelled: the boats above are in.
#
# The STAFF'S SETUP of scenario 7, the full slice (decision 0140, items 10 to
# 14). Made by a script from data/scenarios/07_full_slice.toml: the same map,
# bases, forces, ships, air groups, land units, arrivals, replacements,
# figures and objectives, with every scripted order table taken out and no
# intent stated. It plays as the scripted file with its orders taken out
# (decision 0140, 14); a side given no order does what its units do on their
# own.
#
# It is kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# available_from = N (decision 0140, 1 to 6) is the day the rows have the unit
# there to use; where no row speaks, the day of the first scripted order to
# the unit in scenario 7; and an air group whose aircraft arrive in the file
# takes the day of that arrival (the architect's rulings, Nov 17, 2026,
# decision 0140's As built). The row or decision the day rests on is cited
# beside it. A unit aboard a force takes the force's day and has no key of its
# own; a unit with day 1 has none. A day with no row behind it is marked made
# up (placeholder).
#
# [[formation]] tables and each land unit's formation come from data/oob rows,
# cited beside them (decision 0140, 9).
#
# Relative paths are one folder deeper than in scenario 7. The comments below
# this header are scenario 7's own and describe the scripted file; its orders
# and the comments attached to them are not here. Made by make_staff_setup.py,
# described in decision 0140's "As built". Do not edit by hand: change the
# script or scenario 7 and make it again.

# Scenario 7: the full slice, 7 August to 14 September 1942 (39 days).
#
# Decisions 0043, 0093 and 0101. Everything the earlier scenarios built, run
# together on the real map: the landings of 7 to 9 August on Guadalcanal and
# Tulagi and the land fight that followed them, to the ridge of 12 to 14
# September (decisions 0093 and 0101, with the architect's rulings recorded at
# the end of 0101); the Rabaul against Guadalcanal air campaign (scenario 6);
# the Eastern Solomons carrier battle on day 18, 24 August (scenario 5); a
# placeholder convoy from Espiritu Santo to Lunga; and three placeholder night
# surface actions in the open Coral Sea. Day 1 is 7 August; a game day runs
# from 18:00 the evening before its date (docs/rules chapter 1), so the night
# pulse of day 1 is the night of 6 to 7 August.
#
# From this stage its land fight is measured (data/validation/
# guadalcanal_landings.toml); the rest of it still is not. The frozen copy in
# data/scenarios/step2-frozen/ is the fourteen-day slice and is not touched.
#
# WHAT THE LAND FIGHT HOLDS (decision 0101 and the rulings at its end; every
# figure is used as given there, and the row each rests on is named beside it):
#   - Lunga (base 1) and Tulagi (base 4) start Japanese. The American bases
#     there are formed by the landings; the Japanese bases change side when
#     their side is beaten ashore (decision 0090).
#   - The American transports start at sea and land on day 1. The Japanese
#     runs start at Shortland (base 7), Ichiki's at Rabaul, and are sent out on
#     the day that lands them in the night pulse of the record's day.
#   - A NIGHT LANDING IS NUMBERED A DAY LATER THAN ITS DATE. A destroyer run
#     landed after dark on the date its row gives (the one clock time read,
#     land_unit_facts 1049, is about 9 p.m.), and the evening of a date is the
#     night pulse of the next game day. So the Oite's landing of 16 August is
#     day 11, not day 10 (the architect's ruling of Nov 14, 2026).
#   - The squadrons of Henderson Field arrive on day 14, 20 August, and wait
#     until Lunga is American and has its airfield (decision 0103, 5, and the
#     ruling A of decision 0101): their groups start at base 1 with nothing.
#
# What was changed to put the other pieces together (decision 0043):
#   - The Eastern Solomons air groups on carriers are numbered 101 to 126
#     (their numbers there, plus 100), since the Rabaul scenario uses 1 to 3
#     and 10 to 17. Their ships, task forces and bases keep their numbers.
#   - Eastern Solomons' own Henderson Field is the Rabaul scenario's base 1.
#     Its two groups there, VMF-223 (group 9) and VMSB-232 (group 10), are the
#     Rabaul scenario's groups 10 and 11 and are left out, with their orders.
#   - Every day number of the fourteen-day slice is moved by 14 (decision
#     0093, 1): Eastern Solomons' orders, written for its day 1, are given on
#     day 18, and the air campaign's orders and arrivals move by the same 14.
#     The Rabaul raids of 9 to 13 September and the arrivals of scenario 6's
#     days 22 and 24, which the fourteen days left out, are restored at their
#     shifted days (ruling F of decision 0101).
#   - VMF-223 (group 10) no longer starts with 6 damaged aircraft: it starts
#     with nothing and its aircraft arrive (an arrival brings ready aircraft
#     only). The damaged aircraft were a placeholder for coverage.
#   - Ships and air groups of the Eastern Solomons scenario start in the
#     hexes that scenario gives them and sit there until day 18 (ruling G of
#     decision 0101). Where the carriers were on 6 August, south of
#     Guadalcanal, is a gap.
#   - Force A (task force 6) is sent north on day 19 and back on day 20, so
#     that the log has a turn-back event (decision 5 of 0005). It is there
#     only for coverage, as the order sent to the wrong side's force is.
#   - Lunga has 400 t of fuel and Espiritu Santo 600 t, so that the log has
#     refuelling in port (decision 0045). They are placeholders and there only
#     for coverage. Lunga's fuel is the Japanese base's at the start: the
#     side that takes it keeps half (decision 0090).
#
# PLACEHOLDER DATA. The figures files are placeholders. The convoy, the
# transports of both sides, the night-action forces, a bystander and a dry
# destroyer are invented: placeholder classes, names starting "Placeholder".
name = "Scenario 7, the staff's setup: the full slice, 7 August to 14 September 1942, no scripted order"
placeholder = true
seed = 1942
days = 39
map = "../../map/south_pacific.csv"
land_links = "../../map/south_pacific_land_links.csv"
ship_classes = [
    "../../reference/ship_classes_eastern_solomons.csv",
    "../../reference/ship_classes.csv",
    "../../reference/ship_classes_placeholder_transports.csv",
    "../../reference/ship_classes_placeholder_fast_transport_cargo.csv",
    "../../reference/ship_classes_guadalcanal_landings.csv",
]
port_sizes = "../../reference/port_sizes.csv"
aircraft_types = [
    "../../reference/aircraft_types_eastern_solomons.csv",
    "../../reference/aircraft_types_rabaul_guadalcanal.csv",
]
search = "../../reference/search.toml"
surface_combat = "../../reference/surface_combat.toml"
submarine_classes = "../../reference/submarine_classes_1942.csv"
submarine_torpedoes = "../../reference/submarine_torpedoes_1942.csv"
submarines = "../../reference/submarines.toml"
air_combat = "../../reference/air_combat.toml"
air_upkeep = "../../reference/air_upkeep.toml"
fatigue = "../../reference/fatigue.toml"
air_supply = "../../reference/air_supply.toml"
ground = "../../reference/ground_hunger.toml"
# Whose each class and type is (decision 0173, 1 to 3).
class_sides = "../../reference/class_sides_full_slice.csv"

# The Japanese bases at Lunga and Tulagi have no defences (0): no row sizes
# the works of the garrisons of 7 August, so they stay 0 until research gives
# one (decision 0106, "What it changes in the August scenario").
#
# Lunga, the airfield's hex, Japanese at the start (decision 0101, 6). It has
# no airfield and 13,763 of work done on one (decision 0101, 9): the strip was
# 2,600 ft graded and rolled on 7 August (place_facts 60) of the 3,778 ft it
# had when finished (place_facts 62), so 20,000 x 2,600 / 3,778, cut to a
# whole number. The share rests on rows; the total, ground.toml's
# airfield_work, is a placeholder, so this figure is a placeholder too. Its
# stock is 1,090 t (decision 0101, 20), half of which the side that takes it
# keeps: 545 t, ten days for the Americans there, the ten days of Japanese
# food in the division's count of about 15 August, read from the note of
# land_unit_facts 417. Its guns and repairs a day are the slice's placeholders
# for Henderson Field, kept by the side that holds it; its fuel is the
# placeholder above.
[[base]]
id = 1
name = "Lunga"
side = "japanese"
q = 2
r = -4
supply_t = 1090
fuel_t = 400
anti_aircraft = 8
aircraft_repairs_per_day = 3
airfield = false
airfield_work = 13763

# The Rabaul airfields, Lakunai and Vunakanau, in one hex. Nothing attacks
# them in this scenario, so they are given no guns. Supply and repairs a day
# are placeholders. The fuel is a PLACEHOLDER (decision 0163, 7): no row gives
# Rabaul's stock of fuel oil in August 1942 (a gap in data/oob/gaps.csv). It is
# sized not to bind: a fast transport's round trip to Lunga burns about 139 t,
# so 50,000 t is three hundred and sixty such trips, and a hundred
# destroyers' tanks filled (the architect's ruling 5 on decision 0163).

[[base]]
id = 2
name = "Rabaul"
side = "japanese"
q = -5
r = -13
supply_t = 10000
fuel_t = 50000
aircraft_repairs_per_day = 4

# Espiritu Santo, where the convoy loads (the hex of Segond Channel, port
# size 2 on the real map). The supply is a placeholder.
[[base]]
id = 3
name = "Espiritu Santo"
side = "allied"
q = 7
r = 6
supply_t = 960
fuel_t = 600

# Tulagi, with Gavutu and Tanambogo, one place in one hex (decision 0093, 5;
# place_positions 74, 75), Japanese at the start, with no airfield (decision
# 0101, 11). PLACEHOLDER stock: ten days for its 440 men, 440 x 0.005 x 10 =
# 22 t (the architect's ruling on rows, 1, decision 0101). No row gives a
# quantity there.
[[base]]
id = 4
name = "Tulagi"
side = "japanese"
q = 3
r = -5
supply_t = 22
airfield = false

# The Japanese stocks ashore east and west of the airfield (decision 0101, 22,
# as amended, 5 and 8, and decision 0109, 2). Each landing hex holds a base of
# the Japanese side, off the enemy's map, with no airfield, so that the rations
# a run lands go into a base its men are fed from. The bases are placeholders.
# The men who land bring their own rations (each run's cargo, below), so the
# stock stated ashore is only what the men who fall back there need, turned
# into tons by ground.toml's daily_supply_t_per_man of 0.005:
#   (3,-4): 0. Everyone who lands there brings his own.
#   (2,-5): PLACEHOLDER stock, seven days for the 2,040 men of the garrison of
#     Lunga and its two construction units, who fall back there on the first
#     days (decision 0104), 2,040 x 0.005 x 7 = 71.4 t, 71 t cut to a whole
#     ton (decision 0101, as amended, 8). No row gives a Japanese stock west
#     of the field.
# The seven days are the practice a Japanese officer gave (two on the man,
# three in the unit, two at division, land_unit_facts 1044): a practice and
# not what these units were issued.
[[base]]
id = 5
name = "Placeholder Japanese stock at Taivu"
side = "japanese"
q = 3
r = -4
supply_t = 0
airfield = false
on_map = false

[[base]]
id = 6
name = "Placeholder Japanese stock west of the Lunga"
side = "japanese"
q = 2
r = -5
supply_t = 71
airfield = false
on_map = false

# Shortland, the anchorage the Japanese destroyer runs sailed from, in the hex
# of its position row (place_positions 24: Shortland Harbour, -7.07268,
# 155.88036, which the projection of decision 0017 puts in (-2,-8)). No
# airfield, no stock and no guns (the architect's ruling E, decision 0101).
[[base]]
id = 7
name = "Shortland"
side = "japanese"
q = -2
r = -8
airfield = false

