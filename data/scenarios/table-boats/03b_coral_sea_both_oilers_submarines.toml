# SUBMARINES (decisions 0225 and 0227). Made by scripts/table-boats/make_files.py.
# Each boat starts on her station, her hex (no station key), with her class's
# salvoes, sound, and is ordered nowhere. The rule that reads each start is in
# the header; the hexes are worked by hand in decisions 0225 and 0227,
# "The hexes, worked by hand".

# How each side's staff uses its boats (decision 0223, stage 0; decision 0227).
[side.allied]
submarine_pattern = "off_bases"
expects_boats_off_own_bases = true

[side.japanese]
submarine_pattern = "lines"
expects_boats_off_own_bases = false

# USS S-42 (ships.csv 17203; class 6010, S-42 group, by ship_facts 17206).
# PLACEHOLDER start (-3,-12): engagement_events 16103 (off Cape St George on 5
# May, the day before the game) and engagement_positions 16005, the position
# of Okinoshima's sinking on 11 May, 5-06 S 153-48 E (the day after the game's
# last), read as hers since it is her target's: the point lies 4.2 nm from the
# centre of (-3,-12) and 36.2 nm from that of (-4,-12). No row has her leave
# those waters between, so she is read as in them through the days: the one
# use of a position outside a game's days, the architect's judgement (decision
# 0227). The hex is about 65 miles east-south-east of the hex where the rows
# put "eight miles south of Cape St George" (engagement_positions 16006 with
# engagement_events 16122); she is placed as ruled, at her one stated
# position, not in St George's Channel. She starts on day 1 and has no leave
# day: no row gives one. Home: Port Moresby (base 1), a stand-in (the S-boats'
# own is Brisbane, off the map).
[[submarine]]
id = 1
name = "USS S-42"
side = "allied"
class = 6010
q = -3
r = -12
home = 1

# I-21 (ships.csv 17227; class 6003, I-15 class, by ship_facts 17257 and
# 17258). PLACEHOLDER start (0,18): engagement_positions 17202 (20 miles west
# of Noumea at about 0630 on 7 May; place row 16 for Noumea, bearing 270
# degrees laid off flat in the map's frame): the point lies 8.7 nm from the
# centre of (0,18) and 31.4 nm from that of (0,17). Rows 17201 and 17204 have
# her off Noumea on 5 and 8 May. She starts on day 1 and has no leave day: no
# row gives one. Home: Rabaul (base 2), a stand-in (the rows have the boats of
# the first weeks sail from Rabaul and return to it).
[[submarine]]
id = 2
name = "I-21"
side = "japanese"
class = 6003
q = 0
r = 18
home = 2

# RO-33 (ships.csv 17238; class 6007, RO-33 group, by ship_facts 17277).
# PLACEHOLDER start (-17,-4), the hex of Port Moresby (rule 2, third reading:
# at or off a place with no distance): engagement_positions 17205, off Port
# Moresby from 5 May. Her leave day is 5, 10 May, on which the same row has
# her depart her patrol area. She is in the hex of a base the enemy holds.
# Home: Rabaul (base 2), a stand-in (the rows have the boats of the first
# weeks sail from Rabaul and return to it).
[[submarine]]
id = 3
name = "RO-33"
side = "japanese"
class = 6007
q = -17
r = -4
home = 2
leave_day = 5

# RO-34 (ships.csv 17239; class 6007, RO-33 group, by ship_facts 17279).
# PLACEHOLDER start (-17,-4), the hex of Port Moresby (rule 2, third reading):
# engagement_positions 17206, arrives off Port Moresby on 5 May. She has no
# leave day: no row gives one. She is in the hex of a base the enemy holds.
# Home: Rabaul (base 2), a stand-in (the rows have the boats of the first
# weeks sail from Rabaul and return to it).
[[submarine]]
id = 4
name = "RO-34"
side = "japanese"
class = 6007
q = -17
r = -4
home = 2
