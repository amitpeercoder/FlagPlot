# THE CORAL SEA, 6 TO 10 MAY 1942, WITH SUBMARINES (decision 0227, as amended
# on review).
#
# This file is a copy of the table's copy of file b, the Japanese side given
# its orders and the Allied side none. The table plays it for that pairing. It
# copies data/scenarios/table-hunger/03b_coral_sea_both_oilers.toml.
#
# Made by scripts/table-boats/make_files.py. Do not edit by hand: change the
# file it copies or the script and make the files again (`python3
# scripts/table-boats/make_files.py --check` says whether each file is still
# the one it makes). Each copy is the file it copies with this header, the
# three keys of the submarine files and the section SUBMARINES at the end,
# which opens with the two [side] tables, and nothing else (file a also names
# the table's ground figures). Its `name` is the name of the file it copies.
#
# IT HAS SUBMARINES: four boats, each in a section of her own at the end with
# her rows. American: USS S-42 (-3,-12). Japanese: I-21 (0,18), RO-33 (-17,-4)
# and RO-34 (-17,-4). Each name is the name of her row of ships.csv. The rows
# named are by file: engagement_positions.csv, engagement_events.csv and
# ship_facts.csv, by their ids; a place row is a row of place_positions.csv.
#   - Each start is a PLACEHOLDER start (decision 0227, rule 2), one of three
#     readings: a stated latitude and longitude, the hex the point falls in
#     (where the position is her target's, it is read as hers); a bearing and
#     a distance from a place with a preferred row in place_positions.csv, the
#     point laid off flat in the map's frame; or at or off a place with no
#     distance, the hex of the place. Where the rows give a boat two patrols
#     in the days, the longer is read. She enters on the day of that position,
#     on day 1 where a row has her in the same waters on or before the game's
#     first day.
#   - THE HOMES ARE STAND-INS, named on each boat: the true homes are off the
#     map, or are not read from the rows. Port Moresby is the Allied boat's;
#     Rabaul is every Japanese boat's.
#   - NO ORDER is given to any boat: each keeps her station. A person orders
#     his own boats; a side the staff plays leaves its boats where they start,
#     since the staff moves a boat only on a patrol order of the commander's
#     (decision 0223, as amended). The two [side] tables at the head of the
#     section state each navy's pattern: the Allied side's is off bases and it
#     expects boats off its own bases; the Japanese side's is lines and it
#     does not (decision 0227). Neither moves a boat: the pattern is read only
#     when a commander orders a patrol.
#   - ACCEPTED EFFECTS, each counted by the measure of decision 0227 (which
#     reports who held each such base on each day): a boat in the hex of a
#     base the enemy holds is looked for at the full count of that base's
#     search where the base flies one: at the start so of RO-33 and RO-34 at
#     Port Moresby. A force in the hex of a base its own side holds is not
#     attacked: so the RO boats may not attack what lies at Port Moresby from
#     the start. A boat with one start stands there for the game unless
#     ordered.
#   - S-42'S POSITION is of the day after the game's last: the rows have her
#     off Cape St George the day before the game and at that position the day
#     after it, and nothing on file has her leave between. She is read as in
#     those waters through the days, the one use of a position outside a
#     game's days, the architect's judgement.
#   - NO SUSPECTED WATERS. The rows of what each side believed of the other's
#     boats are left out: Japanese, engagement_events 16257 (Bismarck area:
#     estimate 1 to 2, actual 4 boats); Allied, 16513, 16534, 16750 and 16849.
#     They give no distance, and waters would change where the staff stands
#     its forces.
#   - LEFT OUT: I-28 and I-29 (class 6003) and I-22 and I-24 (class not
#     derived) on the line south-west of Guadalcanal, which
#     engagement_positions 17200 gives as a bearing with no distance; I-27,
#     off the map; S-44 and S-47 (class 6010), off Cape St George and off New
#     Hanover, places with no row (owed); S-38, S-39, S-41, S-43 and S-45, not
#     in the map's waters in the days.
#   - ESTIMATED FIGURES (decision 0207, rule 12; decision 0227). The classes
#     are those derived as of 7 August 1942
#     (data/reference/submarine_classes_1942.csv), read for earlier dates; no
#     boat here is of a class whose rows change between May and August.
#     Figures that load estimated from like boats by decision 0207, not stated
#     by any row: class 6003, I-15 class (I-21), its torpedo; class 6010, S-42
#     group (USS S-42), its passage speed. An estimate is never evidence.
#     Class 6007 has none.
#   - THE FIGURES OF THE SUBMARINES ARE PLAYED UNSET (decision 0225, amended
#     rule 7): data/reference/submarines.toml, every one a placeholder, on the
#     designer's word of Nov 23, 2026 that the table offers one game of each
#     battle and where the battle has boats that game has them. No objective
#     counts a boat sunk.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE GAME IT COPIES. What follows, to the first key, is the header of the
# file it copies, as it stands there. It holds of this file, but where it says
# the submarines are left out or not modelled: the boats above are in.
#
# SCENARIO 105 WITH BOTH OILERS, THE CORAL SEA (decisions 0206 and 0207).
#
# Made by scripts/coral-sea/make_both_oilers_files.py from the base,
# data/scenarios/coral-sea/base_coral_sea_both_oilers.toml. Do not edit by hand: change
# the base or the script and make the files again
# (`python3 scripts/coral-sea/make_both_oilers_files.py --check` says whether each file is
# still the one it makes). There are four files, one for each pairing the
# table offers (decision 0185):
#   03a: both sides given their orders (staff against staff);
#   03b: the Japanese side given its orders, the Allied side none (a person
#        or an agent takes the Allied seat);
#   03c: the Allied side given its orders, the Japanese side none;
#   03d: neither side given orders.
# The file loads a class with ESTIMATED figures: Toho Maru's light
# displacement (so her toughness) and her cargo (decision 0207; her class
# file names them in its column `estimated`), and Neosho's cargo is marked
# too. An estimate is never evidence. Toho Maru's load on 5 May is not
# known: she starts full, as every ship of the file does.
#
# Each is the base with this header, a name of its own and, at the end, the
# `[[command]]` and `[[order]]` tables of the sides it gives orders, and
# nothing else: with their names and those tables taken away the four are
# the same, byte for byte. The orders are the hand calculation's
# (tests/scenario_105_the_coral_sea.rs, "What a side the engine plays is
# given"), on day 1, with no risk set (balanced):
#   Japanese: intent 1, take the place (-17,-4), its forces the invasion
#     force (task force 5) and its two land units (2, 3); intent 2, operate
#     task force 3 from (-4,1); intent 3, operate task force 4 from (-10,-2),
#     each with its own air groups (no forces limit); intent 4, deny the
#     waters within 2 hexes of (-12,-3), its forces the groups at Rabaul
#     (18, 19, 20); leave to prepare and leave to launch given. No estimate
#     of the garrison is held.
#   Allied: intent 1, hold Port Moresby (base 1), its forces the garrison
#     (land unit 1); intent 2, operate task force 1 from (-12,1), with its
#     own air groups (no forces limit); leave to prepare and leave to launch
#     given; intent 3, stand at (-13,-2) with task force 2 (decision 0192);
#     intent 4, deny the waters within 1 hex of (-13,-2), its forces task
#     force 1, with the targets limit transports first and the waters first
#     (decision 0190). No order of a commander's own.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE BASE of scenario 105 with both oilers, the Coral Sea, 6 to 10 May 1942
# (decisions 0206 and 0207). It is not played itself: scripts/coral-sea/
# make_both_oilers_files.py makes it from base_coral_sea_oilers.toml and makes
# the four files of data/scenarios/coral-sea/ (03a to 03d) from it, each with
# this text, a name of its own and the commands and orders of its pairing, and
# nothing else. Edit the oilers' base or the scripts, never a file they make,
# and make them again. The old base, the oilers' base, and the files of
# scenario 105 that read them, are not touched.
#
# It is the oilers' base with one force more, the Japanese fuelling group
# (Toho Maru, task force 7), with the class file of her class,
# ship_classes_coral_sea_japanese_oilers.csv, named after the oilers' class
# file, and with a sides file of its own, class_sides_coral_sea_both_oilers.csv.
# The rest is the oilers' base's, byte for byte. The hand calculation of the
# base is the doc comment of tests/scenario_105_the_coral_sea.rs; that of the
# first oiler, tests/scenario_120_real_oilers.rs; that of the second,
# tests/scenario_121_a_japanese_oiler_by_estimate.rs.
#
# Two American carriers and a cruiser group against two Japanese fleet
# carriers and a light carrier, with a Japanese convoy bound for Port
# Moresby. No scripted order: each side is played by a commander or a staff.
# The game begins at 1800 on 5 May 1942; day 1 is 6 May and day 5 is 10
# May. Times are zone -11, the clock of the analysis of 1947. (A scenario
# file has no key for a date.)
#
# WHAT IT IS MADE OF, and where each piece comes from:
#   - Every real ship and aircraft type: the derivation list of the Coral
#     Sea (data/derivation/coral_sea.toml, as of 6 May 1942), its classes
#     4000 to 4024 and types 4100 to 4110, and each ship's experience from
#     ship_experience_coral_sea.ships.csv where it gives one. Each ship cites
#     her rows of engagement_forces: both sources agree on the forces ship
#     for ship.
#   - The Allied fuelling group: Neosho and Sims, derived by
#     data/derivation/coral_sea_oilers.toml (classes 4030 and 4031), each
#     with her experience from ship_experience_coral_sea_oilers.ships.csv.
#     Neosho carries her cargo full, as every ship of the file starts with
#     her own fuel full; her true load on 5 May is a gap. Neosho's cargo
#     capacity is an estimate too (the least of her sisters', decision
#     0207), marked in her class file.
#   - The Japanese fuelling group: Toho Maru, derived by
#     data/derivation/coral_sea_japanese_oilers.toml, class 4032, with her
#     experience (2) from ship_experience_coral_sea_japanese_oilers.ships.csv.
#     HER LIGHT DISPLACEMENT, AND SO HER TOUGHNESS, IS ESTIMATED BY RATIO
#     FROM LIKE SHIPS, AND HER CARGO IS ESTIMATED AS HER SISTER TOA MARU'S
#     (decision 0207): no source gives either for her. Her class file names
#     the estimated figures in its column `estimated`, and her sources file
#     says how each was worked. AN ESTIMATE IS NEVER EVIDENCE (decision 0207,
#     rule 12): nothing in this scenario or in a measure that names it may
#     be taken as the record of her toughness or her cargo. HER LOAD ON 5
#     MAY IS NOT KNOWN, a gap: she starts full, as every ship of the file
#     does. Her anti-aircraft guns are unknown and are taken as none, and her
#     radar is unknown and is taken as none: assumptions of the scenario, not
#     history. The record has her with the Striking Force from 1 May (she
#     sortied from Truk with it) and fuelling Takagi's ships on 4 May and
#     Carrier Division 5 on 6 May (ship_facts 3503, a combinedfleet record of
#     her movements; engagement_forces 414, Bates' organization of the
#     Japanese 4th Fleet, which lists her with the Striking Force, and 450,
#     the combinedfleet Zuikaku record of the sortie of 1 May). No order is
#     scripted for her: she is the Japanese commander's to send, and the staff
#     uses her by decision 0201, rule 20.
#   - The air groups' strengths: the rows of data/oob/air_unit_facts.csv
#     the hand calculation names, beside each group.
#   - Port Moresby (base 1) and its garrison; Rabaul (base 2) as the 39 days
#     gives it (data/scenarios/07_full_slice.toml).
#   - The convoy: Yubari as the list rates her, five placeholder destroyers
#     and ten placeholder transports of a placeholder class of this
#     scenario's own, with the placeholder men of two land units aboard.
#
# LEFT OUT, and why (decision 0188, rule 6 and stage A's rulings 12 and 13;
# decisions 0206 and 0207):
#   - Of the Allied fuelling group, Worden (also of the group in the
#     sources, and not in the list); and the search group (Tangier);
#     Tippecanoe (whether she was with the force on 6 May is disputed, and
#     there is no endurance for her class).
#   - Tsugaru and every other Japanese oiler but Toho Maru: none is derived
#     (no list names one); Toho Maru is the one the first use of estimates
#     settled (decision 0207).
#   - Uzuki, which one source alone puts with the convoy.
#   - Allied aircraft on land (the designer's answer 2: left out of the
#     first version; the Allied carriers are then the only Allied eyes).
#   - Submarines, as everywhere; the Japanese seaplanes at Deboyne and
#     Tulagi and the force that set them up; the flying boats at Rabaul and
#     Shortland, so the Japanese side has no search from land; the Tulagi
#     force; the Tainan Air Group's six fighters at Lae, with Lae.
#   - The convoy's escort of the Kamikaze and Mutsuki classes (Oite,
#     Asanagi, Mutsuki, Mochizuki, Yayoi) as real ships: no row gives the
#     rounds a gun carried, so they stand as placeholder destroyers. Yubari
#     alone of the escort is real.
#   - The real transports, which have no class on file: placeholders stand
#     for them.
#
# PLACEHOLDER DATA. Every start but the Allied one rests on a row's hour
# and a reading, and each start is marked a placeholder; the convoy's
# transports, destroyers, men, supply aboard and class; Port Moresby's
# garrison and stock; every point value and level. The figures files are
# the live placeholders. Neither side is given a believed force or an
# estimate of the other's men: no row gives what either believed.
#
# A port size: the map gives every hex none, and a scenario cannot set one,
# so Port Moresby and Rabaul have none.

name = "Scenario 105 with both oilers, file b: the Coral Sea, 6 to 10 May 1942; the Japanese side given its orders, the Allied side none"
placeholder = true
seed = 1942
days = 5
map = "../../map/south_pacific.csv"
land_links = "../../map/south_pacific_land_links.csv"
# The Coral Sea list's classes; the Allied fuelling group's two (classes 4030
# and 4031, ship_classes_coral_sea_oilers.csv, decision 0206); the Japanese
# fuelling group's one (class 4032, ship_classes_coral_sea_japanese_oilers.csv,
# decision 0207, with figures estimated and named in its column `estimated`);
# the placeholder destroyer of ship_classes.csv (class 2); and the convoy's
# placeholder transport (class 14).
ship_classes = [
    "../../reference/ship_classes_coral_sea.csv",
    "../../reference/ship_classes_coral_sea_oilers.csv",
    "../../reference/ship_classes_coral_sea_japanese_oilers.csv",
    "../../reference/ship_classes.csv",
    "../../reference/ship_classes_placeholder_transport_6_5_knots.csv",
]
port_sizes = "../../reference/port_sizes.csv"
aircraft_types = [
    "../../reference/aircraft_types_coral_sea.csv",
]
search = "../../reference/search.toml"
surface_combat = "../../reference/surface_combat.toml"
submarine_classes = "../../reference/submarine_classes_1942.csv"
submarine_torpedoes = "../../reference/submarine_torpedoes_1942.csv"
submarines = "../../reference/submarines.toml"
air_combat = "../../reference/air_combat.toml"
# Fatigue, wear, supply and the land rules on, with the live figures, as
# scenario 103's base has them. Command levels are off.
air_upkeep = "../../reference/air_upkeep.toml"
fatigue = "../../reference/fatigue.toml"
air_supply = "../../reference/air_supply.toml"
ground = "../../reference/ground_hunger.toml"
# Whose each class and type is (decision 0173, 1 to 3): this scenario's own
# file of sides with the oilers' (decisions 0206 and 0207), which names every
# class and type of the five class files and the type file above.
class_sides = "../../reference/class_sides_coral_sea_both_oilers.csv"
# The trial's figures (decision 0174): the live ones.
trial = "../../reference/trial.toml"
# A side may stop at 0600 and 1200 (decision 0156), as in scenario 103.
orders_inside_a_day = true

# ---------------------------------------------------------------------------
# BASES
# ---------------------------------------------------------------------------

# Port Moresby, Allied, in hex (-17,-4), a coast hex, with its airfield and
# no aircraft in this version (Allied aircraft on land are left out).
# Supply: PLACEHOLDER, 450 t: 30 days for its 3,000 men at the game's 0.005 t
# a man a day (3,000 x 0.005 = 15 t a day; 15 x 30 = 450). No row gives a
# stock. No anti-aircraft figure: a gap. No port size (above).
[[base]]
id = 1
name = "Port Moresby"
side = "allied"
q = -17
r = -4
supply_t = 450

# Rabaul, the airfields of Lakunai and Vunakanau in one hex, as the 39 days
# has it (its base 2): supply, fuel and repairs a day are its placeholders.
[[base]]
id = 2
name = "Rabaul"
side = "japanese"
q = -5
r = -13
supply_t = 10000
fuel_t = 50000
aircraft_repairs_per_day = 4

# ---------------------------------------------------------------------------
# TASK FORCES. No task force has a home port.
# ---------------------------------------------------------------------------

# Task Force 17, the carriers with the attack group and the air group's
# screen. PLACEHOLDER start (-3,5): the hex of 15 00 S, 160 00 E, where two
# sources have the forces join on the morning of 5 May (engagement_positions
# 562, 566, 567), some ten hours before the game begins.
[[task_force]]
id = 1
name = "Task Force 17"
side = "allied"
q = -3
r = 5
mission = "carrier"

# The support group (Crace), a force of its own from the start. PLACEHOLDER
# start (-3,5): the same rows.
[[task_force]]
id = 2
name = "Support group"
side = "allied"
q = -3
r = 5
mission = "surface_combat"

# The Striking Force (Takagi; Hara's 5th Carrier Division). PLACEHOLDER
# start (4,-2): engagement_events 2480 has it round the south-east tip of
# San Cristobal at 1900 on 5 May and gives no position; (4,-2) is the hex of
# that point on the map.
[[task_force]]
id = 3
name = "Striking Force"
side = "japanese"
q = 4
r = -2
mission = "carrier"

# The Main Force (Goto): Shoho and the four cruisers of Cruiser Division 6,
# with Sazanami. PLACEHOLDER start (-2,-8): the hex of Shortland, where
# ship_facts 3496 has the cruisers and Shoho fuel on 5 May. The hour is not
# given.
[[task_force]]
id = 4
name = "Main Force"
side = "japanese"
q = -2
r = -8
mission = "carrier"

# The Port Moresby invasion force (Kajioka's escort and Abe's transports), on
# the transport mission. PLACEHOLDER start (-8,-9), stopped, with no route,
# so that a staff may take it as a lift as it stands. It left Rabaul at 1600
# on 4 May on the Japanese clock (zone -9), 1800 on 4 May here, at 6.5 kn
# (engagement_events 2478; troop_lift_facts 759, 760): by 1800 on 5 May that
# is 24 x 6.5 = 156 nm, and (-8,-9) is the fourth hex of the game's sea route
# from Rabaul to Port Moresby, 160 nm along it.
[[task_force]]
id = 5
name = "Port Moresby invasion force"
side = "japanese"
q = -8
r = -9
mission = "transport"

# The fuelling group, Neosho and Sims as one force (decision 0206, rule 18),
# on the transport mission, with no home port, no route and no escort. Sims
# is in the force and not an escort to it, since the staff sends no force to
# an oiler's force that has an escort. PLACEHOLDER start (-3,5), the hex of
# Task Force 17: the rows say Task Force 17 fuelled from Neosho through 5 May
# (ship_facts 12908) and that the two were detached together only at 1725 on
# 6 May (ship_facts 12910), so they were with Task Force 17 at 1800 on 5 May.
[[task_force]]
id = 6
name = "Fuelling group"
side = "allied"
q = -3
r = 5
mission = "transport"

# The Japanese fuelling group, Toho Maru by herself as one force (decision
# 0207), on the transport mission, with no home port, no route and no escort.
# PLACEHOLDER start (4,-2), the hex of the Striking Force: the rows put her
# with the Striking Force from 1 May, fuelling Takagi's ships on 4 May and
# Carrier Division 5 on 6 May (ship_facts 3503; engagement_forces 414, 450),
# so she was with it at 1800 on 5 May. No order is scripted for her.
[[task_force]]
id = 7
name = "Japanese fuelling group"
side = "japanese"
q = 4
r = -2
mission = "transport"

