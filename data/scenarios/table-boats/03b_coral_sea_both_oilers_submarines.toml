[objectives.japanese]
mission = "Land the convoy's men at Port Moresby and sink the American carriers."

[[objectives.japanese.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.japanese.objective]]
kind = "ships_out_of_action"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }

[[objectives.japanese.objective]]
kind = "aircraft_destroyed"
points = "0.05"

[[objectives.japanese.objective]]
kind = "men_lost"
points_per_100_men = 1

# 1 point for each 100 men the convoy lands in the hex of Port Moresby and
# does not take off again (decision 0186), the figure scenario 103 gives it.
[[objectives.japanese.objective]]
kind = "men_landed"
base = 1
points_per_100_men = 1

