# MIDWAY, WITH SUBMARINES (decisions 0225 and 0227, each as amended on
# review).
#
# This file is the table's file d, neither side given orders, with boats. The
# table plays it for those pairings. It is built on
# ../table-hunger/01d_midway.toml.
#
# Built on that file (`built_on`, decision 0234): it states the three keys of
# the submarine files and the section SUBMARINES, which opens with the two
# [side] tables, and nothing else. Its `name` is the name of the file it is
# built on.
#
# IT HAS SUBMARINES: fifteen boats, each in a section of her own at the end
# with her rows. American: USS Tambor (1,3), USS Trout (1,1), USS Nautilus
# (4,-2), USS Gato (1,-1), USS Grayling (2,-1), USS Grouper (6,-4), USS
# Gudgeon (7,-4), USS Grenadier (3,-3), USS Flying Fish (5,-1), USS Narwhal
# (18,-3), USS Trigger (16,-2), USS Dolphin (0,2), USS Cachalot (6,-1) and USS
# Cuttlefish (-13,3). Japanese: I-168 (5,1). Each name is the name of her row
# of ships.csv. The rows named are by file: engagement_positions.csv,
# engagement_events.csv and ship_facts.csv, by their ids; a place row is a row
# of place_positions.csv.
#   - Each start is a PLACEHOLDER start, read from a row by a rule (decision
#     0225, amended rules 2 and 3, carried on by decision 0227). The American
#     boats on the arcs of Bates's disposition of 2 June (engagement_positions
#     16010: 240 to 360 degrees, 150 miles from Midway, six boats; 16009: 250
#     to 310 degrees, 200 miles, three boats; 16011: 310 to 350 degrees, 50
#     miles, two boats): the arc is read clockwise from its lower bearing, the
#     first boat the row names at the lower bearing and the last at the
#     higher, those between at even steps, every boat the row names counted;
#     the bearing is laid off flat in the map's frame from the atoll's
#     position at the arc's distance, and the boat starts in the hex that
#     point falls in. The support patrol (16013, a line of bearing 045 to 225
#     degrees through the point 075 degrees, 425 miles out, the boats 30 miles
#     apart): Narwhal 30 miles from the centre on 045 and Trigger 30 miles on
#     225, Plunger between them left out. Cuttlefish: row 17212, 263 degrees,
#     690 miles at 2400 on 3 June. I-168 starts in Midway's hex, where rows
#     16202 and 7673 have her on 1, 2 and 4 June; there she attacks nothing,
#     since a force in the hex of its own base is not attacked. All ten new
#     boats start on day 1, on stations ordered on 2 June.
#   - THE HOMES ARE STAND-INS: the American boats' home is Midway (base 1) and
#     I-168's is Wake (base 2), each the base of her side on the map nearest
#     her; the true homes are off the map. Two effects are accepted: a boat
#     going home to a base that has changed side still leaves the map there;
#     and I-168's way home to Wake is five days on passage, on which a search
#     sights her at the whole chance.
#   - NO ORDER is given to any boat: each keeps her station. A person orders
#     his own boats; a side the staff plays leaves its boats where they start,
#     since the staff moves a boat only on a patrol order of the commander's
#     (decision 0223, as amended). The two [side] tables at the head of the
#     section state each navy's pattern: the Allied side's is off bases and it
#     expects boats off its own bases; the Japanese side's is lines and it
#     does not (decision 0227). Neither moves a boat: the pattern is read only
#     when a commander orders a patrol. The rows that moved the boats in the
#     battle are not played: the order to close and attack the enemy to the
#     north-west at 0710 on 4 June (engagement_events 16181) and the order to
#     form on the circle of 100 miles from Midway by dawn on 5 June (16182).
#   - THE SIDES ARE UNEQUAL in every pairing: fourteen American boats on the
#     arcs west and north-west of Midway, across the way the Japanese forces
#     come, and on a line east-north-east of the atoll, against one Japanese
#     boat at Midway itself.
#   - ACCEPTED EFFECTS, each counted by the measure of decision 0227 (which
#     reports who held each such base on each day): a force in the hex of a
#     base its own side holds is not attacked, so I-168, in Midway's hex,
#     attacks nothing that lies at Midway; a boat with one start stands there
#     for the game unless ordered. A boat in the hex of a base the enemy holds
#     is looked for at the full count of that base's search: no American boat
#     is in such a hex at the start.
#   - NO SUSPECTED WATERS. The rows of what each side believed of the other's
#     boats are left out: engagement_events 16842 (one boat west of Midway, 29
#     May), 16518 (one 200 miles south-west of Midway, 16 April), 16202
#     (fourteen sighted by I-168 off Midway, 1 and 2 June) and 17246 to 17248
#     (of other waters). They give no distance, and waters would change where
#     the staff stands its forces, so that this game would differ from the
#     game without boats by more than boats.
#   - LEFT OUT: USS Plunger, whose class (Porpoise or Perch) is not derived
#     (decision 0227, ruling 9); USS Pike, Tarpon, Growler and Finback, off
#     the map; the Japanese cordons (Subron 3's KO line and Subron 5's OTSU
#     line) and Subdivision 13 at French Frigate Shoals, off the map; and
#     I-171, whose point M (19 N 174-26 W, engagement_positions 16015, hex
#     (1,16) of this map) is of 31 May, three days before the game, for an
#     operation that was cancelled, and whom the rows have on the KO line at
#     166-20 W from 1 June (engagement_events 16194), off the map: no row has
#     her on the map in the game's days. Decision 0225's "I-168 alone lies on
#     the map" is true of the game's days, not of the rows.
#   - ESTIMATED FIGURES (decision 0207, rule 12; decision 0227). The classes
#     are those derived as of 7 August 1942
#     (data/reference/submarine_classes_1942.csv), read for earlier dates; no
#     boat here is of a class whose rows change between May and August.
#     Figures that load estimated from like boats by decision 0207, not stated
#     by any row: class 6001, Tambor class (USS Tambor, USS Trout, USS
#     Grayling, USS Gudgeon, USS Grenadier), its torpedo; class 6002, Gato
#     class (USS Gato, USS Grouper, USS Flying Fish, USS Trigger), its
#     torpedo; class 6011, Narwhal class (USS Nautilus, USS Narwhal), its
#     passage speed and its torpedo; class 6012, Dolphin class (USS Dolphin),
#     its torpedo; class 6013, Cachalot class (USS Cachalot, USS Cuttlefish),
#     its torpedo. An estimate is never evidence. Class 6005 has none.
#   - THE FIGURES OF THE SUBMARINES ARE PLAYED UNSET (decision 0225, amended
#     rule 7): data/reference/submarines.toml, every one a placeholder, on the
#     designer's word of Nov 23, 2026 that the table offers one game of each
#     battle and where the battle has boats that game has them. No objective
#     counts a boat sunk.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE GAME IT IS BUILT ON. Its header, and the header of each file below it,
# follow in that file. They hold of this file, but where they say the
# submarines are left out or not modelled: the boats above are in.

built_on = "../table-hunger/01d_midway.toml"
submarine_classes = "../../reference/submarine_classes_1942.csv"
submarine_torpedoes = "../../reference/submarine_torpedoes_1942.csv"
submarines = "../../reference/submarines.toml"

# SUBMARINES (decisions 0225 and 0227).
# Each boat starts on her station, her hex (no station key), with her class's
# salvoes, sound, and is ordered nowhere. The rule that reads each start is in
# the header; the hexes are worked by hand in decisions 0225 and 0227,
# "The hexes, worked by hand".

# How each side's staff uses its boats (decision 0223, stage 0; decision 0227).
[side.allied]
submarine_pattern = "off_bases"
expects_boats_off_own_bases = true
staff_chooses_supply_sources = true

[side.japanese]
submarine_pattern = "lines"
expects_boats_off_own_bases = false
staff_chooses_supply_sources = true

# USS Tambor (ships.csv 6321; class 6001, Tambor class, by ship_facts 16020).
# PLACEHOLDER start (1,3): engagement_positions 16010 (Bates, 2 June: Tambor,
# Trout, Grayling, Nautilus, Grouper and Gudgeon on the arc 240 to 360
# degrees, 150 miles from Midway; steps of 24 degrees), first of six, bearing
# 240 degrees: the point 150 miles out lies 17.6 nm from the centre of (1,3).
# Home: Midway (base 1), a stand-in.
[[submarine]]
id = 1
name = "USS Tambor"
side = "allied"
class = 6001
q = 1
r = 3
home = 1

