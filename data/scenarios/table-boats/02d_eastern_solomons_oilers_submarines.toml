# THE EASTERN SOLOMONS OVER FIVE DAYS, 23 TO 27 AUGUST 1942, WITH SUBMARINES
# (decision 0227, as amended on review).
#
# This file is a copy of the table's copy of file d, neither side given
# orders. The table plays it for those pairings. It copies
# data/scenarios/table-hunger/02d_eastern_solomons_oilers.toml.
#
# Made by scripts/table-boats/make_files.py. Do not edit by hand: change the
# file it copies or the script and make the files again (`python3
# scripts/table-boats/make_files.py --check` says whether each file is still
# the one it makes). Each copy is the file it copies with this header, the
# three keys of the submarine files and the section SUBMARINES at the end,
# which opens with the two [side] tables, and nothing else (file a also names
# the table's ground figures). Its `name` is the name of the file it copies.
#
# IT HAS SUBMARINES: five boats, each in a section of her own at the end with
# her rows. American: USS S-42 (2,-5), entering on day 4. Japanese: I-19
# (7,-8), I-17 (9,-9), I-33 (8,-5), entering on day 2, and RO-34 (2,-4). Each
# name is the name of her row of ships.csv. The rows named are by file:
# engagement_positions.csv, engagement_events.csv and ship_facts.csv, by their
# ids; a place row is a row of place_positions.csv.
#   - Each start is a PLACEHOLDER start (decision 0227, rule 2), one of three
#     readings: a stated latitude and longitude, the hex the point falls in
#     (where the position is her target's, it is read as hers); a bearing and
#     a distance from a place with a preferred row in place_positions.csv, the
#     point laid off flat in the map's frame; or at or off a place with no
#     distance, the hex of the place. Where the rows give a boat two patrols
#     in the days, the longer is read. She enters on the day of that position,
#     on day 1 where a row has her in the same waters on or before the game's
#     first day.
#   - THE HOMES ARE STAND-INS, named on each boat: the true homes are off the
#     map, or are not read from the rows. Lunga is the Allied boat's; Rabaul
#     is every Japanese boat's.
#   - NO ORDER is given to any boat: each keeps her station. A person orders
#     his own boats; a side the staff plays leaves its boats where they start,
#     since the staff moves a boat only on a patrol order of the commander's
#     (decision 0223, as amended). The two [side] tables at the head of the
#     section state each navy's pattern: the Allied side's is off bases and it
#     expects boats off its own bases; the Japanese side's is lines and it
#     does not (decision 0227). Neither moves a boat: the pattern is read only
#     when a commander orders a patrol.
#   - ACCEPTED EFFECTS, each counted by the measure of decision 0227 (which
#     reports who held each such base on each day): RO-34, in the hex of
#     Lunga, a base the enemy holds, is looked for at the full count of the
#     base's search where the base flies one, and may not attack what lies at
#     Lunga, a force in the hex of a base its own side holds not being
#     attacked. I-19 and I-17 start where they were sighted on passage and do
#     not go on to their line; a boat with one start stands there for the game
#     unless ordered. No boat has a leave day.
#   - NO SUSPECTED WATERS. The rows of what each side believed of the other's
#     boats are left out: Allied, engagement_events 16298, 16584, 16608, 16589
#     and 16590; Japanese, none on file, a gap. They give no distance, and
#     waters would change where the staff stands its forces.
#   - LEFT OUT: I-121 (class 6008) and I-31 (class 6003), whose positions are
#     bearings from San Cristobal, a place with no row (owed); I-26 and I-15
#     (class 6003) and I-174 and I-175 (class 6005), whose areas in these days
#     have no distance; I-9 and I-11, with no position in the days; I-123,
#     with no dated position in the days; S-37, whose row gives her patrol's
#     dates from Brisbane and not her days off Savo.
#   - ESTIMATED FIGURES (decision 0207, rule 12; decision 0227). The classes
#     are those derived as of 7 August 1942
#     (data/reference/submarine_classes_1942.csv), read for earlier dates; no
#     boat here is of a class whose rows change between May and August.
#     Figures that load estimated from like boats by decision 0207, not stated
#     by any row: class 6003, I-15 class (I-19, I-17, I-33), its torpedo;
#     class 6010, S-42 group (USS S-42), its passage speed. An estimate is
#     never evidence. Class 6007 has none.
#   - THE FIGURES OF THE SUBMARINES ARE PLAYED UNSET (decision 0225, amended
#     rule 7): data/reference/submarines.toml, every one a placeholder, on the
#     designer's word of Nov 23, 2026 that the table offers one game of each
#     battle and where the battle has boats that game has them. No objective
#     counts a boat sunk.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE GAME IT COPIES. What follows, to the first key, is the header of the
# file it copies, as it stands there. It holds of this file, but where it says
# the submarines are left out or not modelled: the boats above are in.
#
# SCENARIO 103 WITH THEIR OILERS, THE EASTERN SOLOMONS OVER FIVE DAYS
# (decision 0206).
#
# Made by scripts/five-days/make_oiler_files.py from the base,
# data/scenarios/five-days/base_eastern_solomons_oilers.toml. Do not edit by hand:
# change the base or the script and make the files again
# (`python3 scripts/five-days/make_oiler_files.py --check` says whether each file is
# still the one it makes). There are four files, one for each pairing the
# table offers (decision 0185):
#   02a: both sides given their orders (staff against staff);
#   02b: the Japanese side given its orders, the Allied side none (a person
#        or an agent takes the Allied seat);
#   02c: the Allied side given its orders, the Japanese side none;
#   02d: neither side given orders.
# Each is the base with this header, a name of its own and, at the end, the
# `[[command]]` tables of the sides it gives orders, and nothing else: with
# their names and command tables taken away the four are the same, byte for
# byte. The orders are the hand calculation's (tests/
# scenario_103_the_eastern_solomons_over_five_days.rs, "What a side the
# engine plays is given"), on day 1, with no risk set (balanced):
#   Japanese: intent 1, hold Taivu (base 5), its forces the convoy (task
#     force 5) and its three land units (27, 28, 29), with Rabaul (base 2)
#     the source the convoy returns to; intent 2, neutralise Lunga (base 1),
#     its forces the land bombers and the fighters at Rabaul (groups 27, 28);
#     intent 3, operate task force 3 from (8,-11); intent 4, operate task
#     force 4 from (7,-9), each with its own air groups (no forces limit);
#     leave to prepare and leave to launch given.
#   Allied: intent 1, hold Lunga (base 1), its forces the four land units
#     there (1 to 4) and the two squadrons (groups 9 and 10); intent 2,
#     operate task force 1 from (6,-3); intent 3, operate task force 2 from
#     (7,-3), each with its own air groups (no forces limit); intent 4,
#     deny the waters within 2 hexes of (3,-7), with no forces limit; leave
#     to prepare and leave to launch given.
# These are the second version of the orders (decision 0184, "The second
# version of the orders").
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE BASE of scenario 103 with their oilers, the Eastern Solomons over five
# days, 23 to 27 August 1942 (decision 0206). It is not played itself:
# scripts/five-days/make_oiler_files.py makes it from
# base_eastern_solomons.toml and makes the four files of
# data/scenarios/five-days/ (02a to 02d) from it, each with this text, a name
# of its own and the commands of its pairing, and nothing else. Edit the old
# base or the script, never a file it makes, and make them again. The old
# base, and the four files of scenario 103 that read it, are not touched
# (decision 0206, rule 17). The hand calculation is the doc comment of
# tests/scenario_103_the_eastern_solomons_over_five_days.rs; that of the
# oilers, tests/scenario_120_real_oilers.rs.
#
# It is the base of scenario 103 with one force more, the oilers (Platte and
# Cimarron, task force 6), with the class file of the oilers,
# ship_classes_five_days_oilers.csv, named beside the others, and with a
# sides file of its own, class_sides_five_days_oilers.csv. The rest is the
# old base's, byte for byte.
#
# Three Japanese carriers against two American and an airfield, with a
# Japanese convoy that must reach Guadalcanal. No scripted order: each side
# is played by a commander or a staff. The game begins at 1800 on 22 August;
# day 1 is 23 August, day 5 is 27 August.
#
# WHAT IT IS MADE OF, and where each piece comes from:
#   - Task forces 1 to 4, their ships and their air groups: scenario 5's
#     (data/scenarios/05_eastern_solomons.toml), ship for ship and group for
#     group, with the ids, classes, fuel, strengths and row citations that
#     scenario gives them. Their comments below are scenario 5's own. Only
#     their starts differ (below).
#   - Lunga (base 1), its two squadrons and the Marines ashore there; Rabaul
#     (base 2) and its land bombers and fighters; Tulagi (base 4) and the
#     Marines there; Taivu (base 5): the 39 days' (data/scenarios/
#     07_full_slice.toml and its staff's setup, data/scenarios/staff/
#     07_full_slice.toml), each with the row it rests on.
#   - Task force 5, the convoy: Kagero, Kawakaze, Umikaze and Suzukaze, of
#     the classes the reference data already gives them, and three
#     placeholder troop transports; the men of troop lift rows 8 and 9 aboard.
#   - Task force 6, the oilers: Platte and Cimarron, derived by
#     data/derivation/five_days_oilers.toml (classes 2030 and 2031). Their
#     cargo is full, an assumption: their loads on 22 August are a gap. No
#     order is scripted for them (decision 0206, rule 20): they are the
#     commander's to send, and the staff uses them by decision 0201, rule 20.
#
# LEFT OUT, and why (decision 0184, rules 9 and 18 as amended):
#   - Of the convoy: the light cruiser Jintsu, the four patrol boats (PB-1,
#     PB-2, PB-34, PB-35), and the destroyers Isokaze, Mutsuki and Yayoi.
#     Jintsu and the patrol boats have no derived ratings; Mutsuki and Yayoi
#     cannot be rated today (no row gives the rounds a gun of their main
#     battery carried); Isokaze is of a rated class and on no list. No real
#     ship stands in for another, and no real ship is given an invented
#     rating. The real transports (Boston Maru, Daifuku Maru, Kinryu Maru)
#     have no derived ratings and are stood in for by placeholder transports.
#   - Wasp's force, Kondo's advance force (Mutsu, Chitose), Mikawa's
#     cruisers: with them the scenario is neither small nor of ships the
#     game can rate today.
#   - No Allied supply ship comes in during the five days (rule 20).
#   - Of the oilers (decision 0206): Sabine, Kaskaskia and Guadalupe, where
#     each was on the days played being disputed or not given; every
#     Japanese oiler, no displacement being on file for any, so the
#     Japanese side has no oiler; and the oilers' escorts, named in no
#     source read.
#
# NOT DONE BY DOCTRINE, and said here: a carrier's air groups do not raid an
# airfield under the doctrine of "operate the carriers"; a commander may
# order it directly (decision 0184, amended 9).
#
# PLACEHOLDER DATA. Every start position, the convoy's transports, their
# speed and the supply aboard them, Lunga's and Tulagi's stocks and every
# point value are made up and marked so beside them; the figures files are
# the live placeholders. What each side believes of the other rests on no
# source.

name = "Scenario 103 with their oilers, file d: the Eastern Solomons over five days, 23 to 27 August 1942; neither side given orders"
placeholder = true
seed = 1942
days = 5
map = "../../map/south_pacific.csv"
land_links = "../../map/south_pacific_land_links.csv"
# The 39 days' class files, so that its file of sides (below) fits them; the
# scenario uses classes of the first, third and fifth only; and, beside the
# first, the oilers' two classes (2030 and 2031, ship_classes_five_days_
# oilers.csv, decision 0206).
ship_classes = [
    "../../reference/ship_classes_eastern_solomons.csv",
    "../../reference/ship_classes_five_days_oilers.csv",
    "../../reference/ship_classes.csv",
    "../../reference/ship_classes_placeholder_transports.csv",
    "../../reference/ship_classes_placeholder_fast_transport_cargo.csv",
    "../../reference/ship_classes_guadalcanal_landings.csv",
]
port_sizes = "../../reference/port_sizes.csv"
aircraft_types = [
    "../../reference/aircraft_types_eastern_solomons.csv",
    "../../reference/aircraft_types_rabaul_guadalcanal.csv",
]
search = "../../reference/search.toml"
surface_combat = "../../reference/surface_combat.toml"
submarine_classes = "../../reference/submarine_classes_1942.csv"
submarine_torpedoes = "../../reference/submarine_torpedoes_1942.csv"
submarines = "../../reference/submarines.toml"
air_combat = "../../reference/air_combat.toml"
# Fatigue, wear, supply and the land rules on, with the live figures, as in
# the 39 days (decision 0184, rules 15 and 19 as amended).
air_upkeep = "../../reference/air_upkeep.toml"
fatigue = "../../reference/fatigue.toml"
air_supply = "../../reference/air_supply.toml"
ground = "../../reference/ground_hunger.toml"
# Whose each class and type is (decision 0173, 1 to 3): the 39 days' file of
# sides with the oilers' two classes added (decision 0206, rule 17), which
# names every class and type this scenario uses.
class_sides = "../../reference/class_sides_five_days_oilers.csv"
# The trial's figures (decision 0174): the live ones.
trial = "../../reference/trial.toml"
# A side may stop at 0600 and 1200 (decision 0156; decision 0184, rule 3).
orders_inside_a_day = true

# ---------------------------------------------------------------------------
# BASES (the 39 days' numbers)
# ---------------------------------------------------------------------------

# Lunga, Henderson Field, in the hex of Lunga Point (the 39 days' base 1 at
# (2,-4)), Allied, with its airfield built.
# Supply: PLACEHOLDER, 1,000 t: no row gives the stock on 22 August. The rows
# that bear on it: ten days of captured Japanese food about 15 August (the
# note of land_unit_facts 417) and about 2,000 t landed on 21 and 22 August
# (decision 0184, amended 14). The men ashore eat 10,900 x 0.005 = 54.5 t a
# day, 272.5 t in five days, so the stock does not run out by their eating.
# Its guns (8) and repairs a day (3) are the 39 days' placeholders for
# Henderson Field, kept by the side that holds it. No fuel for ships: no
# ship of this scenario refuels there.
[[base]]
id = 1
name = "Lunga"
side = "allied"
q = 2
r = -4
supply_t = 1000
anti_aircraft = 8
aircraft_repairs_per_day = 3

# Rabaul, the airfields of Lakunai and Vunakanau in one hex, as the 39 days
# has it: supply and repairs a day are its placeholders. No fuel for ships:
# no ship of this scenario is based there.
[[base]]
id = 2
name = "Rabaul"
side = "japanese"
q = -5
r = -13
supply_t = 10000
aircraft_repairs_per_day = 4

# Tulagi, with Gavutu and Tanambogo, one place in one hex (the 39 days' base
# 4; decision 0093, 5; place_positions 74, 75), Allied, with no airfield. It
# takes no part (decision 0184, amended 20).
# Supply: PLACEHOLDER, 303 t: ten days for the 6,075 men ashore there,
# 6,075 x 0.005 x 10 = 303.75, cut to a whole ton, by the rule the 39 days
# uses for Tulagi's stock (ten days for its men; the architect's ruling on
# rows, 1, decision 0101). No row gives a quantity there. Without it the men
# would go unfed in the five days.
[[base]]
id = 4
name = "Tulagi"
side = "allied"
q = 3
r = -5
supply_t = 303
airfield = false

# Taivu, the Japanese stock ashore east of the airfield (the 39 days' base 5;
# decision 0101, 22, as amended), off the enemy's map, with no airfield and
# no supply (the hand calculation: no row gives a stock there). It is where
# the convoy lands.
[[base]]
id = 5
name = "Placeholder Japanese stock at Taivu"
side = "japanese"
q = 3
r = -4
supply_t = 0
airfield = false
on_map = false

