side = "allied"
q = 6
r = -3
mission = "carrier"

# Nagumo's carriers with the ships of the vanguard. PLACEHOLDER start
# (9,-18): engagement_positions 413, 1.8 S, 160.2 E at 0600 on 23 August,
# read off a chart, of low confidence.
[[task_force]]
id = 3
name = "Carrier striking force"
side = "japanese"
q = 9
r = -18
mission = "carrier"

# The Ryujo detachment. PLACEHOLDER start (7,-18): scenario 5's own start for
# it, at 1800 on 23 August there.
[[task_force]]
id = 4
name = "Ryujo detachment"
side = "japanese"
q = 7
r = -18
mission = "carrier"

# The convoy, Tanaka's reinforcement group (troop_lift_facts 5 to 9;
# engagement_forces 144 to 148), on the transport mission. PLACEHOLDER start
# (6,-12): engagement_positions 291, 250 miles north of Guadalcanal at 1040 on
# 23 August, taken as due north of Lunga Point (9.42806 S, 160.05472 E).
# Rows 294 and 352 say 200 and 350 miles (both disputed). Its speed is its
# slowest ship's, the placeholder transport's: 10 kn cruising, 12 at full,
# a PLACEHOLDER (row 291 reports an estimated 17 kn, a contact report's
# estimate, not a speed of the transports). Where it sailed from is disputed
# (Rabaul on 19 August, troop_lift_facts 7; or Truk on the 16th, row 736): it
# is given no home port.
[[task_force]]
id = 5
name = "Reinforcement convoy"
side = "japanese"
q = 6
r = -12
mission = "transport"

# The oilers, Platte and Cimarron as one force (decision 0206, rule 20), on
# the transport mission, with no home port, no route (stopped) and no escort.
# PLACEHOLDER start (7,10), the hex of Efate, at 1800 on 22 August. The record
# has both at "Roses" until they sailed at daylight on 23 August: the
# dispatch of 22 August sends them "from Roses" (ship_facts 14419 and 14420),
# and the fleet's own war diary says Roses is Efate (place_facts 14306 and
# 14307; the post-war list of code words, 14300, agrees). They were to meet
# the carriers at 0800 on 25 August at 13-04 S, 164-03.5 E, hex (5,2)
# (engagement_positions 14300 and 14301; row 279 gives the same point for the
# force). Their escorts are named in no source read.
[[task_force]]
id = 6
name = "Oilers"
side = "allied"
q = 7
r = 10
mission = "transport"

