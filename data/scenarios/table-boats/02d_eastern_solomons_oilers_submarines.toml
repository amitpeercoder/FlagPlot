# ---------------------------------------------------------------------------
# MISSIONS AND OBJECTIVES (decision 0054; decision 0184, rules 11 to 13 and
# amended 13, 16 and 17; decisions 0186 and 0187). A scenario for play
# (decision 0187, 22): its scale is its own, and its results are not laid
# beside the record or another scenario's. Each kind has the worth scenarios
# 5 and 7 give it; men landed at Taivu, which they do not have, is given the
# worth of a man lost (decision 0186, 11). Every point value and level is a
# PLACEHOLDER. Ships damaged are counted out of action over a horizon of 30
# days, longer than the game (decision 0088, 4), in the place of crippled.
# The history note is scenario 5's.
# ---------------------------------------------------------------------------

[objectives]
for_play = true
minor = 3
major = 8
decisive = 16
horizon_days = 30
history = "Ryujo was sunk and Enterprise was damaged and withdrew for repair; Japanese aircraft losses were several times the American. Usually judged a limited American victory. (The architect's reading; not yet scored from the order-of-battle facts.)"

[objectives.allied]
mission = "Keep the airfield at Lunga open, stop the convoy, and sink the Japanese carriers while keeping your own."

[[objectives.allied.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.allied.objective]]
kind = "ships_out_of_action"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }

[[objectives.allied.objective]]
kind = "aircraft_destroyed"
points = "0.05"

[[objectives.allied.objective]]
kind = "men_lost"
points_per_100_men = 1

[[objectives.allied.objective]]
kind = "base_open"
base = 1
points = 10

[objectives.japanese]
mission = "Land the convoy's men and supply on Guadalcanal, shut the airfield at Lunga, and sink the American carriers."

[[objectives.japanese.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.japanese.objective]]
kind = "ships_out_of_action"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }

[[objectives.japanese.objective]]
kind = "aircraft_destroyed"
points = "0.05"

[[objectives.japanese.objective]]
kind = "men_lost"
points_per_100_men = 1

[[objectives.japanese.objective]]
