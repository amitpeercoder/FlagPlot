# MIDWAY, WITH SUBMARINES (decisions 0225 and 0227, each as amended on
# review).
#
# This file is a copy of the table's copy of file b, the Japanese side given
# its orders and the Allied side none. The table plays it for that pairing. It
# copies data/scenarios/table-hunger/01b_midway.toml.
#
# Made by scripts/table-boats/make_files.py. Do not edit by hand: change the
# file it copies or the script and make the files again (`python3
# scripts/table-boats/make_files.py --check` says whether each file is still
# the one it makes). Each copy is the file it copies with this header, the
# three keys of the submarine files and the section SUBMARINES at the end,
# which opens with the two [side] tables, and nothing else (file a also names
# the table's ground figures). Its `name` is the name of the file it copies.
#
# IT HAS SUBMARINES: fifteen boats, each in a section of her own at the end
# with her rows. American: USS Tambor (1,3), USS Trout (1,1), USS Nautilus
# (4,-2), USS Gato (1,-1), USS Grayling (2,-1), USS Grouper (6,-4), USS
# Gudgeon (7,-4), USS Grenadier (3,-3), USS Flying Fish (5,-1), USS Narwhal
# (18,-3), USS Trigger (16,-2), USS Dolphin (0,2), USS Cachalot (6,-1) and USS
# Cuttlefish (-13,3). Japanese: I-168 (5,1). Each name is the name of her row
# of ships.csv. The rows named are by file: engagement_positions.csv,
# engagement_events.csv and ship_facts.csv, by their ids; a place row is a row
# of place_positions.csv.
#   - Each start is a PLACEHOLDER start, read from a row by a rule (decision
#     0225, amended rules 2 and 3, carried on by decision 0227). The American
#     boats on the arcs of Bates's disposition of 2 June (engagement_positions
#     16010: 240 to 360 degrees, 150 miles from Midway, six boats; 16009: 250
#     to 310 degrees, 200 miles, three boats; 16011: 310 to 350 degrees, 50
#     miles, two boats): the arc is read clockwise from its lower bearing, the
#     first boat the row names at the lower bearing and the last at the
#     higher, those between at even steps, every boat the row names counted;
#     the bearing is laid off flat in the map's frame from the atoll's
#     position at the arc's distance, and the boat starts in the hex that
#     point falls in. The support patrol (16013, a line of bearing 045 to 225
#     degrees through the point 075 degrees, 425 miles out, the boats 30 miles
#     apart): Narwhal 30 miles from the centre on 045 and Trigger 30 miles on
#     225, Plunger between them left out. Cuttlefish: row 17212, 263 degrees,
#     690 miles at 2400 on 3 June. I-168 starts in Midway's hex, where rows
#     16202 and 7673 have her on 1, 2 and 4 June; there she attacks nothing,
#     since a force in the hex of its own base is not attacked. All ten new
#     boats start on day 1, on stations ordered on 2 June.
#   - THE HOMES ARE STAND-INS: the American boats' home is Midway (base 1) and
#     I-168's is Wake (base 2), each the base of her side on the map nearest
#     her; the true homes are off the map. Two effects are accepted: a boat
#     going home to a base that has changed side still leaves the map there;
#     and I-168's way home to Wake is five days on passage, on which a search
#     sights her at the whole chance.
#   - NO ORDER is given to any boat: each keeps her station. A person orders
#     his own boats; a side the staff plays leaves its boats where they start,
#     since the staff moves a boat only on a patrol order of the commander's
#     (decision 0223, as amended). The two [side] tables at the head of the
#     section state each navy's pattern: the Allied side's is off bases and it
#     expects boats off its own bases; the Japanese side's is lines and it
#     does not (decision 0227). Neither moves a boat: the pattern is read only
#     when a commander orders a patrol. The rows that moved the boats in the
#     battle are not played: the order to close and attack the enemy to the
#     north-west at 0710 on 4 June (engagement_events 16181) and the order to
#     form on the circle of 100 miles from Midway by dawn on 5 June (16182).
#   - THE SIDES ARE UNEQUAL in every pairing: fourteen American boats on the
#     arcs west and north-west of Midway, across the way the Japanese forces
#     come, and on a line east-north-east of the atoll, against one Japanese
#     boat at Midway itself.
#   - ACCEPTED EFFECTS, each counted by the measure of decision 0227 (which
#     reports who held each such base on each day): a force in the hex of a
#     base its own side holds is not attacked, so I-168, in Midway's hex,
#     attacks nothing that lies at Midway; a boat with one start stands there
#     for the game unless ordered. A boat in the hex of a base the enemy holds
#     is looked for at the full count of that base's search: no American boat
#     is in such a hex at the start.
#   - NO SUSPECTED WATERS. The rows of what each side believed of the other's
#     boats are left out: engagement_events 16842 (one boat west of Midway, 29
#     May), 16518 (one 200 miles south-west of Midway, 16 April), 16202
#     (fourteen sighted by I-168 off Midway, 1 and 2 June) and 17246 to 17248
#     (of other waters). They give no distance, and waters would change where
#     the staff stands its forces, so that this game would differ from the
#     game without boats by more than boats.
#   - LEFT OUT: USS Plunger, whose class (Porpoise or Perch) is not derived
#     (decision 0227, ruling 9); USS Pike, Tarpon, Growler and Finback, off
#     the map; the Japanese cordons (Subron 3's KO line and Subron 5's OTSU
#     line) and Subdivision 13 at French Frigate Shoals, off the map; and
#     I-171, whose point M (19 N 174-26 W, engagement_positions 16015, hex
#     (1,16) of this map) is of 31 May, three days before the game, for an
#     operation that was cancelled, and whom the rows have on the KO line at
#     166-20 W from 1 June (engagement_events 16194), off the map: no row has
#     her on the map in the game's days. Decision 0225's "I-168 alone lies on
#     the map" is true of the game's days, not of the rows.
#   - ESTIMATED FIGURES (decision 0207, rule 12; decision 0227). The classes
#     are those derived as of 7 August 1942
#     (data/reference/submarine_classes_1942.csv), read for earlier dates; no
#     boat here is of a class whose rows change between May and August.
#     Figures that load estimated from like boats by decision 0207, not stated
#     by any row: class 6001, Tambor class (USS Tambor, USS Trout, USS
#     Grayling, USS Gudgeon, USS Grenadier), its torpedo; class 6002, Gato
#     class (USS Gato, USS Grouper, USS Flying Fish, USS Trigger), its
#     torpedo; class 6011, Narwhal class (USS Nautilus, USS Narwhal), its
#     passage speed and its torpedo; class 6012, Dolphin class (USS Dolphin),
#     its torpedo; class 6013, Cachalot class (USS Cachalot, USS Cuttlefish),
#     its torpedo. An estimate is never evidence. Class 6005 has none.
#   - THE FIGURES OF THE SUBMARINES ARE PLAYED UNSET (decision 0225, amended
#     rule 7): data/reference/submarines.toml, every one a placeholder, on the
#     designer's word of Nov 23, 2026 that the table offers one game of each
#     battle and where the battle has boats that game has them. No objective
#     counts a boat sunk.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE GAME IT COPIES. What follows, to the first key, is the header of the
# file it copies, as it stands there. It holds of this file, but where it says
# the submarines are left out or not modelled: the boats above are in.
#
# SCENARIO 114, MIDWAY (decision 0198).
#
# Made by scripts/midway/make_files.py from the base,
# data/scenarios/midway/base_midway.toml. Do not edit by hand: change the
# base or the script and make the files again
# (`python3 scripts/midway/make_files.py --check` says whether each file is
# still the one it makes). There are four files, one for each pairing the
# table offers (decision 0185):
#   01a: both sides given their orders (staff against staff);
#   01b: the Japanese side given its orders, the Allied side none (a person
#        or an agent takes the Allied seat);
#   01c: the Allied side given its orders, the Japanese side none;
#   01d: neither side given orders.
# Each is the base with this header, a name of its own and, at the end, the
# `[[command]]` tables of the sides it gives orders, and nothing else: with
# their names and those tables taken away the four are the same, byte for
# byte. The orders are the hand calculation's (tests/scenario_114_midway.rs,
# "What a side the engine plays is given"), on day 1, with no risk set
# (balanced):
#   Japanese: intent 1, take Midway, the place (5,1), its forces the First
#     Carrier Striking Force and the Midway Invasion Force (task forces 3
#     and 4) and the landing force (land units 2 and 3), with no need to
#     know (a knowledge limit of none); the carriers are in the take's
#     forces and have no order of their own (rule 38). Leave to prepare and
#     leave to launch given. No estimate of the men at Midway is held
#     (rule 96).
#   Allied: intent 1, hold Midway (base 1), its forces the garrison (land
#     unit 1), VMF-221's two fighter groups (12, 13) and the two groups of
#     flying boats (16, 17) (rule 97); intent 2, deny the waters within 4
#     hexes of (1,-1), its forces the SBD-2, SB2U-3 and B-17E groups (14,
#     15, 18), with the targets limit carriers, then transports,
#     battleships, cruisers, destroyers (rule 98); intent 3, operate task
#     force 1 from (9,-5), and intent 4, operate task force 2 from (9,-5):
#     the hex of 31 30 N, 176 30 W, the launching position Task Force 17's
#     commander chose for dawn on 4 June, 202 miles north of Midway
#     (engagement positions 5744, 5745; rule 99 as amended by rule 103),
#     each with its own air groups (no forces limit).
#     Leave to prepare and leave to launch given. No order of a commander's
#     own.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# THE BASE of scenario 114, Midway, 3 to 7 June 1942 (decision 0198, as
# amended on review, confirmed on Nov 20, 2026, with stage A's rulings 50 to
# 80 and stage B's rulings 81 to 102). It is not played itself:
# scripts/midway/make_files.py makes the four files of data/scenarios/midway/
# from it, each with this text, a name of its own and the commands of its
# pairing, and nothing else. Edit this file or the script, never a file it
# makes, and make them again. The hand calculation is the doc comment of
# tests/scenario_114_midway.rs.
#
# Three American carriers and the aircraft of Midway against four Japanese
# carriers, with a Japanese force bound to land on the atoll. A scenario for
# play (decision 0187): its scoring is its own. No scripted order: each side
# is played by a commander or a staff.
#
# THE CLOCK. The game begins at 1800 on 2 June 1942; day 1 is 3 June and
# day 5 is 7 June, and the game ends at 1800 on 7 June. Times are zone +12,
# Midway's clock; a Japanese row on the clock of Tokyo dates the same day a
# day later, 21 hours on, and is converted. (A scenario file has no key for a
# date.)
#
# THE MAP: data/map/midway.csv, the map of decision 0199. Hex (0,0) is at
# 28.5 N, 178.5 E; hexes are 40 nm.
#
# WHAT IT IS MADE OF, and where each piece comes from:
#   - Every real ship and aircraft type: the derivation list of Midway
#     (data/derivation/midway.toml, as of 3 June 1942), its classes 5000 to
#     5036 and types 5100 to 5114 (no ship of the scenario is of Zuiho's
#     5004, Gwin's 5021 or Mikazuki's 5036, and no group flies the A5M4,
#     5112), and each ship's experience from
#     ship_experience_midway.ships.csv where it gives one (rule 93: the list
#     derives it for every ship of the scenario but Worden, whose one
#     commissioning row is unconfirmed and gives a year only, so she has the
#     game's own value for a ship not answered). Each ship cites her rows of
#     engagement_forces. Air groups have no experience in the game (decision
#     0064).
#   - The air groups' strengths: the rows of data/oob/air_unit_facts.csv the
#     hand calculation names, beside each group.
#   - Midway (base 1), its garrison and its aircraft; Wake (base 2), a name
#     and a place (place_positions 5107) and a placeholder stock.
#   - The transports: thirteen placeholder ships of a placeholder class of
#     this scenario's own, with the two land units of the landing force
#     aboard.
#
# WHY WAKE IS IN (rules 81 and 82). A lift needs a base of its side to come
# back to: with no Japanese base on the map the staff forms no order for the
# take at all. Wake is a Japanese base with nothing but its name, its place
# and 100 t of supply, a PLACEHOLDER: no aircraft, no airfield, no men, no
# fuel. The landing force did not sail from Wake but from Saipan and Guam,
# which are off the map: Wake is where a lift that is turned back goes, and
# where the staff counts the take's way home from. Its air units of June are
# on file by day and are left out, their type being in no list.
#
# LEFT OUT, and why (decision 0198, rules 6, 35, 60, 64, 78, 85 and 87):
#   - Allied: Gwin, who joined Task Force 17 on 5 June (engagement_forces
#     8582, 8663) and whose place on 2 June is on no row (rule 85); the
#     fuelling group (Cimarron, Platte, Dewey, Monssen); the submarines,
#     Nautilus among them; the auxiliaries of the naval district. At Midway:
#     the four B-26s and the six TBF-1s (rules 60 and 78), and the six more
#     B-17s that came on 4 June.
#   - Japanese: Zuiho and Mikazuki (rule 87: a two-ship carrier force with one
#     group of attack planes would only search, out of all reach or standing
#     before the transports as the bombers' first target; she flew no strike
#     in the battle); the Main Body with Yamato, which did not come within
#     reach; the Aleutians forces; the seaplane tender group; the
#     minesweepers; the supply groups; Patrol Boats 1, 2 and 34 (no class on
#     file); the submarines, I-168 among them; Wake's air units. Soryu's two
#     D4Y1-C and the Type 95 floatplanes of the battleships and cruisers
#     (rule 60).
#
# THE PLACEHOLDER TRANSPORTS (rule 88). The thirteen transports are of a
# placeholder class and are named "Placeholder transport 1" to "13": a real
# ship is not given an invented rating. They stand for Nankai Maru, Zenyo
# Maru, Brazil Maru, Argentina Maru, Azuma Maru, Kirishima Maru, Kano Maru,
# Toa Maru No. 2, Akebono Maru, Hokuriku Maru, Goshu Maru, Keiyo Maru and
# Seicho Maru (engagement_forces 5868 to 5880). Which was the thirteenth is
# disputed: one source has Seicho Maru (5880), another Kiyosumi Maru (5968).
# Their speed, 8.8 kn, stands on two positions alone (rule 65).
#
# ONE FORCE FOR THE INVASION (rule 86). The transports, their close screen,
# the Close Support Group and the Second Fleet's main body are one task
# force, the Midway Invasion Force, at the transports' 8.8 kn, as they were
# one command. So the night surface threat of the Second Fleet's main body,
# closing on the American carriers at 28 kn on the night of 4 June, is not
# in the game.
#
# THE AIR GROUPS, gaps and readings: VB-6 flies the SBD-3, though its rows
# say SBD-2 and SBD-3 mixed with no split (air_unit_facts 12600 to 12603):
# the split is a gap (rule 90). Of VMSB-241's seventeen SB2U-3s twelve are
# ready and five damaged (rule 92). Tone and Chikuma carry three Type 0
# floatplanes each (rule 91). Hornet's dive bombers are one group of 35
# (rule 56). A Japanese carrier's 6th Air Group fighters are in her fighter
# group (rules 52 and 73).
#
# WHAT EACH SIDE KNOWS AT THE START (rule 34). No contact is held, no
# believed force is given, and no estimate of the men at Midway is held by
# the Japanese side (rule 96). The American side's knowledge is carried by
# where its carriers start, north-east of Midway, by the orders a side the
# engine plays is given and by the directive read at the table.
#
# WHAT THE GAME DOES NOT MODEL, said before a run:
#   - A carrier caught with her aircraft armed and fuelled on deck (rule 16):
#     no rule makes a carrier more easily destroyed while she rearms or spots
#     a strike. The Japanese side will do better for it.
#   - Submarines (rule 17). Yorktown's sinking by one is not in the game.
#   - Weather (rule 42). Fog hid the Japanese carriers on 2 and 3 June; with
#     none, and a search of 700 nm, they are likely to be found on the first
#     day.
#   - Daylight (rule 43). Night is from 1800 to 0600 everywhere; at Midway in
#     June there were about fourteen hours of light, and the morning's
#     launches and first sightings fell in what the game calls night.
#   - Reach (rule 44). The Japanese torpedo plane's radius in the game is 175
#     nm, against a launch at 240 nm on the day, so the carriers close
#     further than they did.
#   - And what it does have (rule 45): while the Japanese carriers serve the
#     take, their bombers are held to the raid on Midway for the whole of a
#     pulse, a part of the bind Nagumo was in, though not the decks full of
#     armed aircraft.
#   - The night surface threat of the Second Fleet's main body (rule 86,
#     above).
#   - Ships' experience is derived (rule 93) for every ship but Worden
#     (above).
#   - The flying boats' night torpedo attack of 3 June (rule 97): Midway's
#     hold names the flying boats, so they search and are sent to strike by
#     no order.
#   - Fuel (rule 95): every ship starts with her fuel full, no base has fuel
#     for ships and no force has a home port (Pearl Harbor, Japan and the
#     Marianas are off the map), so no force's fuel is weighed by the staff,
#     and the oilers are left out. A destroyer that steams at full speed for
#     long can run dry.
#   - What Wake's being on the map does to each side's search (rule 82): a
#     carrier force points its search at the enemy's bases, so a base at Wake
#     draws each side's carriers' search toward it, a thing of the game and
#     not of the battle.
# SURFACE WEAPONS NOT MODELLED (decision 0198, rules 68, 69 and 79; the list's
# surface_weapons_not_modelled): these ships fire no gun and no torpedo at a
# ship, though their anti-aircraft guns fire: USS Enterprise, USS Hornet, USS
# Pensacola, USS Northampton, USS New Orleans, USS Minneapolis, USS Vincennes,
# USS Atlanta, USS Phelps, USS Worden, USS Monaghan, USS Aylwin, USS Balch,
# USS Conyngham, USS Benham, USS Ellet, USS Maury, USS Yorktown, USS Astoria,
# USS Portland, USS Morris, USS Hughes, USS Anderson, USS Hammann, USS
# Russell, Akagi, Kaga, Soryu, Hiryu, Haruna, Kirishima, Tone, Chikuma,
# Nagara, Kazagumo, Yugumo, Makigumo, Akigumo, Isokaze, Urakaze, Hamakaze,
# Tanikaze, Nowaki, Arashi, Hagikaze, Maikaze, Jintsu, Kuroshio, Oyashio,
# Hatsukaze, Yukikaze, Amatsukaze, Tokitsukaze, Kasumi, Arare, Kagero,
# Shiranui, Kumano, Suzuya, Mogami, Mikuma, Yura. Kumano, Suzuya, Mogami,
# Mikuma and Yura are among them because no row names the torpedo they carried
# on 3 June, the rest because they are carriers or screens or the transports'
# close screen. Surface fire is modelled for: Arashio, Asashio, Oshio,
# Michishio, Kongo, Hiei, Atago, Chokai, Haguro, Myoko, Yudachi, Murasame,
# Harusame, Samidare, Asagumo, Minegumo, Natsugumo.
#
# PLACEHOLDER DATA. The transports, their class, the supply aboard them;
# Midway's stock and Wake's stock; Midway's repairs a day; the Japanese
# carriers' start is a row's (engagement_positions 5700), the invasion
# force's is worked from two rows (rule 83) and the American carriers' is the
# rendezvous of the rows (rule 84), each marked a placeholder; every point
# value and level. The figures files are the live placeholders.
#
# A port size: the map gives every hex none, and a scenario cannot set one,
# so Midway and Wake have none. Midway has no anti-aircraft figure: a gap.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).

name = "Scenario 114, file b: Midway, 3 to 7 June 1942; the Japanese side given its orders, the Allied side none"
placeholder = true
seed = 1942
days = 5
map = "../../map/midway.csv"
# The Midway list's classes, and the transports' placeholder class (class 19).
ship_classes = [
    "../../reference/ship_classes_midway.csv",
    "../../reference/ship_classes_placeholder_transport_8_8_knots.csv",
]
port_sizes = "../../reference/port_sizes.csv"
aircraft_types = [
    "../../reference/aircraft_types_midway.csv",
]
search = "../../reference/search.toml"
surface_combat = "../../reference/surface_combat.toml"
submarine_classes = "../../reference/submarine_classes_1942.csv"
submarine_torpedoes = "../../reference/submarine_torpedoes_1942.csv"
submarines = "../../reference/submarines.toml"
air_combat = "../../reference/air_combat.toml"
# Fatigue, wear, supply and the land rules on, with the live figures, as
# scenarios 103 and 105 have them. Command levels are off.
air_upkeep = "../../reference/air_upkeep.toml"
fatigue = "../../reference/fatigue.toml"
air_supply = "../../reference/air_supply.toml"
ground = "../../reference/ground_hunger.toml"
# Whose each class and type is (decision 0173, 1 to 3): this scenario's own
# file of sides, which names every class and type of the two class files and
# the type file above.
class_sides = "../../reference/class_sides_midway.csv"
# The trial's figures (decision 0174): the live ones.
trial = "../../reference/trial.toml"
# A side may stop at 0600 and 1200 (decision 0156), as in scenarios 103 and
# 105.
orders_inside_a_day = true

# ---------------------------------------------------------------------------
# BASES
# ---------------------------------------------------------------------------

# Midway, Allied, in hex (5,1), the atoll at 28.232 N, 177.370 W
# (place_positions 5100), a coast hex by the map's mark of land (decision
# 0199). Its garrison, its aircraft and their airfield (Eastern Island,
# place_facts 6000 to 6005).
# Supply: PLACEHOLDER, 4,000 t (rule 94). The rows say the island was heavily
# stocked with bombs and fuel (place_facts 6008, 6031) and give no tons. At
# the game's figures five days cost about 2,000 t (the upkeep of 111
# aircraft, the flying boats' search, the fighters' patrol, the bombers twice
# a day and the garrison); 4,000 t is twice that, so that the stock is not
# what stops an aircraft. No fuel for ships. No anti-aircraft figure: a gap.
# Repairs a day: PLACEHOLDER, 4, the figure the Coral Sea and the 39 days give
# Rabaul, a base with aircraft (a reading of the build: no row gives one).
[[base]]
id = 1
name = "Midway"
side = "allied"
q = 5
r = 1
supply_t = 4000
aircraft_repairs_per_day = 4

# Wake, Japanese, in hex (-24,16), at 19.299 N, 166.624 E (place_positions
# 5107), a coast hex by the map's mark of land. Supply: PLACEHOLDER, 100 t
# (rule 81). No aircraft, no airfield, no men, no fuel: see the header.
[[base]]
id = 2
name = "Wake"
side = "japanese"
q = -24
r = 16
supply_t = 100
airfield = false

# ---------------------------------------------------------------------------
# TASK FORCES. No task force has a home port.
# ---------------------------------------------------------------------------

# Task Force 16 (Spruance), on the carrier mission. PLACEHOLDER start
# (15,-6): the hex of 32 04 N, 172 45 W, where the rows have Task Forces 16
# and 17 meet on the afternoon of 2 June (engagement_positions 5737 to 5739),
# some two hours before the game begins (rule 84). It is the point north-east
# of Midway where they stood because of what was known (rule 34).
[[task_force]]
id = 1
name = "Task Force 16"
side = "allied"
q = 15
r = -6
mission = "carrier"

# Task Force 17 (Fletcher), on the carrier mission. PLACEHOLDER start
# (15,-6): the same rows.
[[task_force]]
id = 2
name = "Task Force 17"
side = "allied"
q = 15
r = -6
mission = "carrier"

# The First Carrier Striking Force (Nagumo), on the carrier mission.
# PLACEHOLDER start (-2,-15): the hex of 37 01.5 N, 171 07 E, where its own
# report has it on course 130 at 1630 on 2 June by Midway's clock, 1330 on 3
# June by Tokyo's (engagement_positions 5700; rule 32), an hour and a half
# before the game begins.
[[task_force]]
id = 3
name = "First Carrier Striking Force"
side = "japanese"
q = -2
r = -15
mission = "carrier"

# The Midway Invasion Force (Kondo's Second Fleet: the transports, their
# close screen, the Close Support Group and the main body), on the transport
# mission, one force (rule 86). PLACEHOLDER start (-17,4), stopped, with no
# route, so that a staff may take it as a lift as it stands. Worked from two
# rows (rule 83): 700 nm on bearing 261 from Midway at 0925 on 3 June and 560
# nm at 0120 on 4 June (engagement_events 7699 and 7706) are 140 nm in 15
# hours 55 minutes, 8.8 kn; back 15 hours 25 minutes to 1800 on 2 June is
# 135.7 nm more, 835.7 nm from Midway on bearing 261, laid off in the map's
# own flat frame: 607.6 nm west and 146.8 nm south of hex (0,0), in hex
# (-17,4). The 8.8 kn stands on the two positions alone (rule 65).
[[task_force]]
id = 4
name = "Midway Invasion Force"
side = "japanese"
q = -17
r = 4
mission = "transport"

# ---------------------------------------------------------------------------
# SHIPS
# ---------------------------------------------------------------------------

# Task force 1, Task Force 16: ships 1 to 17.

# USS Enterprise (cv-6-enterprise; engagement_forces 8500, 8557, 8608, 8673):
# class 5005, Yorktown class, anti_aircraft 12, surface weapons not modelled
# (ship_classes_midway.ships.csv). Fuel full, an assumption. Experience 2:
# ship_experience_midway.ships.csv (ship_facts.csv:167).
[[ship]]
id = 1
name = "USS Enterprise"
class = 5005
side = "allied"
fuel_t = 4360
