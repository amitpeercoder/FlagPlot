# ---------------------------------------------------------------------------
# MISSIONS AND OBJECTIVES (decision 0054; decision 0198, rules 12 to 14, 46
# to 48 and 100; decisions 0186 and 0187). A scenario for play (decision
# 0187): its scale is its own, and its results are not laid beside the
# record or another scenario's. Every figure is one the game already has
# (scenarios 103 and 105). Every point value is a PLACEHOLDER. No objective
# for a base open or held: the mission inside five days is the landing.
#
# The levels are set before any game is played, in terms of the carriers and
# the landing force (rule 100): minor 5, a carrier out of action; major 15, a
# third of the landing force ashore, or lost; decisive 30, two thirds.
#
# The horizon is 66 days, from 2 June to the landings on Guadalcanal on 7
# August (28 days of June, 31 of July, 7 of August), the next operation the
# carriers fought in: a carrier out for those days missed it.
# ---------------------------------------------------------------------------

[objectives]
for_play = true
minor = 5
major = 15
decisive = 30
horizon_days = 66
history = "Akagi, Kaga, Soryu and Hiryu and the cruiser Mikuma were sunk. Yorktown and the destroyer Hammann were lost. The invasion force turned back on 5 June and landed no one at Midway."

[objectives.allied]
mission = "Hold Midway and sink the Japanese carriers."

[[objectives.allied.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.allied.objective]]
kind = "ships_out_of_action"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }

[[objectives.allied.objective]]
kind = "aircraft_destroyed"
points = "0.05"

[[objectives.allied.objective]]
kind = "men_lost"
points_per_100_men = 1

[objectives.japanese]
mission = "Land the invasion force's men at Midway and sink the American carriers."

[[objectives.japanese.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.japanese.objective]]
kind = "ships_out_of_action"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }

[[objectives.japanese.objective]]
kind = "aircraft_destroyed"
points = "0.05"

[[objectives.japanese.objective]]
