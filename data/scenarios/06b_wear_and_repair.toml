# Scenario 6b: five days of raids on an airfield, with wear and repair.
#
# Stage 6b of scenario 6. It is scenario 6a over five days with the upkeep
# figures and repairs at both airfields. It proves the wear roll, the share
# written off, repair by the day, and damaged aircraft on the ground
# (decision 0035). The hand calculation is in
# tests/scenario_06b_wear_and_repair.rs. The test runs this file with seeds
# 1 to 1000.
#
# PLACEHOLDER DATA. The bases, aircraft, figures and map are invented.

name = "Scenario 6b: Wear and repair"
placeholder = true
seed = 1942
days = 5
map = "../map/placeholder_two_airfields.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"
air_upkeep = "../reference/air_upkeep.toml"

[[base]]
id = 1
name = "Placeholder airfield A"
side = "japanese"
q = 0
r = 0
supply_t = 0
aircraft_repairs_per_day = 2

# 200 nm east of airfield A.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "allied"
q = 5
r = 0
supply_t = 1000
anti_aircraft = 20
aircraft_repairs_per_day = 3

[[air_group]]
id = 1
name = "Placeholder bomber group"
side = "japanese"
base = 1
aircraft_type = 3
ready = 18

[[air_group]]
id = 2
name = "Placeholder escort group"
side = "japanese"
base = 1
aircraft_type = 4
ready = 12

[[air_group]]
id = 3
name = "Placeholder defending fighters"
side = "allied"
base = 2
aircraft_type = 4
ready = 12

[[air_group]]
id = 4
name = "Placeholder resting bombers"
side = "allied"
base = 2
aircraft_type = 3
ready = 10

[[air_group]]
id = 5
name = "Placeholder scouts"
side = "allied"
base = 2
aircraft_type = 2
ready = 6

[[order]]
day = 1
side = "japanese"
air_group = 1
kind = "set_air_mission"
mission = "base_strike"
target_base = 2

# Half the escort group stays over airfield A, half goes with the raid.
[[order]]
day = 1
side = "japanese"
air_group = 2
kind = "set_air_mission"
mission = "combat_air_patrol"

[[order]]
day = 1
side = "japanese"
air_group = 2
kind = "set_patrol_share"
share = "0.5"

# All the defending fighters stay overhead.
[[order]]
day = 1
side = "allied"
air_group = 3
kind = "set_air_mission"
mission = "combat_air_patrol"

# The scouts are in the air each daylight pulse. Group 4 has no order and
# rests on the ground.
[[order]]
day = 1
side = "allied"
air_group = 5
kind = "set_air_mission"
mission = "search"

[[order]]
day = 1
side = "allied"
air_group = 5
kind = "set_search_arc"
from_deg = 40
to_deg = 130
range_nm = 300
