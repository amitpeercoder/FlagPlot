# Scenario 72: reconnaissance.
#
# Decision 0147, step 6 of stage 3, first part. The commander asks for an
# airfield at preserve the force. The staff has no count of the enemy there.
# It sends an aircraft to look, learns that 150 men hold it, chooses one unit
# where it had chosen two, and only then launches.
#
# The map is scenario 27's: A at (0,0), a coast hex with port size 5, and B
# at (4,0), a coast hex with port size 0, 4 hexes, 160 nm, away. Allied base 1
# lies at A with an airfield and 1,000 t of supply; Japanese base 2, an
# airfield, lies at B, on the Allied map, with 100 t of supply. Air group 1,
# six placeholder carrier scouts (search range 300 nm), lies at base 1 at rest.
# Task force 1, two placeholder troop transports of 600 berths, lies stopped in
# port at A on the transport mission. Two Allied fighting units of 600 men are
# ashore at A; the Japanese unit 10, 150 men, holds B. The Allied side holds no
# estimate of the enemy's men at B. The commander states "take the place at B"
# on day 1 at preserve the force with a forces limit of task force 1, units 1
# and 2, air group 1 and base 1 as the source, and gives leave to prepare and to
# launch. The game is 4 days, which ends before the landing.
#
# The hand calculation is in tests/scenario_72_reconnaissance.rs. The test runs
# this file on the frozen step 1 figures with five ground figures of its own,
# preparation_per_day 100, report_error_low 1, report_error_high 1,
# reconnaissance_error_low 1 and reconnaissance_error_high 1, in
# data/reference/ground_placeholder_scenario_72.toml, which this file names, so
# that run by itself it plays the game its test proves. A report gives the true
# count, so no die changes anything. It builds its variants from the text of
# this file using the markers below.
#
# PLACEHOLDER DATA. The bases, ships, units, aircraft, figures and map are
# invented.

name = "Placeholder scenario 72: Reconnaissance"
placeholder = true
seed = 1942
days = 4
map = "../map/placeholder_preparing.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground_placeholder_scenario_72.toml"

# Allied base 1 at A, with supply for every man for the whole game and no
# fuel to give.
[[base]]
id = 1
name = "Placeholder base A"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 0

# Japanese base 2 at B: an airfield with no gun and no aircraft.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "japanese"
q = 4
r = 0
supply_t = 100
fuel_t = 0

# Air group 1: six carrier scouts at base 1, at rest. A type of the frozen
# figures that can search, with a search range of 300 nm.
[[air_group]]
id = 1
name = "Placeholder scout squadron"
side = "allied"
base = 1
aircraft_type = 2
ready = 6

# Task force 1: two placeholder troop transports, stopped in port at base 1.
[[task_force]]
id = 1
name = "Placeholder transport force 1"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder troop transport 1"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

[[ship]]
id = 2
name = "Placeholder troop transport 2"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

# The land units: two Allied fighting units ashore at A, at the standard of
# experience, 2, and the Japanese garrison at B.
[[land_unit]]
id = 1
name = "Placeholder First"
side = "allied"
men = 600
q = 0
r = 0

[[land_unit]]
id = 2
name = "Placeholder Second"
side = "allied"
men = 600
q = 0
r = 0

[[land_unit]]
id = 10
name = "Placeholder Garrison"
side = "japanese"
men = 150
q = 4
r = 0

# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "take_place"
hex = [4, 0]

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
task_forces = [1]
land_units = [1, 2]
air_groups = [1]
source = 1

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "risk"
intent = 1
risk = "preserve"

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
