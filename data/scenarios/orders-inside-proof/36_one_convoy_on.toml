# THE PROOF OF DECISION 0156 (orders inside a day), step 5. It serves
# case C of condition 6 (the convoy held by an order at 0600).
#
# Made by scripts/orders-inside-proof/make_arrangements.py from
# data/scenarios/36_one_convoy.toml
# by the smallest change. Do not edit by hand: change the script or the
# source and make it again (`python3
# scripts/orders-inside-proof/make_arrangements.py --check` says whether this
# file is still the one it makes). It differs from its source in this
# header; in the line `orders_inside_a_day = true` after `days`;
# and, where the source lies in data/scenarios itself, in each reference
# path, one folder deeper. Nothing else.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# Scenario 36: one supply intent, one pool, no enemy (decision 0107, step 3,
# stage 1).
#
# Proves the doctrine for keeping a base supplied against a hand calculation.
# The Allied commander states an intent on day 1: keep base 2 at T at a floor
# of 30 days of supply, a run every 15 days; the pool is ships 1 and 2 and
# the source is base 1 at S, which keeps a reserve of 1000 t of supply. He
# gives leave to prepare and to launch. The staff forms a convoy, loads a
# stated weight, sails, unloads, comes home and sends the next run when the
# projection calls for it. The hand calculation is in
# tests/scenario_36_one_convoy.rs. There is no enemy, no aircraft and no
# random draw. It runs on the frozen step 1 figures.
#
# Class 3 is the placeholder cargo ship: 3000 t of cargo, 10 kn at cruise,
# 0.1 t of fuel a mile (1000 t over 10000 nm), 1000 t of fuel. Land unit 1
# costs 2000 men x 0.005 t = 10 t a day at base 2.
#
# PLACEHOLDER DATA. The bases, ships, unit and map are invented.

name = "Placeholder scenario 36: One convoy"
placeholder = true
seed = 1942
days = 18
orders_inside_a_day = true
map = "../../map/placeholder_one_convoy.toml"
ship_classes = ["../../reference/ship_classes.csv"]
port_sizes = "../../reference/port_sizes.csv"
aircraft_types = "../../reference/aircraft_types.csv"
search = "../../reference/search.toml"
surface_combat = "../../reference/surface_combat.toml"
ground = "../../reference/ground.toml"

# S: the source. Port size 1, one berth at 50 t an hour.
[[base]]
id = 1
name = "Placeholder base S, Allied"
side = "allied"
q = 0
r = 0
supply_t = 5000
fuel_t = 2000

# T: the destination. Port size 0, by lighter at 20 t an hour.
[[base]]
id = 2
name = "Placeholder base T, Allied"
side = "allied"
q = 5
r = 0
supply_t = 100

[[land_unit]]
id = 1
name = "Placeholder unit 1"
side = "allied"
men = 2000
q = 5
r = 0
posture = "defend"

# Ships 1 and 2 lie in port at S in no task force, full of fuel.
[[ship]]
id = 1
name = "Placeholder cargo ship 1"
class = 3
side = "allied"
fuel_t = 1000
port = 1

[[ship]]
id = 2
name = "Placeholder cargo ship 2"
class = 3
side = "allied"
fuel_t = 1000
port = 1

# The Allied commander's commands, in force from day 1.
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
base = 2
floor_days = 30
interval_days = 15

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
ships = [1, 2]
task_forces = []
source = 1

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "reserve"
base = 1
supply_t = 1000
fuel_t = 0

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
