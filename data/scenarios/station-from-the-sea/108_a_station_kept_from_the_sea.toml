# Scenario 108: a station kept from the sea.
#
# Decision 0192. Side A, the Allied side, has a surface force G, task force 1:
# two placeholder cruisers and two placeholder destroyers (ships 1 to 4, of
# 15 knots at cruise and 30 at full speed), stopped at sea at (0,0), with no
# home port, on the surface combat mission, with full tanks. One Allied base,
# B (base 1), lies at (4,5), a coast hex with a port that fuels at 100 t an
# hour, with 5,000 t of fuel above its reserve. The commander states the
# end "stand task force 1 at (4,0)", the station X, 4 hexes from G and 5
# hexes from B, at the balanced risk by default, and gives both leaves. A
# staff of side A that sees no obstacle routes G to X, where it lies stopped.
# There is no enemy and the side holds no contact: a variant of the test
# gives it one. The hand calculation is in
# tests/scenario_108_a_station_kept_from_the_sea.rs.
#
# The test builds its variants from the text of this file, at the marked
# lines below: the station at 8, 12 or 20 hexes, the risk, a contact of ships
# held 10 hexes from the station, B's fuel at nothing, a nearer base B2 at
# (4,2) that holds no fuel, a ship's fuel cut, G beginning at X, a second
# force H, task force 2, with its own intent, a hold, and a deny of the
# waters round X. The test runs this file on the frozen step 1 figures, with
# the fuelling figures of data/reference/port_sizes_placeholder_fuelling.csv
# and the classes of data/reference/ship_classes_placeholder_scenario_108.csv.
# The map is data/map/placeholder_a_station_kept_from_the_sea.toml.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# PLACEHOLDER DATA. The bases, ships, figures and map are invented. Every
# name below says "Placeholder".

name = "Placeholder scenario 108: A station kept from the sea"
placeholder = true
seed = 1942
days = 4
map = "../../map/placeholder_a_station_kept_from_the_sea.toml"
ship_classes = [
    "../../reference/ship_classes.csv",
    "../../reference/ship_classes_placeholder_scenario_108.csv",
]
port_sizes = "../../reference/port_sizes_placeholder_fuelling.csv"
aircraft_types = "../../reference/aircraft_types.csv"
search = "../../reference/search.toml"
surface_combat = "../../reference/surface_combat.toml"
air_combat = "../../reference/air_combat.toml"

# Allied base 1, B: fuel above its reserve.
[[base]]
id = 1
name = "Placeholder base B"
side = "allied"
q = 4
r = 5
supply_t = 1000
fuel_t = 5000

# MARK: bases

# Task force 1, G: two placeholder cruisers and two placeholder destroyers,
# stopped at sea, with the stance avoid and no home port.
[[task_force]]
id = 1
name = "Placeholder force G"
side = "allied"
q = 0
r = 0
mission = "surface_combat"
stance = "avoid"

[[ship]]
id = 1
name = "Placeholder cruiser 1"
class = 15
side = "allied"
fuel_t = 2000
task_force = 1

[[ship]]
id = 2
name = "Placeholder cruiser 2"
class = 15
side = "allied"
fuel_t = 2000
task_force = 1

[[ship]]
id = 3
name = "Placeholder destroyer 3"
class = 16
side = "allied"
fuel_t = 500
task_force = 1

[[ship]]
id = 4
name = "Placeholder destroyer 4"
class = 16
side = "allied"
fuel_t = 500
task_force = 1

# MARK: forces

# MARK: contacts

# The Allied commander's commands.
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "stand_at"
task_force = 1
hex = [4, 0]

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true

# MARK: commands

# MARK: orders
