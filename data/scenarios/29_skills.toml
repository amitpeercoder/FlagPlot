# Scenario 29: what a land unit is good at (decision 0098).
#
# Proves a land unit's skills against a hand calculation. Mountain troops
# march faster in the mountains and no faster out of them (units 1 to 4 on a
# strip of land: M1, M2 and P); troops raised to land from the sea rehearse a
# landing faster (units 5 to 7, aboard three troop transports at base 1); a
# heavy unit fires more and eats more (units 8 and 9 at F); and troops fitted
# to hold ground hit more often when they defend (units 10 and 11 at G). The
# hand calculation is in tests/scenario_29_skills.rs, which gives the four
# strengths of the skills the values it calculates with (the frozen figures
# set every one to 0, which switches the rules off). The hits of a fight are
# the dice; the test reads them.
#
# No air combat, wear, fatigue or air supply figures are named, so no
# aircraft flies. No force sails.
#
# PLACEHOLDER DATA. The units, bases and map are invented.

