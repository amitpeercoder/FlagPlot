# Scenario 42d: saved in the middle (decision 0107, step 4).
#
# Scenario 41a whole (27 days: a plan that waits for leave, a hold, a changed
# intent, a release), with two more commands: on day 1 interrupt 1, base 2
# below 38 days of supply; on day 11 interrupt 1 is acknowledged. The game is
# saved at the end of day 12 with ship 1 held, the plan amended once and
# interrupt 1 fired twice and acknowledged, resumed, and compared with play
# that was not interrupted.
#
# It proves step 4 of decision 0107 (step 3, stage 1: interrupts, a run of
# days in one call, the command report, resuming; rulings 31 to 40 there)
# against the hand calculation in tests/scenario_42_interrupts_and_runs.rs.
# There is no enemy, no aircraft and no random draw. It runs on the frozen
# step 1 figures.
#
# PLACEHOLDER DATA. The bases, ships, units and map are invented.

name = "Placeholder scenario 42d: Saved in the middle"
placeholder = true
seed = 1942
days = 27
map = "../map/placeholder_one_convoy.toml"
ship_classes = ["../reference/ship_classes.csv"]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground.toml"

