# THE TABLE'S 39 DAYS UNDER DECISION 0224'S RULINGS OF NOV 23, 2026.
# Built on ../table-boats/07b_slice_submarines.toml (`built_on`, decision 0234): the same
# file with these changes and nothing else. (The table plays the games with
# submarines of decisions 0225 and 0227; this file is that game under the
# rulings.)
#
#   Ruling 1: each Japanese run the file starts at Shortland (task forces 30
#   and 32 to 39) starts stopped at Rabaul (base 2) with Rabaul as its home
#   port, and may be used one day earlier than the file has it. What each has
#   aboard at the start is unchanged. Shortland (base 7) keeps no supply and
#   no fuel (no row gives it a stock: the two entries of data/oob/gaps.csv for
#   shortland-islands say so). A NAMED SIMPLIFICATION: the passage from Rabaul
#   to the Shortlands in a transport and the run from the Shortlands in
#   destroyers are one passage by one force (troop_lift_facts 12835, 12837,
#   12813, 12815, 723). From Rabaul no run can go at full speed and come home.
#   Ruling 2: Espiritu Santo (base 3) starts with 2,120 t of supply in place of
#   960 t. PLACEHOLDER: the sum of the loads the rows state for the runs that
#   landed at Guadalcanal or Tulagi on or before 14 September 1942, wherever
#   they loaded (troop_lift_facts 88, 60); a least figure of what was carried,
#   not a stock (data/oob/gaps.csv holds the two entries for espiritu-santo).
#   Its fuel stays 600 t, a placeholder (ruling 3).
#
#   Decision 0232, step 3: the line `trial = "../../reference/trial.toml"` is
#   stated; island 3, "Guadalcanal and Tulagi" (base 1, then base 4), is added
#   after island 2 (in the full-slice file, which has no island, islands 1 and 2
#   are added before it, as its sister files have them). An island is map data
#   and the trial a key: no game moves.
#
# It states the `name`, the `trial`, base 3's `supply_t`, for task forces 30
# and 32 to 39 `at_base`, `home_port` and `available_from`, and the islands,
# and nothing else. The header of the file it is built on, and of each file
# below that, follow in those files.

built_on = "../table-boats/07b_slice_submarines.toml"
name = "Stage 3's proof, arrangement (b): the Allied side given nothing, Japanese intents; the staff's setup of the full slice, 7 August to 14 September 1942 (the table's rear bases, decision 0224)"
trial = "../../reference/trial.toml"

[[base]]
id = 3
# Decision 0224, ruling 2: PLACEHOLDER, 2,120 t in place of 960 t. The sum of the loads
# the rows state for the runs that landed at Guadalcanal or Tulagi on or before the last
# day, wherever they loaded: 120 t (troop_lift_facts 88, Dyer, four destroyer-transports
# of 15 August) and 2,000 t (troop_lift_facts 60, Dyer, "over 2,000 tons", 20 to 23
# August). Espiritu Santo stands for every port they loaded at (Noumea is not a base of
# the scenario). A least figure of what was carried, not a stock; the gap stays open.
supply_t = 2120

[[task_force]]
