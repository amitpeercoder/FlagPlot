# Scenario 23: the fight ashore, and a base that changes side (decision
# 0090).
#
# Proves the fight ashore against a hand calculation, in three places on one
# row. At X, a Japanese unit on attack against a fed Allied defender fails and
# stops by fatigue. At Y, an Allied unit on attack beats an unfed Japanese
# defender on the first day; base 3 changes side, with half its fuel, its air
# group, a ship in its port and a force's home port. At Z, one Allied unit on
# attack takes an empty Japanese base without a fight; one of its two air
# groups was flown out the day before it fell. The hand calculation is in
# tests/scenario_23_fight_ashore.rs.
#
# No air combat, wear, fatigue or air supply figures are named, so no aircraft
# flies, nothing wears, tires or is grounded, and no base pays for aircraft.
# Each night the men's supply is the first thing charged.
#
# PLACEHOLDER DATA. The units, bases, ships, air groups and map are invented.

