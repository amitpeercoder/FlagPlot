# Scenario 30: units that work, and what they build (decision 0099).
#
# Proves working units against a hand calculation. Working units build an
# airfield, and an air group can then be flown to it (units 1 and 2 at A);
# work on a port speeds the next day's unloading, up to twice, and one unit
# does one activity a day (units 3 and 4 at B, forces 1 to 4, unit 12);
# work on aircraft repairs more of them the next night and hungry men make
# less (unit 5 at C); work on defences raises a defender's chance to hit, a
# fighting unit set to work makes half as much, and working men do not fire
# (units 6, 7 and 8 at D); working men do not hold a base (units 9 and 10 at
# E). The hand calculation is in tests/scenario_30_working_units.rs, which
# runs the scenario on the frozen step 1 figures. Only the hits of a fight
# are the dice; the test reads them.
#
# The scenario names the wear and repair figures and not the air supply
# figures: aircraft are repaired and cost no supply. No group has a mission,
# so nothing flies and nothing wears. No force sails.
#
# PLACEHOLDER DATA. The units, bases, ships and map are invented.

