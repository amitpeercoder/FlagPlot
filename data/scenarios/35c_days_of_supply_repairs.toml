# Scenario 35c: days of supply, repairs (decision 0107, 31 to 36).
#
# One coast hex, F, with base 6 (Allied, 100 t, an airfield, 3 repairs a day)
# and air group 2: 10 ready and 5 damaged placeholder fighters, no mission.
# Nothing flies, so nothing wears. The hand calculation is in
# tests/scenario_35_days_of_supply.rs, which runs the scenario on the frozen
# step 1 figures.
#
# The wear and repair and the air supply figures are named and no air combat,
# fatigue or ground figures.
#
# PLACEHOLDER DATA. The base, air group and map are invented.

