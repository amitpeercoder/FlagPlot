# Scenario 35a: days of supply, men (decision 0107, 31 to 36).
#
# Proves a side's days of supply in a hex against a hand calculation: no
# figure where there is no use (A), men ashore at their weight (B), a regiment
# at sea counted from the day it is due (C, by the transport force bound there
# from D), a base taken (G) and a base lost (H). The hand calculation is in
# tests/scenario_35_days_of_supply.rs, which runs the scenario on the frozen
# step 1 figures with the weight strength set to 0.25. Nothing in it has a
# dice roll that matters: the fights are won without a shot.
#
# No air combat, wear, fatigue or air supply figures are named, so no aircraft
# flies and none is here. The force is five placeholder troop transports.
#
# PLACEHOLDER DATA. The units, bases, ships and map are invented.

