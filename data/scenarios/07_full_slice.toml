# Searches. The American one is Enterprise's scouting squadron to the north,
# 290 to 090 at 200 miles: the arc of her afternoon search (engagement_events
# 158, her action report; 157, the Navy narrative, has 270 to 090) and the
# range of her dawn search (144, 146), which is also the SBD-3's derived
# search range. The Japanese ones are set from the record (decision 0073).
# Japanese times in the record are Tokyo time, two hours behind the
# scenario's clock; a search flies in every daylight pulse, from the pulse's
# start, with every aircraft its group can fly (docs/rules chapter 3).

[[order]]
day = 4
side = "allied"
air_group = 103
kind = "set_air_mission"
mission = "search"

[[order]]
day = 4
side = "allied"
air_group = 103
kind = "set_search_arc"
from_deg = 290
to_deg = 90
range_nm = 200

# The vanguard's floatplanes: Nagumo's signal 19 had the 11th Sentai search
# from 09:00 Tokyo time (11:00 here) on a base line of 150 degrees, six
# aircraft (engagement_events 437); four flew, to the south and south-east,
# to 330 miles at most (370), Chikuma's two at 09:00 (438) and Kumano's at
# 09:20 to 09:40 (307, 439). Chikuma's No. 2 found the American carriers at
# 12:05 Tokyo time, 153 degrees and about 260 miles from the carriers (441).
# The arc is 120 to 180: south and south-east, about the base line, and it
# holds the bearing of the sighting (a reading: search method 8 and "left
# half" are defined on no page read). The range is the 330 flown, within the
# E13A1's search radius of 398 (decision 0075). Chikuma's five floatplanes stand for
# the four to six of the vanguard (the other cruisers' and the battleships'
# floatplanes are not in the scenario).
[[order]]
day = 4
side = "japanese"
air_group = 117
kind = "set_air_mission"
mission = "search"

[[order]]
day = 4
side = "japanese"
air_group = 117
kind = "set_search_arc"
from_deg = 120
to_deg = 180
range_nm = 330

# A LIMIT OF THE RULES, not the record: the carriers' attack units are on
# naval strike (below), as decision 0063 has them, but on the day they flew
# the dawn search and found nothing (engagement_events 366, 368, 369, 440),
# and in the afternoon they were held and neither searched nor struck. A
# search cannot be ordered for one pulse, so the scenario cannot say so: an
# order to search would add an afternoon search the record does not have, and
# the dawn search finds nothing in the rules either (decision 0073).

# Tone's floatplanes (group 120) have no order. No row has the Ryujo
# detachment search on the 24th. The one row that has Tone launch searchers
# (engagement_events 172, a website) puts her in the vanguard with Chikuma;
# her own division's war diary has her detached with Ryujo from 02:00 (327),
# and the search was ordered to the vanguard's commander (437).

