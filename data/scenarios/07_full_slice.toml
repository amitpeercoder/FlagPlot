# Scenario 7: the full slice, 21 August to 3 September 1942 (fourteen days).
#
# Decision 0043. Everything the earlier scenarios built, run together on the
# real map: the Rabaul against Guadalcanal air campaign (scenario 6, as it
# is), the Eastern Solomons carrier battle placed on day 4, 24 August
# (scenario 5), a placeholder convoy from Espiritu Santo to Henderson Field,
# and three placeholder night surface actions in the open Coral Sea. It is
# assembled from files that exist. It is not a reconstruction and nothing in
# it is compared with history. Its only claim is that it runs and repeats
# (tests/scenario_07_determinism.rs).
#
# What was changed to put the pieces together:
#   - The Eastern Solomons air groups on carriers are numbered 101 to 120
#     (their numbers there, plus 100), since the Rabaul scenario uses 1 to 3
#     and 10 to 17. Their ships, task forces and bases keep their numbers.
#   - Eastern Solomons' own Henderson Field is the Rabaul scenario's base 1.
#     Its two groups there, VMF-223 (group 9) and VMSB-232 (group 10), are the
#     Rabaul scenario's groups 10 and 11 and are left out, with their orders.
#   - Eastern Solomons' orders, written for its day 1, are given on day 4.
#   - VMF-223 (group 10) starts with 6 damaged aircraft besides its 19 ready
#     ones. Scenario 6 has none. It is a placeholder so that the log has
#     damaged aircraft destroyed on the ground.
#   - Rabaul scenario arrivals after day 14 are left out (days 22 and 24).
#     Its orders are all on day 1.
#   - Ships and air groups of the Eastern Solomons scenario start in the
#     hexes that scenario gives them and sit there until day 4.
#   - Force A (task force 6) is sent north on day 5 and back on day 6, so that
#     the log has a turn-back event (decision 5 of 0005). It is there only for
#     coverage, as the damaged fighters of group 10 and the order sent to the
#     wrong side's force are. It is home again at the end of day 6.
#   - Henderson Field has 400 t of fuel and Espiritu Santo 600 t, so that the
#     log has refuelling in port (decision 0045): the convoy refuels at
#     Henderson Field after it arrives. They are placeholders and there only
#     for coverage, like the damaged fighters above. Without them the full
#     slice has no fuel at its bases and no refuelling, as before.
#
# PLACEHOLDER DATA. The figures files are placeholders. The convoy, its
# escort, the night-action forces, a bystander and a dry destroyer are
# invented: placeholder classes, names starting "Placeholder".
name = "Scenario 7: The full slice, 21 August to 3 September 1942"
