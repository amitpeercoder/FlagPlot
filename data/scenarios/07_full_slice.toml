# The Japanese stocks ashore east and west of the airfield (decision 0101, 22,
# as amended, 5). A force put ashore with nothing would have a fed share of 0
# and fire nothing, which the record does not support, so each landing hex
# holds a base of the Japanese side, off the enemy's map, with no airfield.
# The bases themselves are placeholders; the stocks are sized from rows,
# turned into tons by ground.toml's daily_supply_t_per_man of 0.005:
#   (3,-4): two weeks for the Kawaguchi main body (land_unit_facts 975),
#     3,090 x 0.005 x 14 = 216.3 t, and seven days for the Ichiki echelon,
#     916 x 0.005 x 7 = 32.06 t: 248 t, cut to a whole ton.
#   (2,-5): seven days for the 2,070 men landed there (200, 900, 637 and
#     333): 72 t, cut to a whole ton.
# The seven days are the practice a Japanese officer gave (two on the man,
# three in the unit, two at division, land_unit_facts 1044): a practice and
# not what these units were issued.
[[base]]
id = 5
name = "Placeholder Japanese stock at Taivu"
side = "japanese"
q = 3
r = -4
supply_t = 248
airfield = false
on_map = false

[[base]]
id = 6
name = "Placeholder Japanese stock west of the Lunga"
side = "japanese"
q = 2
r = -5
supply_t = 72
airfield = false
on_map = false

# Shortland, the anchorage the Japanese destroyer runs sailed from, in the hex
