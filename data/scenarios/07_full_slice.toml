kinds = ["carrier", "battleship", "cruiser", "transport"]

[[order]]
day = 4
side = "japanese"
air_group = 116
kind = "set_air_mission"
mission = "naval_strike"

# Ryujo's attack unit raids Henderson Field (decision 0063, "What it costs"):
# the record has her launch 15 fighters and 6 attack planes at it
# (engagement_outcomes 1171, her action report) from 200 to 202 miles
# (engagement_events 331, engagement_positions 310). That is beyond the B5N2's
