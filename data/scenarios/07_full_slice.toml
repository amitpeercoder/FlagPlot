fuel_t = 600

# Tulagi, with Gavutu and Tanambogo, one place in one hex (decision 0093, 5;
# place_positions 74, 75), Japanese at the start, with no airfield (decision
# 0101, 11). PLACEHOLDER stock: ten days for its 440 men, 440 x 0.005 x 10 =
# 22 t (the architect's ruling on rows, 1, decision 0101). No row gives a
