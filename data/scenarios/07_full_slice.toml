# Scenario 7: the full slice, 7 August to 14 September 1942 (39 days).
#
# Decisions 0043, 0093 and 0101. Everything the earlier scenarios built, run
# together on the real map: the landings of 7 to 9 August on Guadalcanal and
# Tulagi and the land fight that followed them, to the ridge of 12 to 14
# September (decisions 0093 and 0101, with the architect's rulings recorded at
# the end of 0101); the Rabaul against Guadalcanal air campaign (scenario 6);
# the Eastern Solomons carrier battle on day 18, 24 August (scenario 5); a
# placeholder convoy from Espiritu Santo to Lunga; and three placeholder night
# surface actions in the open Coral Sea. Day 1 is 7 August; a game day runs
# from 18:00 the evening before its date (docs/rules chapter 1), so the night
# pulse of day 1 is the night of 6 to 7 August.
#
# From this stage its land fight is measured (data/validation/
# guadalcanal_landings.toml); the rest of it still is not. The frozen copy in
# data/scenarios/step2-frozen/ is the fourteen-day slice and is not touched.
#
# WHAT THE LAND FIGHT HOLDS (decision 0101 and the rulings at its end; every
# figure is used as given there, and the row each rests on is named beside it):
#   - Lunga (base 1) and Tulagi (base 4) start Japanese. The American bases
#     there are formed by the landings; the Japanese bases change side when
#     their side is beaten ashore (decision 0090).
#   - The American transports start at sea and land on day 1. The Japanese
#     runs start at Shortland (base 7), Ichiki's at Rabaul, and are sent out on
#     the day that lands them in the night pulse of the record's day.
#   - A NIGHT LANDING IS NUMBERED A DAY LATER THAN ITS DATE. A destroyer run
#     landed after dark on the date its row gives (the one clock time read,
#     land_unit_facts 1049, is about 9 p.m.), and the evening of a date is the
#     night pulse of the next game day. So the Oite's landing of 16 August is
#     day 11, not day 10 (the architect's ruling of Nov 14, 2026).
#   - The squadrons of Henderson Field arrive on day 14, 20 August, and wait
#     until Lunga is American and has its airfield (decision 0103, 5, and the
#     ruling A of decision 0101): their groups start at base 1 with nothing.
#
# What was changed to put the other pieces together (decision 0043):
#   - The Eastern Solomons air groups on carriers are numbered 101 to 126
#     (their numbers there, plus 100), since the Rabaul scenario uses 1 to 3
#     and 10 to 17. Their ships, task forces and bases keep their numbers.
#   - Eastern Solomons' own Henderson Field is the Rabaul scenario's base 1.
#     Its two groups there, VMF-223 (group 9) and VMSB-232 (group 10), are the
#     Rabaul scenario's groups 10 and 11 and are left out, with their orders.
#   - Every day number of the fourteen-day slice is moved by 14 (decision
#     0093, 1): Eastern Solomons' orders, written for its day 1, are given on
#     day 18, and the air campaign's orders and arrivals move by the same 14.
#     The Rabaul raids of 9 to 13 September and the arrivals of scenario 6's
#     days 22 and 24, which the fourteen days left out, are restored at their
#     shifted days (ruling F of decision 0101).
#   - VMF-223 (group 10) no longer starts with 6 damaged aircraft: it starts
#     with nothing and its aircraft arrive (an arrival brings ready aircraft
#     only). The damaged aircraft were a placeholder for coverage.
#   - Ships and air groups of the Eastern Solomons scenario start in the
#     hexes that scenario gives them and sit there until day 18 (ruling G of
#     decision 0101). Where the carriers were on 6 August, south of
#     Guadalcanal, is a gap.
#   - Force A (task force 6) is sent north on day 19 and back on day 20, so
#     that the log has a turn-back event (decision 5 of 0005). It is there
#     only for coverage, as the order sent to the wrong side's force is.
#   - Lunga has 400 t of fuel and Espiritu Santo 600 t, so that the log has
#     refuelling in port (decision 0045). They are placeholders and there only
#     for coverage. Lunga's fuel is the Japanese base's at the start: the
#     side that takes it keeps half (decision 0090).
#
# PLACEHOLDER DATA. The figures files are placeholders. The convoy, the
# transports of both sides, the night-action forces, a bystander and a dry
# destroyer are invented: placeholder classes, names starting "Placeholder".
name = "Scenario 7: The full slice, 7 August to 14 September 1942"
placeholder = true
seed = 1942
days = 39
map = "../map/south_pacific.csv"
land_links = "../map/south_pacific_land_links.csv"
ship_classes = [
    "../reference/ship_classes_eastern_solomons.csv",
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
    "../reference/ship_classes_placeholder_fast_transport_cargo.csv",
    "../reference/ship_classes_guadalcanal_landings.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = [
    "../reference/aircraft_types_eastern_solomons.csv",
    "../reference/aircraft_types_rabaul_guadalcanal.csv",
]
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"
air_upkeep = "../reference/air_upkeep.toml"
fatigue = "../reference/fatigue.toml"
air_supply = "../reference/air_supply.toml"
ground = "../reference/ground.toml"

# Lunga, the airfield's hex, Japanese at the start (decision 0101, 6). It has
# no airfield and 13,763 of work done on one (decision 0101, 9): the strip was
# 2,600 ft graded and rolled on 7 August (place_facts 60) of the 3,778 ft it
# had when finished (place_facts 62), so 20,000 x 2,600 / 3,778, cut to a
# whole number. The share rests on rows; the total, ground.toml's
# airfield_work, is a placeholder, so this figure is a placeholder too. Its
# stock is 1,090 t (decision 0101, 20), half of which the side that takes it
# keeps: 545 t, ten days for the Americans there, the ten days of Japanese
# food in the division's count of about 15 August, read from the note of
# land_unit_facts 417. Its guns and repairs a day are the slice's placeholders
# for Henderson Field, kept by the side that holds it; its fuel is the
# placeholder above.
[[base]]
id = 1
name = "Lunga"
side = "japanese"
q = 2
r = -4
supply_t = 1090
fuel_t = 400
anti_aircraft = 8
aircraft_repairs_per_day = 3
airfield = false
airfield_work = 13763

# The Rabaul airfields, Lakunai and Vunakanau, in one hex. Nothing attacks
# them in this scenario, so they are given no guns. Supply and repairs a day
# are placeholders.

[[base]]
id = 2
name = "Rabaul"
side = "japanese"
q = -5
r = -13
supply_t = 10000
aircraft_repairs_per_day = 4

