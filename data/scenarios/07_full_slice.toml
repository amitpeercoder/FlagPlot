# The American transports: placeholders (decision 0101, 16). No rule gives a
# transport its kind or its cargo, so the men and supply go in the placeholder
# troop transport (class 10, 600 men, 3,000 t) and the placeholder fast
# transport (class 11, 200 men, no cargo), each named "Placeholder", enough of
# them to carry each landing's men and supply. A ship carries the men of one
# unit only, so each unit takes whole ships: on Guadalcanal 8 for Combat Group
# A, 8 for Combat Group B, 3 for the Support Group and 2 for the pioneers (21);
# on the Tulagi side 2 for the Raiders, 1 for the Parachutists, 2 for 2/5 and 7
# for the rest (12). No escort is in the slice: the escorts and the covering
# cruisers are a gap (ruling H of decision 0101).
#
# WHERE THEY START. Both groups were at sea on the night of 6 August, coming
# round Savo Island from the west, and began landing in the morning of 7
# August (decision 0101, 7). Each starts three hexes west of its beach by sea,
# 120 nm, which the placeholder transport's cruising 10 knots steams in 12
# hours: from 18:00, the start of day 1, it is off its beach at about 06:00 on
# 7 August, the start of the morning pulse, and lands on day 1, the record's
# day. (-1,-4) is three hexes west of Lunga along the row; (0,-5) three west of
# Tulagi along its row, past Savo. A start hex is the working out of a sailing
# time, not a position from a row: no row of the area's positions puts the
# force there at 18:00.

[[task_force]]
id = 20
name = "Placeholder transports, Guadalcanal"
side = "allied"
q = -1
r = -4
mission = "transport"
home_port = 3

[[task_force]]
id = 21
name = "Placeholder transports, Tulagi"
side = "allied"
q = 0
r = -5
mission = "transport"
home_port = 3

