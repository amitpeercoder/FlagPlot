# Missions and objectives (decision 0054). The points and the levels are the
# placeholder scale of that decision, to be set from the record. The land
# fight adds base_held for Lunga and Tulagi and men_lost for each side
# (decision 0090), beside what the slice had: every point value of them is a
# PLACEHOLDER set by the lead for this build and resting on no source, as
# every point value of the slice is (decision 0101, as built).
[objectives]
minor = 3
major = 8
decisive = 16

[objectives.allied]
mission = "Take Lunga and Tulagi, build and hold the airfield, land the convoy there, keep the field flying, and win the carrier fight. The Japanese carriers are expected to come down from the north."

