# A LIMIT OF THE RULES, not the record: the second wave (groups 121 and 122,
# with their escorts, groups 123 and 124) rests. The record has it launch at
# 14:00 Tokyo time, 16:00 here (engagement_outcomes 1163, 1169, 409; events
# 202), 27 dive bombers and 9 fighters, find nothing and attack nothing (409,
# 1163: bombs jettisoned). The rules cannot order a launch that finds
# nothing, so the second wave gets the order whose effect over the day is the
# record's: it attacks nothing. Its launch stays in the record as what the
# scenario does not fly. Its losses after dark (293; 1170) are outside the
# rules and the scenario's 18:00 end. What it costs: in the record these 36
# aircraft were away from their carriers from 16:00; here they are aboard all
# day, so if Shokaku or Zuikaku is sunk they go down with her, and a hit that
# puts her flight deck out keeps them aboard, where in the record they would
# have had to land elsewhere or ditch (decision 0081).

[[order]]
