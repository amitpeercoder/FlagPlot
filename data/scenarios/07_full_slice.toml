# Land units (decision 0101, "Land units", with the rulings at its end). A
# unit's men are its fighting men; a working unit's men work and do not fight
# (decisions 0093, 6, and 0099). Every unit has experience 2 and every skill 2
# (the defaults): no real unit has a value until the rule that reads the
# research statements is written. The Americans aboard are on attack from the
# start (decision 0101, 12): they land on attack, and go on the defence by
# order once the base is theirs.

