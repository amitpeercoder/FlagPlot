# Stage 4's proof, case W2: a carrier force believed absent that is there
# (decision 0161, condition 8).
#
# It is scenario 5b, the unopposed strike, played for 7 days and read from the
# other seat. The Japanese force, task force 2, a carrier with no aircraft and
# two cruisers, lies stopped at (9,0). The Japanese side believes the Allied
# carrier force is not in these waters. It is: task force 1 lies stopped at
# (4,0), 200 nm west, its scouts searching the arc the Japanese force lies in
# and its eighteen dive bombers ordered to strike ships, as scenario 5b has
# them, every day.
#
# A trial of the Japanese side holds no enemy in any world, so nothing can
# harm its ships. In the game they are bombed.
#
# The statement and its working are in
# tests/proof_stage_4_case_w2_a_carrier_believed_absent.rs. Everything but the
# days, the two files a trial needs and the belief is scenario 5b's, and that
# scenario's hand calculation gives the chances.
#
# A case of a proof (decision 0072): in a folder of its own, read by no loop,
# and never a scenario for play.
#
# PLACEHOLDER DATA. The ships, aircraft, figures, belief and map are invented.

name = "Placeholder: stage 4's proof, case W2, a carrier force believed absent that is there"
placeholder = true
seed = 1942
days = 7
