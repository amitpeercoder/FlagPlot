# The dive bombers search (decision 0082, 2). That they searched is from
# rows: engagement_events 1189, engagement_outcomes 314, 418, 419 and 475,
# aircrew_fates 115 and 117. The arc and the distance are A READING, not a
# row: 300 to 030 true takes in the north and the Slot, where the rows'
# contacts lie (1189, 1765, 1777, 1817); 200 miles is the distance the
# SBD-3's search rows record as flown elsewhere (aircraft_type_facts 280,
# 282). The arc matters little while the scenario holds no ships; the
# distance sets the wear. No row sets a rest threshold, so none is given.
# LIMITS: a group searches whole in both daylight pulses, where the record
# sent sections; and their strikes on ships (1763, 1765, 1777, 1817, 1867)
# cannot be flown, since the scenario holds no ships.

[[order]]
day = 1
side = "allied"
air_group = 11
kind = "set_air_mission"
mission = "search"

[[order]]
