# Squadrons that arrive during the four weeks (decision 0041). Day 1 is 21
# August. Each arrives with a pilot for each aircraft, which is an
# assumption: the sources count aircraft.
# 24 August: eleven dive bombers of Enterprise, Flight 300.
[[arrival]]
day = 4
air_group = 12
aircraft = 11
pilots = 11

# 30 August: VMF-224.
[[arrival]]
