# Squadrons that arrive during the four weeks (decision 0041). Day 1 is 21
# August. Each arrives with a pilot for each aircraft, which is an
# assumption: the sources count aircraft.
# 24 August: eleven dive bombers of Enterprise, Flight 300. This arrival stays
# scripted here: the scenario has no carriers, so the rule of decision 11 of
# 0059 cannot deliver them. (The full slice and the soak leave it to the rule.)
[[arrival]]
day = 4
air_group = 12
aircraft = 11
pilots = 11

# 30 August: VMF-224.
[[arrival]]
day = 10
air_group = 13
aircraft = 19
pilots = 19

# 30 August: VMSB-231.
[[arrival]]
day = 10
air_group = 14
aircraft = 12
pilots = 12

# 31 August: the 6th Air Group's Zeros reach Rabaul.
[[arrival]]
day = 11
air_group = 3
aircraft = 13
pilots = 13

# 11 September: VF-5, from Saratoga.
[[arrival]]
day = 22
air_group = 15
aircraft = 24
pilots = 24

# 13 September: eighteen fighters from Hornet and Wasp.
[[arrival]]
day = 24
air_group = 16
aircraft = 18
pilots = 18

# 13 September: VS-3.
[[arrival]]
day = 24
air_group = 17
aircraft = 12
pilots = 12

# Replacements at Rabaul: two bombers and two fighters a day, each with a
# pilot. A reading of weak totals, see decision 0042. The Allies receive
# nothing but the squadrons above. INVENTED, NOT FROM A ROW (decision 0082,
# 3): the rows give totals with no day and no unit (air_unit_facts 335, 336:
# 60 fighters and 72 bombers; 337: 85 aircraft from 15 to 28 September) and
# one dated arrival, the 6th Air Group's 13 (row 32), which is the arrival
# above. Rows giving aircraft reaching the scenario's units at Rabaul by day
# and type would settle it. Left as decision 0042 set it.
[[replacement]]
side = "japanese"
base = 2
aircraft_type = 2103
aircraft_per_day = 2
pilots_per_day = 2

[[replacement]]
side = "japanese"
base = 2
aircraft_type = 2102
aircraft_per_day = 2
pilots_per_day = 2

# Rabaul (decision 0082). THE RAID DAYS ARE THE RECORD'S. The bombers fly
# the base strike on the eleven days a raid reached Henderson Field by the
# units' own forms, and rest on the others: 25 and 26 August (days 5, 6), 29
# and 30 August (9, 10), 2 September (13), 5 September (16), and 9 to 13
# September (20 to 24). The forms are in
# docs/research/oob/japanese-air-records.md, section 1, rows 1115, 1044, 982,
# 1047, 987, 1059, 1005, 1065, 1008, 1075, 1011, 1080, 1015, 1085, 1019,
# 1089, 1023, 1094, 1028, 1100, 1033, 1108 and 1037; row 954 counts 14
# missions launched and 4 aborted to 12 September. How many bombers fly on a
# raid day is what the group has ready, cut by its fatigue (the rules
# decide); the forms' numbers sent are the check, in decision 0082.
# Raids that turned back (23, 24, 27, 28 and 31 August, 1, 4 and 16
# September by the forms) are not flown: the rules have no weather and no
# raid that turns back. No row sets a rest threshold, so none is given
# (the default): the record's schedule, not fatigue, sets the days. Decision
# 0042 had fatigue stand in for weather; a recorded schedule replaces it.

[[order]]
day = 1
side = "japanese"
air_group = 1
kind = "set_air_mission"
mission = "rest"

[[order]]
