# Scenario 6: Rabaul against Guadalcanal in the air, 21 August to 17
# September 1942.
#
# Stage 6e, which closes scenario 6. The air groups, their aircraft, the
# days squadrons arrived and the two airfields are historical, settled by
# the architect from data/oob (docs/decisions/0042-rabaul-against-guadalcanal.md).
# It is the first scenario in which wear, fatigue, pilots, replacements,
# arrivals and base supply all run together. The hand calculation is in
# tests/scenario_06_rabaul_guadalcanal.rs. The test runs this file with
# seeds 1 to 1000.
#
# PLACEHOLDER DATA in part. The combat, wear, fatigue and supply figures are
# placeholders, as in every scenario. So are each base's supply and repairs
# a day, and the replacement rates are a reading of weak totals. Each is
# marked below.

name = "Scenario 6: Rabaul against Guadalcanal, 21 August to 17 September 1942"
placeholder = true
seed = 1942
days = 28
map = "../map/south_pacific.csv"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types_rabaul_guadalcanal.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"
air_upkeep = "../reference/air_upkeep.toml"
fatigue = "../reference/fatigue.toml"
air_supply = "../reference/air_supply.toml"

# Henderson Field, in the hex of Lunga Point. Eight anti-aircraft shots: two
# batteries of four 90 mm guns of the 3rd Defense Battalion (decision 0042).
# Supply and repairs a day are placeholders.
[[base]]
id = 1
name = "Henderson Field"
side = "allied"
q = 2
r = -4
supply_t = 4000
anti_aircraft = 8
aircraft_repairs_per_day = 3

# The Rabaul airfields, Lakunai and Vunakanau, in one hex. Nothing attacks
# them in this scenario, so they are given no guns. Supply and repairs a day
# are placeholders.
[[base]]
