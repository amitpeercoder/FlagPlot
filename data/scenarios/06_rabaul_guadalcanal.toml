# Both fighter groups keep nothing over Rabaul and send every fighter that can
# fly as escort, which they do only on a raid day. Decision 0042, 15: nothing
# attacks Rabaul. No rest threshold (decision 0082). The record's escorts
# include units the scenario leaves out (Shokaku's fighters from Buka on 29
# and 30 August and 2 September, the 2nd Air Group on 12 September), and on
# 30 August the Tainan Air Group's eight turned back; here every escort is
# the Tainan's and, from 31 August, the 6th's, and none turns back.

[[order]]
day = 1
side = "japanese"
air_group = 2
kind = "set_air_mission"
mission = "combat_air_patrol"

[[order]]
day = 1
side = "japanese"
air_group = 2
kind = "set_patrol_share"
share = "0"

[[order]]
day = 1
side = "japanese"
air_group = 3
kind = "set_air_mission"
mission = "combat_air_patrol"

[[order]]
day = 1
side = "japanese"
air_group = 3
kind = "set_patrol_share"
share = "0"

# Henderson Field: every fighter group patrols over the field with all it
# can fly, and the staff rests each above a fatigue of 40. INVENTED, NOT FROM
# A ROW (decision 0082, 3): no row says the fighters kept a standing patrol
# or sets a rest threshold. The rows have them scrambled on a coastwatcher's
# alarm (engagement_outcomes 545, 572, 1328) and reaching height late (544,
# 1334); none gives the warning in minutes. A row giving the warning time, or
# the fighters' daily patrol routine, would settle it. Left as decision 0042
# set it.

[[order]]
