# Scenario 109: men ashore with no more coming.
#
# Decision 0193. Side J (the Japanese side) has a base S, base 1, at (0,0)
# and a transport force L, task force 1, nine placeholder troop transports
# (600 men each), stopped at sea at (2,0), 12 hexes from P, with two land
# units aboard and nothing else: U, land unit 1, 3,000 men at fatigue 10, and
# V, land unit 2, 2,386 men at fatigue 0. P at (14,0) is a coast hex with an
# Allied base 2 in it (1,000 t of supply) and an Allied garrison of 3,444 men
# on defend (land unit 10). J holds an opening estimate of 3,444 enemy men at
# P. No unit is left behind at S. A third J unit, W, land unit 3, 2,000 men,
# is not in the game as it stands: a variant of the test puts it ashore at S
# or aboard a second lift, and gives it a day.
#
# On day 1 J's commander states "take the place at (14,0)" with the forces L,
# land units 1 and 2 and base 1 as the source, asks for no count of the
# enemy at P (the limit "knowledge: none"), and gives both leaves. The risk is
# press on day 1, so that the staff sends the lift (a lift short of the men
# wanted at balanced, with none to follow it to feed it, is not sent), and
# balanced from day 2. The staff releases the plan on day 1 and routes L to P
# and home again, acting at P, with the order to unload: L is at (8,0) on the
# morning of day 2, at P on the morning of day 3, and U and V are ashore on
# defend on the morning of day 4, M, the first morning of the judgement
# ashore. The game is 7 days. The units rest by nothing (rest_per_day 0), no
# man is lost for want of supply (unfed_loss_share_per_day 0) and no ground
# report is made (no report error figure is given): U's fatigue is 10 and J's
# estimate is 3,444 on every morning. Neither side attacks but by the
# staff's order: the Allied garrison is given no order, and J's units are on
# defend until the staff sets them to attack.
#
# The test builds its variants from the text of this file, at the marked
# lines below. The hand calculation is in
# tests/scenario_109_men_ashore_with_no_more_coming.rs. The test runs this
# file on the frozen step 1 figures, with scenario 109's ground figures
# (data/reference/ground_placeholder_scenario_109.toml). The map is
# data/map/placeholder_a_lift_turned_back.toml, scenario 107's.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# PLACEHOLDER DATA. The bases, ships, units, estimate and figures are
# invented. Every name below says "Placeholder".

name = "Placeholder scenario 109: Men ashore with no more coming"
placeholder = true
seed = 1942
days = 7
map = "../../map/placeholder_a_lift_turned_back.toml"
ship_classes = [
    "../../reference/ship_classes.csv",
    "../../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../../reference/port_sizes.csv"
aircraft_types = "../../reference/aircraft_types.csv"
search = "../../reference/search.toml"
surface_combat = "../../reference/surface_combat.toml"
ground = "../../reference/ground_placeholder_scenario_109.toml"

# Japanese base 1, S: supply for the whole game and fuel.
[[base]]
id = 1
name = "Placeholder base S"
side = "japanese"
q = 0
r = 0
supply_t = 1000
fuel_t = 2000

# Allied base 2, P: an airfield with no gun and no aircraft, and 1,000 t of
# supply, so that the Allied garrison is fed and loses no man unfed.
[[base]]
id = 2
name = "Placeholder airfield P"
side = "allied"
q = 14
r = 0
supply_t = 1000
fuel_t = 0

# Task force 1, L: nine placeholder troop transports (600 men each), stopped at
# sea at (2,0), 12 hexes from P, with U and V aboard and nothing else.
[[task_force]]
id = 1
name = "Placeholder lift L"
side = "japanese"
q = 2
r = 0
mission = "transport"

[[ship]]
id = 1
name = "Placeholder troop transport 1"
class = 10
side = "japanese"
fuel_t = 1000
task_force = 1

[[ship]]
id = 2
name = "Placeholder troop transport 2"
class = 10
side = "japanese"
fuel_t = 1000
task_force = 1

[[ship]]
