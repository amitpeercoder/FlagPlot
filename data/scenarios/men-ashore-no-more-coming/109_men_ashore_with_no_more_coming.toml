name = "Placeholder troop transport 5"
class = 10
side = "japanese"
fuel_t = 1000
task_force = 1

[[ship]]
id = 6
name = "Placeholder troop transport 6"
class = 10
side = "japanese"
fuel_t = 1000
task_force = 1

[[ship]]
id = 7
name = "Placeholder troop transport 7"
class = 10
side = "japanese"
fuel_t = 1000
task_force = 1

[[ship]]
