# Allied task force 4, a placeholder cruiser force far from everything, so
# that side A has a force and the game is not over for lack of one.
[[task_force]]
id = 4
name = "Placeholder Allied cruiser force"
side = "allied"
q = 20
r = 10
mission = "surface_combat"

[[ship]]
id = 20
name = "Placeholder Allied cruiser 20"
class = 1
side = "allied"
fuel_t = 2000
task_force = 4

# U and V, J's units, aboard L. Once landed at P they are on defend.
[[land_unit]]
id = 1
name = "Placeholder U"
side = "japanese"
men = 3000
task_force = 1
fatigue = 10

[[land_unit]]
id = 2
name = "Placeholder V"
side = "japanese"
men = 2386
task_force = 1

# The Allied garrison of P, on defend.
[[land_unit]]
id = 10
name = "Placeholder Allied garrison"
side = "allied"
men = 3444
q = 14
r = 0

# MARK: units

# J's opening estimate of the enemy's men at P.
[[estimate]]
side = "japanese"
q = 14
r = 0
men = 3444

# MARK: estimate

# The Japanese commander's commands.
[[command]]
day = 1
side = "japanese"
kind = "set_intent"
intent = 1
intent_kind = "take_place"
hex = [14, 0]

# Press the first day, so that the lift is sent (a lift short of the men wanted
# at balanced, with none to follow it to feed it, is not); balanced from the
# second day, so that the men ashore are judged at balanced when they are
# landed. A variant sets another risk on the second day.
[[command]]
day = 1
side = "japanese"
kind = "set_limit"
limit = "risk"
intent = 1
risk = "press"

[[command]]
day = 2
side = "japanese"
kind = "set_limit"
limit = "risk"
intent = 1
risk = "balanced"

# MARK: risk

# MARK: limit
[[command]]
day = 1
side = "japanese"
kind = "set_limit"
limit = "forces"
intent = 1
task_forces = [1]
land_units = [1, 2]
source = 1

# No count of the enemy at P is asked for at any risk, so that the plan is
# released on day 1 at preserve the force as at balanced and at press.
[[command]]
day = 1
side = "japanese"
kind = "set_limit"
limit = "knowledge"
intent = 1
knowledge = "none"

[[command]]
day = 1
side = "japanese"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "japanese"
kind = "set_leave"
leave = "launch"
given = true

# MARK: orders
