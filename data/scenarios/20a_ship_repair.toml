# Scenario 20a: ship repair, forward at a base and in a yard off the map.
#
# Four anchorages, seven Allied task forces and nine damaged ships. Base 1
# mends 6 points of damage a day; base 2 is a port for the yard (a passage of
# 4 days); base 3 does neither; base 4 is the Japanese side's own. It proves
# forward repair and the yard (decision 0069), and that the other side sees
# nothing of either. No fatigue figures are named, no base has fuel or supply,
# and there is no random draw. The hand calculation is in
# tests/scenario_20a_ship_repair.rs.
#
# PLACEHOLDER DATA. The ships, figures and map are invented.

