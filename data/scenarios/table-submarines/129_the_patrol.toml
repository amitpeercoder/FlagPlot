# Scenario 129 as a game the table can be tried on (decision 0218, stage 3, the table's part): the file of scenario 129 with its paths one
# folder deeper and the Japanese commander's commands left out, so that the person at the seat gives the patrol order and the leaves
# himself. Not for play: its boats, base and map are placeholders. The table's checks start a bridge on it.
# Scenario 129: submarines, the staff and the patrol order. Game A1 of the
# hand calculation in tests/scenario_129_submarines_the_staff_and_the_patrol.rs:
# seven placeholder Japanese submarines lie at the Japanese base at (12,0);
# the Japanese commander orders the waters within 2 hexes of (5,0) patrolled
# with submarines and gives both leaves, and the staff gives each boat the
# station its place in the order gives it. The Allied side has nothing.
# Decision 0218, stage 3 (the third stage of three).
#
# The test runs variants of this file, one for each game of the hand
# calculation.
#
# PLACEHOLDER DATA. The boats, base, figures and map are invented. The class
# and the torpedo are those of scenario 128.

