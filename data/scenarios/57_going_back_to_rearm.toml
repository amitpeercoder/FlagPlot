# Scenario 57: going back to rearm (decision 0127, with decision 0122's rule
# beneath it; step 6 of step 3, stage 2).
#
# Scenario 54's map, base, force, contact, intent and commands, with one
# change: base 1 holds 100 t of ammunition and ship 1, one of the two
# placeholder cruisers of task force 1, has 300 of her 800 rounds aboard.
# At balanced risk a ship is short of rounds below a half of her outfit, 400:
# the staff keeps the force in port on the first night, ship 1 rearms, and
# the force sorties on the second. There is no enemy at all. The hand
# calculation is in tests/scenario_57_going_back_to_rearm.rs. The test runs
# this file on the frozen step 1 figures, with the rearming rates and weights
# of scenario 52's port sizes and surface combat figures, and with variants
# it builds from the parsed text.
#
# PLACEHOLDER DATA. The base, ships, figures and map are invented.

name = "Placeholder scenario 57: Going back to rearm"
placeholder = true
seed = 1942
days = 4
map = "../map/placeholder_a_force_that_stands_by_night.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes_placeholder_rearming.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat_placeholder_rearming.toml"
air_combat = "../reference/air_combat.toml"

# Allied base 1, S.
[[base]]
id = 1
name = "Placeholder base 1"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 5000
ammunition_t = 100

# Task force 1: two placeholder cruisers, stopped at S, with the stance
# avoid and no home port.
[[task_force]]
id = 1
name = "Placeholder cruiser force 1"
side = "allied"
at_base = 1
mission = "surface_combat"
stance = "avoid"

[[ship]]
id = 1
name = "Placeholder cruiser 1"
class = 1
side = "allied"
fuel_t = 2000
gun_rounds = 300
task_force = 1

[[ship]]
id = 2
name = "Placeholder cruiser 2"
class = 1
side = "allied"
fuel_t = 2000
task_force = 1

# The contact.
[[contact]]
side = "allied"
q = 10
r = 0
ship_count = 3
kind = "cruiser"
age_pulses = 0

# The Allied commander's commands.
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "deny"
hex = [3, 0]
distance = 0

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
task_forces = [1]

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
