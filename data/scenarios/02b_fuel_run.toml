# Scenario 2b: a convoy loads fuel at Espiritu Santo and lands it at
# Guadalcanal, and refuels there from what it has landed.
#
# It is scenario 2's convoy carrying fuel in place of supply. It proves fuel
# as a cargo (decision 0046) together with refuelling in port (decision
# 0045). The hand calculation is in tests/scenario_02b_fuel_run.rs.
#
# PLACEHOLDER DATA. The ships, figures and map are invented.

name = "Scenario 2b: Fuel run, Espiritu Santo to Guadalcanal"
placeholder = true
seed = 1942
days = 4
map = "../map/placeholder_supply_run.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"

[[base]]
id = 1
name = "Espiritu Santo"
side = "allied"
q = 0
r = 0
supply_t = 10000
fuel_t = 6500

[[base]]
id = 2
name = "Guadalcanal"
side = "allied"
q = 8
r = 0
supply_t = 500

[[task_force]]
id = 1
name = "Placeholder supply convoy"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder cargo ship 1"
class = 3
side = "allied"
fuel_t = 1000
task_force = 1

[[ship]]
id = 2
name = "Placeholder cargo ship 2"
class = 3
side = "allied"
fuel_t = 1000
task_force = 1

[[ship]]
id = 3
name = "Placeholder destroyer 1"
class = 2
side = "allied"
fuel_t = 500
task_force = 1

# Day 1: load supply.
[[order]]
day = 1
side = "allied"
task_force = 1
kind = "load"
cargo = "fuel"

# Day 2: steam to Guadalcanal at cruise speed and unload on arrival.
[[order]]
day = 2
side = "allied"
task_force = 1
kind = "set_route"
waypoints = [[8, 0]]

[[order]]
day = 2
side = "allied"
task_force = 1
kind = "set_speed"
speed = "cruise"

[[order]]
day = 2
side = "allied"
task_force = 1
kind = "unload"

# Days 3 to 8 have no new orders. The standing ones continue.
