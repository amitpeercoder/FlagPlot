# Scenario 42c: an intent that cannot be met, under a run (decision 0107,
# step 4).
#
# Scenario 40a whole (two intents, one ship, 16 days), with no command added.
# The standing interrupts are on: the staff cannot meet intent 2 on days 1 to
# 4 and intent 1 on days 10 to 13, each as one matter of the command report.
#
# It proves step 4 of decision 0107 (step 3, stage 1: interrupts, a run of
# days in one call, the command report, resuming; rulings 31 to 40 there)
# against the hand calculation in tests/scenario_42_interrupts_and_runs.rs.
# There is no enemy, no aircraft and no random draw. It runs on the frozen
# step 1 figures.
#
# PLACEHOLDER DATA. The bases, ships, units and map are invented.

name = "Placeholder scenario 42c: Displaced under a run"
placeholder = true
seed = 1942
days = 16
map = "../map/placeholder_one_pool_two_hexes.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_fast_transport_cargo.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground.toml"

