# Scenario 82: how much must be known.
#
# Decision 0159, rule D, items 12 and 13, step 4 of the opening of stage 4.
# The commander asks for an airfield at balanced risk and says that the count
# of the enemy there must be no more than a day old when the landing goes. The
# staff looks, readies one unit on what it sees, finds its count a day too old
# on the morning the landing is ready, looks again, and goes the day after.
#
# It is scenario 72's start. The map is scenario 27's: A at (0,0), a coast hex
# with port size 5, and B at (4,0), a coast hex with port size 0, 4 hexes,
# 160 nm, away. Allied base 1 lies at A with an airfield and 1,000 t of
# supply; Japanese base 2, an airfield, lies at B, on the Allied map, with
# 100 t of supply. Air group 1, six placeholder carrier scouts (search range
# 300 nm), lies at base 1 at rest. Task force 1, two placeholder troop
# transports of 600 berths, lies stopped in port at A on the transport
# mission. Two Allied fighting units of 600 men are ashore at A; the Japanese
# unit 10, 150 men, holds B. The Allied side holds no estimate of the enemy's
# men at B. The commander states "take the place at B" on day 1 with a forces
# limit of task force 1, units 1 and 2, air group 1 and base 1 as the source,
# sets no risk (so balanced) and the limit "knowledge: a recent count, 1 day"
# on it, and gives leave to prepare and to launch. The game is 5 days, which
# ends before the landing.
#
# The hand calculation is in tests/scenario_82_how_much_must_be_known.rs. The
# test runs this file on the frozen step 1 figures with scenario 72's ground
# figures, data/reference/ground_placeholder_scenario_72.toml, which this file
# names, so that run by itself it plays the game its test proves: a report
# gives the true count, so no die changes anything. It builds its variants
# from the text of this file using the markers below.
#
# PLACEHOLDER DATA. The bases, ships, units, aircraft, figures and map are
# invented.

name = "Placeholder scenario 82: How much must be known"
placeholder = true
seed = 1942
days = 5
map = "../map/placeholder_preparing.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground_placeholder_scenario_72.toml"

# Allied base 1 at A, with supply for every man for the whole game and no
# fuel to give.
[[base]]
id = 1
name = "Placeholder base A"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 0

# Japanese base 2 at B: an airfield with no gun and no aircraft.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "japanese"
q = 4
r = 0
supply_t = 100
fuel_t = 0

# Air group 1: six carrier scouts at base 1, at rest. A type of the frozen
# figures that can search, with a search range of 300 nm.
[[air_group]]
id = 1
name = "Placeholder scout squadron"
side = "allied"
base = 1
aircraft_type = 2
ready = 6

# Task force 1: two placeholder troop transports, stopped in port at base 1.
[[task_force]]
id = 1
name = "Placeholder transport force 1"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder troop transport 1"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

[[ship]]
id = 2
name = "Placeholder troop transport 2"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

# The land units: two Allied fighting units ashore at A, at the standard of
# experience, 2, and the Japanese garrison at B.
[[land_unit]]
id = 1
name = "Placeholder First"
side = "allied"
men = 600
q = 0
r = 0

[[land_unit]]
id = 2
name = "Placeholder Second"
side = "allied"
men = 600
q = 0
r = 0

[[land_unit]]
id = 10
name = "Placeholder Garrison"
side = "japanese"
men = 150
q = 4
r = 0

# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "take_place"
hex = [4, 0]

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
task_forces = [1]
land_units = [1, 2]
air_groups = [1]
source = 1

# The knowledge limit
[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "knowledge"
intent = 1
knowledge = "recent_count"
within_days = 1

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
