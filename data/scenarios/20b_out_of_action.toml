# Objectives: a horizon of 60 days stated for a game of 6.

[objectives]
minor = 3
major = 8
decisive = 16
horizon_days = 60
history = "No battle: a placeholder case of the scale, not a day of the war."

[objectives.allied]
mission = "Placeholder mission: put as many Japanese ships out of action as can be."

[[objectives.allied.objective]]
