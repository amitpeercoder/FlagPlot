# Scenario 20b: ships out of action on the objectives scale (decision 0088).
#
# Four anchorages, nine ships and two yard trips, and no fight: the two sides
# never meet and nothing searches. Base 1 is a port for the yard (a passage of
# 1 day); base 2 mends 1 point a day; base 3 does neither; base 4 is the
# Allied side's own. Both sides hold `ships_sunk` and `ships_out_of_action`,
# with a horizon of 60 days stated for a game of 6. It proves that a ship's
# days out are her days of repair at the end plus the days she left a yard
# with, that her share of the horizon is capped at 1, and that a ship at the
# yard at the end is not counted twice. No fatigue figures are named, no base
# has fuel or supply, and there is no random draw. The hand calculation is in
# tests/scenario_20b_out_of_action.rs.
#
# Class 9, a placeholder battleship, is in a file of its own so that no other
# scenario's data moves.
#
# PLACEHOLDER DATA. The ships, figures and map are invented.

name = "Scenario 20b: Ships out of action"
placeholder = true
seed = 1942
days = 6
map = "../map/placeholder_repair.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_battleship.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"

[[base]]
id = 1
name = "Placeholder yard port"
side = "japanese"
q = 0
r = 0
yard_passage_days = 1

