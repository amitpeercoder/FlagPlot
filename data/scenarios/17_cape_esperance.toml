# The bombardment group: into the hex of Savo Island and back to Shortland, at
# 27 knots, worked back from the hour fire opened (decision 0072, 6). The
# bombardment of Henderson Field is not modelled (decision 0052). Break-off
# level 0.5: INVENTED, no row gives one (decision 0072, 11). A ship that
# cannot keep up is sent home to Shortland with an escort.
[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_route"
waypoints = [[2, -5], [-2, -8]]

[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_speed"
knots = "27"

[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_rules_of_engagement"
stance = "engage"
break_off = "0.5"
stragglers = "detach"

# Task Force 64: west of Guadalcanal by (1,-4) to the hex of Savo Island,
# where it stays, at the 29 knots of the approach (decision 0072, 5). Break-off
# level 1, by its conduct (decision 0072, 11). It keeps its stragglers.
[[order]]
day = 1
side = "allied"
task_force = 2
kind = "set_route"
waypoints = [[1, -4], [2, -5]]

[[order]]
day = 1
side = "allied"
task_force = 2
kind = "set_speed"
knots = "29"

[[order]]
day = 1
side = "allied"
task_force = 2
kind = "set_rules_of_engagement"
stance = "engage"
break_off = "1"

# Missions and objectives (decision 0054). The points and the levels are the
# placeholder scale of that decision.
[objectives]
minor = 3
major = 8
decisive = 16
history = "Two Japanese ships, the heavy cruiser Furutaka and the destroyer Fubuki, were sunk that night for one American destroyer, Duncan; Aoba was badly damaged and the bombardment of Henderson Field was not carried out. (From the order-of-battle facts; not yet scored from them.)"

[objectives.allied]
mission = "Intercept the Japanese force coming down the Slot off Savo Island and stop it shelling Henderson Field."

[[objectives.allied.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.allied.objective]]
kind = "ships_crippled"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }

[objectives.japanese]
mission = "Shell Henderson Field by night and be clear of Guadalcanal by daylight."

[[objectives.japanese.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.japanese.objective]]
kind = "ships_crippled"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }
