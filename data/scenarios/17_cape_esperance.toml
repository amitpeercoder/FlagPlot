# Scenario 17: Cape Esperance, the night of 11 to 12 October 1942.
#
# THE CHECK, NEVER TUNED ON. This scenario checks the surface figures tuned
# on Savo Island (decision 0072; docs/step2-spec.md, "Tuning"). It was moved
# here from data/scenarios/not-run/ on Nov 13, 2026, with only its data paths
# and this paragraph changed, before any batch of it was made. The check is
# its first batch of 1,000 runs (decision 0084), and nothing is tuned on it.
# Its test, tests/scenario_17_cape_esperance.rs, proves only that it loads,
# where and when the two forces meet, each side's readiness and the order of
# the ships.
#
# What is in the scenario and what is left out is
# docs/decisions/0072-cape-esperance-scenario.md. The bombardment group steams
# down the Slot and enters the hex of Savo Island, (2,-5), at 23:42, where
# Task Force 64 has stood since 23:02. The reinforcement group is left out.
#
# The ships are real: their figures are derived from sourced facts
# (data/reference/ship_classes_cape_esperance.csv, decision 0072). The map is
# real. Positions, speeds and readiness are from data/oob, worked as decision
# 0072 says.
#
# PLACEHOLDER DATA all the same: the combat figures in surface_combat.toml are
# placeholders until step 2 sets them, and the Japanese break-off level is
# invented (no row gives one). Full fuel and ammunition at the start is an
# assumption.

name = "Scenario 17: Cape Esperance, 11 to 12 October 1942"
placeholder = true
seed = 1942
days = 1
map = "../map/south_pacific.csv"
ship_classes = "../reference/ship_classes_cape_esperance.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"

# Shortland, where the bombardment group came from and where Aoba and
# Kinugasa returned (engagement_positions 493, engagement_events 529), and
# where a ship it sends home goes. The base holds nothing: only its place
# matters here.
[[base]]
id = 1
name = "Shortland"
side = "japanese"
q = -2
r = -8
supply_t = 0

# The bombardment group (Goto), at 18:00 in (0,-8), the hex of its 18:26
# position (Guadalcanal bearing 310, 200 miles, read from Lunga;
# engagement_positions 494), at normal readiness: its staff expected no
# enemy surface force (engagement_events 497, 718, 719). It holds no contact.
[[task_force]]
id = 1
name = "Bombardment group"
side = "japanese"
q = 0
r = -8
mission = "surface_combat"
home_port = 1

# Task Force 64 (Scott), at 18:00 in (2,-2), between its 16:00 position and
# Salt Lake City's 18:45 fix (engagement_positions 510, 513), at battle
# readiness: Condition One was set at 18:15 (engagement_events 584, 585).
[[task_force]]
id = 2
name = "Task Force 64"
side = "allied"
q = 2
r = -2
mission = "surface_combat"
readiness = "battle"

# The ships, in the order of decision 0072, 1 and 12: the Japanese column with
# its screen, then Task Force 64's battle disposition of 22:35. Experience is
# data/reference/ship_experience_cape_esperance.ships.csv (decision 0064);
# fuel is each class's full load.
[[ship]]
id = 1
name = "Aoba"
class = 3000
side = "japanese"
experience = 3
fuel_t = 2040
task_force = 1

