# The Japanese runs. Each starts at Shortland (base 7), Ichiki's at Rabaul
# (base 2): its destroyers came from Truk, which is off the map (ruling E of
# decision 0101). Every run but the four Fubuki-class destroyers is carried in
# placeholder fast transports, enough of them for its men (decision 0101, 17):
# no Kagero-class, Shiratsuyu-class or Kamikaze-class destroyer has a troop
# figure, so the real destroyers of those runs are not in the slice. Fubuki and
# Shirayuki (class 3009, 225 men) are of the run of 29 August and Hatsuyuki and
# Amagiri (class 3010, 150 men) of 31 August, as the derivation list
# data/derivation/guadalcanal_landings.toml reads them. Each run is ordered out
# on the day before it lands, with its route to the landing hex and back home,
# a mark on the landing hex (decision 0096: it halts, lands its men and steams
# on) and an unload order; its speed is worked out so that it arrives in the
# night pulse of its landing day (see each run's orders).
#
# EACH RUN LANDS ITS OWN RATIONS (decision 0109, 2). Two weeks' rations were
# carried with the men by the destroyers (land_unit_facts 975), and a destroyer
# was planned to carry 110 men and two weeks' rations (troop_lift_facts 170,
# 177, 178). So each run carries rations for its men at the game's charge,
# ground.toml's daily_supply_t_per_man of 0.005, as supply cargo, landed by its
# unload order with the men: 14 days for each run of the Kawaguchi main body,
# the Aoba part and the Oka group; 7 days for the Ichiki echelon, the Yokosuka
# force and the force of 29 August, by the practice of land_unit_facts 1044,
# which is all that bears on them. They sail in the placeholder fast transport
# with cargo (class 12, 200 men and 30 t), as ruling D of decision 0101 made for
# the American run of 15 August, as many ships as the men need, the rations
# shared equally among a run's ships of that class. PLACEHOLDER: the rations
# rest on a stated practice, not on what these units were issued.

# Rations: 200 men (troop_lift_facts 37, 38) x 0.005 x 7 days = 7 t, the
# seven days of land_unit_facts 1044, in one ship.
[[task_force]]
id = 30
name = "Placeholder run of 16 August, the Yokosuka 5th Special Naval Landing Force"
side = "japanese"
at_base = 7
mission = "transport"
home_port = 7

