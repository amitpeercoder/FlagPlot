# The Japanese stocks ashore east and west of the airfield (decision 0101, 22,
# as amended, 5 and 8, and decision 0109, 2). Each landing hex holds a base of
# the Japanese side, off the enemy's map, with no airfield, so that the rations
# a run lands go into a base its men are fed from. The bases are placeholders.
# The men who land bring their own rations (each run's cargo, below), so the
# stock stated ashore is only what the men who fall back there need, turned
# into tons by ground.toml's daily_supply_t_per_man of 0.005:
#   (3,-4): 0. Everyone who lands there brings his own.
#   (2,-5): PLACEHOLDER stock, seven days for the 2,040 men of the garrison of
#     Lunga and its two construction units, who fall back there on the first
#     days (decision 0104), 2,040 x 0.005 x 7 = 71.4 t, 71 t cut to a whole
#     ton (decision 0101, as amended, 8). No row gives a Japanese stock west
#     of the field.
# The seven days are the practice a Japanese officer gave (two on the man,
# three in the unit, two at division, land_unit_facts 1044): a practice and
# not what these units were issued.
[[base]]
id = 5
name = "Placeholder Japanese stock at Taivu"
side = "japanese"
q = 3
r = -4
supply_t = 0
airfield = false
on_map = false

[[base]]
id = 6
name = "Placeholder Japanese stock west of the Lunga"
side = "japanese"
q = 2
r = -5
supply_t = 71
airfield = false
on_map = false

