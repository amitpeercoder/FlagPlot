# Scenario 1: one task force steams from Noumea to Espiritu Santo.
#
# Proves movement, fuel burn and arrival time against a hand calculation.
# The calculation is written out in tests/scenario_01_transit.rs.
#
# PLACEHOLDER DATA. The ships, their figures and the map are invented.

name = "Scenario 1: Transit, Noumea to Espiritu Santo"
placeholder = true
seed = 1942
days = 3
map = "../map/placeholder_transit.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"

[[base]]
id = 1
name = "Noumea"
side = "allied"
q = 0
r = 0

[[base]]
id = 2
name = "Espiritu Santo"
side = "allied"
q = 8
r = 3

[[task_force]]
id = 1
name = "Placeholder transit force"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder cruiser 1"
class = 1
side = "allied"
fuel_t = 2000
task_force = 1

[[ship]]
id = 2
name = "Placeholder destroyer 1"
class = 2
side = "allied"
fuel_t = 500
task_force = 1

# Day 1: steam to Espiritu Santo at cruise speed.
[[order]]
day = 1
side = "allied"
task_force = 1
kind = "set_route"
waypoints = [[8, 3]]

[[order]]
day = 1
side = "allied"
task_force = 1
kind = "set_speed"
speed = "cruise"

# Days 2 and 3 have no new orders. The standing ones continue.
