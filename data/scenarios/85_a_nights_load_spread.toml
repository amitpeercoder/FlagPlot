# Scenario 85: a night's load spread over its ships.
#
# Decision 0162, step 1 of stage 4, first part. Three fast transports keep a
# garrison fed at a place an enemy base overlooks. They have not the fuel for
# full speed, so they go at cruise and arrive with two hours of the night
# left. Each ship carries what it can land in two hours, 40 t, and the run
# lands 120 t where, as the rule stood, it landed 40 t in the first ship.
#
# The map is scenario 27's: A at (0,0), a coast hex with port size 5; B at
# (4,0) and C at (0,6), coast hexes with port size 0. A to B is 4 hexes,
# 160 nm, and B to C is 6 hexes. Allied base 1 lies at A with 1,000 t of
# supply and no fuel; Allied base 2, the garrison, at B with 100 t of supply;
# Japanese base 3 at C, on the Allied map, with no ship, aircraft or man.
# Unit 1, an Allied fighting unit of 2,000 men, is ashore at B on the
# defence. Task force 1, three placeholder fast transports with 50 t of cargo
# (class 13), lies stopped at base 1 on the transport mission at cruising
# speed, each with 150 t of fuel and nothing aboard. On day 1 the commander
# states "keep base 2 supplied", with a floor of 5 days and no interval, and
# a forces limit of ships 1, 2 and 3 and base 1 as the source, and gives
# leave to prepare and to launch. The game is 14 days.
#
# The hand calculation is in tests/scenario_85_a_nights_load_spread.rs. The
# test runs this file on the frozen step 1 figures. Nothing is sighted and
# nothing fights, so no die changes anything. The second game of the test,
# the order alone, is data/scenarios/85b_a_load_with_a_level.toml.
#
# PLACEHOLDER DATA. The bases, ships, units and map are invented.

name = "Placeholder scenario 85: A night's load spread over its ships"
placeholder = true
seed = 1942
days = 14
map = "../map/placeholder_preparing.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_fast_transport_50t.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground.toml"

# Allied base 1 at A, the source. It holds no fuel, so no ship is fuelled.
[[base]]
id = 1
name = "Placeholder base A"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 0

# Allied base 2 at B, the garrison kept supplied.
[[base]]
id = 2
name = "Placeholder garrison B"
side = "allied"
q = 4
r = 0
supply_t = 100
fuel_t = 0

# Japanese base 3 at C, on the Allied map, 6 hexes from B.
[[base]]
id = 3
name = "Placeholder enemy base C"
side = "japanese"
q = 0
r = 6
supply_t = 0
fuel_t = 0

# Unit 1, the garrison, ashore at B on the defence.
[[land_unit]]
id = 1
name = "Placeholder Garrison"
side = "allied"
men = 2000
q = 4
r = 0
posture = "defend"

# Task force 1: three placeholder fast transports with 50 t of cargo,
# stopped at base 1.
[[task_force]]
id = 1
name = "Placeholder transport force 1"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder fast transport 1"
class = 13
side = "allied"
fuel_t = 150
task_force = 1

[[ship]]
id = 2
name = "Placeholder fast transport 2"
class = 13
side = "allied"
fuel_t = 150
task_force = 1

[[ship]]
id = 3
name = "Placeholder fast transport 3"
class = 13
side = "allied"
fuel_t = 150
task_force = 1

# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
base = 2
floor_days = 5

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
ships = [1, 2, 3]
task_forces = []
source = 1

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
