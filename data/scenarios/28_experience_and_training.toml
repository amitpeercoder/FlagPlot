# Scenario 28: the experience of a land unit and training (decision 0097).
#
# Proves training, the experience of a land unit and its effect on a shot
# against a hand calculation. Six units on four coast hexes far apart: unit 1
# trains for 62 days, unit 6 trains on a base with 1 t of supply, units 2 and
# 3 fight at F (unit 2 is one day of fighting short of a step) and units 4 and
# 5 fight at G, raw against the best. The hand calculation is in
# tests/scenario_28_experience_and_training.rs, which gives the four figures
# of the rules the values it calculates with (the frozen figures switch the
# rules off). The hits of a fight are the dice; the test reads them.
#
# No ships, no aircraft and no land links.
#
# PLACEHOLDER DATA. The units, bases and map are invented.

