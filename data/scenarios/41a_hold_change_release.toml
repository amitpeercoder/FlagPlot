# Scenario 41a: a plan made ready that waits for leave to launch, a hold, a
# changed intent, a week, a release (decision 0107, step 3, stage 1).
#
# Scenario 36 with other commands, over 27 days. The Allied commander states
# the intent, the forces limit (ships 1 and 2, source base 1) and the reserve
# of 1000 t at base 1 on day 1, and sets no leave: by default leave to prepare
# is given and leave to launch is not, so the staff makes the plan ready and
# loads its first run and does not sail it. On day 3 he approves the plan,
# which releases it. On day 8 he holds ship 1; on day 10 he changes the intent
# to a floor of 40 days; on day 17 he releases ship 1. The hand calculation is
# in tests/scenario_41_hold_change_release.rs. There is no enemy, no aircraft
# and no random draw. It runs on the frozen step 1 figures, as scenario 36
# does.
#
# Class 3 is the placeholder cargo ship: 3000 t of cargo, 10 kn at cruise,
# 0.1 t of fuel a mile (1000 t over 10000 nm), 1000 t of fuel. Land unit 1
# costs 2000 men x 0.005 t = 10 t a day at base 2.
#
# PLACEHOLDER DATA. The bases, ships, unit and map are invented.

name = "Placeholder scenario 41a: A hold, a changed intent, a release"
placeholder = true
seed = 1942
days = 27
map = "../map/placeholder_one_convoy.toml"
ship_classes = ["../reference/ship_classes.csv"]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground.toml"

# S: the source. Port size 1, one berth at 50 t an hour.
[[base]]
id = 1
name = "Placeholder base S, Allied"
side = "allied"
q = 0
r = 0
supply_t = 5000
fuel_t = 2000

# T: the destination. Port size 0, by lighter at 20 t an hour.
[[base]]
id = 2
name = "Placeholder base T, Allied"
side = "allied"
q = 5
r = 0
supply_t = 100

[[land_unit]]
id = 1
name = "Placeholder unit 1"
side = "allied"
men = 2000
q = 5
r = 0
posture = "defend"

# Ships 1 and 2 lie in port at S in no task force, full of fuel.
[[ship]]
id = 1
name = "Placeholder cargo ship 1"
class = 3
side = "allied"
fuel_t = 1000
port = 1

[[ship]]
id = 2
name = "Placeholder cargo ship 2"
class = 3
side = "allied"
fuel_t = 1000
port = 1


# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
base = 2
floor_days = 30
interval_days = 15

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
ships = [1, 2]
task_forces = []
source = 1

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "reserve"
base = 1
supply_t = 1000
fuel_t = 0

[[command]]
day = 3
side = "allied"
kind = "approve"
plan = 1

[[command]]
day = 8
side = "allied"
kind = "hold"
ship = 1

[[command]]
day = 10
side = "allied"
kind = "set_intent"
intent = 1
base = 2
floor_days = 40
interval_days = 15

[[command]]
day = 17
side = "allied"
kind = "release"
ship = 1
