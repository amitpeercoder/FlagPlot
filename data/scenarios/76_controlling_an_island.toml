# Scenario 76: controlling an island.
#
# Decision 0151, step 8 of stage 3, second part. The commander says "control
# the island" and nothing else. The island has two places: an airfield the
# enemy holds with nobody on it (base 2, at B), and an anchorage the side holds
# with a small garrison (base 3, at C). The staff forms the tree, takes the
# airfield, holds both places and feeds them.
#
# The map is scenario 27's: A at (0,0), a coast hex with port size 5, B at
# (4,0), a coast hex with port size 0, and C at (0,6), a coast hex with port
# size 0. Allied base 1 lies at A with 1,000 t of supply; Japanese base 2, an
# airfield with no gun, no aircraft, no man and no stock, lies at B, on the
# Allied map; Allied base 3 lies at C with 100 t of supply. No base has a
# reserve or fuel. Task force 1, two placeholder troop transports, lies stopped
# at base 1. Two Allied fighting units are ashore: unit 1 at A with 600 men and
# unit 3 at C with 300 men. The Allied side holds no contact and no estimate.
# The island is island 1, "Placeholder island": base 2, then base 3. On day 1
# the commander states "control island 1", names no forces, and gives leave to
# prepare and to launch. The game is 14 days. There is no Japanese man, so no
# die is rolled.
#
# The hand calculation is in tests/scenario_76_controlling_an_island.rs. The
# test runs this file on the frozen step 1 figures with one ground figure of its
# own, preparation_per_day 100, in
# data/reference/ground_placeholder_scenario_76.toml, which this file names, so
# that run by itself it plays the game its test proves. It builds its variants
# from the text of this file using the markers below.
#
# PLACEHOLDER DATA. The bases, ships, units, figures, island and map are
# invented.

name = "Placeholder scenario 76: Controlling an island"
placeholder = true
seed = 1942
days = 14
map = "../map/placeholder_preparing.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"
ground = "../reference/ground_placeholder_scenario_76.toml"

# Allied base 1 at A, with supply for every man for the whole game and no
# fuel.
[[base]]
id = 1
name = "Placeholder base A"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 0

# Japanese base 2 at B: no gun, no aircraft, no man, no stock.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "japanese"
q = 4
r = 0
supply_t = 0
fuel_t = 0

# Allied base 3 at C, with supply and no fuel.
[[base]]
id = 3
name = "Placeholder anchorage C"
side = "allied"
q = 0
r = 6
supply_t = 100
fuel_t = 0

# Task force 1: two placeholder troop transports, stopped in port at base 1.
[[task_force]]
id = 1
name = "Placeholder transport force 1"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder troop transport 1"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

[[ship]]
id = 2
name = "Placeholder troop transport 2"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

# The land units, ashore, fighting units on the defence, each at the standard
# of experience, 2, and with every skill at 2, the defaults.
[[land_unit]]
id = 1
name = "Placeholder First"
side = "allied"
men = 600
q = 0
r = 0

[[land_unit]]
id = 3
name = "Placeholder Garrison"
side = "allied"
men = 300
q = 0
r = 6

# The island: base 2, then base 3.
[[island]]
number = 1
name = "Placeholder island"
places = [{ base = 2 }, { base = 3 }]

# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "control_island"
island = 1

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
