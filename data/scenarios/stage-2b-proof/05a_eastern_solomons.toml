# PROOF OF STEP 3, STAGE 2B, decision 0138, item 8: the Eastern Solomons, both sides from intents, command levels on.
# Made from second-proof/05a_eastern_solomons.toml by adding `command_levels = true` after the name and
# `reports = "../../reference/reports.toml"` (the live report figures) after the last
# reference file; nothing else is changed. No commander is named and no force is
# silent. Not run by any loop over data/scenarios/*.toml (decision 0072). What follows
# is the file it was made from.
#
# SECOND PROOF OF STAGE 2, decision 0128: the Eastern Solomons, arrangement (a),
# both sides from intents. Made from 05_eastern_solomons.toml by taking out the orders
# of each side played from intents or given nothing. Not run by any loop
# over data/scenarios/*.toml (decision 0072).
#
# Scenario 5: Eastern Solomons, 24 August 1942.
#
# Stage 5e of scenario 5. Two American carrier forces lie east of
# Guadalcanal. The Japanese carrier striking force and the Ryujo detachment
# come down from the north. What is in the scenario and what is left out is
# docs/decisions/0031-eastern-solomons-scenario.md. The hand calculation is
# in tests/scenario_05_eastern_solomons.rs.
#
# The ships and aircraft are real: their figures are derived from sourced
# facts (data/reference/ship_classes_eastern_solomons.csv and
# aircraft_types_eastern_solomons.csv, decisions 0020 and 0029). The map is
# real. Air group strengths cite rows of data/oob/air_unit_facts.csv.
#
# PLACEHOLDER DATA all the same: the search, air combat and surface combat
# figures and the scaling constants are invented. Full fuel at the start is
# an assumption. The starting positions are worked back from positions that
# are themselves good to about one hex.

name = "Scenario 5: Eastern Solomons, 24 August 1942"
command_levels = true
placeholder = true
seed = 1942
days = 1
map = "../../map/south_pacific.csv"
ship_classes = "../../reference/ship_classes_eastern_solomons.csv"
