reports = "../../reference/reports.toml"

# Henderson Field, in the hex of Lunga Point.
[[base]]
id = 1
name = "Henderson Field"
side = "allied"
q = 2
r = -4
supply_t = 0

# Task Force 16, Enterprise. It has the lower number, so a strike on the hex
# attacks it first (decision 0026, 7), as on the day.
[[task_force]]
id = 1
name = "Task Force 16"
side = "allied"
q = 7
r = -5
mission = "carrier"

# Task Force 11, Saratoga, in the same hex.
[[task_force]]
id = 2
name = "Task Force 11"
side = "allied"
q = 7
r = -5
mission = "carrier"

# Nagumo's carriers with the ships of the vanguard, at the map's northern
# edge at 18:00 on 23 August.
[[task_force]]
id = 3
name = "Carrier striking force"
side = "japanese"
q = 9
r = -19
mission = "carrier"

# The Ryujo detachment. It starts in (7,-18), on the same column of hexes as
# its noon hex (7,-9), so its course is along an axis, 360 nm at 20 knots, and
# it arrives at noon (decision 0058, decision 0031 amended).
# Ryujo's noon hex is (7,-9) and not (7,-10). The record has her launch from
# 200 to 202 miles from Guadalcanal (engagement_events 331, the 8th Cruiser
# Division's war diary: "20 degrees 202 nm from the Guadalcanal base";
# engagement_positions 310: 200 nautical miles north of Lunga Point). (7,-9)
# is 200 miles from Henderson Field at (2,-4) by hex centres; (7,-10) is 223,
# which is the grid's error and not the record.
[[task_force]]
id = 4
name = "Ryujo detachment"
side = "japanese"
q = 7
r = -18
mission = "carrier"

