# Scenario 53: the commander states one end, deny the waters at (0,5), at
# press, and the staff strikes and searches.
#
# Decision 0123, with decision 0118. Three dive bomber groups, a flying boat
# group and a fighter group rest at Allied base 1. The Allied commander
# states one end, deny the waters within 0 hexes of (0,5), with no forces
# limit, at press, and gives both leaves. At the area's level the staff forms
# two tasks for base 1, striking ships (intent 2) and searching the waters
# (intent 3); at the base's level it sets the groups' standing orders; at the
# group's level each strike is sized. The Allied side starts holding three
# contacts in reach, and there is no enemy at all: every strike finds nothing
# and the search sights nothing. The hand calculation is in
# tests/scenario_53_deny_an_area.rs. The test runs this file on the frozen
# step 1 figures with its own table of aircraft for each ship added, and with
# variants it builds from the parsed text. The upkeep, wear, fatigue and
# supply figures are not loaded.
#
# PLACEHOLDER DATA. The bases, aircraft, figures and map are invented.

name = "Placeholder scenario 53: Deny an area"
placeholder = true
seed = 1942
days = 2
map = "../map/placeholder_a_strike_sized_to_its_target.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"

