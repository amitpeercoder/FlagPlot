# Scenario 65: a day from which a force may be used.
#
# Decision 0140, step 1 of stage 3. Scenario 58's placeholder carrier force
# without its contact: task force 1 lies stopped at sea at (0,0), full of fuel,
# on the carrier mission, with Allied base 1 (at (0,5)) as its home port and
# a fighter group, a scout group and a dive bomber group aboard, and the side
# may use it from day 2 (available_from = 2). The commander states "operate
# task force 1 from (6,0)" with no risk set, so balanced, and gives both
# leaves. On day 1 the staff gives the force and its groups no order and
# says why; from day 2 it gives the orders it would have given on day 1 had
# the day not been set. The game is 4 days. There is no enemy unit and no
# contact: no die is rolled. The hand calculation is in
# tests/scenario_65_a_day_from_which_a_force_may_be_used.rs. The test runs
# this file on the frozen step 1 figures with scenario 53's table of aircraft
# for each ship added, and builds its variants from the text of this file
# using the markers below. The map is scenario 58's. The upkeep, wear, fatigue
# and supply figures are not loaded.
#
# PLACEHOLDER DATA. The base, ship, aircraft, figures and map are invented.

name = "Placeholder scenario 65: A day from which a force may be used"
placeholder = true
seed = 1942
days = 4
map = "../map/placeholder_a_carrier_force_closes.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"

# Allied base 1.
[[base]]
id = 1
name = "Placeholder base 1"
side = "allied"
q = 0
r = 5
supply_t = 1000
fuel_t = 5000

# Task force 1: one placeholder carrier, stopped at sea at (0,0).
[[task_force]]
id = 1
name = "Placeholder carrier force 1"
side = "allied"
q = 0
r = 0
mission = "carrier"
home_port = 1
# Task force 1 may be used from day 2 (decision 0140).
available_from = 2

[[ship]]
id = 1
name = "Placeholder carrier 1"
class = 4
side = "allied"
fuel_t = 3000
task_force = 1

# The groups aboard.
[[air_group]]
id = 1
name = "Placeholder fighters 1"
side = "allied"
ship = 1
aircraft_type = 4
ready = 12

[[air_group]]
id = 2
name = "Placeholder carrier scouts 2"
side = "allied"
ship = 1
aircraft_type = 2
ready = 6

[[air_group]]
id = 3
name = "Placeholder dive bombers 3"
side = "allied"
ship = 1
aircraft_type = 3
ready = 10

# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "operate_carriers"
task_force = 1
hex = [6, 0]

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
