# Scenario 55: a carrier force played from an end.
#
# Decision 0125. One placeholder carrier, task force 1, lies stopped at sea
# at (0,0), full of fuel, on the carrier mission, with Allied base 1 (S, at
# (5,0)) as its home port and a fighter group, a scout group and a dive
# bomber group aboard. The Allied commander states one end, deny the waters
# within 0 hexes of (0,5), at press, names task force 1 in its forces limit
# and gives both leaves. At the area's level the staff forms the task of
# operating task force 1 from its hex (intent 2); at the force's level it
# flies the patrol, searches and sets the bombers to strike. The Allied side
# starts holding scenario 53's three contacts, and there is no enemy at all:
# every strike finds nothing and the search sights nothing. The hand
# calculation is in tests/scenario_55_a_carrier_force_from_an_end.rs. The
# test runs this file on the frozen step 1 figures with scenario 53's table
# of aircraft for each ship added, and with variants it builds from the
# parsed text. The upkeep, wear, fatigue and supply figures are not loaded.
#
# PLACEHOLDER DATA. The base, ship, aircraft, figures and map are invented.

name = "Placeholder scenario 55: A carrier force from an end"
placeholder = true
seed = 1942
days = 2
map = "../map/placeholder_a_force_that_stands_by_night.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"

# Allied base 1, S.
[[base]]
id = 1
name = "Placeholder base 1"
side = "allied"
q = 5
r = 0
supply_t = 1000
fuel_t = 5000

# Task force 1: one placeholder carrier, stopped at sea at (0,0).
[[task_force]]
id = 1
name = "Placeholder carrier force 1"
side = "allied"
q = 0
r = 0
mission = "carrier"
home_port = 1

[[ship]]
id = 1
name = "Placeholder carrier 1"
class = 4
side = "allied"
fuel_t = 3000
task_force = 1

# The groups aboard.
[[air_group]]
id = 1
name = "Placeholder fighters 1"
side = "allied"
ship = 1
aircraft_type = 4
ready = 12

[[air_group]]
id = 2
name = "Placeholder carrier scouts 2"
side = "allied"
ship = 1
aircraft_type = 2
ready = 6

[[air_group]]
id = 3
name = "Placeholder dive bombers 3"
side = "allied"
ship = 1
aircraft_type = 3
ready = 10

# The three contacts, entered from the oldest down.
[[contact]]
side = "allied"
q = 0
r = 4
ship_count = 1
kind = "carrier"
age_pulses = 2

[[contact]]
side = "allied"
q = 3
r = 0
ship_count = 2
kind = "cruiser"
age_pulses = 1

[[contact]]
side = "allied"
q = -3
r = 0
ship_count = 3
kind = "transport"
age_pulses = 0

# The Allied commander's commands.
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "deny"
hex = [0, 5]
distance = 0

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "risk"
intent = 1
risk = "press"

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
task_forces = [1]

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
