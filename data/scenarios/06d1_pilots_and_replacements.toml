# Scenario 6d1: six days of raids on an airfield, with pilots and
# replacements.
#
# Stage 6d1 of scenario 6. It is scenario 6a over six days. Every group has
# pilots, and each side receives replacements at its airfield. It has no wear
# and no fatigue. It proves pilots lost with aircraft shot down away from
# home and saved at home, the limit pilots put on what flies, and
# replacements by the day (decision 0038). The hand calculation is in
# tests/scenario_06d1_pilots_and_replacements.rs. The test runs this file
# with seeds 1 to 1000.
#
# PLACEHOLDER DATA. The bases, aircraft, figures and map are invented.

name = "Scenario 6d1: Pilots and replacements"
placeholder = true
seed = 1942
days = 6
map = "../map/placeholder_two_airfields.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"

[[base]]
id = 1
name = "Placeholder airfield A"
side = "japanese"
q = 0
r = 0
supply_t = 0

# 200 nm east of airfield A.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "allied"
q = 5
r = 0
supply_t = 1000
anti_aircraft = 20

[[air_group]]
id = 1
name = "Placeholder bomber group"
side = "japanese"
base = 1
aircraft_type = 3
ready = 18
pilots = 18

[[air_group]]
id = 2
name = "Placeholder escort group"
side = "japanese"
base = 1
aircraft_type = 4
ready = 12
pilots = 12

[[air_group]]
id = 3
name = "Placeholder defending fighters"
side = "allied"
base = 2
aircraft_type = 4
ready = 12
pilots = 12

[[air_group]]
id = 4
name = "Placeholder resting bombers"
side = "allied"
base = 2
aircraft_type = 3
ready = 10
pilots = 10

[[air_group]]
id = 5
name = "Placeholder scouts"
side = "allied"
base = 2
aircraft_type = 2
ready = 6
pilots = 6

# The Japanese receive two bombers and one bomber pilot a day at airfield A,
# and no fighters.
[[replacement]]
side = "japanese"
base = 1
aircraft_type = 3
aircraft_per_day = 2
pilots_per_day = 1

# The Allies receive two fighters a day at airfield B and no pilots, and one
# bomber a day.
[[replacement]]
side = "allied"
base = 2
aircraft_type = 4
aircraft_per_day = 2
pilots_per_day = 0

[[replacement]]
side = "allied"
base = 2
aircraft_type = 3
aircraft_per_day = 1
pilots_per_day = 0

[[order]]
day = 1
side = "japanese"
air_group = 1
kind = "set_air_mission"
mission = "base_strike"
target_base = 2

# Half the escort group stays over airfield A, half goes with the raid.
[[order]]
day = 1
side = "japanese"
air_group = 2
kind = "set_air_mission"
mission = "combat_air_patrol"

[[order]]
day = 1
side = "japanese"
air_group = 2
kind = "set_patrol_share"
share = "0.5"

# All the defending fighters stay overhead.
[[order]]
day = 1
side = "allied"
air_group = 3
kind = "set_air_mission"
mission = "combat_air_patrol"

# The scouts are in the air each daylight pulse. Group 4 has no order and
# rests on the ground.
[[order]]
day = 1
side = "allied"
air_group = 5
kind = "set_air_mission"
mission = "search"

[[order]]
day = 1
side = "allied"
air_group = 5
kind = "set_search_arc"
from_deg = 40
to_deg = 130
range_nm = 300
