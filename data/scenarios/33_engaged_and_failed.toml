# Scenario 33: who is engaged in a fight ashore, and an attack that fails
# (decision 0105).
#
# Proves decision 0105 against a hand calculation, at four hexes. At K a
# large Allied division holds against a small Japanese regiment: the
# Allied fire is limited to 3 times the Japanese men, the attack fails twice
# and wears the regiment out, and it holds with no instruction because its
# base has supply. At L a tired Japanese battalion attacks, fails, and its
# order says fall back, so it marches for M though its base holds supply. At N
# the same, with no instruction and a base with nothing to feed it: it falls
# back to O. At P a larger Allied force attacks a smaller one and its attack
# does not fail. The hand calculation is in tests/scenario_33_engaged_and_failed.rs,
# which runs the scenario on the frozen step 1 figures with the two new
# figures set. Only the hits of the fights are the dice; the test reads them.
#
# No air combat, wear, fatigue or air supply figures are named, so no aircraft
# flies and nothing wears or is grounded. Each night the men's supply is the
# first thing charged. Every base has an airfield (the default).
#
# PLACEHOLDER DATA. The units, bases and map are invented.

name = "Scenario 33: Who is engaged, and an attack that fails"
placeholder = true
seed = 1942
days = 6
map = "../map/placeholder_engaged.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground.toml"

