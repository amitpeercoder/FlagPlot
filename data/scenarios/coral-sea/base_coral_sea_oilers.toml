# ---------------------------------------------------------------------------
# MISSIONS AND OBJECTIVES (decision 0054; decision 0188, rules 11, 12 and 14
# to 17 and amended 49 to 51; decisions 0186 and 0187). A scenario for play
# (decision 0187): its scale is its own, and its results are not laid beside
# the record or another scenario's. Every figure is one the game already has
# (scenarios 5, 7 and 103). Every point value is a PLACEHOLDER. No objective
# for a base open or held: the mission inside five days is the landing.
#
# The levels are set for this scenario's size, in the convoy, before any game
# is played (decision 0187, 15): one transport's 600 men landed are 6 points
# (minor); a third of the convoy's 5,386 men, 17.95, is 18 (major); two
# thirds, 35.91, is 36 (decisive).
#
# The horizon is 30 days: the next battle, Midway, was fought 30 days after
# the game begins, and a carrier out for those days missed it, as two of
# these did (decision 0088).
# ---------------------------------------------------------------------------

[objectives]
for_play = true
minor = 6
major = 18
decisive = 36
horizon_days = 30
history = "Shoho was sunk and Lexington was lost; Yorktown and Shokaku were damaged. The convoy turned back on 7 May and landed no one at Port Moresby."

[objectives.allied]
mission = "Stop the landing at Port Moresby and sink the Japanese carriers."

[[objectives.allied.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.allied.objective]]
kind = "ships_out_of_action"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }

[[objectives.allied.objective]]
kind = "aircraft_destroyed"
points = "0.05"

[[objectives.allied.objective]]
kind = "men_lost"
points_per_100_men = 1

