# SCENARIO 105 WITH BOTH OILERS, THE CORAL SEA (decisions 0206 and 0207).
#
# Built on base_coral_sea_both_oilers.toml (`built_on`, decision 0234): the
# four files state what differs and read the rest from it. There are four
# files, one for each pairing the table offers (decision 0185):
#   03a: both sides given their orders (staff against staff);
#   03b: the Japanese side given its orders, the Allied side none (a person
#        or an agent takes the Allied seat);
#   03c: the Allied side given its orders, the Japanese side none;
#   03d: neither side given orders.
# The file loads a class with ESTIMATED figures: Toho Maru's light
# displacement (so her toughness) and her cargo (decision 0207; her class
# file names them in its column `estimated`), and Neosho's cargo is marked
# too. An estimate is never evidence. Toho Maru's load on 5 May is not
# known: she starts full, as every ship of the file does.
#
# Each states a name of its own and, at the end, the commands (and orders)
# of the sides it gives orders, and nothing else: with those taken away the
# four are the same. The orders are the hand calculation's
# (tests/scenario_105_the_coral_sea.rs, "What a side the engine plays is
# given"), on day 1, with no risk set (balanced):
#   Japanese: intent 1, take the place (-17,-4), its forces the invasion
#     force (task force 5) and its two land units (2, 3); intent 2, operate
#     task force 3 from (-4,1); intent 3, operate task force 4 from (-10,-2),
#     each with its own air groups (no forces limit); intent 4, deny the
#     waters within 2 hexes of (-12,-3), its forces the groups at Rabaul
#     (18, 19, 20); leave to prepare and leave to launch given. No estimate
#     of the garrison is held.
#   Allied: intent 1, hold Port Moresby (base 1), its forces the garrison
#     (land unit 1); intent 2, operate task force 1 from (-12,1), with its
#     own air groups (no forces limit); leave to prepare and leave to launch
#     given; intent 3, stand at (-13,-2) with task force 2 (decision 0192);
#     intent 4, deny the waters within 1 hex of (-13,-2), its forces task
#     force 1, with the targets limit transports first and the waters first
#     (decision 0190). No order of a commander's own.
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).

built_on = "base_coral_sea_both_oilers.toml"
name = "Scenario 105 with both oilers, file a: the Coral Sea, 6 to 10 May 1942; both sides given their orders"

[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "hold"
base = 1

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
land_units = [1]

[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 2
intent_kind = "operate_carriers"
task_force = 1
hex = [-12, 1]

[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 3
intent_kind = "stand_at"
task_force = 2
hex = [-13, -2]

[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 4
intent_kind = "deny"
hex = [-13, -2]
distance = 1

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 4
task_forces = [1]

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "targets"
intent = 4
kinds = ["transport", "carrier", "battleship", "cruiser", "destroyer", "auxiliary"]
waters_first = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true

[[command]]
day = 1
side = "japanese"
kind = "set_intent"
intent = 1
intent_kind = "take_place"
hex = [-17, -4]

[[command]]
day = 1
side = "japanese"
kind = "set_limit"
limit = "forces"
intent = 1
task_forces = [5]
land_units = [2, 3]

[[command]]
day = 1
side = "japanese"
kind = "set_intent"
intent = 2
intent_kind = "operate_carriers"
task_force = 3
hex = [-4, 1]

[[command]]
day = 1
side = "japanese"
kind = "set_intent"
intent = 3
intent_kind = "operate_carriers"
task_force = 4
hex = [-10, -2]

[[command]]
day = 1
side = "japanese"
kind = "set_intent"
intent = 4
intent_kind = "deny"
hex = [-12, -3]
distance = 2

[[command]]
day = 1
side = "japanese"
kind = "set_limit"
limit = "forces"
intent = 4
air_groups = [18, 19, 20]

[[command]]
day = 1
side = "japanese"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "japanese"
kind = "set_leave"
leave = "launch"
given = true
