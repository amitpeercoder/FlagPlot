# Scenario 49: a strike sized to its target.
#
# Decision 0118. Eight Allied groups of placeholder dive bombers at one base,
# all on naval strike, each launching on a contact up to 3 pulses old. Seven
# size their strikes to their target, by an order of day 1; group 2 does not;
# group 4 holds back a quarter. The Allied side starts holding three contacts
# in reach (a carrier, two cruisers, three transports), and there is no enemy
# at all: every strike flies to a contact's hex, finds nothing and rolls no
# die. The hand calculation is in tests/scenario_49_a_strike_sized_to_its_target.rs.
# The test runs this file on the frozen step 1 figures with its own table of
# aircraft for each ship added, and with variants it builds from the parsed
# text. The upkeep, wear, fatigue and supply figures are not loaded.
#
# PLACEHOLDER DATA. The bases, aircraft, figures and map are invented.

