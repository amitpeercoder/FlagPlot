# Scenario 5: Eastern Solomons, 24 August 1942.
#
# Stage 5e of scenario 5. Two American carrier forces lie east of
# Guadalcanal. The Japanese carrier striking force and the Ryujo detachment
# come down from the north. What is in the scenario and what is left out is
# docs/decisions/0031-eastern-solomons-scenario.md. The hand calculation is
# in tests/scenario_05_eastern_solomons.rs.
#
# The ships and aircraft are real: their figures are derived from sourced
# facts (data/reference/ship_classes_eastern_solomons.csv and
# aircraft_types_eastern_solomons.csv, decisions 0020 and 0029). The map is
# real. Air group strengths cite rows of data/oob/air_unit_facts.csv.
#
# PLACEHOLDER DATA all the same: the search, air combat and surface combat
# figures and the scaling constants are invented. Full fuel at the start is
# an assumption. The starting positions are worked back from positions that
# are themselves good to about one hex.

