# VB-6 (group 2, 17; its 11 SBDs were hers) and VT-3's attack group (group
# 25, 7) rest, which over the day has the record's effect: they attack
# nothing. Saratoga's second group of 17:08 (233, 359; group 26, VT-8's five)
