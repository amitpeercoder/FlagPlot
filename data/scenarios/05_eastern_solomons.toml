# Nagumo's carriers with the ships of the vanguard, at the map's northern
# edge at 18:00 on 23 August.
[[task_force]]
id = 3
name = "Carrier striking force"
side = "japanese"
q = 9
r = -19
mission = "carrier"

# The Ryujo detachment. It starts in (7,-19), on the same column of hexes as
