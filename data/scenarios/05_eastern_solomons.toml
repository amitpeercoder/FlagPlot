kind = "set_air_mission"
mission = "naval_strike"

# A LIMIT OF THE RULES, not the record: the second wave (groups 21 and 22,
# with their escorts, groups 23 and 24) rests. The record has it launch at
# 14:00 Tokyo time, 16:00 here (engagement_outcomes 1163, 1169, 409; events
# 202), 27 dive bombers and 9 fighters, find nothing and attack nothing (409,
# 1163: bombs jettisoned). The rules cannot order a launch that finds
# nothing, so the second wave gets the order whose effect over the day is the
# record's: it attacks nothing. Its launch stays in the record as what the
# scenario does not fly. Its losses after dark (293; 1170) are outside the
# rules and the scenario's 18:00 end. What it costs: in the record these 36
# aircraft were away from their carriers from 16:00; here they are aboard all
# day, so if Shokaku or Zuikaku is sunk they go down with her, and a hit that
# puts her flight deck out keeps them aboard, where in the record they would
# have had to land elsewhere or ditch (decision 0081).

[[order]]
day = 1
side = "japanese"
air_group = 21
kind = "set_air_mission"
mission = "rest"

[[order]]
day = 1
side = "japanese"
air_group = 22
kind = "set_air_mission"
mission = "rest"

[[order]]
day = 1
side = "japanese"
air_group = 23
kind = "set_air_mission"
mission = "rest"

[[order]]
day = 1
side = "japanese"
air_group = 24
kind = "set_air_mission"
mission = "rest"

# Ryujo's attack unit raids Henderson Field (decision 0063, "What it costs"):
# the record has her launch 15 fighters and 6 attack planes at it
# (engagement_outcomes 1171, her action report) from 200 to 202 miles
# (engagement_events 331, engagement_positions 310). That is beyond the B5N2's
# derived radius of 175 and within extended reach (218), so the raid is a base
# strike at base 1 on extended reach.
[[order]]
day = 1
side = "japanese"
air_group = 19
kind = "set_air_mission"
mission = "base_strike"
target_base = 1

[[order]]
day = 1
side = "japanese"
air_group = 19
kind = "set_reach"
reach = "extended"

# Missions and objectives (decision 0054). The points and the levels are the
# placeholder scale of that decision, to be set from the record in step 2.
[objectives]
minor = 3
major = 8
decisive = 16
history = "Ryujo was sunk and Enterprise was damaged and withdrew for repair; Japanese aircraft losses were several times the American. Usually judged a limited American victory. (The architect's reading; not yet scored from the order-of-battle facts.)"

