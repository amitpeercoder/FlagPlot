# Scenario 32: a beaten side falls back (decision 0104).
#
# Proves decision 0104 against a hand calculation, in three places. At P a
# Japanese working unit, its side beaten with no fight, falls back to R, where
# its side has a base, in preference to Q, which comes first in hex order and
# holds nothing; it marches carrying nothing, tired by the defeat, and works
# the port at R when it arrives. At T a Japanese fighting unit beaten in a
# fight falls back to V, passing U, which holds Allied fighting men. At S, a
# hex with no land link, a Japanese working unit beaten with no fight has
# nowhere to go and surrenders. The Allied side's objective counts Japanese
# men lost. The hand calculation is in tests/scenario_32_falling_back.rs, which
# runs the scenario on the frozen step 1 figures. Only the hits of the one
# fight, at T on day 1, are the dice; the test reads them.
#
# No air combat, wear, fatigue or air supply figures are named, so no aircraft
# flies and nothing wears, tires or is grounded. Each night the men's supply is
# the first thing charged. Every base has an airfield (the default).
#
# PLACEHOLDER DATA. The units, bases and map are invented.

name = "Scenario 32: A beaten side falls back"
placeholder = true
seed = 1942
days = 6
map = "../map/placeholder_falling_back.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground.toml"

