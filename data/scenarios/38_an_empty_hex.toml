# Scenario 38: a side's men report an empty hex (decision 0110, item 10).
#
# Proves decision 0110, items 10 and 11, against a hand calculation, in four
# places. At P a Japanese working unit, its side beaten with no fight, is set
# to fall back to R and stays three days (marching its third day); the Allied
# regiment has no estimate at first, gets a daily ground report, and on the
# day the last Japanese man is gone is told its men find none, and the
# estimate is cleared. At Q the Allied side holds an opening estimate of men
# who were never there; its men find none on day 1. At S the Allied side
# holds an opening estimate and has only a working unit: no report is made.
# At V a Japanese working unit surrenders on day 1 and the Allied platoon is
# told its men find none. The hand calculation is in
# tests/scenario_38_an_empty_hex.rs, which runs the scenario on the frozen
# step 1 figures. The estimates drawn are the dice; the test reads them.
#
# No air combat, wear, fatigue or air supply figures are named, so no
# aircraft flies and nothing wears, tires or is grounded. Every base has an
# airfield (the default). No order is given.
#
# PLACEHOLDER DATA. The units, bases and map are invented.

name = "Scenario 38: An empty hex"
placeholder = true
seed = 1942
days = 6
map = "../map/placeholder_an_empty_hex.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
