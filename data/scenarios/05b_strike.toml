# Scenario 5b: a carrier's scouts find an enemy force and its bombers strike it.
#
# Stage 5b of scenario 5. It proves the strike decision, a strike that flies
# on belief and finds its target or finds nothing, bomb hits through the
# damage rules of surface combat, and the flight deck (decision 0026). Nobody
# opposes the strike: fighters and anti-aircraft fire are stage 5c. The hand
# calculation is in tests/scenario_05b_strike.rs. The test runs this file
# with seeds 1 to 1000.
#
# PLACEHOLDER DATA. The ships, aircraft, figures and map are invented.

name = "Scenario 5b: Unopposed strike"
placeholder = true
seed = 1942
days = 1
map = "../map/placeholder_search.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"

# The carrier force lies stopped at (4,0).
[[task_force]]
id = 1
name = "Placeholder carrier force"
side = "allied"
q = 4
r = 0
mission = "carrier"

# The enemy force lies stopped at (9,0), 200 nm east.
[[task_force]]
