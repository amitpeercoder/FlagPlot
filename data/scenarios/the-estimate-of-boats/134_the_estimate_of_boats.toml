# The flying boats' orders. Day 1: the whole circle, to 600 nm.
[[order]]
day = 1
side = "allied"
air_group = 1
kind = "set_air_mission"
mission = "search"

[[order]]
day = 1
side = "allied"
air_group = 1
kind = "set_search_arc"
from_deg = 0
to_deg = 0
range_nm = 600

# Day 2: an arc that holds boat 8 alone.
[[order]]
day = 2
side = "allied"
air_group = 1
kind = "set_search_arc"
from_deg = 280
to_deg = 330
range_nm = 600

# Day 3: no search.
[[order]]
day = 3
side = "allied"
air_group = 1
kind = "set_air_mission"
mission = "rest"
