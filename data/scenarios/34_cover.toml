# Day 1: the labour at B and C works on the defences.

[[order]]
day = 1
side = "allied"
land_unit = 2
kind = "set_activity"
activity = "work"
job = "defences"

[[order]]
day = 1
side = "allied"
land_unit = 3
kind = "set_activity"
activity = "work"
job = "defences"

# Day 2: force 1 to F at cruise; it shells base 6 that night.

[[order]]
day = 2
side = "japanese"
task_force = 1
kind = "set_route"
waypoints = [[40, 0]]

[[order]]
day = 2
side = "japanese"
task_force = 1
kind = "set_speed"
speed = "cruise"

# Day 3: force 1 back out; force 2 to A at cruise, and it shells base 1
# that night.

[[order]]
day = 3
side = "japanese"
task_force = 1
kind = "set_route"
waypoints = [[38, 0]]

[[order]]
day = 3
side = "japanese"
task_force = 2
kind = "set_route"
waypoints = [[0, 0]]

[[order]]
day = 3
side = "japanese"
task_force = 2
kind = "set_speed"
speed = "cruise"

# Day 4: force 2 back out; unit 1 is set to attack, with no enemy at A.

[[order]]
day = 4
side = "japanese"
task_force = 2
kind = "set_route"
waypoints = [[2, 0]]

[[order]]
day = 4
side = "allied"
land_unit = 1
kind = "set_posture"
posture = "attack"

# Day 5: unit 1 is set to defend again.

[[order]]
day = 5
side = "allied"
land_unit = 1
kind = "set_posture"
posture = "defend"
