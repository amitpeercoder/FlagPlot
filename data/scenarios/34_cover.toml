# Scenario 34: cover, men who dig in, and a place under bombardment
# (decision 0106).
#
# Proves decision 0106 against a hand calculation, in five places on one row.
# At A a battalion digs in, is shelled on men who have dug, leaves its holes
# when set to attack and digs again from nothing. At B and C labour works on
# defences in the prepared grade and across into the fortified one, each point
# dearer. At D a battalion behind defences of 80 loses fewer men in the fight.
# At F two units behind defences of 50 are shelled: neither rests, the strain
# stops at its limit, and the shells wear the defences. The hand calculation is
# in tests/scenario_34_cover.rs, which sets the rule's figures on the frozen
# ones (the frozen figures switch the rule off).
#
# No air supply, wear or fatigue figures are named, so no base pays for
# aircraft and nothing wears at sea. Each night the men's supply is the first
# thing charged.
#
# PLACEHOLDER DATA. The units, bases, ships and map are invented.

name = "Scenario 34: Cover, men who dig in, and a place under bombardment"
placeholder = true
seed = 1942
days = 6
map = "../map/placeholder_cover.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"
ground = "../reference/ground.toml"

[[base]]
id = 1
name = "Placeholder base A, Allied"
side = "allied"
q = 0
r = 0
supply_t = 5000

[[base]]
id = 2
name = "Placeholder base B, Allied"
side = "allied"
q = 10
r = 0
supply_t = 5000
defences = 30

[[base]]
