# Two bombarding forces built as scenario 24's is, each at sea 2 hexes from
# the base it shells. Force 1 shells base 6 at F on the night of day 2 and
# steams back out on the night of day 3; force 2 shells base 1 at A on the
# night of day 3 and steams back out on the night of day 4.
[[task_force]]
id = 1
name = "Placeholder bombardment force 1"
side = "japanese"
q = 38
r = 0
mission = "bombardment"

[[task_force]]
id = 2
name = "Placeholder bombardment force 2"
side = "japanese"
q = 2
r = 0
mission = "bombardment"

# Placeholder cruiser: 8 guns at 3 rounds a minute, gun damage 20.
[[ship]]
id = 1
name = "Placeholder cruiser 1"
class = 1
side = "japanese"
