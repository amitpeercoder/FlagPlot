# Scenario 133, game A: a force followed, lost and not found (decision 0220,
# as amended on review). Two Japanese cruisers lie at (8,0), go to (14,0) in
# the night of day 2, come back to (8,0) in the night of day 4 and leave at
# full speed in the night of day 5, beyond the flying boats' range. The Allied
# commander orders the force of contact 1 destroyed, within 2 hexes, at
# balanced, and gives both leaves. Base 1 has flying boats and dive bombers;
# the force is never within the bombers' reach, so nothing is struck and no
# die is rolled. The statements and the hand calculation are in
# tests/scenario_133_a_force_followed.rs.
#
# The order "destroy a force" is `intent_kind = "destroy_force"`, with
# `contact`, `distance` and, where given, `search_only` (decision 0220, built
# on Nov 23, 2026; rules chapter 8, Destroying a force).
#
# Kept out of the loops that walk data/scenarios/*.toml by being in this
# folder (decision 0072).
#
# The test runs this file on the frozen step 1 figures with three changes made
# through `common::altered_reference`, so that a report says exactly what was
# there and no outcome rests on a die: `position_error_chance`,
# `count_over_chance` and `count_under_chance` are 0, and every row of
# `kind_confusion` names its own kind with a chance of 1. The upkeep, wear,
# fatigue, supply and report figures are not loaded. The staff's own figures
# (`followed_force_knots` 20, `lost_contact_days` 2, `station_rechosen_hexes`
# 3) are the doctrine's, in the code, and are read from no file.
#
# PLACEHOLDER DATA. The base, ships, aircraft, figures and map are invented.
# The 100 flying boats of group 1 are a placeholder number chosen so that the
# chance to sight a force in the arc is 1 at any distance to the type's 600 nm
# and any width of arc: 57.295779 x 100 x 40 = 229,183.116, above 600 x 360 =
# 216,000.

name = "Placeholder scenario 133, game A: a force followed, lost and not found"
placeholder = true
seed = 1942
days = 7
map = "../../map/placeholder_a_force_followed.toml"
ship_classes = "../../reference/ship_classes.csv"
port_sizes = "../../reference/port_sizes.csv"
aircraft_types = "../../reference/aircraft_types.csv"
search = "../../reference/search.toml"
surface_combat = "../../reference/surface_combat.toml"
air_combat = "../../reference/air_combat.toml"

# Allied base 1, with the flying boats.
[[base]]
id = 1
name = "Placeholder base 1"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 5000

[[air_group]]
id = 1
name = "Placeholder flying boats 1"
side = "allied"
base = 1
aircraft_type = 1
ready = 100

[[air_group]]
id = 2
name = "Placeholder dive bombers 2"
side = "allied"
base = 1
aircraft_type = 3
ready = 10

# Japanese task force 1: two placeholder cruisers, stopped at sea at (8,0).
[[task_force]]
id = 1
name = "Placeholder cruiser force 1"
side = "japanese"
q = 8
r = 0
mission = "surface_combat"

[[ship]]
id = 1
name = "Placeholder cruiser 1"
class = 1
side = "japanese"
fuel_t = 2000
task_force = 1

[[ship]]
id = 2
name = "Placeholder cruiser 2"
class = 1
side = "japanese"
fuel_t = 2000
task_force = 1

# The contact the Allied side starts with: contact 1.
[[contact]]
side = "allied"
q = 8
r = 0
ship_count = 2
kind = "cruiser"
age_pulses = 0

# The Japanese force's orders. A night at 20 knots is 240 nm, six hexes.
[[order]]
day = 2
side = "japanese"
task_force = 1
kind = "set_speed"
knots = 20

[[order]]
day = 2
side = "japanese"
task_force = 1
kind = "set_route"
waypoints = [[14, 0]]

[[order]]
day = 4
side = "japanese"
task_force = 1
kind = "set_route"
waypoints = [[8, 0]]

# At the cruisers' full speed, 32 knots, the force is 384 nm on by the morning
# of day 5: in (17,0), 680 nm from base 1.
[[order]]
day = 5
side = "japanese"
task_force = 1
kind = "set_speed"
speed = "full"

[[order]]
day = 5
side = "japanese"
task_force = 1
kind = "set_route"
waypoints = [[20, 0]]

# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "destroy_force"
contact = 1
distance = 2

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
