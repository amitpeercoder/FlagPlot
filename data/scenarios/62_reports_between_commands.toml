# Scenario 62: reports between commands.
#
# Decision 0135, step 2 of stage 2b. This is scenario 61's file (scenario 58
# with command levels on) with a second carrier force, task force 2, one
# placeholder carrier stopped at sea at (7,0), and report figures of its own
# (data/reference/reports_placeholder_scenario_62.toml: up on time, sideways
# and down never). Task force 1 finds nothing where the Allied side holds a
# contact and tells the area command only; task force 2 and base 1 are never
# told and go on holding the contact for five pulses. The hand calculation is
# in tests/scenario_62_reports_between_commands.rs. What follows is scenario
# 58's own note.
#
# Scenario 58: a carrier force closes the range.
#
# Decision 0130. One placeholder carrier, task force 1, lies stopped at sea
# at (0,0), full of fuel, on the carrier mission, with Allied base 1 (at
# (0,5)) as its home port and a fighter group, a scout group and a dive
# bomber group aboard. The Allied side holds one contact, a carrier 12 hexes
# (480 nm) to the east, beyond the bombers' reach of 250 nm. The commander
# states "operate task force 1 from (0,0)" at press and gives both leaves.
# The staff closes the range at full speed through the night, the bombers
# strike in the morning, and the force goes back to its hex. There is no
# enemy unit: the strike finds nothing. The hand calculation is in
# tests/scenario_58_a_carrier_force_closes.rs. The test runs this file on
# the frozen step 1 figures with scenario 53's table of aircraft for each
# ship added, and with variants it builds from the parsed text. The upkeep,
# wear, fatigue and supply figures are not loaded.
#
# PLACEHOLDER DATA. The base, ship, aircraft, figures and map are invented.

