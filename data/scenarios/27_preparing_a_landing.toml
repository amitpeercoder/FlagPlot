task_force = 5
kind = "prepare_landing"
hex = [4, 0]
roster = [5]

# Day 3: force 1 is given the same order again.

[[order]]
day = 3
side = "allied"
task_force = 1
kind = "prepare_landing"
hex = [4, 0]
roster = [1]

# Day 6: force 4 prepares for C. Force 5 prepares for B with units 5 and 6.

[[order]]
day = 6
side = "allied"
task_force = 4
kind = "prepare_landing"
hex = [0, 6]
roster = [4]

[[order]]
day = 6
side = "allied"
task_force = 5
kind = "prepare_landing"
hex = [4, 0]
roster = [5, 6]

# Day 11: forces 1 and 2 sail to B and force 3 to C, at cruise, and unload.

