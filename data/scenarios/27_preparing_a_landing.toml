# Scenario 27: preparing a landing (decision 0095).
#
# Proves loading, rehearsal and the rate of a landing against a hand
# calculation. Five forces lie at port A. Force 1 prepares a landing at B for
# ten days and force 2 does not prepare. Force 3 prepares for B and lands at
# C. Force 4 changes its landing place and force 5 takes on a second unit.
# On day 11 forces 1 and 2 sail to B and force 3 to C and unload. The hand
# calculation is in tests/scenario_27_preparing_a_landing.rs, which gives
# the four figures of the rule the values it calculates with (the frozen
# figures switch the rule off).
#
# No air combat, wear, fatigue or air supply figures are named, so no
# aircraft flies. There is no enemy, no search and no random draw.
#
# PLACEHOLDER DATA. The ships, units, bases and map are invented.

name = "Scenario 27: Preparing a landing"
placeholder = true
seed = 1942
days = 12
map = "../map/placeholder_preparing.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground.toml"

[[base]]
