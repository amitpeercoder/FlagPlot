# Day 1: forces 1, 3, 4 and 5 prepare a landing at B with the unit aboard.
# Force 2 is given no such order.

[[order]]
day = 1
side = "allied"
task_force = 1
kind = "prepare_landing"
hex = [4, 0]
roster = [1]

[[order]]
day = 1
side = "allied"
task_force = 3
kind = "prepare_landing"
hex = [4, 0]
roster = [3]

[[order]]
