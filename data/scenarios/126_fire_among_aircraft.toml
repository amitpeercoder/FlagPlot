# Scenario 126: fire among a carrier's aircraft.
#
# Decision 0212, as amended and measured. Scenario 5b's setting: an Allied
# carrier's scouts find the Japanese force and its dive bombers strike it,
# for three days. Carrier B has her own aircraft aboard, group 3 (twenty
# dive bombers) and group 4 (ten fighters), both at rest: neither flies. A
# raid whose bombs hit carrier B may set her bombers alight, and the fire
# is fought from the next pulse. The hand calculation is in
# tests/scenario_126_fire_among_aircraft.rs. The test runs this file with
# the figures of a copy of the frozen air combat figures that adds
# aircraft_fire_chance (0.3 plain; Japanese 0.6, Allied 0.15 by side),
# fire_spreads_chance 0.5 and aircraft_fire_levels 3, for seeds 1 to 1000.
# On the live figures, which have them, this file loads and runs as any
# scenario does.
#
# PLACEHOLDER DATA. The ships, aircraft, figures and map are invented.

name = "Scenario 126: Fire among a carrier's aircraft"
placeholder = true
seed = 1942
days = 3
map = "../map/placeholder_search.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"

# The carrier force lies stopped at (4,0).
[[task_force]]
id = 1
name = "Placeholder carrier force"
side = "allied"
q = 4
r = 0
mission = "carrier"

# The enemy force lies stopped at (9,0), 200 nm east.
[[task_force]]
id = 2
name = "Placeholder enemy carrier force"
side = "japanese"
q = 9
r = 0
mission = "carrier"

[[ship]]
id = 1
name = "Placeholder carrier A"
class = 4
side = "allied"
fuel_t = 3000
task_force = 1

[[ship]]
id = 2
name = "Placeholder destroyer A"
class = 2
side = "allied"
fuel_t = 500
task_force = 1

[[ship]]
id = 3
name = "Placeholder carrier B"
class = 4
side = "japanese"
fuel_t = 3000
task_force = 2

[[ship]]
id = 4
name = "Placeholder cruiser B1"
class = 1
side = "japanese"
fuel_t = 2000
task_force = 2

[[ship]]
id = 5
name = "Placeholder cruiser B2"
class = 1
side = "japanese"
fuel_t = 2000
task_force = 2

# Aboard carrier A: eight scouts and eighteen dive bombers.
[[air_group]]
id = 1
name = "Placeholder scouting squadron"
side = "allied"
ship = 1
aircraft_type = 2
ready = 8

[[air_group]]
id = 2
name = "Placeholder bombing squadron"
side = "allied"
ship = 1
aircraft_type = 3
ready = 18

# Aboard carrier B: twenty dive bombers and ten fighters, both at rest.
[[air_group]]
id = 3
name = "Placeholder bombing squadron B"
side = "japanese"
ship = 3
aircraft_type = 3
ready = 20

[[air_group]]
id = 4
name = "Placeholder fighter squadron B"
side = "japanese"
ship = 3
aircraft_type = 4
ready = 10

[[order]]
day = 1
side = "allied"
air_group = 1
kind = "set_air_mission"
mission = "search"

[[order]]
day = 1
side = "allied"
air_group = 1
kind = "set_search_arc"
from_deg = 40
to_deg = 130
range_nm = 300

[[order]]
day = 1
side = "allied"
air_group = 2
kind = "set_air_mission"
mission = "naval_strike"
