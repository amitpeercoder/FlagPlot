land_unit = 3
kind = "march"
hex = [0, 0]

# Day 2: the Allied unit at P goes on the defence. Unit 5, at T, is given no
# order and stays on attack.
[[order]]
day = 2
side = "allied"
land_unit = 2
kind = "set_posture"
posture = "defend"
