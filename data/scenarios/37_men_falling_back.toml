# Scenario 37: men who are falling back are fired on only when the side that
# beat them is on attack (decision 0109, correction 1).
#
# Proves correction 1 of decision 0109 against a hand calculation, at two
# places. At P a Japanese regiment is beaten on day 1 by an Allied attack and
# falls back to R; on day 2 the Allied unit goes on the defence; on day 3 a
# Japanese battalion arrives from R and attacks, and the regiment, falling
# back with no Allied attack in the hex, is out of the fight: it does not
# fire, is not counted for the limit on engaged men and takes no share of the
# losses. At T the same regiment falls back while the Allied unit goes on
# attacking: it is counted and fired on, as before. The hand calculation is in
# tests/scenario_37_men_falling_back.rs, which runs the scenario on the frozen
# step 1 figures with `engagement_ratio` set to 3. Only the hits of the
# fights are the dice; the test reads them.
#
# No air combat, wear, fatigue or air supply figures are named, so no aircraft
# flies and nothing wears or is grounded. Each night the men's supply is the
# first thing charged. Every base has an airfield (the default).
#
# PLACEHOLDER DATA. The units, bases and map are invented.

name = "Scenario 37: Men falling back"
placeholder = true
seed = 1942
days = 6
map = "../map/placeholder_men_falling_back.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground.toml"

[[base]]
