# Scenario 4: Savo Island, the night of 8 to 9 August 1942.
#
# Stage 4c2 of scenario 4. The Japanese column steams down the Slot, enters
# the hex of Savo Island at 01:31 and meets the southern and then the
# northern cruiser group there. What is in the scenario and what is left out
# is docs/decisions/0024-savo-island-scenario.md. The hand calculation is in
# tests/scenario_04_savo_island.rs.
#
# The ships are real: their figures are derived from sourced facts
# (data/reference/ship_classes_savo_island.csv, decisions 0020 and 0023).
# The map is real. The positions, readiness and the Allied contact are from
# data/oob (engagement_positions.csv, engagement_events.csv).
#
# PLACEHOLDER DATA all the same: the combat figures in surface_combat.toml
# and the three scaling constants are invented, and so are the break-off
# levels. Full fuel and ammunition at the start is an assumption.

name = "Scenario 4: Savo Island, 8 to 9 August 1942"
placeholder = true
seed = 1942
days = 1
map = "../map/south_pacific.csv"
ship_classes = "../reference/ship_classes_savo_island.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"

# Rabaul, where the column came from and where a ship it sends home goes.
# The position is the anchorage's (data/map/south_pacific_anchors.csv). The
# base holds nothing: only its place matters here.
[[base]]
id = 1
name = "Rabaul"
side = "japanese"
q = -5
r = -13
supply_t = 0

# The Japanese column, 208 nm up the Slot at 18:00, at battle stations. Ships
# are charged the straight-line miles of their course (decision 0058): from
# (-1,-8) the six steps to (2,-5) are charged 34, 30, 38, 26, 40 and 40, 208 in
# all, and the column enters the hex after 188 nm. Worked back so that, at 25
# knots (inside the sources' 24 to 26), it enters at 01:31 (decision 0024, 6;
# the start was (-1,-7) and 24 knots when a step was a flat 40 nm).
[[task_force]]
id = 1
name = "Eighth Fleet striking force"
side = "japanese"
q = -1
r = -8
mission = "surface_combat"
readiness = "battle"
home_port = 1

# The southern group, south-east of Savo Island. Condition II.
[[task_force]]
id = 2
name = "Southern group"
side = "allied"
q = 2
r = -5
mission = "surface_combat"

# The northern group, east of Savo Island. Condition II.
[[task_force]]
id = 3
name = "Northern group"
side = "allied"
q = 2
