# The Hudson's 10:26 report of the column, as the Allied side held it at
# 18:00: eight ships at the reported position, two pulses old.
[[contact]]
side = "allied"
q = -1
r = -9
ship_count = 8
kind = "cruiser"
age_pulses = 2

# Japanese: into the hex of Savo Island and back up the Slot, at 25 knots.
# A ship that cannot keep up is sent home to Rabaul with an escort; one that
# cannot move is left.
[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_route"
waypoints = [[2, -5], [-1, -8]]

[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_speed"
knots = "25"

[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_rules_of_engagement"
stance = "engage"
break_off = "0.5"
stragglers = "detach"

# Allied: hold station, and fight.
[[order]]
day = 1
side = "allied"
task_force = 2
kind = "set_rules_of_engagement"
stance = "engage"
break_off = "0.5"

[[order]]
day = 1
side = "allied"
task_force = 3
kind = "set_rules_of_engagement"
stance = "engage"
break_off = "0.5"

# Missions and objectives (decision 0054). The points and the levels are the
# placeholder scale of that decision, to be set from the record in step 2.
[objectives]
minor = 3
major = 8
decisive = 16
history = "Four Allied heavy cruisers were sunk for no Japanese ship lost that night: a decisive Japanese victory, though the transports the screen guarded were left untouched. (The architect's reading; not yet scored from the order-of-battle facts.)"

[objectives.allied]
mission = "Stop the Japanese column at Savo Island and keep the cruiser screen afloat."

[[objectives.allied.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.allied.objective]]
kind = "ships_crippled"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }

[objectives.japanese]
mission = "Destroy the Allied cruiser screen off Savo Island and be clear before daylight."

[[objectives.japanese.objective]]
kind = "ships_sunk"
points = { carrier = 10, battleship = 8, cruiser = 4, destroyer = 1, transport = 2, auxiliary = 1 }

[[objectives.japanese.objective]]
kind = "ships_crippled"
points = { carrier = 5, battleship = 4, cruiser = 2, destroyer = "0.5", transport = 1, auxiliary = "0.5" }
