# Scenario 13a: strike groups with target lists choose among three contacts,
# and one holds its strike.
#
# Stage 1 of decision 0063. One Allied carrier carries six groups of six dive
# bombers, all on naval strike. The Allied side starts holding three contacts
# (a cruiser, a transport and a carrier that is not there), and five of the
# six groups are given a target list. They choose different contacts, one
# holds, and over the targets two groups of one raid attack different ships.
# Nobody opposes the strikes: the Japanese side has no aircraft and its ships
# have no anti-aircraft fire. The hand calculation is in
# tests/scenario_13a_target_priority.rs. The test runs this file with seeds 1
# to 1000, with strike_contact_max_age_pulses at 1 (a changed figure: with
# the live 0 a contact the side starts with is too old to strike in the
# morning), and with the target orders taken out.
#
# PLACEHOLDER DATA. The ships, aircraft, figures and map are invented.

name = "Scenario 13a: Target priority"
placeholder = true
seed = 1942
days = 1
map = "../map/placeholder_search.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"

# The Allied carrier force lies stopped at (4,0).
[[task_force]]
id = 1
name = "Placeholder carrier force"
side = "allied"
q = 4
r = 0
mission = "carrier"

# The Japanese forces all lie stopped. Force 2 is 120 nm east of the carrier.
[[task_force]]
