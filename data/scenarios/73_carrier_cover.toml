# Scenario 73: carrier cover.
#
# Decision 0148, step 6 of stage 3, second part. The commander asks for an
# airfield and names a carrier force beside the transports. The staff sends
# the carrier to the first hex from which her bombers reach the airfield,
# strikes it each day until the men are ashore and it is theirs, and then
# sends her home.
#
# The map is a row of open sea: A at (0,0), a coast hex with port size 5, and
# B at (10,0), a coast hex with port size 0: 400 nm apart. Allied base 1 lies
# at A; Japanese base 2, an airfield with no gun, no aircraft, no man and no
# stock, lies at B, on the Allied map. Task force 1, one placeholder carrier
# on the carrier mission with a fighter group, a scout group and a dive
# bomber group aboard, lies stopped in port at A, its home port. Task force 2,
# two placeholder troop transports, lies stopped in port at A with nothing
# aboard. Two Allied fighting units are ashore at A. The Allied side holds no
# contact and no estimate. On day 1 the commander states "take the place at
# B", with a forces limit of task forces 1 and 2, units 1 and 2 and base 1 as
# the source, and gives leave to prepare and to launch. The game is 8 days.
# There is no Japanese unit, so no die is rolled.
#
# The hand calculation is in tests/scenario_73_carrier_cover.rs. The test runs
# this file on the frozen step 1 figures with scenario 53's table of aircraft
# for each ship added and one ground figure of its own, preparation_per_day
# 100, in data/reference/ground_placeholder_scenario_73.toml, which this file
# names, so that run by itself it plays the game its test proves. It builds its
# variants from the text of this file using the markers below. The upkeep,
# wear, fatigue and supply figures of the air are not loaded.
#
# PLACEHOLDER DATA. The bases, ships, aircraft, units, figures and map are
# invented.

name = "Placeholder scenario 73: Carrier cover"
placeholder = true
seed = 1942
days = 8
map = "../map/placeholder_carrier_cover.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"
ground = "../reference/ground_placeholder_scenario_73.toml"

# Allied base 1 at A, with supply for every man for the whole game and fuel
# for the carrier.
[[base]]
id = 1
name = "Placeholder base A"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 5000

# Japanese base 2 at B: no gun, no aircraft, no man, no stock.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "japanese"
q = 10
r = 0
supply_t = 0
fuel_t = 0

# Task force 1: one placeholder carrier, stopped in port at base 1, its home
# port.
[[task_force]]
id = 1
name = "Placeholder carrier force 1"
side = "allied"
at_base = 1
mission = "carrier"
home_port = 1

[[ship]]
id = 1
name = "Placeholder carrier 1"
class = 4
side = "allied"
fuel_t = 3000
task_force = 1

# Task force 2: two placeholder troop transports, stopped in port at base 1.
[[task_force]]
id = 2
name = "Placeholder transport force 2"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 2
name = "Placeholder troop transport 2"
class = 10
side = "allied"
fuel_t = 1000
task_force = 2

[[ship]]
id = 3
name = "Placeholder troop transport 3"
class = 10
side = "allied"
fuel_t = 1000
task_force = 2

# The groups aboard the carrier.
[[air_group]]
id = 1
name = "Placeholder fighters 1"
side = "allied"
ship = 1
aircraft_type = 4
ready = 12

[[air_group]]
id = 2
name = "Placeholder carrier scouts 2"
side = "allied"
ship = 1
aircraft_type = 2
ready = 6

[[air_group]]
id = 3
name = "Placeholder dive bombers 3"
side = "allied"
ship = 1
aircraft_type = 3
ready = 10

# The land units, ashore at A, fighting units on the defence, each at the
# standard of experience, 2, the default.
[[land_unit]]
id = 1
name = "Placeholder First"
side = "allied"
men = 600
q = 0
r = 0

[[land_unit]]
id = 2
name = "Placeholder Second"
side = "allied"
men = 600
q = 0
r = 0

# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "take_place"
hex = [10, 0]

[[command]]
day = 1
side = "allied"
kind = "set_limit"
limit = "forces"
intent = 1
task_forces = [1, 2]
land_units = [1, 2]
source = 1

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
