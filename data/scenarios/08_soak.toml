# of VB-6 and VS-5 together, the squadrons not split in any row (VB-6 crews
# are named among them, outcomes 368); group 104 is the 7 TBFs of VT-3 (369).
# The afternoon search is taken and not the dawn one (20 SBDs, 290 to 070 at
# 200, 144, 146), because a standing order flies both pulses and the
# afternoon's is the search that met the enemy; the dawn search found nothing.
# 250 is within the SBD-3's search radius of 397 and the TBF-1's of 420
# (decision 0075). The Japanese ones are set from the record (decision 0073).
# A LIMIT OF THE RULES, not the record: a search group never attacks what it
