# Scenario 8: the soak. The full slice of scenario 7 carried on for 180 days
# from 21 August 1942, seed 1942 (decision 0044).
#
# A machine test and not history. Nothing in it is compared with the record.
# Its forces do what keeps every subsystem busy to the end, and each kind of
# running out happens in it at least once (tests/scenario_08_soak.rs).
#
# PART 1, from the name line to the last order of the scenario-7 text, is the
# file of scenario 7 (data/scenarios/07_full_slice.toml) with these changes:
#   - days is 180.
#   - Rabaul's supply is 9640 t, set so that it runs out late in the run
#     (a placeholder invented for the soak; scenario 7 gave 10,000 t).
#   - Espiritu Santo's supply is 40000 t, so that convoys can load there
#     for the whole run (a placeholder invented for the soak; scenario 7 gave
#     960 t).
# Everything else in part 1, its real units, placeholders and orders,
# is as scenario 7 has it.
#
# PART 2 is what the soak adds, grouped by what it keeps busy:
#   A. The air campaign: arrivals and replacements at both bases, two doomed
#      placeholder groups (4 and 5) and two scout flights (6 and 7).
#   B. Search and strikes on ships: Japanese raiding forces that come, one
#      every 15 days from day 40, to within reach of Henderson Field's scouts
#      and dive bombers.
#   C. Convoys: three shuttles between Espiritu Santo and Lunga Point.
#   D. Surface actions: ten pairs of placeholder forces that meet in the open
#      Coral Sea, two pairs in each 30 days after the first, a picket held at
#      battle readiness and a cruiser that runs out of fuel.
#   E. Orders and arrivals for units that no longer have anything, which the
#      engine rejects or does not deliver.
#
# Facts about the engine that this file works around and does not hide:
#   - Ships cannot take on fuel, in port or at sea. A ship's fuel only falls.
#     Every shuttle ship, then, is good for a number of cycles and no more,
#     and the escort of convoy 5 runs dry first. Convoys are listed from the
#     start in numbers that cover the whole run.
#   - Two forces that survive a fight stay in the hex they fought in, since a
#     force that retires and has no home port stays where it is (decision
#     0016, 14), and they fight again in the next pulse, and the next, with
#     no end. Without orders to part, one pair made 92 engagements in 30
#     days. Each pair of part D is therefore ordered to part two days after
#     it meets.
#   - A base with no supply flies nothing (decision 0039), and nothing
#     brings supply to Rabaul, which has no convoy.
#
# PLACEHOLDER DATA. Every unit, quantity and order in part 2 is invented for
# the soak: the names start "Placeholder", the figures files are placeholders.

