# --- C. Convoys ------------------------------------------------------
#
# Three shuttles between Espiritu Santo (7,6) and Lunga Point (2,-4), 15
# hexes, about 2.5 days each way at 10 knots. A cycle is 12 days: load at
# Espiritu Santo for two days, steam, unload at Lunga Point for most of a
# week, steam back. Ships cannot refuel in port (decision 0006 leaves it
# for later) so each cycle burns 120 t of a cargo ship's 1,000, and a
# convoy is good for about eight cycles. Convoy 5, the scenario-7 convoy,
# has a destroyer escort that carries 500 t and runs dry first, a little
# after day 38. Convoys 21 and 22 are placeholder pairs of cargo ships, no
