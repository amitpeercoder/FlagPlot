# Scenario 4c2a: an attacking force at battle readiness meets two defending
# forces in one hex, one after the other.
#
# Stage 4c2a of scenario 4. It proves readiness, alertness from belief, the
# alarm when a fight breaks out in a hex, and a speed order in knots, on
# placeholder ships. The hand calculation is in
# tests/scenario_04c_readiness.rs. The test runs this file with seeds 1 to
# 1000.
#
# PLACEHOLDER DATA. The ships, figures and map are invented.

name = "Scenario 4c2a: Readiness, one attacker and two defenders"
placeholder = true
seed = 1942
days = 1
map = "../map/placeholder_night_action.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"

# The attacker, at battle readiness.
[[task_force]]
id = 1
name = "Placeholder attacking force"
side = "japanese"
q = 0
r = 0
mission = "surface_combat"
readiness = "battle"

# Two defending forces lie stopped in (7,0), 280 nm east, at normal
# readiness. Their side holds no contact.
[[task_force]]
id = 2
name = "Placeholder first defending force"
side = "allied"
q = 7
r = 0
mission = "surface_combat"

[[task_force]]
id = 3
name = "Placeholder second defending force"
side = "allied"
q = 7
r = 0
mission = "surface_combat"

[[ship]]
id = 1
name = "Placeholder cruiser A1"
class = 1
side = "japanese"
fuel_t = 2000
task_force = 1

[[ship]]
id = 2
name = "Placeholder cruiser A2"
class = 1
side = "japanese"
fuel_t = 2000
task_force = 1

[[ship]]
id = 3
name = "Placeholder cruiser A3"
class = 1
side = "japanese"
fuel_t = 2000
task_force = 1

[[ship]]
id = 4
name = "Placeholder cruiser B1"
class = 1
side = "allied"
fuel_t = 2000
task_force = 2

[[ship]]
id = 5
name = "Placeholder cruiser B2"
class = 1
side = "allied"
fuel_t = 2000
task_force = 2

[[ship]]
id = 6
name = "Placeholder cruiser B3"
class = 1
side = "allied"
fuel_t = 2000
task_force = 2

[[ship]]
id = 7
name = "Placeholder cruiser C1"
class = 1
side = "allied"
fuel_t = 2000
task_force = 3

[[ship]]
id = 8
name = "Placeholder cruiser C2"
class = 1
side = "allied"
fuel_t = 2000
task_force = 3

[[ship]]
id = 9
name = "Placeholder cruiser C3"
class = 1
side = "allied"
fuel_t = 2000
task_force = 3

# Day 1, Japanese: steam east to (10,0) at 24 knots, and fight.
[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_route"
waypoints = [[10, 0]]

[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_speed"
knots = "24"

[[order]]
day = 1
side = "japanese"
task_force = 1
kind = "set_rules_of_engagement"
stance = "engage"
break_off = "0.5"

# Day 1, Allied: hold position, and fight.
[[order]]
day = 1
side = "allied"
task_force = 2
kind = "set_rules_of_engagement"
stance = "engage"
break_off = "0.5"

[[order]]
day = 1
side = "allied"
task_force = 3
kind = "set_rules_of_engagement"
stance = "engage"
break_off = "0.5"
