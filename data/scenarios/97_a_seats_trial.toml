# Scenario 97: a seat's trial.
#
# Decision 0178, the first part of step 8 of step 3's stage 4. A commander at
# his seat queues a landing and, before a day is resolved, asks what it would
# cost: the tool `trial`. He is given the estimate in his own words and
# numbers, and the game is as it was.
#
# It is scenario 95 (the estimate) with one change: it names its own file of
# the trial's figures, trial_placeholder_scenario_97.toml, which is scenario
# 95's but for the sizes: small is 4 worlds for 8 days, standard 8 worlds for
# 8 days and full 16 worlds for 8 days. It names its own file of sides,
# class_sides_placeholder_scenario_97.csv, scenario 95's. So: unit 1, 600
# fighting men at A, and task force 1 of two troop transports there; base 2 at
# B, Japanese, held in the live game by 1,200 men; the Allied side's opening
# estimate of B is 200 men, and it believes 400 more may be there, standing
# unknown; scenario 68's ground figures. The scenario has no commands: the
# commander gives them from his seat.
#
# The hand calculation is in tests/scenario_97_a_seats_trial.rs. The test runs
# this file on the frozen step 1 figures, through a session built as sim-cli
# builds one, with the Allied seat played and the Japanese seat scripted. The
# trial's figures and the file of sides have frozen copies in
# data/reference/step1.
#
# PLACEHOLDER DATA. The bases, ships, units, beliefs, figures and map are
# invented.

name = "Placeholder scenario 97: A seat's trial"
placeholder = true
seed = 1942
days = 14
map = "../map/placeholder_preparing.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground_placeholder_scenario_68.toml"
class_sides = "../reference/class_sides_placeholder_scenario_97.csv"
trial = "../reference/trial_placeholder_scenario_97.toml"

# Allied base 1 at A, with supply for every man for the whole game and no
# fuel to give.
[[base]]
id = 1
name = "Placeholder base A"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 0

# Japanese base 2 at B: an airfield with 200 t of supply and no fuel.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "japanese"
q = 4
r = 0
supply_t = 200
fuel_t = 0

# Task force 1: two placeholder troop transports, stopped in port at base 1.
[[task_force]]
id = 1
name = "Placeholder transport force 1"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder troop transport 1"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

[[ship]]
id = 2
name = "Placeholder troop transport 2"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

# The Allied land units, ashore at A: one fighting unit on the defence, at
# the standard of experience, 2, the default, as is the garrison.
[[land_unit]]
id = 1
name = "Placeholder First"
side = "allied"
men = 600
q = 0
r = 0

# The Japanese garrison of B, on the defence.
[[land_unit]]
id = 10
name = "Placeholder Garrison"
side = "japanese"
men = 1200
q = 4
r = 0

# The Allied side's opening estimate of the enemy's men at B.
[[estimate]]
side = "allied"
q = 4
r = 0
men = 200

# The men the Allied side believes may be at B beyond its estimate.
[[believed_men]]
side = "allied"
name = "Reinforcement believed at B"
at_base = 2
men = 400
standing = "unknown"
placeholder = true
note = "Scenario 97's hand calculation, as scenario 95's: 400 more men may be at B, not known whether. Rests on no source."
