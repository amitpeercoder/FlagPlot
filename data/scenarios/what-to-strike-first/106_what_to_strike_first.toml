# The contacts the Allied side holds, fresh.
# MARK: contacts

# The Allied commander's commands.
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "operate_carriers"
task_force = 1
hex = [0, 0]

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
