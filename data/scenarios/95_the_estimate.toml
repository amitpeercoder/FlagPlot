# Scenario 95: the estimate.
#
# Decision 0176, step 6 of step 3's stage 4. A landing of 600 men is tried
# against a place whose garrison the Allied side puts at 200 and believes may
# hold 400 more, not known which. The estimate read from the trial's worlds
# says, in counts of worlds, where it was taken and what it cost.
#
# It is scenario 68 (ashore) with these changes, as the hand calculation's
# inputs give them:
#   1. One Allied unit: unit 1, 600 fighting men at A. Units 2 and 3 are not
#      in the scenario.
#   2. The Allied side's opening estimate of the enemy's men at B is 200.
#   3. The Allied side believes 400 more men may be at B, standing unknown
#      ([[believed_men]]).
#   4. No commands: the course the test tries is scenario 68's four commands
#      of day 1 with the forces limit naming unit 1 alone. The live game is
#      given none of them, and nothing is ever ordered in it.
#   5. It names a file of the trial's figures,
#      trial_placeholder_scenario_95.toml, in which an enemy base is assumed
#      to hold 200 t of supply and 0 t of fuel and the seed is 1942; and a file
#      of sides, class_sides_placeholder_scenario_95.csv, that gives every
#      class and type to both sides.
#
# The Japanese garrison of the live game is as scenario 68 has it, 1,200 men.
# The trial is not told. The game is 14 days, as scenario 68's.
#
# The hand calculation is in tests/scenario_95_the_estimate.rs. The test runs
# this file on the frozen step 1 figures with scenario 68's ground figures,
# data/reference/ground_placeholder_scenario_68.toml, which this file names:
# every shot is a whole shot and hits, and a report gives the true count, so
# no die changes anything. The trial's figures and the file of sides have
# frozen copies in data/reference/step1. The test builds its variants from the
# text of this file using the markers below.
#
# PLACEHOLDER DATA. The bases, ships, units, beliefs, figures and map are
# invented.

name = "Placeholder scenario 95: The estimate"
placeholder = true
seed = 1942
days = 14
map = "../map/placeholder_preparing.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
ground = "../reference/ground_placeholder_scenario_68.toml"
class_sides = "../reference/class_sides_placeholder_scenario_95.csv"
trial = "../reference/trial_placeholder_scenario_95.toml"

# Allied base 1 at A, with supply for every man for the whole game and no
# fuel to give.
[[base]]
id = 1
name = "Placeholder base A"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 0

# Japanese base 2 at B: an airfield with 200 t of supply and no fuel.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "japanese"
q = 4
r = 0
supply_t = 200
fuel_t = 0

# Task force 1: two placeholder troop transports, stopped in port at base 1.
[[task_force]]
id = 1
name = "Placeholder transport force 1"
side = "allied"
at_base = 1
mission = "transport"

[[ship]]
id = 1
name = "Placeholder troop transport 1"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

[[ship]]
id = 2
name = "Placeholder troop transport 2"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

# The Allied land units, ashore at A: one fighting unit on the defence, at
# the standard of experience, 2, the default, as is the garrison.
[[land_unit]]
id = 1
name = "Placeholder First"
side = "allied"
men = 600
q = 0
r = 0

# The Japanese garrison of B, on the defence.
[[land_unit]]
id = 10
name = "Placeholder Garrison"
side = "japanese"
men = 1200
q = 4
r = 0

# The Allied side's opening estimate of the enemy's men at B.
[[estimate]]
side = "allied"
q = 4
r = 0
men = 200

# The men the Allied side believes may be at B beyond its estimate.
[[believed_men]]
side = "allied"
name = "Reinforcement believed at B"
at_base = 2
men = 400
standing = "unknown"
placeholder = true
note = "Scenario 95's hand calculation: 400 more men may be at B, not known whether. Rests on no source."
