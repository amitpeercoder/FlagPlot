# Scenario 12c: aircraft in the air when their deck is lost.
#
# Stage 2 of decision 0059. Two carrier forces 200 nm apart on a wider copy of the
# open map of scenario 5b, each with scouts searching and dive bombers on naval strike, and
# an Allied force of transports 200 nm east of the Japanese carriers, which is
# what the Japanese scouts find. Pilots are counted for every group. The test
# alters the figures so that nothing is left to a roll but the crews of
# ditched aircraft (see tests/scenario_12c_no_deck.rs): every sighting is
# reported in its true hex, every bomb hits and every hit lands on flotation.
#
# In the morning both sides sight and strike. The Allied bombs sink carrier B
# with group 3's bombers and group 4's scouts in the air; carrier B2, with
# room under her aircraft capacity, takes some of them.
#
# PLACEHOLDER DATA. The ships, aircraft, figures and map are invented.

name = "Scenario 12c: No deck"
placeholder = true
seed = 1942
days = 1
map = "../map/placeholder_search_wide.toml"
ship_classes = "../reference/ship_classes.csv"
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"

# The Allied carrier force lies at (4,0).
[[task_force]]
id = 1
name = "Placeholder Allied carrier force"
side = "allied"
q = 4
r = 0
mission = "carrier"

# The Japanese carrier force lies at (9,0), 200 nm east.
[[task_force]]
id = 2
name = "Placeholder Japanese carrier force"
side = "japanese"
q = 9
r = 0
mission = "carrier"

# The Allied transports lie at (9,5), 200 nm from the Japanese carriers, at a
# bearing of 150: inside the Japanese scouts' arc and outside the Allied one.
[[task_force]]
id = 3
name = "Placeholder Allied transports"
side = "allied"
q = 9
r = 5
mission = "transport"

