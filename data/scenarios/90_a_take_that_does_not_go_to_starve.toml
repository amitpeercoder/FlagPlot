# Scenario 90: a take that does not go to starve.
#
# Decision 0169, the second mend of step 3's stage 4. The commander says
# "control the island". The side's men are at sea in their transports, fewer
# than the staff wants against the enemy it has been told is there, with no
# more in reach and not the supply aboard to last until a run could reach
# them. At balanced the staff does not lift them: it hands in "cannot bring
# enough" and waits.
#
# It is scenario 86 with two changes: the Allied side holds from the start an
# estimate of 400 enemy men at B, (4,0), and ship 1 has 10 t of supply aboard
# where it had 30 t. Everything else is scenario 86's: the map of scenario 27,
# Allied base 1 at A with 1,000 t of supply, Japanese base 2 at B with nothing
# at it, Allied base 4 at C with nothing, task force 1 of two placeholder troop
# transports stopped at sea at (2,0) with base 4 its home port, unit 1 (600
# fighting men) in ship 1 and unit 2 (400 working men) in ship 2, island 1 of
# base 2, and on day 1 "control island 1" with leave to prepare and to launch.
# The game is 8 days. There is no Japanese man, so no die is rolled.
#
# The hand calculation is in
# tests/scenario_90_a_take_that_does_not_go_to_starve.rs. The test runs this
# file on the frozen step 1 figures, and builds its variants from the text of
# this file using the markers below.
#
# PLACEHOLDER DATA. The bases, ships, units, estimate, figures, island and map
# are invented.

name = "Placeholder scenario 90: A take that does not go to starve"
placeholder = true
seed = 1942
days = 8
map = "../map/placeholder_preparing.toml"
ship_classes = [
    "../reference/ship_classes.csv",
    "../reference/ship_classes_placeholder_transports.csv",
]
port_sizes = "../reference/port_sizes.csv"
aircraft_types = "../reference/aircraft_types.csv"
search = "../reference/search.toml"
surface_combat = "../reference/surface_combat.toml"
air_combat = "../reference/air_combat.toml"
ground = "../reference/ground.toml"

# Allied base 1 at A, with supply for every man for the whole game and no
# fuel.
[[base]]
id = 1
name = "Placeholder base A"
side = "allied"
q = 0
r = 0
supply_t = 1000
fuel_t = 0

# Japanese base 2 at B: no gun, no aircraft, no man, no stock.
[[base]]
id = 2
name = "Placeholder airfield B"
side = "japanese"
q = 4
r = 0
supply_t = 0
fuel_t = 0

# Allied base 4 at C: the transports' home port, with no stock at all.
[[base]]
id = 4
name = "Placeholder staging C"
side = "allied"
q = 0
r = 6
supply_t = 0
fuel_t = 0

# Task force 1: two placeholder troop transports, stopped at sea at (2,0), with
# base 4 their home port. Unit 1 fills ship 1, which has 10 t of supply
# aboard; unit 2 goes into ship 2.
[[task_force]]
id = 1
name = "Placeholder transport force 1"
side = "allied"
q = 2
r = 0
home_port = 4
mission = "transport"

[[ship]]
id = 1
name = "Placeholder troop transport 1"
class = 10
side = "allied"
fuel_t = 1000
supply_t = 10
task_force = 1

[[ship]]
id = 2
name = "Placeholder troop transport 2"
class = 10
side = "allied"
fuel_t = 1000
task_force = 1

# The land units, aboard. Unit 1 is a fighting unit, unit 2 is a working
# unit; each at the standard of experience, 2, and with every skill at 2, the
# defaults.
# UNITS_MARKER
[[land_unit]]
id = 1
name = "Placeholder Infantry"
side = "allied"
men = 600
task_force = 1

[[land_unit]]
id = 2
name = "Placeholder Pioneers"
side = "allied"
working = true
men = 400
task_force = 1

# The island: base 2.
# ISLANDS_MARKER
[[island]]
number = 1
name = "Placeholder island"
places = [{ base = 2 }]

# The Allied side's opening estimate of the enemy's men at B.
# ESTIMATE_MARKER
[[estimate]]
side = "allied"
q = 4
r = 0
men = 400

# The Allied commander's commands
[[command]]
day = 1
side = "allied"
kind = "set_intent"
intent = 1
intent_kind = "control_island"
island = 1

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "prepare"
given = true

[[command]]
day = 1
side = "allied"
kind = "set_leave"
leave = "launch"
given = true
