# PLACEHOLDER MAP. Open sea with six coast hexes, used by scenario 135
# (decision 0229, men ashore beside a place): A at (0,0) with port size 5, the
# source; D at (4,0), P at (5,0) and N at (6,0), each with port size 0, on one
# landmass, joined D to P and P to N by land links; T at (0,4) with port size
# 0, joined to nothing; and J at (6,4) with port size 0, joined to nothing.
# A to D is 4 hexes, 160 nm, and A to T is 4 hexes, 160 nm. Both lie along an
# axis of the grid, where a leg between centres is charged 40 nm (decision
# 0058), so the passages are exact in the hand calculation. The geography is
# invented.

placeholder = true

# Ranges are inclusive.
[[region]]
kind = "deep_sea"
q = [-1, 7]
r = [-1, 5]

# A, the source.
[[hex]]
q = 0
r = 0
kind = "coast"
port_size = 5
anchorage = true

# D, the dump beside the place.
[[hex]]
q = 4
r = 0
kind = "coast"
port_size = 0

# P, the island's named place.
[[hex]]
q = 5
r = 0
kind = "coast"
port_size = 0

# N, a shore of the same landmass with no base.
[[hex]]
q = 6
r = 0
kind = "coast"
port_size = 0

# T, D's twin on land joined to no named place.
[[hex]]
q = 0
r = 4
kind = "coast"
port_size = 0

# J, a shore the Allied side has nothing on its map for.
[[hex]]
q = 6
r = 4
kind = "coast"
port_size = 0

[[land_link]]
a = [4, 0]
b = [5, 0]
note = "Placeholder: D and P are on one landmass."

[[land_link]]
