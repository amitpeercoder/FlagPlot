# PLACEHOLDER MAP. Open sea with four clear coast hexes in a row and a
# separate strip of three land hexes, used by scenario 29 (decision 0098,
# what a land unit is good at): the coast hexes A at (0,0), L at (4,0), F at
# (6,0) and G at (8,0), all clear; the land hexes M1 at (0,3) and M2 at
# (1,3), both mountain, and P at (2,3), clear. Land links join M1 to M2 and
# M2 to P. The geography is invented.

placeholder = true

