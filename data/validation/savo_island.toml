# Measures for Savo Island, 8 to 9 August 1942 (step 2 spec, "Measures").
# The format and its rules are in README.md beside this file.
#
# Scope is the scenario's (decision 0024): the Japanese column of eight
# ships, the southern group (Canberra, Chicago, Patterson, Bagley) and the
# northern group (Vincennes, Quincy, Astoria, Helm, Wilson), in one hex.
# The pickets Blue and Ralph Talbot, Jarvis, Australia and the transports
# are outside it. So are Kako's loss to a submarine on 10 August and
# Jarvis's to aircraft on the 9th.
#
# The ranges were settled by the architect of the spec session on
# 2026-11-12. No row's standing was changed.

battle = "savo-island"
scenario = "data/scenarios/04_savo_island.toml"
facts = "data/oob/engagement_outcomes.csv"

# ---------------------------------------------------------------- ships

[[measure]]
id = "allied_cruisers_sunk"
counts = "Allied cruisers sunk at the end of the run, of the five"
record_low = 4
record_high = 4
judged = true
take = "ships_sunk"
ships = [9, 10, 13, 14, 15]
rows = [761, 762, 763, 764, 765, 768, 769]
reason = "Canberra, Vincennes, Quincy and Astoria (761, 762, 763, 764). Canberra was scuttled at about 08:00 (765) and Astoria capsized later that day; both are within the scenario's day. Chicago was damaged and steamed on (768, 769)."

[[measure]]
id = "southern_group_cruisers_sunk"
counts = "Cruisers of the southern group sunk at the end of the run, of the two"
record_low = 1
record_high = 1
judged = true
take = "ships_sunk"
ships = [9, 10]
rows = [761, 765, 768]
reason = "Canberra (761, 765). Chicago was not (768)."

[[measure]]
id = "northern_group_cruisers_sunk"
counts = "Cruisers of the northern group sunk at the end of the run, of the three"
record_low = 3
record_high = 3
judged = true
take = "ships_sunk"
ships = [13, 14, 15]
rows = [762, 763, 764]
reason = "Vincennes, Quincy and Astoria (762, 763, 764). The column went on from the southern group to the northern; a model in which it breaks off between them fails here."

[[measure]]
id = "allied_destroyers_sunk"
counts = "Allied destroyers sunk at the end of the run, of the four"
record_low = 0
record_high = 0
judged = true
take = "ships_sunk"
ships = [11, 12, 16, 17]
rows = [770, 773, 774, 775]
reason = "Patterson was damaged and stayed in service (770). Bagley, Helm and Wilson were not hit (773, 774, 775)."

[[measure]]
id = "japanese_ships_sunk"
counts = "Japanese ships sunk at the end of the run, of the eight"
record_low = 0
record_high = 0
judged = true
take = "ships_sunk"
ships = [1, 2, 3, 4, 5, 6, 7, 8]
rows = [779, 780, 781, 782, 783, 785, 787, 778]
reason = "None in the action. Chokai, Aoba, Kinugasa, Yubari and Tenryu had slight damage (779, 780, 781, 782, 783); Furutaka and Yunagi none (785, 787). Kako was sunk by a submarine the next day, outside the scenario (778)."

[[measure]]
id = "japanese_ships_with_propulsion_out"
counts = "Japanese ships afloat at the end of the run with propulsion out"
record_low = 0
record_high = 0
judged = true
take = "ships_with_system_out"
ships = [1, 2, 3, 4, 5, 6, 7, 8]
system = "propulsion"
rows = [779, 780, 781, 782, 783]
reason = "All the damaged ships steamed home (779, 780, 781); Yubari and Tenryu had splinters or scratches only (782, 783)."

# ----------------------------------------------------------------- hits

[[measure]]
id = "gun_hits_on_allied_ships"
counts = "Gun hits on the nine Allied ships, all calibres"
record_low = 153
record_high = 219
judged = true
take = "hits_on"
ships = [9, 10, 11, 12, 13, 14, 15, 16, 17]
weapons = ["gun"]
rows = [19, 20, 37, 50, 58, 59, 60, 69, 70, 71, 82, 83, 49, 93, 96]
reason = "Low end: Canberra 24 (19, 20), Chicago 1 (37), Patterson 1 (50), Vincennes 57 (58, 59), Quincy 36 (69, 70), Astoria 34 by the count of larger calibres only (83). High end: Vincennes 74 (60), Quincy 54 (71) and Astoria 65 by the count of all calibres (82). Bagley, Helm and Wilson took none (49, 93, 96). The record counts hits of every calibre and cannot be split; a ship in the rules fires its main battery only, so a run will be low by what the Japanese secondary guns scored (step 2 spec, 'Where the model stands today')."

[[measure]]
id = "gun_hits_on_japanese_ships"
counts = "Gun hits on the eight Japanese ships, all calibres"
record_low = 10
record_high = 17
judged = true
take = "hits_on"
ships = [1, 2, 3, 4, 5, 6, 7, 8]
weapons = ["gun"]
rows = [11, 114, 115, 125, 140, 141, 151, 156, 132, 147, 157]
reason = "Low end: 10 by the Japanese reports the 1950 analysis quotes, Chokai 4, Kinugasa 2, Yubari 3, Tenryu 1 (11, 114, 140, 151, 156), a low-confidence row read here by exception because it is the only count from the side that was hit. High end: Chokai 10 by the tabular record (115) and 1 on Aoba (125), with Kinugasa 2 (141), Yubari 3 and Tenryu 1. Kako, Furutaka and Yunagi took none (132, 147, 157). Either end is a small fraction of what the Allied ships took, and that is the fact the measure is for."

[[measure]]
id = "torpedo_hits_on_allied_ships"
counts = "Torpedo hits on the nine Allied ships"
record_low = 4
record_high = 9
judged = true
take = "hits_on"
ships = [9, 10, 11, 12, 13, 14, 15, 16, 17]
weapons = ["torpedo"]
rows = [25, 23, 24, 163, 38, 39, 61, 62, 63, 72, 73, 85]
reason = "Canberra 0, 1 or 2: the 1950 analysis rejects any hit (25), the 1943 narrative says one or two (23, 24) and the Australian navy's history two (163). Chicago 1 (38, 39). Vincennes 1, 2 or 3 (61, 62, 63). Quincy 2 or 3 (72, 73). Astoria 0 (85). Low end 0 + 1 + 1 + 2, high end 2 + 1 + 3 + 3."

[[measure]]
id = "torpedo_hits_on_japanese_ships"
counts = "Torpedo hits on the eight Japanese ships"
record_low = 0
record_high = 0
judged = true
take = "hits_on"
ships = [1, 2, 3, 4, 5, 6, 7, 8]
weapons = ["torpedo"]
rows = [779, 780, 781, 782, 783, 784, 785, 786, 787, 132]
reason = "No row has a torpedo hit on any of them. The 1950 analysis's summary of Japanese damage has Chokai, Aoba and Kinugasa slightly damaged (779, 780, 781) and Yubari and Tenryu slightly damaged (782, 783), Yubari with only scratches from a destroyer's light fire (784); Furutaka and Yunagi are not among the damaged (785, 786, 787) and Kako took no hit (132). None is a statement about torpedoes: the architect reads slight damage and none as no torpedo hit, since a torpedo does not leave a cruiser slightly damaged. At the baseline Allied torpedoes hit about three times a run, and the ships they stopped were caught by day in fights the record does not have."

# ---------------------------------------------------------- hits a round
#
# Hits for each thousand shells fired, by side. A count of hits follows how
# long a force fires; this does not. It is the measure that experience at
# night (step 2 spec, "Experience") is tested on. Each end of a range is a
# division of two recorded figures, rounded down, and the division is the
# architect's.

[[measure]]
id = "japanese_gun_hits_per_thousand_shells"
counts = "Gun hits scored by the Japanese force for each 1,000 gun shots it fires, all calibres, rounded down"
record_low = 81
record_high = 117
judged = true
take = "hits_per_thousand_shots"
side = "japanese"
weapon = "gun"
rows = [7, 19, 37, 50, 58, 69, 83, 60, 71, 82, 9]
reason = "Shells fired: 1,867 (7). Hits: 153 to 219 on the nine Allied ships, as in gun_hits_on_allied_ships (low end 19, 37, 50, 58, 69, 83; high end 60, 71, 82). 153 in 1,867 is 81 a thousand and 219 is 117. The 1950 analysis's own estimate is about 12 in 100 (9). The shells counted include the few fired at Ralph Talbot, who is outside the scenario. The record is hits of every calibre over shells of every calibre; a run is main battery hits over main battery shots. The two are set side by side on the assumption that the secondary guns shot about as well as the main, which no row tests."

[[measure]]
id = "allied_gun_hits_per_thousand_shells"
counts = "Gun hits scored by the two Allied groups for each 1,000 gun shots they fire, all calibres, rounded down"
record_low = 21
record_high = 36
judged = true
take = "hits_per_thousand_shots"
side = "allied"
weapon = "gun"
rows = [10, 11, 115, 125, 141, 156, 151]
reason = "Shells fired: 471 (10). Hits: 10 to 17 on the eight Japanese ships, as in gun_hits_on_japanese_ships (low end 11; high end 115, 125, 141, 156, 151). 10 in 471 is 21 a thousand and 17 is 36. The shells counted include Ralph Talbot's 12, outside the scenario. As with the Japanese rate, the record is of every calibre and a run is of the main battery only."

# ---------------------------------------------------------- shells fired
#
# Main battery only. A ship in the rules fires its main guns and nothing
# else (chapter 4: shots are the rate times the main guns), so the record
# set beside it is the main battery's: eight-inch for a heavy cruiser,
# 5.5-inch for Tenryu and Yubari, five-inch for a destroyer. A cruiser's
# five-inch and 4.7-inch secondary guns, about a third of the Japanese
# shells that night, have no counterpart in the rules; that gap is named in
# the step 2 spec and is not hidden in these measures.
#
# Until decision 0070 these five measures counted every calibre, under ids
# that said "gun_shells" where these say "main_battery_shells". Those ids
# are retired: japanese_, allied_, southern_group_, northern_group_ and
# tenryu_and_yubari_ followed by gun_shells_fired_in_hundreds.

[[measure]]
id = "japanese_main_battery_shells_fired_in_hundreds"
counts = "Main battery shots the Japanese force fires in the run, in hundreds, rounded down"
record_low = 10
record_high = 11
judged = true
take = "shots_in_hundreds"
side = "japanese"
weapon = "gun"
rows = [1, 2, 3]
reason = "Eight-inch: 1,014 as the 1950 analysis states the total (1) or 914 as its five ship figures add up (2); the two rows dispute each other and give the two ends. 5.5-inch, the main battery of Tenryu and Yubari: 176 (3). So 1,090 to 1,190, which is 10 or 11 hundreds. Yunagi's main battery has no row and adds nothing here. The figures include the few shells fired at Ralph Talbot, outside the scenario. The derivation of rates of fire (decision 0070) reads Chokai's and Kako's figures as two of its cases, so for the heavy cruisers this is not an independent check; the measure of Tenryu and Yubari is."

[[measure]]
id = "allied_main_battery_shells_fired_in_hundreds"
counts = "Main battery shots the two Allied groups fire in the run, in hundreds, rounded down"
record_low = 3
record_high = 3
judged = true
take = "shots_in_hundreds"
side = "allied"
weapon = "gun"
rows = [12, 53, 54, 94, 97]
reason = "Eight-inch from the five cruisers: 107 (12). Five-inch from the destroyers of the two groups, whose main battery it is: Wilson 212 (97), Patterson 33 or 50 (53, 54, which dispute each other), Helm one salvo of four at no visible target (94), Bagley none. So 352 to 373, which is 3 hundreds at either end. Ralph Talbot's 12 are outside the scenario. At the first baseline the Allied groups fired about 2,800 a run; hits for each thousand shells agreed all the same, and hid it. This measure is here so that cannot hide again."

[[measure]]
id = "southern_group_main_battery_shells_fired_in_hundreds"
counts = "Main battery shots the four ships of the southern group fire in the run, in hundreds, rounded down"
record_low = 0
record_high = 0
judged = true
take = "shots_in_hundreds"
ships = [9, 10, 11, 12]
weapon = "gun"
rows = [27, 41, 48, 53, 54]
reason = "Canberra fired no eight-inch shell (27, disputed: the other reading is that one gun may have fired one salvo) and Chicago none (41). Bagley fired no gun at the enemy (48). Patterson fired 33 or 50 five-inch (53, 54). That is 33 to 50 shells, or a few more by the other reading of Canberra: under a hundred by any of them. It is the measure decision 0068 is checked on: a group that was not at battle readiness and barely fired."

[[measure]]
id = "northern_group_main_battery_shells_fired_in_hundreds"
counts = "Main battery shots the five ships of the northern group fire in the run, in hundreds, rounded down"
record_low = 3
record_high = 3
judged = true
take = "shots_in_hundreds"
ships = [13, 14, 15, 16, 17]
weapon = "gun"
rows = [64, 74, 86, 94, 97]
reason = "Eight-inch: Vincennes about 33 (64), Quincy 21 (74), Astoria about 53 (86), 107 together. Five-inch from the two destroyers: Wilson 212 (97) and Helm's one salvo of four (94). That is 319 to 323, which is 3 hundreds. Two shells in three are one destroyer's, Wilson, who was not a target."

[[measure]]
id = "tenryu_and_yubari_main_battery_shells_fired_in_hundreds"
counts = "Main battery shots Tenryu and Yubari fire in the run, in hundreds, rounded down"
record_low = 1
record_high = 1
judged = true
take = "shots_in_hundreds"
ships = [6, 7]
weapon = "gun"
rows = [3, 148, 154]
reason = "Tenryu 80 and Yubari 96 of 5.5 inch (148, 154; 176 together, as row 3 has it), which is 1 hundred. Tenryu's 23 three-inch are not main battery. Yunagi is left out: no row gives what she fired. These two were at battle readiness, so no rule of readiness reads their count, and no case in the derivation of rates of fire is theirs: this is the independent check of the rates (step 2 spec, 'Tuning', 6)."

# ------------------------------------------------------- how long it ran

[[measure]]
id = "minutes_of_action"
counts = "Minutes of surface fighting in the run: the rounds each fight ran, summed, times the minutes a round stands for"
record_low = 20
record_high = 30
judged = true
take = "minutes_of_action"
rows = [14, 15, 16]
reason = "Half an hour from the enemy's appearing round Savo until he ceased fire (14, 15); twenty minutes by Quincy's report (16). It is the measure for when a force breaks off, the last mechanism in the order of tuning. Judged since the batch file gives the rounds each fight ran, whatever ended it (decision 0062). A round in which a force slips away and no shot is fired is counted. Fights by day are counted too: the record has none, so a run that has one runs longer than the night did, and that is a true miss. A round is five minutes on the frozen figures, so the measure moves in fives."

[[measure]]
id = "surface_fights_by_day"
counts = "Surface fights in the run that are not in a night pulse"
record_low = 0
record_high = 0
judged = true
take = "fights_by_day"
rows = [14, 15]
reason = "The whole action lay in the half hour from the enemy's appearing round Savo until he ceased fire and passed out to sea, between 01:45 and 02:15 (14, 15). No ship of either side was caught after dawn. At the baseline, fights by day with Japanese ships that had fallen behind cost the Allied groups about 550 shells a run; this measure is how often that happens."

# --------------------------------------------------------------- claims

[[measure]]
id = "japanese_ships_claimed_sunk_per_hundred_sunk"
counts = "Ships the Japanese side claims sunk, for each 100 Allied ships really sunk"
record_low = 350
record_high = 350
judged = false
take = "claims_per_hundred"
side = "japanese"
claim = "sunk"
ships = [9, 10, 11, 12, 13, 14, 15, 16, 17]
rows = [745, 761, 762, 763, 764]
reason = "The cruiser force claimed 14 ships sunk (745) and sank 4 (761, 762, 763, 764). Not judged: the claim was of more ships than were there to fire at. The rules claim a ship that sank and a ship left burning (decision 0014, 16), so with nine Allied ships in the scenario and four sunk they cannot pass 225."

[[measure]]
id = "allied_ships_claimed_sunk"
counts = "Japanese ships the Allied side claims sunk"
record_low = 0
record_high = 0
judged = true
take = "claims"
side = "allied"
claim = "sunk"
rows = [749, 751]
reason = "The Allies knew they had done some damage and claimed no ship sunk (749, 751)."
