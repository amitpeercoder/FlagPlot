[[passage]]
id = "japanese_2nd_destroyer_squadron_noon_27_to_noon_28_october"
facts = "data/oob/passages.csv"
counts = "Minutes to steam from 6-14.5 S 165-53 E to 1-23.5 S 161-47 E, at 18 knots, 14 knots from 21:40 while refuelling, and 18 knots again from 09:00"
from_lat = "-6.2417"
from_lon = "165.8833"
to_lat = "-1.3917"
to_lon = "161.7833"
speed_kn = 18
speed_changes = [[580, 14], [1260, 18]]
record_low = 1440
record_high = 1440
judged = false
rows = [100]
reason = "The squadron's own diary: noon positions a day apart, and every hour between accounted for (100). At 12:00 on 27 October the force turned to 320 degrees at 18 knots; at 21:40 it began refuelling from an oiler at 14 knots; at 09:00 on the 28th it went back to 18 knots and began to zigzag. Those speeds over those hours come to about 387 miles, and the two positions are 381 apart, so the record agrees with itself to within two in a hundred. It is the longest run in the record that lies on the map with a speed for every hour, and the best check there is of the miles a ship is charged. Not judged: a position is taken to be at the centre of its hex, up to 23 miles off at each end, which at these speeds is over an hour and a half each, as much as the error the rule was made to remove."

