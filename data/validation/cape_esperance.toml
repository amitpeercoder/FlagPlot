# Measures for Cape Esperance, 11 to 12 October 1942 (step 2 spec,
# "Measures"). The format and its rules are in README.md beside this file.
#
# This battle is the check on the surface figures: they are tuned on Savo
# Island and never on this (step 2 spec, "Tuning"). Here the other side had
# the radar and the surprise.
#
# Changed on 2026-11-13 by the coordinating architect: the `scenario` key and
# each measure's `take` were added, before any batch of this scenario had been
# made. No record, row, range, reason or judged flag changed.
#
# Scope, the scenario's (decision 0072): the night action only. US Task
# Force 64, nine ships (San Francisco, Boise, Salt Lake City, Helena;
# Farenholt, Duncan, Laffey,
# Buchanan, McCalla) against the Japanese bombardment force, five ships
# (Aoba, Furutaka, Kinugasa; Fubuki, Hatsuyuki). Outside it: the
# reinforcement group that was landing troops, and the two destroyers,
# Murakumo and Natsugumo, sunk by aircraft the next day.
#
# The ranges were settled by the architect of the spec session on
# 2026-11-12. No row's standing was changed.
#
# Changed on 2026-11-13 by the coordinating architect, before the check is
# run (decision 0084, finding 14): the hits on the Japanese cruisers are
# measured ship by ship. gun_hits_on_japanese_cruisers (130 to 134) is
# retired: it added Aoba's 40 and Furutaka's 90, and neither is a count.
# Every figure for them is a historian's with no counter named, and no
# Japanese survey or crew count exists. Furutaka's rows give lower bounds
# only, so no range can be written for her and her measure is reported;
# a total that holds her cannot be judged either.
#
# Changed on 2026-11-13 by the coordinating architect (decision 0089, ruling
# 5): the reason of gun_hits_on_aoba is reworded. Only one statement says 40;
# the other two bound it from either side and disagree with each other. No
# record, row, range or judged flag changed.

battle = "cape-esperance"
scenario = "data/scenarios/17_cape_esperance.toml"
facts = "data/oob/engagement_outcomes.csv"

# ---------------------------------------------------------------- ships

[[measure]]
id = "japanese_ships_sunk"
counts = "Japanese ships sunk at the end of the run, of the five"
record_low = 2
record_high = 2
judged = true
take = "ships_sunk"
ships = [1, 2, 3, 4, 5]
rows = [1506, 1507, 1544, 1546, 1661, 1662]
reason = "Furutaka and Fubuki, by the force's own report (1506, 1507), the tabular records (1544, 1546) and the US narrative as revised (1661, 1662)."

[[measure]]
id = "japanese_ships_with_propulsion_out"
counts = "Japanese ships afloat at the end of the run with propulsion out"
record_low = 0
record_high = 0
judged = true
take = "ships_with_system_out"
ships = [1, 2, 3, 4, 5]
system = "propulsion"
rows = [1508, 1547, 1514]
reason = "Aoba was heavily damaged and steamed to the Shortlands under her own power (1508, 1547). Kinugasa reported no damage (1514)."

[[measure]]
id = "us_cruisers_sunk"
counts = "US cruisers sunk at the end of the run, of the four"
record_low = 0
record_high = 0
judged = true
take = "ships_sunk"
ships = [9, 10, 11, 12]
rows = [1526, 1529, 1536, 1538]
reason = "Boise and Salt Lake City were damaged and stayed afloat (1526, 1529). San Francisco and Helena are in no list of ships damaged (1536, 1538)."

[[measure]]
id = "us_destroyers_sunk"
counts = "US destroyers sunk at the end of the run, of the five"
record_low = 1
record_high = 1
judged = true
take = "ships_sunk"
ships = [6, 7, 8, 13, 14]
rows = [1532, 1533, 1534, 1530]
reason = "Duncan, abandoned on fire; she sank by two accounts (1532, 1534) and was sunk by her own side by a third (1533). Lost either way. Farenholt was damaged and reached port (1530)."

# ----------------------------------------------------------------- hits

[[measure]]
id = "gun_hits_on_aoba"
counts = "Gun hits on Aoba, all calibres"
record_low = 40
record_high = 40
judged = true
take = "hits_on"
ships = [1]
weapons = ["gun"]
rows = [1598, 4034, 1599]
reason = "One statement of 40, a flat '40 hits' in the Australian official history (4034), bounded from both sides by two others that disagree with each other: 'up to forty' (1598) and 'over 40' (1599). None is from a count: no counter is named in any, and no Japanese survey or crew count exists. 'Up to' bounds nothing below and 'over' nothing above, so this is a weak record, judged on the one statement that gives 40 (decision 0089, ruling 5). Outside research has looked for a bounded source; if a row arrives before the check is run the record changes, and it does not change after the run (decision 0084, finding 14). Many of her hits were duds by one lead (1695), so the count is not a measure of damage."

[[measure]]
id = "gun_hits_on_furutaka"
counts = "Gun hits on Furutaka, all calibres"
record_low = 90
record_high = 90
judged = false
take = "hits_on"
ships = [2]
weapons = ["gun"]
rows = [1600, 1601, 1602, 4035]
reason = "'About 90' (1600), 'over 90' (1601), 'more than 90 above the waterline alone' (1602) and 'over 90 times' (4035, likely repeating 1601): lower bounds only, perhaps one count repeated, with no counter named. No row bounds the figure above, so no range can be written; 90 is the floor they share. Not judged for that reason (decision 0084, finding 14). Reported, so the size of the run's figure stays in view."

[[measure]]
id = "gun_hits_on_kinugasa"
counts = "Gun hits on Kinugasa, all calibres"
record_low = 0
record_high = 4
judged = true
take = "hits_on"
ships = [3]
weapons = ["gun"]
rows = [1605, 4036, 1686, 1687, 1688]
reason = "Four by a reference site's tabular record (1605) and a tertiary site with no references that gives the same 4 (4036). None by her division's report, which says twice that she received no enemy fire (1686, 1687), and by her own battle flash, 'no damage' (1688). The rows dispute each other, so by this file's rule the range spans them: 0 to 4."

[[measure]]
id = "gun_hits_on_us_ships"
counts = "Gun hits on the nine US ships, all calibres"
record_low = 15
record_high = 29
judged = false
take = "hits_on"
ships = [6, 7, 8, 9, 10, 11, 12, 13, 14]
weapons = ["gun"]
rows = [1587, 1588, 1590, 1591, 1594, 1593, 1597, 1596]
reason = "Low end: Boise 6 (1587), Salt Lake City 2 (1590), Farenholt 3 (1594), Duncan 4 (1597). High end: Boise 8 (1588), Salt Lake City 3 (1591), Farenholt 4 (1593), Duncan 14 (1596). Not judged: several of the hits on Duncan and Farenholt came from their own cruisers, and no row says how many. The rules have no fire on a friend, so this record is a ceiling for hits by Japanese guns."

[[measure]]
id = "torpedo_hits_on_japanese_ships"
counts = "Torpedo hits on the five Japanese ships"
record_low = 0
record_high = 1
judged = true
take = "hits_on"
ships = [1, 2, 3, 4, 5]
weapons = ["torpedo"]
rows = [1603, 1604]
reason = "One on Furutaka by the tabular record and an encyclopedia (1603, 1604), both disputed: the Japanese account of her damage has none."

# --------------------------------------------------------------- claims

[[measure]]
id = "japanese_ships_claimed_sunk_per_hundred_sunk"
counts = "Ships the Japanese side claims sunk, for each 100 US ships really sunk"
record_low = 200
record_high = 300
judged = true
take = "claims_per_hundred"
side = "japanese"
claim = "sunk"
ships = [6, 7, 8, 9, 10, 11, 12, 13, 14]
rows = [1524, 1522, 1532]
reason = "The force's first signal claimed 2 sunk (1524) and its action report 3 (1522). One was: Duncan (1532)."

[[measure]]
id = "us_ships_claimed_sunk_per_hundred_sunk"
counts = "Ships the US side claims sunk, for each 100 Japanese ships really sunk"
record_low = 400
record_high = 750
judged = false
take = "claims_per_hundred"
side = "allied"
claim = "sunk"
ships = [1, 2, 3, 4, 5]
rows = [1656, 1655, 1657, 1506, 1507]
reason = "The ships' own reports add to 15 (1655); a conference of their captains cut that to 8 (1656) and the fleet commander made it 9 (1657). Two were sunk (1506, 1507). Low end 8 in 2, high end 15 in 2. Not judged: more ships were claimed than the five the scenario would hold, as with the Japanese claim at Savo Island."

# No measure of hits for each thousand shells, the one experience is tested
# on at Savo Island, and there will not be one. Checked again by decision
# 0084 before the run, against the rows as they stand. The US main battery
# shells are on record for Salt Lake City (296: 1636, 1704) and Helena (580
# or 560: 2980, 3001), with Boise's 5-inch and 6-inch together as "more
# than 1,000" from the press (1715) and McCalla's 390 (1641); none for San
# Francisco, Farenholt, Duncan, Laffey or Buchanan, and the hits on the
# Japanese ships are the whole force's. The Japanese cruisers' main
# batteries fired 7, 20 or 36, and 80 (2276 to 2282; 1648 to 1653, 1700),
# the destroyers' are not known (2283), and the hits on US ships include an
# uncounted share from their own side. So neither side has both its shells
# and its hits on record. The rates of fire derived from Salt Lake City and
# Helena here are cases of decision 0070, so they could not check it either.
#
# So experience is checked here by hits received on each side, the two
# measures above, and by ships sunk. Those count what a side did and not how
# well it shot for the rounds it fired: a force that fires longer scores
# more. It is a blunter test than Savo Island's, and it is the only one on
# a battle the figures were not fitted to.
