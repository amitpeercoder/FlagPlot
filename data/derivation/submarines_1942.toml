# ------------------------------------------------- the count of hits (rule 30)
# Counted by the stage 1 lead on Nov 22, 2026, from engagement_events.csv (ev)
# and engagement_outcomes.csv (out). It sets no figure. Choices: the aimed ship
# only (strays listed apart); a torpedo that left no tube is not counted; a
# disputed count is a range; a dud that struck is a miss (rule 8); a salvo with
# no stated count of torpedoes or of hits is listed and not counted. "Stated":
# a row of the salvo names the weapon. "Class row": the boat's class row names
# it. "Estimated": taken by rule 29 from the boats of her group or the group
# nearest in date (this list's torpedo_from), or, for I-11's class, left out
# here, not counted.
#
# The six Japanese salvoes at warships, January to September 1942:
#   Type 89, stated   I-6 at Saratoga, 11 Jan: 3 fired, 1 hit (ev 16050)
#   Type 89, class row I-168 at Yorktown, 6 Jun: 4 fired, 1 to 2 hits on
#                     Yorktown (ev 16053, 8035, 8037; out 9366); Hammann's 1 or
#                     2 are strays (class row 16225, by exception)
#   Type 89, estimated I-121 at Task Force 16, 22 Aug: 1 seen, the count not
#                     printed; 0 hits (ev 16023); her class's torpedo_from,
#                     I-123's Type 89 (ev 16429)
#   Type 95, stated   I-19 at Wasp, 15 Sep: 6 fired, 2 to 3 hits on Wasp
#                     (ev 3002; out 871, 872); North Carolina and O'Brien 1
#                     each, strays. BuShips judged the warhead near a Type 89's
#                     (out 16072)
#   Type 95, estimated I-26 at Saratoga, 31 Aug: 6 fired (one broached), 1 hit
#                     (ev 16010, 16011); her own rows are a Type 95 loaded in
#                     January and a Type 89 fired in June (ev 16428, 16435)
#   not counted       I-11 at Hornet, 6 Sep: 4 fired, 0 hits (ev 16017); her
#                     class's rows name both Type 89 and Type 95 (16215, 16216)
#   Totals: Type 89, 7 or 8 fired, 2 to 3 hits (stated 3 and 1); Type 95, 12
#   fired, 3 to 4 hits (stated 6 and 2 to 3).
# Later in 1942, on file: I-176 at a column she took for a battleship, 20 Oct,
# 6 fired, Chester hit once, the aimed ship not stated (ev 3019, 3020; Type 95
# estimated); I-26 at San Francisco and Juneau, 13 Nov, 3 fired and 3 fired, or
# one salvo of 3, Juneau hit once (ev 3029, 3031; Type 95 estimated).
# Japanese salvoes at merchant ships, weapon stated: Type 89, I-7 2 fired 1 hit
# (ev 16430), I-26 1 fired 1 hit (ev 16435), I-123 4 fired hits not stated
# (ev 16429), I-3 count not stated 1 hit (ev 16432); Type 95, I-21 2 fired 2
# hits and 2 fired 0, both premature (ev 16433, 16434); Type 96, I-4 2 fired
# hits not stated (ev 16431); 6th Year Type, RO-61 at Casco 3 fired 1 hit
# (ev 16057). RO-33 at Malaita, count not stated, 1 hit (ev 16055; Type 95 by
# class row).
#
# The Mark 10 (S-boats; the weapon stated by the salvo's row or by the S-boat
# class rows 16180 to 16183):
#   S-42 at Okinoshima, 11 May: 4 fired, 2 to 3 hits (ev 16104, 16107 stated)
#   S-44 at Kako, 10 Aug: 4 fired, 3 to 4 hits (ev 16126, 16127, 16130 stated)
#   S-44 at Shoei Maru, 12 May: 4 fired, 2 hits (ev 16108, 16112)
#   S-38 at Meiyo Maru, 8 Aug: 2 fired, 2 hits (ev 16123)
#   S-44 at a ship, 8 May: 2 fired, 0 hits (ev 16109)
#   not counted: S-42, 3 May (count not stated, missed, ev 16103); S-37, 2 Sep
#   (count not stated, 1 hit, ev 16150); S-47, 2 May and 12 Sep (ev 16161,
#   16164); S-41, 7 Aug (ev 16151)
#   Totals: 16 fired, 9 to 11 hits; at warships (Okinoshima, Kako) 8 fired, 5
#   to 7 hits.
#
# The Mark 14 (fleet boats; the weapon estimated by rule 29 for every salvo,
# no salvo's row naming it):
#   Nautilus at a battleship, 4 Jun 0825: 1 fired (the second tube failed), 0
#   (ev 16063, 16078, 16086; out 16108, 16112)
#   Nautilus at Arashi, 4 Jun 0910: 1 fired, 0 (ev 8044, 16066)
#   Nautilus at a carrier, 4 Jun 1359: 3 fired (a fourth would not leave its
#   tube), 0 to 3 hits: her claim 3, Bates 2 or 3, survivors 1 dud (ev 16072,
#   16084, 8045 to 8047; out 16109)
#   Grouper at a destroyer, 4 Jun: 2 fired, one at a time, 0 (ev 16090)
#   Flying Fish at a battleship, 28 Aug: 4 fired, 0 to 2 hits heard by sound
#   (ev 16137)
#   Trout at a light carrier, 28 Sep: 5 fired, 0 to 2 explosions heard
#   (ev 16145, 16136)
#   Amberjack at a cruiser, 30 Sep: 6 fired, 0 (ev 16149)
#   Amberjack at a transport, 18 Sep: 4 fired, 0 (ev 16147)
#   not counted: Flying Fish at a destroyer, 28 Aug (count not stated, ev
#   16140), at patrol vessels 2 Sep (hits that did not explode, no count, ev
#   16141) and 4 Sep (2 fired, sank her, hits not stated, ev 16142)
#   Totals: 26 fired, 0 to 7 hits; at warships 22 fired, 0 to 7 hits.
