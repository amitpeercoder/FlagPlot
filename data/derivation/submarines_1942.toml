reason = "No row names the torpedo of the Narwhal class. The fleet type's row 16184 (NavWeaps) gives the Mark 14 as the standard submarine torpedo of the war, of US submarines generally, as for the Sargo class. The tubes pamphlet's row 16185 covers SS-198 and higher, so not Narwhal (SS-167), and is not cited. Rowland and Boyd's Mark 10 for the fleet type (row 16186) is a reserve weapon by its own words and stays set aside. Settled by the architect, Nov 22, 2026 (decision 0218, stage 1)"

