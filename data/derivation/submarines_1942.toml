# The passage speeds of the S-boats and Narwhal, estimated by ratio (decision
# 0207, rule 5, the first method): her max_speed_kn times the mean, over every
# like class, of a like class's endurance_speed_kn over its max_speed_kn. The
# like classes are every class of the type submarine on file with class rows
# of both, found by the tool (rule 6). The Gato class's top speed is read as 20
# knots by the architect's ruling, which lets the estimate be worked.
[[estimate]]
class = "us-s-boat-s-1-group"
attribute = "endurance_speed_kn"
method = "ratio"
from = "max_speed_kn"
by = "the architect"
date = "2026-11-22"
reason = "No source read gives the S-boats a range with its speed (gaps.csv), and a boat without a passage speed cannot be put in a scenario. Her top speed, 14.5 knots (DANFS), is on file, and eight classes of the type submarine have both rows. Settled by the architect, Nov 22, 2026 (decision 0218, stage 1)"

[[estimate]]
class = "us-s-boat-s-42-group"
attribute = "endurance_speed_kn"
method = "ratio"
from = "max_speed_kn"
by = "the architect"
date = "2026-11-22"
reason = "No source read gives the S-boats a range with its speed (gaps.csv). Her top speed, 14.5 knots (DANFS), is on file, and eight classes of the type submarine have both rows. Settled by the architect, Nov 22, 2026 (decision 0218, stage 1)"

[[estimate]]
class = "us-narwhal-class"
attribute = "endurance_speed_kn"
method = "ratio"
from = "max_speed_kn"
by = "the architect"
date = "2026-11-22"
reason = "Her ranges on file give no speed (rows 16145, 16149; gaps.csv). Her top speed, 17.4 knots (DANFS), is on file, and eight classes of the type submarine have both rows. Settled by the architect, Nov 22, 2026 (decision 0218, stage 1)"

