# Experience values for ships (decision 0064). A value is a whole number 0
# to 4 that starts at 2; each of four yes or no questions a fact row answers
# moves it by 1, once. The questions were fixed by the architect on Nov 12,
# 2026, before any batch with the rule on existed, and a value changes only
# when a fact row changes, never to improve a report. The thresholds below
# are measured to the engagement's first day (engagements.csv, date_from).
#
# 1. night_practice_recent, up 1: a preferred row of medium or high
#    confidence, naming the ship, says she fired or exercised at night, dated
#    inside the three months that end on that day. "Night training" is
#    exercising at night. An undated "recently" answers nothing. A statement
#    about a force or a squadron answers for a ship only if a row names her
#    as part of it at that time.
# 2. no_night_practice, down 1: such a row says she held no night practice
#    over a period that reaches into the twelve months that end on that day,
#    and no preferred row says she held one in them. A statement about
#    "practically none of the ships" of a force names no ship and answers
#    nothing.
# 3. new_ship, down 1: her commissioned date is later than that day less
#    twelve months (strictly). Where every commissioning row is disputed, the
#    question is answered if every row, whatever its standing, gives the same
#    answer; otherwise it is a problem to settle.
# 4. navy_night_first, up 1: the rows below say a navy's fleet training put
#    night action first, for the kinds of ship named. A nation with no row
#    here is not answered "no": nothing moves.
#
# Rows that are not preferred never move a value; the output lists them as
# not read.
[experience]
recent_months = 3
lookback_months = 12
new_ship_months = 12

# Japan: training_facts.csv row 32 (Bates 1950, from Japanese officials and
# records): "The Japanese had placed great stress in their fleet training on
# night attack procedures". It is a statement about a navy and not about a
# ship, and several statements about the Japanese were written after the
# battle by the side that lost it. Decision 0064 (item 5) requires a SECOND
# source before the values are fixed.
#
# The second source is row 87, Vice Admiral Ozawa to the Strategic Bombing
# Survey, 1945: "we stressed training on that type of battle from before the
# war". It is Japanese testimony independent of the 1950 analysis behind row
# 32. Settled by the architect on Nov 12, 2026: a second source is a row of
# the navy's entity (row 87 is of `ijn-surface-fleet`, the navy's whole
# surface fleet, which includes its cruisers and destroyers), from a
# different source than the first row, read at the page, whose standing is
# not `disputed`; it need not be preferred, and row 87 is `unconfirmed`,
# being one witness. Its limits: it is about the navy as a whole, names no
# ship or date, and the question put to him assumed the emphasis.
# `second_source` empty would mark every Japanese value PROVISIONAL.
[[experience.navy]]
nation = "jp"
entity = "ijn-cruiser-destroyer-crews"
rows = [32]
kinds = ["heavy_cruiser", "light_cruiser", "destroyer"]
second_source = [87]
second_source_entity = "ijn-surface-fleet"

# A statement about a force or a squadron may answer question 1 for a ship
# (decision 0064, "As built"), with `named_by` in an `[[experience.answer]]`:
# the row or rows that name her as part of the force at that time. The rule,
# from pull request 137: "a statement about a force or a squadron answers for
# a ship only if a row names her as part of it at that time". Settled by the
# architect on Nov 12, 2026: "at that time" means a row puts her with that
# force during the period the statement is dated to; a list of the squadron on
# one day does not by itself show that, as the rows' own note says, so an
# answer names that list and a row that puts her with the force, together.
#
# The attributes that are allowed, checked by the tool:
# - `statement`: the row of the statement: a `night_practice_note` row in
#   ship_facts.csv (of any ship in the force) or a `night_training_note` row
#   in training_facts.csv.
# - `named_by`: rows of the ship herself that name her as part of the force or
#   say where she was: her `time_in_theatre_note` rows, and her
#   `night_practice_note` rows.
# The statement row is preferred, of medium or high confidence, and dated
# inside the window. A `named_by` row is of that ship, of medium or high
# confidence, dated so that it puts her with the force inside the statement's
# period, and preferred; where her rows about where she was are disputed, the
# answer may name them if it names EVERY disputed row of hers that bears on
# the period, and the tool checks that each is dated inside it. The tool reads
# the dates, not what a row says: that a row puts her with the force, and that
# disputed rows agree, is the architect's reading, written in the answer.
[experience.force]
statement = ["ship_facts.csv:night_practice_note", "training_facts.csv:night_training_note"]
named_by = ["ship_facts.csv:time_in_theatre_note", "ship_facts.csv:night_practice_note"]

# Rates of fire as achieved (decision 0070). A class's `gun_rounds_per_min` is
# the lesser of its sourced rate and the achieved rate of its kind of battery;
# the achieved rate of a kind is the median of the cases below. Each case is
# a ship for which rows state the shells one battery fired and a span of
# firing of `min_span_minutes` or more; the case is the written exception
# (decision 0020, item 3) that lets the tool read its rows, whatever their
# standing. Kinds: "salvo" (main battery of cruisers and larger, the default
# for a cruiser or battleship class), "destroyer", and "continuous" (only a
# class named in a `continuous` entry, with the rows that say it fired so).
# Everything about decision 0070 is in this one block.
[fire_rate]
min_span_minutes = 5

[[fire_rate.case]]
kind = "salvo"
ship = "chokai"
class = "jp-takao-class"
engagement = "savo-island"
shells_row = 3131
span_row = 3132
reason = "Her own report: 302 shells of the main battery, over 20 minutes from opening gunfire to the end, fire held between targets."
agreed = "2026-11-13"

[[fire_rate.case]]
kind = "salvo"
ship = "kako"
class = "jp-furutaka-class"
engagement = "savo-island"
shells_row = 3138
span_row = 3140
reason = "Her own report: 192 armour-piercing 20 cm shells, fired over thirty minutes; 30 minutes is a lower bound of the span, so the rate is an upper bound."
