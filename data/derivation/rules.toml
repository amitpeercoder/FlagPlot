# How game figures for real ships are derived from the facts in data/oob.
# See docs/decisions/0020-figures-from-facts.md.
#
# The three constants below are MODEL PARAMETERS and PLACEHOLDERS. They are
# not historical figures. They are the same for every ship, and step 2 tunes
# them against recorded outcomes. Everything else a real ship's figures rest
# on is a sourced fact.

constants_are_placeholders = true

# Gun damage = shell weight in kg / this.
gun_shell_kg_per_damage = 6

# Torpedo damage = warhead weight in kg x this.
torpedo_damage_per_warhead_kg = "0.4"

# Toughness = standard displacement in long tons / this.
displacement_lt_per_toughness = 25

# Exceptions to "read only preferred rows" (decision 0020, 3). Each names a
# class, ship or weapon, a fact, the row to read, the reason, and the date
# the designer agreed. These are the choices of the Savo Island settlement
# sheet (docs/research/oob/savo-island-settlement.md) that rest on weak
# sources only, and so cannot be preferred by the format's own rule. See
# docs/decisions/0023-savo-island-ships.md.

[[exception]]
entity = "us-bagley-class"
fact = "displacement_standard_lt"
row = 625
reason = "Settlement sheet b4: 1,624 tons. Every row for the class is low grade, so none can be preferred; two sources agree on this figure."
agreed = "2026-11-10"

