# The search radius of an aircraft type (decision 0075): a third of the range
# in the scouting condition, rounded down (the Bureau of Aeronautics' method).
# It is read only for the search range of a type; the strike radius is as
# decision 0029 has it. Where the exceptions below and the preference rules
# cannot settle a type's range, the type keeps its strike radius as its
# search radius and the run lists it as not settled. The exceptions below are
# read only for this; they do not widen any other reading. The PBY-5's and the
# PBY-5A's, the last two, are the Midway list's (decision 0200, 13 and 14):
# the PBY-5A's names a row of the Navy's sheet of 1943 and says `later = true`,
# so it reads that row only on a list dated before the row begins, and every
# figure it gives is marked as read from a row of a later date (decision
# 0200; the rule is in docs/research/oob/database-design.md, "Dates").
# divisor_of_scouting_range: sized from a source, the method of the Bureau of
# Aeronautics' sheets, which call the scouting radius a third of the range in
# that condition (decision 0075, "The source of the method"; the note on
# aircraft_type_facts 555).
[search_radius]
divisor_of_scouting_range = 3

