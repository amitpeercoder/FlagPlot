# How game figures for real ships are derived from the facts in data/oob.
# See docs/decisions/0020-figures-from-facts.md.
#
# The three constants below are MODEL PARAMETERS and PLACEHOLDERS. They are
# not historical figures. They are the same for every ship. At the close of
# step 2 none has moved: the round on what a hit does looked at two of them at
# Savo Island and found no source that sizes any
# (docs/validation/tuning/savo-island-closed.md). Each reaches the Savo Island
# and Eastern Solomons class files, and bomb and aircraft torpedo damage too.
# The note above each model parameter in this file says what it rests on;
# docs/validation/tuning/surface-and-search-figures-closed.md lists them all.
# Everything else a real ship's figures rest on is a sourced fact.

constants_are_placeholders = true

# Gun damage = shell weight in kg / this.
# Placeholder: set so real ships land near the placeholder cruiser (decision
# 0020). No row sizes it, and no round looked at it.
gun_shell_kg_per_damage = 6

# Torpedo damage = warhead weight in kg x this.
# Looked at and not moved: 0.25 was tried at Savo Island and took the northern
# group's sinkings further from the record (savo-island-closed.md). No row
# sizes it.
torpedo_damage_per_warhead_kg = "0.4"

# Toughness = standard displacement in long tons / this.
# Looked at and not moved: 35 tons a point was tried at Savo Island and took
# the northern group's sinkings further from the record
# (savo-island-closed.md). The rows support displacement as the measure, not
# the divisor.
displacement_lt_per_toughness = 25

# Constants of decision 0029, also MODEL PARAMETERS and PLACEHOLDERS, not
# history. They are read only by a list that asks for air figures or
# aircraft types.

# Anti-aircraft shots = heavy guns x this + light barrels x the next one,
# rounded down.
# Both placeholders (decision 0029, 1). No row sizes either, and no round
# looked at them; air round 5 looked at the guns' chance to hit instead. They
# reach the ships of the Eastern Solomons.
anti_aircraft_heavy_weight = "1"
anti_aircraft_light_weight = "0.25"

# Strike and search radius, where no sourced combat radius can be read =
# range with a normal load x this, rounded down.
# Placeholder (decision 0029, 6). No row sizes it; the Bureau of Aeronautics'
# third, which decision 0075 takes for the search radius, is of the range in
# the scouting condition, not with a normal load. It gives the strike radius
# of the D3A1, B5N2 and E13A1 at the Eastern Solomons and of the G4M1 at
# Rabaul against Guadalcanal.
strike_radius_fraction_of_range = "0.333333"

# Width of the strip an aircraft searches, in nautical miles. No source
# gives one.
# Placeholder (decision 0029, 10), and no round looked at it. Every derived
# type has it, so every air search at the Eastern Solomons and at Rabaul
# reads it.
search_sweep_width_nm = 20

