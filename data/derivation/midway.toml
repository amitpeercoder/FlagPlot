# The experience values of the ships of scenario 114 (decision 0064; decision
# 0198, rule 93; the questions and their thresholds are in rules.toml, under
# [experience]). The tool measures the windows to the engagement's first day
# in engagements.csv, 4 June 1942 for midway: the three months are 4 March to
# 4 June 1942 and a new ship is one commissioned after 4 June 1941. The ships
# are those of the scenario, so Gwin, Zuiho and Mikazuki (rules 85 and 87)
# are not here. Worden is not here either: her one commissioning row
# (ship_facts 202) is unconfirmed and gives a year only, so the question of a
# new ship cannot be answered for her, as for Farragut in the Coral Sea's
# list; she has the game's own value for a ship not answered. No answer is
# written by hand.
[experience]
engagement = "midway"
output = "../reference/ship_experience_midway.ships.csv"
ships = [
    "cv-6-enterprise", "cv-8-hornet",
