# The aircraft types, each with the load it attacks with (decision 0029, 7).
# A fighter attacks nothing on the surface. Their ids follow this order from
# 5100 (5100 to 5114); a type added later goes at the end so that none moves.

# VF-3, VF-6 and VF-8.
[[aircraft]]
type = "f4f-4"

# VMF-221's seven F4F-3.
[[aircraft]]
type = "f4f-3"

# VMF-221's twenty-one F2A-3 (rule 71).
[[aircraft]]
type = "f2a-3"

# VB-3, VS-5, VS-6, VB-8, VS-8 and part of VB-6. No radius of the type holds
# on 3 June: the Midway rows are launches of 4 June (550, about 155 miles to
# a target estimated) and 5 June (549, 278 miles, Hornet's report), different
# events, not a dispute. The Coral Sea list's reading is kept, so that the
# type has one radius in every list.
[[aircraft]]
type = "sbd-3"
load = "us-bomb-1000lb-gp"
combat_radius_row = 280
combat_radius_reason = "200 miles, the Eastern Solomons search and strike distance of 24 August 1942, which the Eastern Solomons and Coral Sea lists read, read for 3 June: the same aircraft with the same load. The Midway rows are a launch to a target estimated at about 155 miles on 4 June (550) and Hornet's launch at 278 miles on 5 June (549); neither is a stated radius, and neither holds on 3 June."

# VMSB-241's nineteen SBD-2 and part of VB-6 (rule 55).
[[aircraft]]
type = "sbd-2"
load = "us-bomb-1000lb-gp"
combat_radius_row = 12203
combat_radius_reason = "About 180 miles, the distance of the enemy carriers given to VMSB-241's sixteen SBD-2 and eleven SB2U-3 at about 0645 on 4 June 1942, which they flew and attacked (Bates, medium), read for 3 June. It is the 180 miles of Lexington's launch of 7 May (647), which the Coral Sea list reads."

# VMSB-241's seventeen SB2U-3 (rules 55 and 71). Its radius is the maker's
# stated 486 nm with a 1,000 lb bomb (aircraft type facts 12200, preferred),
# which the tool reads with no exception.
[[aircraft]]
type = "sb2u-3"
load = "us-bomb-500lb-gp"

# VT-3, VT-6 and VT-8.
[[aircraft]]
type = "tbd-1"
load = "us-torpedo-mk13"
combat_radius_row = 12210
combat_radius_reason = "About 175 miles, the combat radius of Task Force 16's torpedo planes that the Naval War College analysis names as the controlling factor on the morning of 4 June 1942 (Bates, medium), read for 3 June. It is a stated radius of the type on the day, before the 180 miles of Lexington's launch of 7 May (648), which the Coral Sea list reads."

# The Army's B-17E at Midway (rule 71).
[[aircraft]]
type = "b-17e"
load = "us-bomb-600lb-gp"

# The fighters, bombers and attack planes of the four carriers and Zuiho.
[[aircraft]]
type = "a6m2-21"

[[aircraft]]
type = "d3a1-11"
load = "jp-bomb-250kg"

[[aircraft]]
type = "b5n2"
load = "jp-torpedo-type91"

# Tone's and Chikuma's Type 0 floatplanes, which fly the Japanese search
# (rule 60).
[[aircraft]]
type = "e13a1"

# Zuiho's six A5M4 (rule 66, by the rule for disagreements: see the header).
[[aircraft]]
type = "a5m4"

# The sixteen PBY-5A of Midway (decision 0198, rules 57 and 77; decision 0200,
# 13): type 5113, with the torpedo of the night attack of 3 June.
[[aircraft]]
type = "pby-5a"
load = "us-torpedo-mk13"

# The fourteen PBY-5 of Midway (decision 0198, rules 57 and 76; decision 0200,
# 14): type 5114, attacking with nothing.
[[aircraft]]
type = "pby-5"

