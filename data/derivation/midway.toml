# The ships and aircraft of Midway, as of 3 June 1942, for scenario 114
# (decision 0198, rules 4 to 7, 35 to 37 as amended, and "Stage A: the
# architect's rulings", rules 50 to 72). The derivation tool turns this list
# into data/reference/ship_classes_midway.csv, aircraft_types_midway.csv and
# their sources and ships companions. Ships another list derives are derived
# again here for this date, with class ids of this list. The exceptions this
# list rests on are at the end of rules.toml, under "Decision 0198"; each
# names its row, its reason and the rule it rests on. Written on 2026-11-21 by
# the list's lead, for the architect to read before it merges.
#
# WHO IS HERE. Allied: Task Force 16 (Enterprise, Hornet, the cruiser and
# destroyer groups) and Task Force 17 (Yorktown, Portland, Astoria and the
# destroyer screen, Gwin with them). Japanese: the First Carrier Striking
# Force (the four carriers, the Supporting Group and the screen), the
# transports' close screen (Jintsu and Destroyer Divisions 15, 16 and 18), the
# Close Support Group (Cruiser Division 7 and Destroyer Division 8), and the
# Second Fleet's main body with Zuiho and Mikazuki (rules 35 and 66).
#
# WHO IS LEFT OUT, and why (each to be named in the scenario's header):
# - Natsushio, listed in Destroyer Division 15 by Bates (engagement_forces
#   5884): she was sunk on 8 February 1942 (ship_facts 9252).
# - The fuelling group of TF 16 (Cimarron, Platte, Dewey, Monssen), as the
#   Coral Sea's was (decision 0188, ruling 12), and the auxiliaries and
#   submarines (rule 6). The Main Body, the Aleutians forces and the seaplane
#   tender group (rules 6 and 35).
# - Patrol Boats 1, 2 and 34: no class on file (rule 64). The transports are
#   of the scenario's placeholder class (rules 7, 33 and 64), not here.
# - Aircraft: the B-26, the D4Y1-C and the E8N2 (rule 60). Nor is the TBF-1
#   of VT-8's detachment (see THE LOADS).
#
# SURFACE FIRE (rule 68) is modelled for the Second Fleet's main body (Atago,
# Chokai, Myoko, Haguro, Kongo, Hiei, Yura, Destroyer Divisions 2 and 9,
# Mikazuki) and the Close Support Group (the four Mogami class and Destroyer
# Division 8). Within them, the Mogami, Nagara (Yura) and Mutsuki (Mikazuki)
# classes are still blocked after the second pass and are in
# surface_weapons_not_modelled (rule 68): no row names the torpedo the Mogami
# class or Yura carried on 3 June (fits 14000 and 14001 state the Type 93 for
# Mogami on 1 March 1942 only, fits 14004 the Type 90 for the Nagara class in
# December 1941 only), and no row gives rounds per gun for the 14 cm/50 or the
# Mutsuki class's 12 cm/45. Every other ship (the carriers and their screens
# of both sides, rule 69, and the transports' close screen, which rule 68 does
# not name) is in surface_weapons_not_modelled, as at the Coral Sea; Jintsu's
# class (Sendai) is blocked on rounds besides.
#
# THE JAPANESE CARRIERS' AIRCRAFT (rules 73 and 74, which replace rules 50
# and 51), for the scenario, not for this list: combinedfleet's records of 27
# May (air_unit_facts 14200 to 14216, B), each carrier's own 18 fighters with
# the 6th Air Group's beside them. Akagi 24 fighters, 18 bombers, 18 attack
# planes; Kaga 27, 18 (her two spare bombers are not flown) and 27; Soryu 21,
# 16 (rule 74: two sources state 16 aboard; the 18 of row 12403 stays,
# disputed) and 18. Hiryu has no row in that source and keeps rule 50's rows,
# 18, 18 and 18, with the 6th's three fighters added: 21, 18 and 18. The
# 6th Air Group's fighters are in the fighters (rule 52). The sum is 93
# fighters, 70 bombers and 81 attack planes, 244 in all, beside the 234 of
# Bates (90, 72 and 72, air_unit_facts 5864 to 5867): 10 more, the difference
# left in sight (rule 53).
#
# ZUIHO'S AIR GROUP (rule 66), by the rule for disagreements: six A5M4, six
# A6M2 and twelve B5N2, combinedfleet's record of 29 May (air_unit_facts 14220
# to 14222, B), with which English Wikipedia (12452 to 12454) agrees, before
# Wikipedia's 12 and 12 (12458, 12459, C), Japanese Wikipedia's establishment
# of 6, 6 and 9 (12460 to 12462, C) and Pacific Wrecks' D3As (14223, 14224,
# C). So the A5M4 is derived here. The B5N2 is the order of battle's mark
# (12457); combinedfleet writes only B5N.
#
# THE LOADS each type attacks with (decision 0029, 7):
# - SBD-3, SBD-2: the 1,000 lb bomb. The SBD-2s of VMSB-241 carried 500 lb
#   bombs on 4 and 5 June (fits 12203 to 12205, Bates), rows dated those days
#   only, which the tool cannot read on 3 June; VB-6's SBD-2s are the carrier
#   aircraft the 1,000 lb rows describe (fits 6818, 1324).
# - SB2U-3: the 500 lb bomb, its maker's sheet (fits 6802), by the exception
#   for the bomb's weight.
# - B-17E: the 600 lb bomb, four each, the load of the attack of 3 June on the
#   transports (fits 6819, ONI, a row of the list's own day).
# - TBD-1: the Mark 13; D3A1: the 250 kg bomb; B5N2: the Type 91, as in the
#   Coral Sea list.
# - TBF-1, stopped and reported: its torpedo cannot be read on 3 June. Bates's
#   row (fits 12206) and the Eastern Solomons row (410) are dated their days
#   only, and the two undated rows (52, 409) are grade C and unconfirmed. An
#   exception for them is read by every list, and it changes the sources file
#   of the Eastern Solomons list (which reads row 410), which this list may not
#   do; a bomb load would not be what the detachment carried. Six aircraft.
#
# THE FLYING BOATS (decision 0198, rules 57, 58, 76 and 77; decision 0200, 13
# and 14), types 5113 and 5114 at the end of the list:
# - PBY-5A. Read from the Navy's sheet of 1 September 1943 by exceptions that
#   say `later = true` (decision 0200): its range (12000, in the search radius
#   block), armour (12003) and partly protected tanks (12004, read as no). Each
#   figure resting on one is marked in the sources file as read from a row of a
#   later date. Armour is the weakest reading of the list: when the PBY-5A was
#   fitted is a gap (gaps.csv). Her strike radius is the 434 nm flown on the
#   night of 3 June (12009), which holds and is preferred, and she attacks with
#   the Mark 13 torpedo of that night (fits 6822).
# - PBY-5. Read from her own rows by plain exceptions (rule 76): armour
#   12005, tanks 12006 (partial, so no), range 313 for the search radius and
#   range with bombs 314 for the strike radius. Both ranges are one low page
#   with no sources; the gap for a sheet of her own stays open. No row of the
#   time gives her a load that can be read, so she attacks with nothing.
# The searches flown to 700 miles (12007, 12008) are the check on both: the
#   search radii the tool gives, 737 and 898 nm, are above them.
#
# RADAR: as in the other lists, where no row says whether a ship carried a
# search radar on 3 June she is treated as not fitted (radar_unknown_means_none).

name = "Midway"
date = "1942-06-03"
rules = "rules.toml"
output = "../reference/ship_classes_midway.csv"
aircraft_output = "../reference/aircraft_types_midway.csv"
first_class_id = 5000
first_aircraft_type_id = 5100
air_figures = true

ships = [
    # Task Force 16.
    "cv-6-enterprise", "cv-8-hornet",
    "ca-24-pensacola", "ca-26-northampton", "ca-32-new-orleans", "ca-36-minneapolis", "ca-44-vincennes", "cl-51-atlanta",
