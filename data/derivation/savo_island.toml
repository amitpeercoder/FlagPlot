# The ships that fought at Savo Island, 8 to 9 August 1942, for stage 4c.
# The derivation tool turns this list into data/reference/ship_classes_savo_island.csv.
# Who is here follows docs/decisions/0019-savo-island-choices.md.

name = "Savo Island"
date = "1942-08-08"
rules = "rules.toml"
output = "../reference/ship_classes_savo_island.csv"
first_class_id = 1000

# Japanese column.
ships = [
    "chokai", "aoba", "kako", "kinugasa", "furutaka", "tenryu", "yubari", "yunagi",
    # Southern group.
    "hmas-canberra", "ca-29-chicago", "dd-386-bagley", "dd-392-patterson",
    # Northern group.
    "ca-44-vincennes", "ca-39-quincy", "ca-34-astoria", "dd-388-helm", "dd-408-wilson",
    # Pickets.
    "dd-387-blue", "dd-390-ralph-talbot",
    # Alone, damaged, not attacked.
    "dd-393-jarvis",
]

# Working assumption, not a fact (decision 0019, 5): no source says whether
# these ships carried a search radar on the date, and the scenario treats
# them as not fitted. The list only matters while the facts are silent: a
# ship with a sourced fit, or a sourced "none", is read from the facts.
#
# - Bagley, Patterson, Helm, Wilson, Jarvis: no radar row of any kind.
# - Vincennes: fire-control radar rows only, no search radar row.
#
# Canberra is no longer here: her Type 271 set is settled in the facts
# (settlement sheet r1).
radar_unknown_means_none = [
    "dd-386-bagley", "dd-392-patterson", "dd-388-helm", "dd-408-wilson", "dd-393-jarvis",
    "ca-44-vincennes",
]

# Working assumption, not a fact (decision 0023): no source gives the
# main-gun ammunition these three carried. Tenryu fired 80 rounds that night
# and Yubari 96, far below any plausible outfit, so their main-gun
# ammunition is treated as not limiting.
main_gun_ammunition_not_limiting = ["tenryu", "yubari", "yunagi"]
