# The ships of the night action at Cape Esperance, 11 to 12 October 1942:
# Task Force 64's nine ships and the Japanese bombardment group's five
# (decision 0072; data/validation/cape_esperance.toml). The derivation tool
# turns this list into data/reference/ship_classes_cape_esperance.csv and the
# two files beside it, and the ships' experience values (decision 0064). The
# date is the engagement's first day. The settlements this list rests on are
# in decision 0072, "The ships", and on the rows; the exceptions are at the
# end of rules.toml.
#
# The class ids are pinned (decision 0077): 3000 to 3008, which no other list
# uses.

name = "Cape Esperance"
date = "1942-10-11"
rules = "rules.toml"
output = "../reference/ship_classes_cape_esperance.csv"
first_class_id = 3000

ships = [
    # Task Force 64, in the battle disposition of 22:35.
    "dd-491-farenholt", "dd-485-duncan", "dd-459-laffey",
    "ca-38-san-francisco", "cl-47-boise", "ca-25-salt-lake-city", "cl-50-helena",
    "dd-484-buchanan", "dd-488-mccalla",
    # The bombardment group (Goto).
    "aoba", "furutaka", "kinugasa", "fubuki", "hatsuyuki",
]

# Working assumption, not a fact (decision 0019, 5): no fit row read holds
# for a search radar on these ships on the date, and they are treated as not
# fitted. Duncan's two surface-search rows are disputed and low (fits 662,
# 663), so none holds. For the destroyers it changes nothing the rules read:
# a force sights with radar if any ship of it has it, and Boise and Helena
# have an SG (decision 0077).
radar_unknown_means_none = [
    "dd-485-duncan", "dd-459-laffey", "dd-484-buchanan", "dd-488-mccalla",
    "aoba", "furutaka", "kinugasa", "fubuki", "hatsuyuki",
]

# The class ids, pinned (decision 0077).
[class_ids]
3000 = ["aoba", "kinugasa"]
3001 = ["furutaka"]
3002 = ["fubuki", "hatsuyuki"]
3003 = ["dd-491-farenholt", "dd-485-duncan", "dd-484-buchanan", "dd-488-mccalla"]
3004 = ["dd-459-laffey"]
3005 = ["ca-38-san-francisco"]
3006 = ["cl-47-boise"]
3007 = ["ca-25-salt-lake-city"]
3008 = ["cl-50-helena"]

# The questions and thresholds are in rules.toml, under [experience]. The
# first day is 1942-10-11, so the three months are 1942-07-11 to 1942-10-11,
# and a new ship is one commissioned after 1941-10-11.
#
# The rows now carry their periods (valid_from, valid_to), so an answer gives
# none and the tool reads them.
#
# THE ARCHITECT'S SETTLEMENTS, Nov 12, 2026. The statement is
# training_facts.csv row 74 (the Navy's combat narrative): Task Force SUGAR
# "held target practice 8 Oct and brief antiaircraft practice that night",
# dated 20 September to 8 October 1942. An antiaircraft practice at night is
# an exercise at night. A statement about a force answers for a ship only if a
# row names her as part of it at that time:
# - Farenholt (sf:1081), Buchanan (sf:1082), Laffey (sf:1083): each named as
#   one of the three destroyers of the force as first organised, with it on 7
#   and 8 October. Yes. 2 - 1 (new ship) + 1 = 2.
# - Duncan (sf:1084) and McCalla (sf:1085): rows say each was not with the
#   force for the practices of 8 October. Not answered. 2 - 1 = 1.
# - Helena. sf:1050 says she joined Task Force SUGAR from Espiritu Santo and
#   does not say she exercised. Both her commissioning dates are before the
#   line. Not answered.
# - The Japanese cruisers and the war diaries (sf:1086 to 1122): no value
#   changes (see savo_island.toml). The five Japanese ships keep 3, by the
#   designer's decision of Nov 12, 2026 ("Keep it").
# Unchanged: San Francisco, Boise, Salt Lake City 3; Helena 2.
[experience]
engagement = "cape-esperance"
output = "../reference/ship_experience_cape_esperance.ships.csv"
ships = [
    "ca-38-san-francisco", "cl-47-boise", "ca-25-salt-lake-city", "cl-50-helena",
    "dd-491-farenholt", "dd-485-duncan", "dd-459-laffey", "dd-484-buchanan", "dd-488-mccalla",
    "aoba", "furutaka", "kinugasa", "fubuki", "hatsuyuki",
]

# The night firing practice of 7 October 1942, from the deck log of Salt Lake
# City: she, San Francisco and Boise in company.
[[experience.answer]]
ship = "ca-25-salt-lake-city"
question = "night_practice_recent"
row = "ship_facts.csv:1033"
answer = "yes"
reason = "Her deck log of 7 October 1942: general quarters for night firing practice with San Francisco and Boise."

[[experience.answer]]
ship = "ca-38-san-francisco"
question = "night_practice_recent"
row = "ship_facts.csv:1036"
answer = "yes"
reason = "Salt Lake City's deck log of 7 October 1942 names San Francisco in company and firing on a target in the night firing practice."

[[experience.answer]]
ship = "cl-47-boise"
question = "night_practice_recent"
row = "ship_facts.csv:1037"
answer = "yes"
reason = "Salt Lake City's deck log of 7 October 1942 names Boise in company in the night firing practice."

# The three destroyers of the force as first organised.
[[experience.answer]]
ship = "dd-491-farenholt"
question = "night_practice_recent"
row = "training_facts.csv:74"
named_by = ["ship_facts.csv:1081"]
answer = "yes"
reason = "The Navy's narrative has the force hold target practice on 8 October and brief antiaircraft practice that night, an exercise at night; she was one of its three destroyers as first organised, with it on 7 and 8 October (sf:1081)."

[[experience.answer]]
ship = "dd-484-buchanan"
question = "night_practice_recent"
row = "training_facts.csv:74"
named_by = ["ship_facts.csv:1082"]
answer = "yes"
reason = "The Navy's narrative has the force hold target practice on 8 October and brief antiaircraft practice that night, an exercise at night; she was one of its three destroyers as first organised, with it on 7 and 8 October (sf:1082)."

[[experience.answer]]
ship = "dd-459-laffey"
question = "night_practice_recent"
row = "training_facts.csv:74"
named_by = ["ship_facts.csv:1083"]
answer = "yes"
reason = "The Navy's narrative has the force hold target practice on 8 October and brief antiaircraft practice that night, an exercise at night; she was one of its three destroyers as first organised, with it on 7 and 8 October (sf:1083)."
