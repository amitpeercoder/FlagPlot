[package]
name = "scenario-tests"
description = "Flag Plot scenarios as automated tests, one file per scenario."
version.workspace = true
edition.workspace = true
publish.workspace = true

# One test program for every scenario file, not one for each: building and
# linking the programs was most of the build. `all.rs` declares each file
# as a module; a file written and not yet to be run (scenario 75) is left
# out of it, as it was left out of this list.
autotests = false

[[test]]
name = "scenarios"
path = "all.rs"

[dev-dependencies]
sim-core.workspace = true
sim-data.workspace = true
sim-staff.workspace = true
sim-trial.workspace = true
# Scenario 41's preview is asked through the agent's tools.
sim-agent = { path = "../crates/sim-agent" }
# Scenario 97's session is given what plays a seat's trials as sim-cli
# gives it (decision 0178).
sim-cli = { path = "../crates/sim-cli" }
serde_json.workspace = true
# Statement 18 of scenario 122 reads the figures files as TOML.
toml.workspace = true
# Part 3 of scenario 4b reads the anchors file and places each position in a
# hex with the map tool's own projection.
csv.workspace = true
map-tool = { path = "../crates/map-tool" }
# Scenarios 114, 120 and 121 ask a derivation list's check of the library
# `oob-derive` is built on, not of the program through cargo.
oob-derive = { path = "../crates/oob-derive" }

[lints]
workspace = true
