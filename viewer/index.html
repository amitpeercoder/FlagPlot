  for (const f of st.forces.values()) {
    const side = 'side-' + (f.side === 'japanese' ? 'japanese' : 'allied');
    if (f.trail.length > 1) gDyn.append(sv('polyline', { class: 'trail ' + side, points: f.trail.map(h => C.hexCenter(h[0], h[1]).join(',')).join(' ') }));
    for (const path of st.moves.get(f.id) || []) {
      if (path.length > 1) gDyn.append(sv('polyline', { class: 'move ' + side, points: path.map(h => C.hexCenter(h[0], h[1]).join(',')).join(' ') }));
    }
  }
  renderRings();
}

/** The reach of the selected air group, drawn round its position at this step: strike radius, extended reach and search range. */
function selectedRings() {
  const m = S.model;
  if (!m || !S.air || S.selAirGroup == null) return null;
  const st = m.states[S.step], info = C.airReach(m, st, S.selAirGroup);
  if (!info.group || !info.type) return null;
  const hex = C.airGroupHex(m.bases, st, info.group);
  if (!hex) return null;
  const t = info.type;
  return { hex, side: info.group.side === 'japanese' ? 'japanese' : 'allied', extended: info.reach === 'extended', strike: t.strike_radius_nm, ext: t.extended_reach_nm, search: t.search_range_nm };
}

function renderRings() {
  const rg = selectedRings();
  if (!rg) return;
  const c = C.hexCenter(rg.hex[0], rg.hex[1]), cls = ' side-' + rg.side;
  const ring = (r, kind) => { if (r > 0) gDyn.append(sv('circle', { class: 'ring-air ' + kind + cls, cx: c[0], cy: c[1], r })); };
  // The reach it is on is solid; the other is dashed (the extended one fainter when it is not in use). Equal radii: one ring.
  const same = rg.ext === rg.strike;
  ring(rg.search, 'search');
  if (same) ring(rg.strike, 'solid');
  else if (rg.extended) { ring(rg.strike, 'alt'); ring(rg.ext, 'solid'); }
  else { ring(rg.ext, 'faint'); ring(rg.strike, 'solid'); }
}

function counterShape(side) {
  if (side === 'japanese') return sv('polygon', { class: 'shape', points: '-18,-5 -13,-10 13,-10 18,-5 18,5 13,10 -13,10 -18,5' });
  return sv('rect', { class: 'shape', x: -18, y: -10, width: 36, height: 20, rx: 3 });
}

function counterLabel(f) { return 'TF' + f.id; }

function highlightSets() {
  const hl = { forces: new Set(), bases: new Set(), contacts: new Set() };
  const st = S.model.states[S.step];
  const ev = S.selEvent != null ? S.model.eventById.get(S.selEvent) : null;
  if (ev) {
    for (const e of ev.entities || []) {
      const p = C.parseEntity(e);
      if (!p) continue;
      if (p.type === 'task_force') hl.forces.add(p.id);
      else if (p.type === 'ship') { const fid = st.shipForce.get(p.id); if (fid !== undefined) hl.forces.add(fid); }
      else if (p.type === 'base') hl.bases.add(p.id);
      else if (p.type === 'contact') {
        // A report names its side; an alert names the force, whose side it is.
        const alerted = ev.data && ev.data.task_force !== undefined ? st.forces.get(ev.data.task_force) : null;
        const side = (ev.data && ev.data.side) || (alerted && alerted.side);
        if (side) hl.contacts.add(side + ':' + p.id);
        else { hl.contacts.add('allied:' + p.id); hl.contacts.add('japanese:' + p.id); }
      }
    }
  }
  const sel = new Set();
  if (S.selEntity) {
    if (S.selEntity.type === 'force') sel.add(S.selEntity.id);
    else { const fid = st.shipForce.get(S.selEntity.id); if (fid !== undefined) sel.add(fid); }
  }
  return { hl, sel };
}

function renderScreen() {
  clear(gScreen);
  const m = S.model;
  if (!m) return;
  const { k, tx, ty } = S.view;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const st = m.states[S.step];
  const pos = (q, r) => { const c = C.hexCenter(q, r); return [c[0] * k + tx, c[1] * k + ty]; };
  const visible = (p, pad) => p[0] > -pad && p[1] > -pad && p[0] < W + pad && p[1] < H + pad;
  const { hl, sel } = highlightSets();
  const obstacles = [];
  const free = (rect) => !obstacles.some(o => rect.x < o.x + o.w && rect.x + rect.w > o.x && rect.y < o.y + o.h && rect.y + rect.h > o.y);
  const rectFor = (x, y, w, h) => ({ x: x - w / 2, y: y - h / 2, w, h });
  const textW = s => s.length * 6.8 + 6;
  const hexPx = C.HEX_SPACING * k;

  const gFeat = sv('g'), gLbl = sv('g'), gBase = sv('g'), gGhost = sv('g'), gCtr = sv('g');

  // Forces per hex, fanned out
  const byHex = new Map();
  for (const f of st.forces.values()) {
    const key = C.hexKey(f.q, f.r);
    if (!byHex.has(key)) byHex.set(key, []);
    byHex.get(key).push(f);
  }
  const counters = [];
  for (const [key, list] of byHex) {
    const f0 = list[0], p = pos(f0.q, f0.r);
    if (!visible(p, 40)) continue;
    list.sort((a, b) => a.id - b.id);
    const n = list.length, rad = n === 1 ? 0 : Math.max(24, n * 9);
    list.forEach((f, i) => {
      const a = (-90 + (360 / n) * i + (n === 2 ? 90 : 0)) * Math.PI / 180;
      counters.push({ f, x: p[0] + rad * Math.cos(a), y: p[1] + rad * Math.sin(a) });
    });
  }
  for (const c of counters) obstacles.push(rectFor(c.x, c.y, 40, 24));

  // Ghost contacts for the chosen belief
  const ghosts = [];
  if (S.belief !== 'truth' && st.contacts[S.belief]) {
    const perHex = new Map();
    for (const c of st.contacts[S.belief].values()) {
      const key = C.hexKey(c.hex[0], c.hex[1]);
      const i = perHex.get(key) || 0;
      perHex.set(key, i + 1);
      const p = pos(c.hex[0], c.hex[1]);
      if (!visible(p, 60)) continue;
      ghosts.push({ c, x: p[0], y: p[1] + 30 + i * 42 });
    }
  }
  for (const g of ghosts) obstacles.push(rectFor(g.x, g.y + 6, Math.max(40, textW(ghostText(g.c))), 42));

  // Bases
  const baseMarks = [];
  for (const b of m.bases.values()) {
    const p = pos(b.q, b.r);
    if (!visible(p, 60)) continue;
    baseMarks.push({ b: Object.assign({}, b, { side: holderOf(st, b) }), x: p[0], y: p[1] });
    obstacles.push(rectFor(p[0], p[1], 14, 14));
  }
  for (const bm of baseMarks) {
    const name = bm.b.name || ('base ' + bm.b.id);
    const rect = { x: bm.x + 9, y: bm.y - 9, w: textW(name), h: 16 };
    if (free(rect)) { obstacles.push(rect); bm.label = name; }
  }
  // Place labels (only when the map has lat/lon): greedy, skipping collisions
  const placeLabels = [];
  for (const p of m.placements) {
    const sp = pos(p.q, p.r);
    if (!visible(sp, 60)) continue;
    const text = String(p.label.place);
    const rect = rectFor(sp[0], sp[1] + 17, textW(text), 16);
    if (free(rect)) { obstacles.push(rect); placeLabels.push({ text, x: sp[0], y: sp[1] + 21, title: p.label.feature }); }
  }

  // The air layer: marks and lines under the counters; tally boxes and labels over them, placed clear of everything above
  const gAirLow = sv('g'), gAirTop = sv('g');
  if (S.air && m.hasAir) drawAir({ st, pos, visible, obstacles, free, rectFor, textW, hexPx, gLow: gAirLow, gTop: gAirTop, W, H });

  // Hex features (port, airfield, anchorage) when zoomed in enough to read
  if (hexPx >= 34) {
    for (const h of m.hexes) {
      if (!(h.port_size || h.airfield_size || h.anchorage)) continue;
      const p = pos(h.q, h.r);
      if (!visible(p, 40)) continue;
      const bits = [];
      if (h.port_size) bits.push('P' + h.port_size);
      if (h.airfield_size) bits.push('A' + h.airfield_size);
      if (h.anchorage) bits.push('anch');
      gFeat.append(sv('text', { class: 'feat', x: p[0], y: p[1] - 14, 'text-anchor': 'middle', text: bits.join(' ') }));
    }
  }

  for (const pl of placeLabels) gLbl.append(sv('text', { class: 'lbl place', x: pl.x, y: pl.y, 'text-anchor': 'middle', text: pl.text }, pl.title ? sv('title', { text: pl.title }) : null));

  for (const bm of baseMarks) {
    const b = bm.b, side = b.side === 'japanese' ? 'japanese' : 'allied';
    const g = sv('g', { class: 'base', transform: 'translate(' + bm.x + ' ' + bm.y + ')', 'data-kind': 'base', 'data-id': b.id });
    if (hl.bases.has(b.id)) g.append(sv('rect', { class: 'ring-hl', x: -10, y: -10, width: 20, height: 20 }));
    if (S.selBase === b.id) g.append(sv('rect', { class: 'ring-sel', x: -13, y: -13, width: 26, height: 26, rx: 4 }));
    g.append(sv('path', { class: 'basemark side-' + side, d: 'M0 -7L7 0L0 7L-7 0Z' }));
    g.append(sv('title', { text: (b.name || 'base ' + b.id) + ' (' + (b.side || '?') + ', base:' + b.id + (b.supply !== undefined ? ', supply ' + b.supply : '') + ')' }));
    gBase.append(g);
    if (bm.label) gBase.append(sv('text', { class: 'lbl base', x: bm.x + 10, y: bm.y + 4, text: bm.label }));
  }

  for (const g of ghosts) {
    const c = g.c, side = c.side === 'japanese' ? 'japanese' : 'allied';
    const op = 0.35 + 0.65 * Math.max(0, Math.min(1, 1 - (Number(c.age_pulses) || 0) / 5));
    const grp = sv('g', { class: 'ghost side-' + side, transform: 'translate(' + g.x + ' ' + g.y + ')', opacity: op.toFixed(2) });
    if (hl.contacts.has(c.side + ':' + c.id)) grp.append(sv('rect', { class: 'ring-hl', x: -23, y: -14, width: 46, height: 28, rx: 5, opacity: 1 }));
    grp.append(sv('rect', { class: 'gshape', x: -20, y: -11, width: 40, height: 22, rx: 3 }));
    grp.append(sv('text', { x: 0, y: 4, text: String(c.ship_count) }));
    grp.append(sv('text', { x: 0, y: 26, text: ghostText(c) }));
    grp.append(sv('title', { text: 'Contact ' + c.id + ' (' + c.side + ' belief): ' + ghostText(c) + ', in (' + c.hex[0] + ',' + c.hex[1] + ')' }));
    gGhost.append(grp);
  }

  for (const c of counters) {
    const f = c.f, side = f.side === 'japanese' ? 'japanese' : 'allied';
    const afloat = f.ships.length > 0;
    const g = sv('g', { class: 'counter side-' + side + (afloat ? '' : ' hollow'), transform: 'translate(' + c.x + ' ' + c.y + ')', 'data-kind': 'force', 'data-id': f.id });
    if (hl.forces.has(f.id)) g.append(sv('rect', { class: 'ring-hl', x: -23, y: -15, width: 46, height: 30, rx: 6 }));
    if (sel.has(f.id)) g.append(sv('rect', { class: 'ring-sel', x: -26, y: -18, width: 52, height: 36, rx: 8 }));
    g.append(counterShape(side));
    g.append(sv('text', { x: 0, y: 4.5, text: counterLabel(f) }));
    if (!afloat) g.append(sv('line', { class: 'strike', x1: -20, y1: 11, x2: 20, y2: -11 }));
    g.append(sv('title', { text: f.name + ' (' + (f.side || '?') + '), task_force:' + f.id + ', ' + f.ships.length + ' ship(s) afloat' + (afloat ? '' : ', none afloat') }));
    gCtr.append(g);
  }
  gScreen.append(gFeat, gLbl, gAirLow, gBase, gGhost, gCtr, gAirTop);
}

// ---- The air layer on the screen layer ----
const airSide = side => 'side-' + (side === 'japanese' ? 'japanese' : 'allied');

/** Compact lines for the tally box: what the raids at one target hex did and what it cost. Only what the model knows is said. */
function tallyLines(t, st) {
  const view = S.pov !== 'umpire';
  const raids = st.air.raids.filter(r => t.raids.includes(r.id));
  const lines = [];
  const found = raids.filter(r => r.outcome === 'found').length, nothing = raids.filter(r => r.outcome === 'nothing').length, none = raids.length - found - nothing;
  const verdict = [found ? found + ' found' : '', nothing ? nothing + ' found nothing' : '', none ? none + ' no bomber got through' : ''].filter(Boolean).join(', ');
  lines.push({ head: true, text: t.raids.length + (t.raids.length === 1 ? ' raid: ' : ' raids: ') + t.bombers + ' a/c' + (t.escorts ? ' + ' + t.escorts + ' esc' : '') });
  lines.push({ text: verdict });
  const shots = [];
  if (t.patrolEngaged) shots.push('patrol ' + t.patrolEngaged + ' engaged');
  if (t.patrolShots) shots.push('patrol shots ' + t.patrolShots);
  if (t.escortShots) shots.push('escort shots ' + t.escortShots);
  if (t.gunShots) shots.push('guns ' + t.gunShots + (t.gunHits !== null ? ' (' + t.gunHits + ' hit' + (t.gunHits === 1 ? '' : 's') + ')' : ''));
  if (shots.length) lines.push({ text: shots.join(', ') });
  const lost = Object.entries(t.lost).filter(([, l]) => l.total).map(([side, l]) => {
    const why = ['patrol', 'escorts', 'guns'].filter(k => l[k]).map(k => k + ' ' + l[k]);
    if (l.unseen) why.push('cause not seen');
    return side + ' lost ' + l.total + (why.length ? ' (' + why.join(', ') + ')' : '');
  });
  if (lost.length) lines.push({ text: lost.join('; ') });
  const after = [t.ditched ? 'ditched ' + t.ditched : '', t.landed ? 'landed elsewhere ' + t.landed : '', t.lostWithShip ? 'lost with ship ' + t.lostWithShip : ''].filter(Boolean);
  const result = [t.hits !== null ? 'hits ' + t.hits : (found && view ? 'hits not seen' : ''), t.sunk ? 'sunk ' + t.sunk : ''].filter(Boolean);
  const rest = after.concat(result).join(', ');
  if (rest) lines.push({ text: rest });
  if (t.claims.length) {
    const by = new Map();
    for (const c of t.claims) {
      const a = by.get(c.side) || { sunk: 0, hits: 0, down: 0, ground: 0 };
      a.sunk += c.sunk || 0; a.hits += c.hits || 0; a.down += c.shot_down || 0; a.ground += c.on_ground || 0;
      by.set(c.side, a);
    }
    lines.push({ text: 'claimed: ' + [...by.entries()].map(([s, a]) => s + ' ' + [a.sunk ? a.sunk + ' sunk' : '', a.hits ? a.hits + ' hits' : '', a.down ? a.down + ' down' : '', a.ground ? a.ground + ' on ground' : ''].filter(Boolean).join(' ') || s + ' nothing').join('; ') });
  }
  return lines;
}

function drawAir(c) {
  const { st, pos, visible, obstacles, free, rectFor, textW, hexPx, gLow, gTop, W, H } = c;
  const air = st.air;
  const slots = new Map();
  const slot = key => { const n = slots.get(key) || 0; slots.set(key, n + 1); return n; };
  const segVisible = (a, b) => !((a[0] < 0 && b[0] < 0) || (a[0] > W && b[0] > W) || (a[1] < 0 && b[1] < 0) || (a[1] > H && b[1] > H));
  const place = (cands, w, h) => { for (const [x, y] of cands) { const r = rectFor(x, y, w, h); if (free(r)) return { x, y, r }; } return null; };

  // Search marks: a sighting where the report put it (and, for the umpire, a faint link to where the force truly was); a miss where the force truly was
  for (const s of air.sighted) {
    const p = pos(s.q, s.r);
    const tp = s.trueHex && (s.trueHex[0] !== s.q || s.trueHex[1] !== s.r) ? pos(s.trueHex[0], s.trueHex[1]) : null;
    if (!visible(p, 40) && !(tp && visible(tp, 40))) continue;
    const g = sv('g', { class: airSide(s.side) });
    if (tp) { g.append(sv('line', { class: 'air-link', x1: p[0], y1: p[1], x2: tp[0], y2: tp[1] })); g.append(sv('circle', { class: 'air-truedot', cx: tp[0], cy: tp[1], r: 2.6 })); }
    g.append(sv('path', { class: 'air-sighted', d: 'M0 -6.5L6.5 0L0 6.5L-6.5 0Z', transform: 'translate(' + (p[0] + slot('s' + s.q + ',' + s.r) * 9) + ' ' + p[1] + ')' }));
    g.append(sv('title', { text: 'Report #' + s.event + ': the search of air_group:' + s.air_group + ' put a contact at (' + s.q + ', ' + s.r + ')' + (s.trueHex ? '; the force was truly at (' + s.trueHex[0] + ', ' + s.trueHex[1] + ')' : '') }));
    gLow.append(g);
  }
  for (const mk of air.misses) {
    const p = pos(mk.q, mk.r);
    if (!visible(p, 40)) continue;
    const i = slot('m' + mk.q + ',' + mk.r);
    const g = sv('g', { transform: 'translate(' + (p[0] + i * 9) + ' ' + p[1] + ')' });
    g.append(sv('circle', { class: 'air-miss', cx: 0, cy: 0, r: 5.5 }));
    g.append(sv('title', { text: 'The search of air_group:' + mk.air_group + ' missed task_force:' + mk.task_force + ' here (event #' + mk.event + ')' }));
    gLow.append(g);
  }

  // Tally boxes first, so that the raid labels come second and keep clear of them
  const tallyBoxes = [];
  for (const t of air.tallies) {
    const p = pos(t.q, t.r);
    if (!visible(p, 80)) continue;
    const lines = tallyLines(t, st);
    const w = Math.max(...lines.map(l => l.text.length * 6.4 + (l.head ? 6 : 0))) + 14, h = lines.length * 14 + 8;
    const around = (w2, h2) => [[p[0] + 30 + w2 / 2, p[1]], [p[0] - 30 - w2 / 2, p[1]], [p[0] + 30 + w2 / 2, p[1] - h2 / 2 - 6], [p[0] + 30 + w2 / 2, p[1] + h2 / 2 + 6], [p[0] - 30 - w2 / 2, p[1] - h2 / 2 - 6], [p[0] - 30 - w2 / 2, p[1] + h2 / 2 + 6], [p[0], p[1] - 30 - h2 / 2], [p[0], p[1] + 30 + h2 / 2]];
    const asBadge = hexPx < 55;
    const badgeText = t.raids.length + (t.raids.length === 1 ? ' raid' : ' raids'), bw = badgeText.length * 6.4 + 12, bh = 18;
    const fullSpot = place(around(w, h), w, h) || { x: around(w, h)[0][0], y: around(w, h)[0][1], r: rectFor(around(w, h)[0][0], around(w, h)[0][1], w, h) };
    let badgeSpot = null;
    if (asBadge) badgeSpot = place(around(bw, bh), bw, bh) || { x: around(bw, bh)[0][0], y: around(bw, bh)[0][1], r: rectFor(around(bw, bh)[0][0], around(bw, bh)[0][1], bw, bh) };
    obstacles.push(asBadge ? badgeSpot.r : fullSpot.r);
    const sel = S.selEvents && S.selEventsHex === t.key;
    const one = t.sides.length === 1;
    const g = sv('g', { class: 'tally' + (one ? ' ' + airSide(t.sides[0]) : '') + (asBadge ? ' badge' : '') + (sel ? ' sel' : ''), 'data-kind': 'tally', 'data-id': t.key });
    const leader = r => { const lx = Math.max(r.x, Math.min(r.x + r.w, p[0])), ly = Math.max(r.y, Math.min(r.y + r.h, p[1])); return sv('line', { class: 'tleader', x1: p[0], y1: p[1], x2: lx, y2: ly }); };
    const full = sv('g', { class: 'tfull' });
    full.append(leader(fullSpot.r));
    full.append(sv('rect', { class: 'tbox', x: fullSpot.r.x, y: fullSpot.r.y, width: w, height: h, rx: 4 }));
    lines.forEach((l, i) => full.append(sv('text', { class: l.head ? 'head' : '', x: fullSpot.r.x + 7, y: fullSpot.r.y + 17 + i * 14, text: l.text })));
    if (asBadge) {
      const b = sv('g', { class: 'tbadge' });
      b.append(leader(badgeSpot.r));
      b.append(sv('rect', { class: 'tbox', x: badgeSpot.r.x, y: badgeSpot.r.y, width: bw, height: bh, rx: 4 }));
      b.append(sv('text', { class: 'head', x: badgeSpot.r.x + 6, y: badgeSpot.r.y + 13, text: badgeText }));
      g.append(b);
    }
    g.append(full);
    g.append(sv('title', { text: 'Click to list the ' + t.events.length + ' events of the air fight at (' + t.q + ', ' + t.r + ')' }));
    tallyBoxes.push(g);
  }

  // Raid lines: the raids that went from one hex to one hex with one outcome are drawn as one line
  const lines = new Map();
  for (const r of air.raids) {
    if (!r.launch || !r.target) continue;
    const key = [r.side, r.launch.join(','), r.target.join(','), r.kind, r.baseId, r.outcome].join('|');
    if (!lines.has(key)) lines.set(key, []);
    lines.get(key).push(r);
  }
  const trueDone = new Set();
  for (const group of lines.values()) {
    const r0 = group[0];
    const a0 = pos(r0.launch[0], r0.launch[1]), b0 = pos(r0.target[0], r0.target[1]);
    if (!segVisible(a0, b0)) continue;
    const dx = b0[0] - a0[0], dy = b0[1] - a0[1], len = Math.hypot(dx, dy);
    if (len < 2) continue;
    const ux = dx / len, uy = dy / len, ox = -uy * 4, oy = ux * 4; // a little to the right of the way it flies, so a raid and its return fire do not lie on one line
    const a = [a0[0] + ox, a0[1] + oy], b = [b0[0] + ox, b0[1] + oy];
    const bombers = group.reduce((n, r) => n + r.bombers, 0), esc = group.reduce((n, r) => n + r.escorts, 0);
    const text = (group.length > 1 ? group.length + ' raids: ' : '') + bombers + ' a/c' + (esc ? ' + ' + esc + ' esc' : '');
    const g = sv('g', { class: airSide(r0.side) });
    const base = r0.kind === 'base', gap = base ? 7 : r0.outcome === 'nothing' ? 9 : 4;
    const tip = [b[0] - ux * gap, b[1] - uy * gap], start = [a[0] + ux * 5, a[1] + uy * 5];
    g.append(sv('line', { class: 'air-line ' + r0.outcome, x1: start[0], y1: start[1], x2: tip[0], y2: tip[1] }));
    g.append(sv('circle', { class: 'air-from', cx: a[0], cy: a[1], r: 3.4 }));
    if (base) g.append(sv('rect', { class: 'air-end', x: b[0] - 5, y: b[1] - 5, width: 10, height: 10 }));
    else if (r0.outcome === 'nothing') g.append(sv('circle', { class: 'air-end hollow', cx: b[0], cy: b[1], r: 7 }));
    else {
      const hl = r0.outcome === 'none' ? 8 : 12, hw = r0.outcome === 'none' ? 3.5 : 5.5;
      g.append(sv('polygon', { class: 'air-head', points: [[b[0], b[1]], [b[0] - ux * hl - uy * hw, b[1] - uy * hl + ux * hw], [b[0] - ux * hl + uy * hw, b[1] - uy * hl - ux * hw]].map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') }));
    }
    const what = r0.outcome === 'found' ? 'found its target' : r0.outcome === 'nothing' ? 'found nothing at the hex' : 'no bomber got through';
    g.append(sv('title', { text: group.map(r => 'raid ' + r.id + ': air_group:' + r.strikeGroups.join(', ') + (r.escortGroups.length ? ' with escorts air_group:' + r.escortGroups.join(', ') : '')).join('; ') + ' from (' + r0.launch + ') to (' + r0.target + '): ' + bombers + ' aircraft' + (esc ? ' + ' + esc + ' escorts' : '') + ', ' + what }));
    gLow.append(g);
    // The label sits beside the line, clear of the counters, contacts and boxes
    const lw = text.length * 6.3 + 6, cands = [];
    for (const f of [0.5, 0.35, 0.65, 0.22, 0.78]) for (const side of [1, -1]) cands.push([a[0] + dx * f - uy * 11 * side * (1 + 0), a[1] + dy * f + ux * 11 * side]);
    const spot = place(cands, lw, 14);
    if (spot) { obstacles.push(spot.r); gTop.append(sv('text', { class: 'air-lbl ' + airSide(r0.side), x: spot.x, y: spot.y + 4, 'text-anchor': 'middle', text })); }
    // For the umpire: where the force the strike was sent at truly was
    if (r0.trueHex !== undefined) {
      const th = r0.trueHex;
      if (th && (th[0] !== r0.target[0] || th[1] !== r0.target[1])) {
        const tk = r0.target.join(',') + '>' + th.join(',');
        if (!trueDone.has(tk)) {
          trueDone.add(tk);
          const tp = pos(th[0], th[1]);
          gLow.append(sv('line', { class: 'air-true', x1: b0[0], y1: b0[1], x2: tp[0], y2: tp[1] }));
          gLow.append(sv('circle', { class: 'air-truedot', cx: tp[0], cy: tp[1], r: 3 }));
          const tw = 'target truly here'.length * 6 + 6;
          const tc = [[tp[0], tp[1] - 12], [tp[0], tp[1] + 16], [tp[0] + tw / 2 + 8, tp[1]], [tp[0] - tw / 2 - 8, tp[1]], [tp[0], tp[1] + 30], [tp[0], tp[1] - 26]];
          const ts = place(tc, tw, 14) || { x: tc[1][0], y: tc[1][1], r: rectFor(tc[1][0], tc[1][1], tw, 14) }; // this label is the point of the line: it goes below the mark even when crowded
          if (ts) { obstacles.push(ts.r); gTop.append(sv('text', { class: 'air-lbl dim', x: ts.x, y: ts.y + 4, 'text-anchor': 'middle', text: 'target truly here' }, sv('title', { text: 'The force this strike was sent at was at (' + th + ') when it found nothing at (' + r0.target + ')' }))); }
        }
      }
    }
  }
  tallyBoxes.forEach(g => gTop.append(g));

  // Reach rings: their labels (the rings are in the world layer)
  const rg = selectedRings();
  if (rg) {
    const cp = pos(rg.hex[0], rg.hex[1]), k = S.view.k;
    // Each label goes on its ring at the first angle near the one asked for where it covers no counter or label.
    const lab = (r, ang, text) => {
      if (!(r > 0)) return;
      for (const off of [0, 12, -12, 24, -24, 36, -36, 48, -48, 60, -60, 90, -90, 120, -120, 180]) {
        const a = (ang + off) * Math.PI / 180, x = cp[0] + r * k * Math.cos(a), y = cp[1] + r * k * Math.sin(a);
        if (!visible([x, y], 0)) continue;
        const rect = rectFor(x, y - 4, textW(text), 14);
        if (!free(rect)) continue;
        obstacles.push(rect);
        gTop.append(sv('text', { class: 'air-lbl ' + airSide(rg.side), x, y, 'text-anchor': 'middle', text }));
        return;
      }
    };
    if (rg.ext === rg.strike) lab(rg.strike, -90, 'strike ' + rg.strike + ' nm');
    else { lab(rg.strike, -90, 'strike ' + rg.strike + ' nm'); lab(rg.ext, -62, 'extended ' + rg.ext + ' nm' + (rg.extended ? ' (on)' : '')); }
    lab(rg.search, -118, 'search ' + rg.search + ' nm');
  }
}

function ghostText(c) { return c.ship_count + ' ' + c.kind + ', age ' + c.age_pulses; }

function renderScale() {
  const k = S.view.k, box = $('scalebar');
  if (!S.model || !(k > 0)) { box.hidden = true; return; }
  const cands = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000];
  let pick = cands[0];
  for (const c of cands) { if (c * k <= 150) pick = c; }
  box.hidden = false;
  $('scalelabel').textContent = pick + ' nm';
  $('scalebarbar').style.width = Math.max(8, pick * k) + 'px';
}

function applyView() {
  const { k, tx, ty } = S.view;
  worldEl.setAttribute('transform', 'translate(' + tx + ' ' + ty + ') scale(' + k + ')');
  renderScale();
  scheduleScreen();
}
let screenQueued = false;
function scheduleScreen() {
  if (screenQueued) return;
  screenQueued = true;
  requestAnimationFrame(() => { screenQueued = false; renderScreen(); });
}

// =====================================================================
// Pan and zoom
// =====================================================================
function fit() {
  const m = S.model;
  if (!m) return;
  const W = wrap.clientWidth || 800, H = wrap.clientHeight || 600, pad = 30;
  const b = m.bounds, bw = Math.max(1, b.maxX - b.minX), bh = Math.max(1, b.maxY - b.minY);
  const k = Math.max(0.02, Math.min(30, Math.min((W - 2 * pad) / bw, (H - 2 * pad) / bh)));
  S.view = { k, tx: W / 2 - (b.minX + bw / 2) * k, ty: H / 2 - (b.minY + bh / 2) * k };
  S.autoFit = true;
  applyView();
}

function zoomAt(factor, cx, cy) {
  const v = S.view;
  const k = Math.max(0.02, Math.min(40, v.k * factor));
  const f = k / v.k;
  S.view = { k, tx: cx - (cx - v.tx) * f, ty: cy - (cy - v.ty) * f };
  S.autoFit = false;
  applyView();
}

function initPanZoom() {
  let drag = null;
  mapEl.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, tx: S.view.tx, ty: S.view.ty, moved: false, target: e.target.closest ? e.target.closest('[data-kind]') : null };
    mapEl.setPointerCapture(e.pointerId);
  });
  mapEl.addEventListener('pointermove', e => {
    if (drag && drag.id === e.pointerId) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; mapEl.classList.add('dragging'); }
      if (drag.moved) { S.view = { k: S.view.k, tx: drag.tx + dx, ty: drag.ty + dy }; S.autoFit = false; applyView(); return; }
    }
    hoverAt(e);
  });
  const end = e => {
    if (!drag || drag.id !== e.pointerId) return;
    const wasClick = !drag.moved && e.type === 'pointerup';
    const target = drag.target;
    drag = null;
    mapEl.classList.remove('dragging');
    if (wasClick && S.measure.on) { pickMeasureHex(e); return; }
    const kind = target && target.getAttribute('data-kind');
    if (wasClick && kind === 'force') selectEntity({ type: 'force', id: Number(target.getAttribute('data-id')) });
    else if (wasClick && kind === 'base') selectBase(Number(target.getAttribute('data-id')));
    else if (wasClick && kind === 'tally') selectTally(target.getAttribute('data-id'));
  };
  mapEl.addEventListener('pointerup', end);
  mapEl.addEventListener('pointercancel', end);
  mapEl.addEventListener('pointerleave', () => { if (!drag) hoverClear(); });
  mapEl.addEventListener('wheel', e => {
    e.preventDefault();
    const r = mapEl.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  $('zin').addEventListener('click', () => zoomAt(1.4, wrap.clientWidth / 2, wrap.clientHeight / 2));
  $('zout').addEventListener('click', () => zoomAt(1 / 1.4, wrap.clientWidth / 2, wrap.clientHeight / 2));
  $('zfit').addEventListener('click', fit);
  new ResizeObserver(() => { if (S.autoFit) fit(); else scheduleScreen(); }).observe(wrap);
}

// =====================================================================
// Hover readout
// =====================================================================
function hoverAt(e) {
  if (!S.model) return;
  const r = mapEl.getBoundingClientRect();
  const x = (e.clientX - r.left - S.view.tx) / S.view.k, y = (e.clientY - r.top - S.view.ty) / S.view.k;
  const h = C.pointToHex(x, y);
  const key = C.hexKey(h.q, h.r);
  if (key === S.hoverKey) return;
  S.hoverKey = key;
  renderReadout();
}
function hoverClear() { S.hoverKey = null; renderReadout(); }

function renderReadout() {
  const box = $('readout'), m = S.model;
  clear(box); clear(gHover);
  if (!m || !S.hoverKey) { box.append(el('div', { class: 'dim', text: m ? 'Move the pointer over the map.' : 'No replay loaded.' })); return; }
  const [q, r] = S.hoverKey.split(',').map(Number);
  const hx = m.hexByKey.get(S.hoverKey), st = m.states[S.step];
  const line = (t) => box.append(el('div', { text: t }));
  if (!hx) { line('Hex (' + q + ', ' + r + '): off the map'); return; }
  gHover.append(sv('polygon', { class: 'hover-hex', points: C.hexCorners(q, r).map(c => c.join(',')).join(' ') }));
  line('Hex (' + q + ', ' + r + '): ' + String(hx.kind).replace('_', ' ') + (typeof hx.land_percent === 'number' ? ', ' + hx.land_percent + '% land' : '') + (hx.terrain ? ', ' + hx.terrain : ''));
  if (typeof hx.lat === 'number') line('Lat ' + hx.lat + ', lon ' + hx.lon);
  const feat = [];
  if (hx.port_size) feat.push('port size ' + hx.port_size);
  if (hx.airfield_size) feat.push('airfield size ' + hx.airfield_size);
  if (hx.anchorage) feat.push('anchorage');
  if (feat.length) line(feat.join(', '));
  if ((hx.closed || []).length) line('Closed sides: ' + hx.closed.join(', '));
  for (const p of m.placementsByHex.get(S.hoverKey) || []) line('Place: ' + p.label.place + (p.label.feature ? ' (' + p.label.feature + ')' : ''));
  for (const b of m.basesByHex.get(S.hoverKey) || []) line('Base: ' + b.name + ' (' + holderOf(st, b) + (b.side !== holderOf(st, b) ? ', taken from the ' + b.side + ' side' : '') + (b.supply !== undefined ? ', supply ' + b.supply : '') + ')');
  const formed = st.formedBases && st.formedBases.get(S.hoverKey);
  if (formed) line('Base ' + formed.id + ' (' + formed.side + '): formed by a landing');
  if (st.landUnits) for (const u of st.landUnits.values()) if (u.hex && u.hex[0] === q && u.hex[1] === r && u.men_ashore > 0) line('Land unit: ' + u.name + (u.side ? ' (' + u.side + ')' : '') + ', ' + u.men_ashore + ' men ashore' + (u.posture === 'attack' ? ', on attack' : '') + (u.fatigue > 0 ? ', fatigue ' + u.fatigue : '') + (u.fed_share !== undefined && u.fed_share < 1 ? ', fed share ' + u.fed_share : ''));
  for (const f of st.forces.values()) if (f.q === q && f.r === r) line('Force: TF' + f.id + ' ' + f.name + ' (' + f.side + '), ' + f.ships.length + ' ship(s) afloat');
  if (S.belief !== 'truth' && st.contacts[S.belief]) {
    for (const c of st.contacts[S.belief].values()) if (c.hex[0] === q && c.hex[1] === r) line('Contact (' + S.belief + ' belief): ' + ghostText(c));
  }
  if (st.fights.some(f => f.q === q && f.r === r)) line('A fight is recorded here in this step.');
}

// =====================================================================
// The view: the umpire's truth, or one side's page built from what the engine let that side see
// =====================================================================
function beliefChoice() {
  const c = document.querySelector('input[name=belief]:checked'); // the browser may restore form state on reload
  return c ? c.value : 'truth';
}

function initPov() {
  const has = !!(S.replay && S.replay.side_views);
  document.querySelectorAll('input[name=pov]').forEach(r => { r.checked = r.value === S.pov; r.disabled = r.value !== 'umpire' && !has; });
  $('povset').title = has ? '' : 'This file has no side views (replay version 1). Export it again to see a side\'s view.';
  applyPovChrome();
}

function applyPovChrome() {
  const side = S.pov !== 'umpire';
  $('belief').hidden = side;
  $('readonly').textContent = side ? S.pov.charAt(0).toUpperCase() + S.pov.slice(1) + ' side: only what it was allowed to know, read-only' : "Umpire's view, read-only";
  renderLegend();
}

/** Changes the view, keeping the step nearest the one on screen (the steps of a side are the ones in which it has events). */
function setPov(pov) {
  if (!S.models || pov === S.pov) return;
  let model = S.models[pov];
  if (!model) {
    try { model = C.buildModel(C.sideReplay(S.replay, pov)); }
    catch (err) { showMessage('Could not build the ' + pov + ' view: ' + err.message); initPov(); return; }
    S.models[pov] = model;
  }
  const key = s => s.day * 10 + (s.phase === 'start' ? -1 : C.PHASES.indexOf(s.phase));
  const here = key(S.model.steps[S.step]);
  let idx = 0;
  model.steps.forEach((s, i) => { if (key(s) <= here) idx = i; });
  stopPlaying();
  S.pov = pov; S.model = model; S.step = idx; S.selEvent = null; S.selEntity = null; S.hoverKey = null; resetAirSelection();
  S.belief = pov === 'umpire' ? beliefChoice() : pov; // a side shows the contacts it holds, and no others
  buildWorld();
  initHeader();
  initPov();
  render();
  renderReadout();
  renderMeasure();
}

// =====================================================================
// Measuring: two hexes, the air distance and the sea route (decisions 0040, 0017)
// =====================================================================
function setMeasureMode(on) {
  S.measure.on = on;
  if (!on) { S.measure.a = null; S.measure.b = null; }
  const btn = $('measurebtn');
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  mapEl.classList.toggle('measuring', on);
  renderMeasure();
}

function pickMeasureHex(e) {
  if (!S.model) return;
  const r = mapEl.getBoundingClientRect();
  const h = C.pointToHex((e.clientX - r.left - S.view.tx) / S.view.k, (e.clientY - r.top - S.view.ty) / S.view.k);
  if (!S.model.hexByKey.has(C.hexKey(h.q, h.r))) return; // off the map: not a hex to measure
  const m = S.measure;
  if (!m.a || m.b) { m.a = [h.q, h.r]; m.b = null; } // the first pick, or a third click starting again
  else m.b = [h.q, h.r];
  renderMeasure();
}

function renderMeasure() {
  const m = S.measure, box = $('measurebox');
  clear(gMeasure); clear(box);
  box.hidden = !m.on || !S.model;
  if (box.hidden) return;
  const line = (t, cls) => box.append(el('div', { class: cls, text: t }));
  const hexLine = (label, h) => {
    const hx = S.model.hexByKey.get(C.hexKey(h[0], h[1]));
    line(label + ' (' + h[0] + ', ' + h[1] + ')' + (hx ? ', ' + String(hx.kind).replace('_', ' ') : ''));
  };
  const ring = h => gMeasure.append(sv('polygon', { class: 'measure-end', points: C.hexCorners(h[0], h[1]).map(c => c.join(',')).join(' ') }));
  line('Measure', 'big');
  if (!m.a) { line('Click a first hex. Escape leaves.', 'dim'); return; }
  ring(m.a);
  hexLine('From', m.a);
  if (!m.b) { line('Click a second hex.', 'dim'); return; }
  ring(m.b);
  hexLine('To', m.b);
  const res = C.measureHexes(S.sea, m.a, m.b);
  const ca = C.hexCenter(m.a[0], m.a[1]), cb = C.hexCenter(m.b[0], m.b[1]);
  gMeasure.append(sv('line', { class: 'measure-air', x1: ca[0], y1: ca[1], x2: cb[0], y2: cb[1] }));
  if (res.sea) {
    const pts = [m.a].concat(res.sea.path).map(h => C.hexCenter(h[0], h[1]).join(','));
    if (pts.length > 1) gMeasure.append(sv('polyline', { class: 'measure-sea', points: pts.join(' ') }));
  }
  line('Air distance: ' + res.air + ' nm', 'big');
  line(res.sea ? 'Sea route: ' + res.sea.nm + ' nm charged, ' + res.sea.steps + ' hex' + (res.sea.steps === 1 ? '' : 'es') : 'Sea route: no sea route', 'big');
  line('Click again to start over.', 'dim');
}

function initMeasure() {
  $('measurebtn').addEventListener('click', e => { setMeasureMode(!S.measure.on); e.currentTarget.blur(); });
}

// =====================================================================
// Time controls
// =====================================================================
function goto(i) {
  const m = S.model;
  if (!m) return;
  const to = Math.max(0, Math.min(m.steps.length - 1, i));
  if (to !== S.step) { S.selEvents = null; S.selEventsHex = null; } // the events of an air fight are of one step
  S.step = to;
  render();
}
function stopPlaying() {
  S.playing = false;
  if (S.timer) clearTimeout(S.timer);
  S.timer = null;
  $('play').textContent = 'Play';
}
function tick() {
  if (!S.playing) return;
  if (S.step >= S.model.steps.length - 1) { stopPlaying(); return; }
  goto(S.step + 1);
  S.timer = setTimeout(tick, 1000 / S.speed);
}
function togglePlay() {
  if (!S.model) return;
  if (S.playing) { stopPlaying(); return; }
  if (S.step >= S.model.steps.length - 1) goto(0);
  S.playing = true;
  $('play').textContent = 'Pause';
  S.timer = setTimeout(tick, 1000 / S.speed);
}
function renderControls() {
  const m = S.model, n = m ? m.steps.length : 1;
  const slider = $('slider');
  slider.max = String(n - 1);
  slider.value = String(S.step);
  slider.disabled = !m || n < 2;
  for (const id of ['prev', 'next', 'play']) $(id).disabled = !m || n < 2;
  $('stepcount').textContent = (S.step) + ' / ' + (n - 1);
}
function initControls() {
  const blurAfter = b => b.addEventListener('click', () => b.blur());
  $('prev').addEventListener('click', () => { stopPlaying(); goto(S.step - 1); });
  $('next').addEventListener('click', () => { stopPlaying(); goto(S.step + 1); });
  $('play').addEventListener('click', togglePlay);
  ['prev', 'next', 'play'].forEach(id => blurAfter($(id)));
  $('slider').addEventListener('input', e => { stopPlaying(); goto(Number(e.target.value)); });
  $('speed').addEventListener('change', e => { S.speed = Number(e.target.value) || 1; e.target.blur(); });
  document.addEventListener('keydown', e => {
    const t = e.target, tag = t && t.tagName;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') { if (S.measure.on) setMeasureMode(false); else clearSelection(); return; }
    if (tag === 'TEXTAREA' || tag === 'SELECT' || (tag === 'INPUT' && (t.type === 'text' || t.type === 'search'))) return; // typing in the filter box
    if (tag === 'INPUT' && t.type === 'checkbox' && (e.key === ' ' || e.code === 'Space')) return; // Space toggles the checkbox
    if (!S.model) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); stopPlaying(); goto(S.step - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stopPlaying(); goto(S.step + 1); }
    else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePlay(); }
  });
  document.querySelectorAll('input[name=pov]').forEach(r => r.addEventListener('change', () => { if (r.checked) { r.blur(); setPov(r.value); } }));
  document.querySelectorAll('input[name=belief]').forEach(r => r.addEventListener('change', () => { if (r.checked) { S.belief = r.value; r.blur(); render(); renderReadout(); } }));
}

// =====================================================================
// Events panel
// =====================================================================
function renderEvents() {
  const m = S.model, ul = $('evlist');
  clear(ul);
  $('selname').textContent = S.selEntity ? '(' + entityName(S.selEntity) + ')' : '(nothing selected)';
  if (!m) { ul.append(el('li', { class: 'empty', text: 'No replay loaded.' })); $('evinfo').textContent = ''; return; }
  const sel = S.onlySel ? S.selEntity : null;
  const steps = S.allSteps ? m.steps : [m.steps[S.step]];
  let shown = 0, total = 0, truncated = false;
  const LIMIT = 2000;
  if (S.selEvents) {
    const hx = S.selEventsHex ? S.selEventsHex.split(',') : [];
    ul.append(el('li', { class: 'banner', title: 'Show every event of the step again', onclick: clearEventSet }, S.selEvents.size + ' events of the air fight at (' + hx[0] + ', ' + hx[1] + ') — show all'));
  }
  for (const step of steps) {
    const rows = [];
    for (const ei of step.events) {
      const ev = m.events[ei];
      if (S.selEvents && !S.selEvents.has(ev.id)) continue;
      total++;
      if (C.eventMatches(m, ev, S.filter, sel)) rows.push(ev);
    }
    if (!rows.length) continue;
    if (S.allSteps) ul.append(el('li', { class: 'grp', title: 'Go to this step', onclick: () => { stopPlaying(); goto(step.index); } }, step.label));
    for (const ev of rows) {
      if (shown >= LIMIT) { truncated = true; break; }
      shown++;
      const parts = C.splitText(ev.text);
      const li = el('li', { class: 'ev' + (S.selEvents ? ' air' : '') + (S.selEvent === ev.id ? ' sel' : ''), 'data-id': ev.id, onclick: () => clickEvent(ev.id) },
        el('span', { class: 'eid', text: '#' + ev.id }),
        ev.cut ? el('span', { class: 'tag', text: 'cut', title: 'The engine shows this side only part of this event' }) : null,
        el('span', { text: parts.body }),
        parts.causes ? el('span', { class: 'ecause', text: '← ' + parts.causes }) : null,
        ev.hidden_causes ? el('span', { class: 'ecause', text: '(and causes this side cannot see)' }) : null);
      ul.append(li);
    }
  }
  if (!shown) ul.append(el('li', { class: 'empty', text: S.model.steps[S.step].phase === 'start' && !S.allSteps ? 'Start: the initial state. Step forward to see events.' : 'No events match.' }));
  if (truncated) ul.append(el('li', { class: 'empty', text: 'List cut off at ' + LIMIT + ' events. Narrow the filter.' }));
  $('evinfo').textContent = shown + ' of ' + total + ' shown';
  const selRow = ul.querySelector('li.sel');
  if (selRow) selRow.scrollIntoView({ block: 'nearest' });
}

function clickEvent(id) {
  if (S.selEvent === id) { S.selEvent = null; render(); return; }
  selectEvent(id);
}

function entityName(sel) {
  if (!sel) return '';
  if (sel.type === 'force') return 'TF' + sel.id;
  return 'ship ' + sel.id;
}

// =====================================================================
// Selection
// =====================================================================
function selectEvent(id) {
  const m = S.model;
  if (!m || !m.eventById.has(id)) return;
  S.selEvent = id;
  if (S.selEvents && !S.selEvents.has(id)) { S.selEvents = null; S.selEventsHex = null; }
  const si = m.stepOfEvent.get(id);
  if (si !== undefined && si !== S.step) { stopPlaying(); S.step = si; }
  render();
}
function selectEntity(sel) {
  if (S.selEntity && S.selEntity.type === sel.type && S.selEntity.id === sel.id) S.selEntity = null;
  else S.selEntity = sel;
  S.selBase = null; S.selAirGroup = null;
  render();
}
function selectBase(id) {
  S.selBase = S.selBase === id ? null : id;
  S.selEntity = null; S.selAirGroup = null;
  render();
}
function selectAirGroup(id) {
  S.selAirGroup = S.selAirGroup === id ? null : id;
  render();
}
function resetAirSelection() { S.selEvents = null; S.selEventsHex = null; S.selAirGroup = null; S.selBase = null; }
/** A click on a tally: the list shows only the events of that air fight, and the raid's key event is selected so that Why and Led to show its causes. */
function selectTally(key) {
  const m = S.model, t = m && m.states[S.step].air.tallies.find(x => x.key === key);
  if (!t) return;
  if (S.selEvents && S.selEventsHex === key) { S.selEvents = null; S.selEventsHex = null; S.selEvent = null; render(); return; }
  S.selEvents = new Set(t.events); S.selEventsHex = key;
  S.selEvent = t.keyEvent;
  render();
}
function clearEventSet() { S.selEvents = null; S.selEventsHex = null; render(); }
function clearSelection() {
  if (S.selEvent == null && !S.selEntity && !S.selEvents && S.selBase == null && S.selAirGroup == null) return;
  S.selEvent = null; S.selEntity = null; resetAirSelection();
  render();
}

// =====================================================================
// Why / Led to, breakdown, and entity details
// =====================================================================
function eventLink(id) {
  const ev = S.model.eventById.get(id);
  const a = el('span', { class: 'link', title: 'Jump to this event', onclick: e => { e.preventDefault(); e.stopPropagation(); selectEvent(id); } }, '#' + id);
  return [a, ' ', ev ? C.splitText(ev.text).body : '(event not in this file)'];
}
function orderLine(o, id) {
  if (!o) return ['order ' + id + ' (not in this file)'];
  return [el('span', { class: 'tag', text: 'order ' + o.id }), (o.side || '?') + ', ' + (o.issuer || '?') + ': ', String(o.text)];
}
function whyNode(n) {
  if (n.kind === 'order') return el('li', null, orderLine(n.obj, n.id));
  const head = n.obj ? eventLink(n.id) : ['#' + n.id + ' (event not in this file)'];
  if (n.repeat) return el('li', null, head, el('span', { class: 'dim', text: ' (shown above)' }));
  if (!n.children.length && !n.cutoff) return el('li', { class: 'leaf' }, head);
  const kids = el('ul', null, n.children.map(whyNode));
  if (n.cutoff) kids.append(el('li', { class: 'dim', text: '... ' + n.cutoff + ' more cause(s) not expanded; jump to the event to continue' }));
  const det = el('details', null, el('summary', null, head), kids);
  det.open = true;
  return el('li', null, det);
}

function renderDetail() {
  const m = S.model, box = $('detail');
  clear(box);
  if (!m) { box.append(el('div', { class: 'empty', text: 'Open a replay file to begin.' })); return; }
  let any = false;
  if (S.selEntity) { box.append(entitySection(S.selEntity)); any = true; }
  if (S.selBase != null) { box.append(baseSection(S.selBase)); any = true; }
  if (S.selEvent != null) { box.append(eventSection(S.selEvent)); any = true; }
  if (!any) box.append(el('div', { class: 'empty', text: 'Click an event to see why it happened, or a force counter on the map to see its ships. Escape clears the selection.' }));
}

function eventSection(id) {
  const m = S.model, ev = m.eventById.get(id);
  const sec = el('section');
  if (!ev) return sec;
  sec.append(el('h2', null, 'Event #' + ev.id + ' ', el('span', { class: 'tag', text: ev.kind }), el('span', { class: 'dim', text: ' ' + m.steps[m.stepOfEvent.get(ev.id) || 0].label })));
  sec.append(el('div', { text: C.splitText(ev.text).body }));
  if (ev.cut) sec.append(el('div', { class: 'note', text: 'This side is shown only part of this event: what it may not know has been left out.' }));
  if (ev.breakdown && Array.isArray(ev.breakdown.factors)) {
    sec.append(el('h3', { text: 'Breakdown' }));
    const rows = ev.breakdown.factors.map(f => el('tr', null, el('td', { text: String(f.name) }), el('td', { class: 'num', text: String(f.value) })));
    if (ev.breakdown.result !== undefined) rows.push(el('tr', { class: 'result' }, el('td', { text: 'result' }), el('td', { class: 'num', text: String(ev.breakdown.result) })));
    sec.append(el('table', null, el('tbody', null, rows)));
  }
  sec.append(el('h3', { text: 'Why' }));
  const tree = C.whyTree(m, ev.id, { maxDepth: 8, maxNodes: 60 });
  if (!tree.nodes.length) sec.append(el('div', { class: 'dim', text: ev.hidden_causes ? 'No causes this side can see.' : 'No recorded causes.' }));
  else {
    const why = el('div', { class: 'why' }, el('ul', null, tree.nodes.map(whyNode)));
    if (tree.omitted) why.append(el('div', { class: 'dim', text: '... ' + tree.omitted + ' more cause(s) left out (limit ' + 60 + ' shown).' }));
    sec.append(why);
  }
  if (ev.hidden_causes) sec.append(el('div', { class: 'note', text: 'There are more causes than these, and this side cannot see them.' }));
  sec.append(el('h3', { text: 'Led to' }));
  const led = m.ledTo.get('event:' + ev.id) || [];
  if (!led.length) sec.append(el('div', { class: 'dim', text: 'No later event cites this one.' }));
  else {
    const ul = el('ul', { class: 'why' });
    led.slice(0, 30).forEach(id => ul.append(el('li', { class: 'leaf' }, eventLink(id))));
    sec.append(ul);
    if (led.length > 30) sec.append(el('div', { class: 'dim', text: '... and ' + (led.length - 30) + ' more.' }));
  }
  return sec;
}

function shipSummary(id, st) {
  const m = S.model;
  const fin = m.finalShips.get(id), ini = m.initShips.get(id);
  const s = fin || ini;
  const sunkNow = st.sunk.has(id);
  const row = el('div', { class: 'shiprow' + (S.selEntity && S.selEntity.type === 'ship' && S.selEntity.id === id ? ' sel' : ''), onclick: e => { e.stopPropagation(); selectEntity({ type: 'ship', id }); } });
  if (!s) { row.append(el('div', null, 'ship:' + id + ' (no record in this file)')); return row; }
  row.append(el('div', null, el('b', { text: s.name || ('ship ' + id) }), ' ', el('span', { class: 'dim', text: (s.class || '') + (s.kind ? ' (' + s.kind + ')' : '') + ', ship:' + id })));
  const bits = [];
  if (sunkNow) bits.push('SUNK by this step');
  else if (fin && fin.location === 'sunk') bits.push('afloat at this step; sunk later in the run');
  if (fin) {
    bits.push('flotation damage ' + fin.flotation_damage + ', fire damage ' + fin.fire_damage);
    const bad = Object.entries(fin.systems || {}).filter(([, v]) => v !== 'working').map(([k, v]) => k + ' ' + v);
    bits.push(bad.length ? 'systems not working: ' + bad.join(', ') : 'all systems working');
    bits.push('fuel ' + fin.fuel + ', gun rounds ' + fin.gun_rounds + ', torpedoes ' + (fin.torpedoes_ready ? 'ready' : 'not ready'));
  } else bits.push('no end-of-run record');
  row.append(el('div', { class: 'sub', text: bits.join('. ') + '.' }));
  return row;
}

function entitySection(sel) {
  const m = S.model, st = m.states[S.step];
  const sec = el('section');
  let fid = sel.type === 'force' ? sel.id : st.shipForce.get(sel.id);
  if (sel.type === 'ship' && fid === undefined) {
    sec.append(el('h2', { text: 'Ship ' + sel.id }));
    sec.append(shipSummary(sel.id, st));
    sec.append(el('div', { class: 'note', text: 'Damage, fuel and ammunition are as at the end of the run.' }));
    return sec;
  }
  const now = st.forces.get(fid), fin = m.finalForces.get(fid);
  sec.append(el('h2', null, 'TF' + fid + ' ', el('span', { class: 'dim', text: (now && now.name) || (fin && fin.name) || '' })));
  const kv = el('dl', { class: 'kv' });
  const add = (k, v) => { kv.append(el('dt', { text: k }), el('dd', { text: String(v) })); };
  const side = (now && now.side) || (fin && fin.side);
  add('Side', side || '?');
  if (now) {
    add('Readiness', now.readiness);
    // The flag follows the events for every force. A force at battle readiness is alert by its readiness
    // whatever the flag says, and the Readiness line above says so.
    add('Alerted', now.alerted ? 'yes' : 'no');
  } else if (fin) {
    add('Readiness (end of run)', fin.readiness);
    add('Alerted (end of run)', fin.alerted ? 'yes' : 'no');
  }
  if (now) add('Position now', '(' + now.q + ', ' + now.r + ')' + (now.detachedFrom != null ? ', detached from TF' + now.detachedFrom : ''));
  if (fin) {
    add('Mission', fin.mission);
    add('Status (end of run)', fin.status);
    if (fin.home_port != null) add('Home port', 'base:' + fin.home_port);
    const roe = fin.rules_of_engagement || {};
    add('Rules of engagement', Object.entries(roe).map(([k, v]) => k + ' ' + v).join(', '));
  } else add('Final record', 'none (not in the final state)');
  sec.append(kv);
  sec.append(el('h3', { text: 'Ships' }));
  const ships = [...st.shipForce.entries()].filter(([, f]) => f === fid).map(([s]) => s).sort((a, b) => a - b);
  if (!ships.length) sec.append(el('div', { class: 'dim', text: 'No ships.' }));
  ships.forEach(id => sec.append(shipSummary(id, st)));
  sec.append(el('div', { class: 'note', text: 'Damage, fuel and ammunition are as at the end of the run.' }));
  const shipSet = new Set(ships);
  sec.append(airGroupsBlock([...m.groupTable.values()].filter(g => g.ship !== null && shipSet.has(g.ship) && !st.sunk.has(g.ship) && (g.formedStep === undefined || g.formedStep <= S.step)), st));
  return sec;
}

/** The air groups listed for a force or a base, with their reach at this step; a click selects one and draws its rings. */
function airGroupsBlock(groups, st) {
  const m = S.model, box = el('div');
  box.append(el('h3', { text: 'Air groups' }));
  if (!groups.length) { box.append(el('div', { class: 'dim', text: 'No air groups here.' })); return box; }
  groups.sort((a, b) => a.id - b.id).forEach(g => {
    const info = C.airReach(m, st, g.id), t = info.type;
    const row = el('div', { class: 'airrow' + (S.selAirGroup === g.id ? ' sel' : ''), title: 'Show the reach rings of this group', onclick: e => { e.stopPropagation(); selectAirGroup(g.id); } });
    row.append(el('div', null, el('b', { text: g.name || ('air group ' + g.id) }), ' ', el('span', { class: 'dim', text: 'air_group:' + g.id })));
    const bits = [g.type || 'type unknown', 'mission ' + (st.mission.get(g.id) || 'none'), 'reach ' + info.reach];
    row.append(el('div', { class: 'sub', text: bits.join(', ') + (t ? ' (strike ' + t.strike_radius_nm + ', extended ' + t.extended_reach_nm + ', search ' + t.search_range_nm + ' nm)' : '') }));
    box.append(row);
  });
  if (S.replay.aircraft_types === undefined) box.append(el('div', { class: 'note', text: 'This replay carries no aircraft figures (version ' + S.replay.version + '); export it again for reach rings.' }));
  else if (S.selAirGroup !== null && !C.airReach(m, st, S.selAirGroup).type && groups.some(g => g.id === S.selAirGroup)) box.append(el('div', { class: 'note', text: 'This replay has no figures for the type of this group.' }));
  return box;
}

/** The side that holds a base at a step: the side the replay starts it with, changed by each base_changed_side event up to the step (decision 0090). */
function holderOf(st, b) { return (st && st.baseSide && st.baseSide.get(b.id)) || b.side; }

function baseSection(id) {
  const m = S.model, st = m.states[S.step], b = m.bases.get(id);
  const sec = el('section');
  if (!b) { sec.append(el('h2', { text: 'Base ' + id })); return sec; }
  sec.append(el('h2', null, (b.name || 'base') + ' ', el('span', { class: 'dim', text: 'base:' + id })));
  const kv = el('dl', { class: 'kv' });
  kv.append(el('dt', { text: 'Side' }), el('dd', { text: holderOf(st, b) || '?' }), el('dt', { text: 'Hex' }), el('dd', { text: '(' + b.q + ', ' + b.r + ')' }));
  sec.append(kv);
  const baseOf = g => (st.groupBase && st.groupBase.has(g.id) ? st.groupBase.get(g.id) : g.base);
  sec.append(airGroupsBlock([...m.groupTable.values()].filter(g => baseOf(g) === id && (g.formedStep === undefined || g.formedStep <= S.step)), st));
  return sec;
}

// =====================================================================
// Legend and theme (colours come from CSS custom properties; the page follows prefers-color-scheme)
// =====================================================================
function initLegend() {
  if (window.innerWidth < 1000 || window.innerHeight < 700) $('legend').open = false; // small windows: start collapsed
  renderLegend();
}

// A side's legend names only that side's forces: the enemy is not on its page except as contacts.
function renderLegend() {
  const side = S.pov !== 'umpire' ? S.pov : null;
  const items = [
    ...(!side || side === 'allied' ? [['allied', side ? 'Own force' : 'Allied force']] : []),
    ...(!side || side === 'japanese' ? [['japanese', side ? 'Own force' : 'Japanese force']] : []),
    ['ghost', side ? 'Contact this side holds, fainter when less sure' : 'Contact (belief), fainter when less sure'],
    ['deep', 'Deep sea'], ['shallow', 'Shallow sea'], ['coast', 'Coast (more land, darker)'], ['land', 'Land'],
    ['closed', 'Closed side'], ['fight', side ? 'Fight this side knows of, in this step' : 'Fight in this step'], ['arc', 'Search arc flown in this step'],
    ['trail', 'Trail of hexes entered'], ['move', 'Movement in this step'],
    ...(S.model && S.model.hasAir ? [
      ['sighted', side ? 'Sighting this side was told of, where the report put it' : 'Sighting, where the report put it (faint line to where the force truly was)'],
      ...(side ? [] : [['miss', 'Search that missed the force it looked for, where the force truly was']]),
      ['raid', side ? 'Own strike that found its target (arrow), with its aircraft and escorts' : 'Strike that found its target (arrow), with its aircraft and escorts'],
      ['raid-nothing', 'Strike that found nothing at the hex it was sent to (hollow ring)' + (side ? '' : '; a grey line shows where the target truly was')],
      ['raid-none', 'Strike with no bomber through (dotted)'],
      ['tally', side ? 'Fight over a target hex as this side knows it: click for its events' : 'Fight over a target hex: click for its events'],
      ['ring', 'Reach of a selected air group: strike, extended and search rings'],
    ] : []),
  ];
  const ul = $('legendlist');
  clear(ul);
  items.forEach(([cls, text]) => ul.append(el('li', null, el('span', { class: 'sw ' + cls }), text)));
}

// =====================================================================
// Render everything for the current step
// =====================================================================
function render() {
  renderControls();
  if (!S.model) { renderEvents(); renderDetail(); return; }
  renderHeaderStep();
  renderDynamic();
  scheduleScreen();
  renderEvents();
  renderDetail();
  if (S.hoverKey) renderReadout();
}

function init() {
  initLegend();
  initControls();
  S.belief = beliefChoice();
  initPanZoom();
  initMeasure();
  $('airon').addEventListener('change', e => { S.air = e.target.checked; e.target.blur(); render(); });
  $('filter').addEventListener('input', e => { S.filter = e.target.value.trim(); renderEvents(); });
  $('onlysel').addEventListener('change', e => { S.onlySel = e.target.checked; renderEvents(); });
  $('allsteps').addEventListener('change', e => { S.allSteps = e.target.checked; renderEvents(); });
  render();
  renderReadout();
  initLoading();
}
init();
})();
</script>
</body>
</html>
