<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Plot replay viewer</title>
<!--
  Flag Plot replay viewer. An umpire's debugging tool: read-only, offline, one file.
  See docs/decisions/0018-replay-viewer.md. Nothing that plays the game may use it.
  Two script blocks: #core (pure functions, also run by check.js) and #ui (everything that touches the page).
-->
<style>
:root {
  --bg: #f4f4f1; --panel: #ffffff; --ink: #1d2024; --dim: #596068; --line: #cdd1d4;
  --accent: #2a5db0; --halo: #eef3f6;
  --sea-deep: #bfd3e4; --sea-shallow: #d6e6f0; --coast: #ebe1bd; --land: #aebf86;
  --hexline: rgba(40, 60, 80, 0.16); --closed: #20242a;
  --allied: #1f4fa3; --allied-ink: #ffffff; --japanese: #c4361f; --japanese-ink: #ffffff;
  --edge: #ffffff; --fight: #d1137a; --hl: #f0a500; --warn-bg: #fff1c2; --warn-ink: #5a4300; --bad-bg: #fbd9d4; --bad-ink: #6b1308;
  --hover: rgba(0, 0, 0, 0.5);
  --air-miss: #5d6770; --air-true: #3b4650; --tally-bg: rgba(255, 255, 255, 0.94); --tally-edge: #7d8891;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --panel: #1e2226; --ink: #e5e7e9; --dim: #a0a8b0; --line: #3a4147;
    --accent: #7fb0ff; --halo: #16222c;
    --sea-deep: #132638; --sea-shallow: #1b3347; --coast: #54503a; --land: #43552f;
    --hexline: rgba(170, 200, 230, 0.16); --closed: #f2f2ee;
    --allied: #6aa3f5; --allied-ink: #08182e; --japanese: #f2705a; --japanese-ink: #2b0c06;
    --edge: #0d0f11; --fight: #ff63b0; --hl: #ffd04a; --warn-bg: #4a3d0c; --warn-ink: #ffe9a6; --bad-bg: #5a1c14; --bad-ink: #ffd6cf;
    --hover: rgba(255, 255, 255, 0.6);
    --air-miss: #a6b0b9; --air-true: #c9d1d8; --tally-bg: rgba(30, 34, 38, 0.94); --tally-edge: #7d8891;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; overflow: auto; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=text], input[type=search], select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }

/* Header */
#top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; flex: none; }
#top .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 26px; }
h1 { font-size: 15px; margin: 0; font-weight: 650; }
.spacer { flex: 1; }
.dim { color: var(--dim); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
.badge.bad { background: var(--bad-bg); color: var(--bad-ink); }
.filebtn { position: relative; display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; background: var(--bg); }
.filebtn:hover, .filebtn:focus-within { border-color: var(--accent); }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
fieldset.belief { border: 0; padding: 0; margin: 0; display: flex; gap: 12px; align-items: center; }
fieldset.belief legend { float: left; padding: 0; margin-right: 8px; color: var(--dim); }
fieldset.belief label { cursor: pointer; white-space: nowrap; }
#msg { flex: none; padding: 8px 12px; background: var(--bad-bg); color: var(--bad-ink); border-bottom: 1px solid var(--line); }
#msg.info { background: var(--warn-bg); color: var(--warn-ink); }

/* Layout */
/* The map and the event panel never shrink below a usable size: in a short or
   narrow window the page scrolls instead, and the step controls stay in view. */
main { flex: 1 0 0; min-height: 420px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr); }
@media (max-width: 960px) { main { grid-template-columns: minmax(0, 1fr) 320px; } }
@media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: minmax(340px, 55vh) minmax(320px, 45vh); min-height: 660px; } }
#mapwrap { position: relative; min-width: 0; min-height: 0; background: var(--sea-deep); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; user-select: none; }
#map.dragging { cursor: grabbing; }
.dropping #mapwrap { outline: 3px dashed var(--accent); outline-offset: -4px; }
#panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
@media (max-width: 700px) { #panel { border-left: 0; border-top: 1px solid var(--line); } }

/* Map decoration */
.maptool { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 12px; }
#mapbtns { top: 8px; left: 8px; display: flex; gap: 4px; padding: 4px; }
#mapbtns button { min-width: 30px; padding: 2px 8px; }
#mapbtns button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--panel)); }
#map.measuring { cursor: crosshair; }
#measurebox { left: 8px; top: 48px; max-width: min(330px, calc(100% - 180px)); font-size: 12.5px; }
#measurebox div { overflow-wrap: anywhere; }
#measurebox .big { font-weight: 650; }
.measure-air { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; pointer-events: none; }
.measure-sea { fill: none; stroke: var(--hl); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.measure-end { fill: color-mix(in srgb, var(--hl) 25%, transparent); stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
#north { top: 8px; left: 262px; padding: 2px 8px; display: flex; align-items: center; gap: 4px; }
#scalebar { right: 10px; bottom: 10px; }
#scalebar .bar { height: 6px; border: 2px solid var(--ink); border-top: 0; margin-top: 2px; }
#readout { left: 8px; bottom: 8px; max-width: min(430px, calc(100% - 180px)); font-size: 12.5px; pointer-events: none; }
#readout div { overflow-wrap: anywhere; }
#legend { right: 10px; top: 8px; max-width: 250px; }
#legend summary { cursor: pointer; font-weight: 600; }
#legend ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 3px; }
#legend li { display: flex; gap: 8px; align-items: center; }
.sw { flex: none; width: 24px; height: 14px; display: inline-block; border: 1px solid var(--line); }
.sw.deep { background: var(--sea-deep); } .sw.shallow { background: var(--sea-shallow); } .sw.coast { background: var(--coast); } .sw.land { background: var(--land); }
.sw.allied { background: var(--allied); border-color: var(--edge); border-radius: 3px; }
.sw.japanese { background: var(--japanese); border-color: var(--edge); clip-path: polygon(0 30%, 20% 0, 80% 0, 100% 30%, 100% 70%, 80% 100%, 20% 100%, 0 70%); border: 0; }
.sw.ghost { border: 2px dashed var(--allied); background: transparent; opacity: 0.7; }
.sw.closed { height: 0; border: 0; border-top: 3px solid var(--closed); }
.sw.fight { border: 3px solid var(--fight); border-radius: 50%; width: 16px; height: 16px; margin: 0 4px; }
.sw.arc { background: color-mix(in srgb, var(--allied) 18%, transparent); border: 1px dashed var(--allied); clip-path: polygon(0 100%, 0 20%, 100% 0, 100% 100%); }
.sw.trail { height: 0; border: 0; border-top: 2px solid var(--allied); opacity: 0.5; }
.sw.move { height: 0; border: 0; border-top: 4px solid var(--allied); }
.sw.sighted { width: 12px; height: 12px; margin: 0 6px; background: var(--allied); border: 1px solid var(--edge); transform: rotate(45deg) scale(0.8); }
.sw.miss { width: 12px; height: 12px; margin: 0 6px; border: 2px dashed var(--air-miss); border-radius: 50%; background: transparent; }
.sw.raid { height: 0; border: 0; border-top: 3px solid var(--allied); }
.sw.raid-nothing { height: 0; border: 0; border-top: 3px dashed var(--allied); }
.sw.raid-none { height: 0; border: 0; border-top: 2px dotted var(--allied); }
.sw.tally { background: var(--tally-bg); border-color: var(--tally-edge); border-radius: 3px; }
.sw.ring { height: 14px; width: 14px; margin: 0 5px; border: 1.5px dashed var(--allied); border-radius: 50%; background: transparent; }
#airtoggle { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; cursor: pointer; white-space: nowrap; }
#airtoggle.off { opacity: 0.55; cursor: default; }

/* SVG */
.hex { stroke: var(--hexline); stroke-width: 1; vector-effect: non-scaling-stroke; }
.hex.deep_sea { fill: var(--sea-deep); } .hex.shallow_sea { fill: var(--sea-shallow); } .hex.coast { fill: var(--coast); } .hex.land { fill: var(--land); }
.closed-line { fill: none; stroke: var(--closed); stroke-width: 2.4; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.closed-line.inland { stroke-width: 1; opacity: 0.55; }
.hover-hex { fill: none; stroke: var(--hover); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.fight-ring { fill: none; stroke: var(--fight); stroke-width: 3; vector-effect: non-scaling-stroke; }
.fight-ring.inner { stroke-width: 1.5; stroke-dasharray: 4 3; }
.trail { fill: none; stroke-width: 1.6; opacity: 0.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.move { fill: none; stroke-width: 4; opacity: 0.9; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.arc { stroke-width: 1.2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.side-allied { --sc: var(--allied); --si: var(--allied-ink); }
.side-japanese { --sc: var(--japanese); --si: var(--japanese-ink); }
.trail.side-allied, .move.side-allied, .arc.side-allied, .trail.side-japanese, .move.side-japanese, .arc.side-japanese { stroke: var(--sc); }
.arc { fill: color-mix(in srgb, var(--sc) 14%, transparent); }
svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; }
.lbl { fill: var(--ink); stroke: var(--halo); stroke-width: 3.5px; paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
.lbl.place { font-style: italic; fill: var(--dim); }
.lbl.base { font-weight: 650; }
.feat { fill: var(--ink); opacity: 0.7; font-size: 12px; pointer-events: none; }
.counter { cursor: pointer; }
.counter .shape { fill: var(--sc); stroke: var(--edge); stroke-width: 1.5; }
.counter text { fill: var(--si); font-weight: 700; text-anchor: middle; pointer-events: none; }
.counter.hollow .shape { fill: var(--panel); stroke: var(--sc); stroke-width: 2; stroke-dasharray: 3 2; }
.counter.hollow text { fill: var(--sc); }
.counter .strike { stroke: var(--sc); stroke-width: 2; }
.ring-hl { fill: none; stroke: var(--hl); stroke-width: 3.5; pointer-events: none; }
.ring-sel { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 3; pointer-events: none; }
.ghost .gshape { fill: color-mix(in srgb, var(--sc) 12%, transparent); stroke: var(--sc); stroke-width: 2; stroke-dasharray: 5 3; }
.ghost text { fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; text-anchor: middle; }
.basemark { fill: var(--panel); stroke: var(--ink); stroke-width: 1.6; }
.basemark.side-allied { fill: var(--allied); stroke: var(--edge); }
.basemark.side-japanese { fill: var(--japanese); stroke: var(--edge); }
.base { cursor: pointer; }

/* Air layer: lines and marks sit under the counters, the tally boxes and their labels above them */
.air-line { fill: none; stroke: var(--sc); stroke-linecap: round; pointer-events: none; }
.air-line.found { stroke-width: 2.6; opacity: 0.85; }
.air-line.nothing { stroke-width: 2.2; stroke-dasharray: 7 5; opacity: 0.85; }
.air-line.none { stroke-width: 1.3; stroke-dasharray: 1.5 4; opacity: 0.9; }
.air-head { fill: var(--sc); stroke: var(--edge); stroke-width: 0.8; pointer-events: none; }
.air-end { fill: var(--sc); stroke: var(--edge); stroke-width: 1.2; pointer-events: none; }
.air-end.hollow { fill: var(--panel); stroke: var(--sc); stroke-width: 2; }
.air-from { fill: var(--sc); stroke: var(--edge); stroke-width: 1; pointer-events: none; }
.air-true { fill: none; stroke: var(--air-true); stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.75; pointer-events: none; }
.air-truedot { fill: var(--air-true); opacity: 0.8; pointer-events: none; }
.air-sighted { fill: var(--sc); stroke: var(--edge); stroke-width: 1.2; pointer-events: none; }
.air-link { fill: none; stroke: var(--sc); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.55; pointer-events: none; }
.air-miss { fill: none; stroke: var(--air-miss); stroke-width: 1.6; stroke-dasharray: 2.5 2; opacity: 0.85; pointer-events: none; }
.air-lbl { fill: var(--ink); stroke: var(--halo); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; pointer-events: none; font-size: 11.5px; font-weight: 600; }
.air-lbl.dim { fill: var(--air-true); font-weight: 500; font-style: italic; }
.tally { cursor: pointer; }
.tally .tleader { stroke: var(--sc, var(--ink)); stroke-width: 1.2; opacity: 0.8; pointer-events: none; }
.tally .tbox { fill: var(--tally-bg); stroke: var(--sc, var(--ink)); stroke-width: 1.5; }
.tally text { fill: var(--ink); font-size: 11.5px; pointer-events: none; }
.tally text.head { font-weight: 700; }
.tally .tfull { display: block; }
.tally.badge .tfull { display: none; }
.tally.badge:hover .tfull { display: block; }
.tally.badge:hover .tbadge { display: none; }
.tally.sel .tbox { stroke-width: 3; }
.ring-air { fill: none; stroke: var(--sc); vector-effect: non-scaling-stroke; pointer-events: none; }
.ring-air.solid { stroke-width: 2.4; }
.ring-air.alt { stroke-width: 1.8; stroke-dasharray: 8 5; opacity: 0.85; }
.ring-air.faint { stroke-width: 1.4; stroke-dasharray: 3 6; opacity: 0.55; }
.ring-air.search { stroke-width: 1.6; stroke-dasharray: 1 5; stroke-linecap: round; }
#evlist li.banner { position: sticky; top: 0; z-index: 2; padding: 4px 10px; background: color-mix(in srgb, var(--hl) 22%, var(--panel)); border-bottom: 1px solid var(--line); cursor: pointer; font-weight: 600; }
#evlist li.banner:hover { background: color-mix(in srgb, var(--hl) 38%, var(--panel)); }
#evlist li.ev.air { background: color-mix(in srgb, var(--hl) 14%, transparent); }
#evlist li.ev.air.sel { background: color-mix(in srgb, var(--hl) 34%, transparent); }
.airrow { border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; margin: 3px 0; cursor: pointer; }
.airrow:hover { border-color: var(--accent); }
.airrow.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
.airrow .sub { color: var(--dim); font-size: 12.5px; }

/* Panel */
.pane-head { padding: 6px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; flex: none; }
.pane-head .line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pane-head h2, #detail h2 { font-size: 13px; margin: 0; font-weight: 650; }
#filter { flex: 1; min-width: 120px; }
#evwrap { flex: 1 1 42%; min-height: 110px; display: flex; flex-direction: column; min-height: 0; }
#evlist { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
#evlist li.ev { padding: 3px 10px; border-bottom: 1px solid var(--line); cursor: pointer; overflow-wrap: anywhere; }
#evlist li.ev:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
#evlist li.ev.sel { background: color-mix(in srgb, var(--hl) 28%, transparent); box-shadow: inset 3px 0 0 var(--hl); }
#evlist li.grp { padding: 3px 10px; background: var(--bg); font-weight: 650; cursor: pointer; position: sticky; top: 0; border-bottom: 1px solid var(--line); }
.eid { color: var(--dim); margin-right: 6px; font-variant-numeric: tabular-nums; }
.ecause { color: var(--dim); font-size: 12px; margin-left: 4px; }
.empty { padding: 10px; color: var(--dim); }
#detail { flex: 1 1 58%; overflow: auto; border-top: 2px solid var(--line); padding: 8px 10px; min-height: 0; }
#detail section { margin-bottom: 12px; }
#detail h3 { font-size: 12.5px; margin: 8px 0 3px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.03em; }
#detail table { border-collapse: collapse; }
#detail td, #detail th { padding: 1px 10px 1px 0; text-align: left; vertical-align: top; font-weight: normal; }
#detail td.num { text-align: right; font-variant-numeric: tabular-nums; }
#detail tr.result td { border-top: 1px solid var(--line); font-weight: 650; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.link { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; }
.why ul { list-style: none; margin: 0; padding-left: 14px; border-left: 1px solid var(--line); }
.why > ul { padding-left: 0; border-left: 0; }
.why details > summary { cursor: pointer; }
.why li { margin: 2px 0; overflow-wrap: anywhere; }
.why .leaf { padding-left: 14px; }
.tag { font-size: 12px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--dim); margin-right: 4px; }
.shiprow { border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; margin: 4px 0; cursor: pointer; }
.shiprow:hover { border-color: var(--accent); }
.shiprow.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
.shiprow .sub { color: var(--dim); font-size: 12.5px; }
.note { color: var(--dim); font-size: 12.5px; margin: 4px 0; }

/* Footer */
#controls { flex: none; position: sticky; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#slider { flex: 1; min-width: 160px; }
#stepcount { min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header id="top">
  <div class="row">
    <h1 id="title">Flag Plot replay viewer</h1>
    <span id="seed" class="dim"></span>
    <span id="placeholder" class="badge warn" hidden>Placeholder data: figures are not historical</span>
    <span id="rebuildwarn" class="badge bad" hidden></span>
    <span class="spacer"></span>
    <span class="dim" id="readonly">Umpire's view, read-only</span>
    <label class="filebtn">Open replay file<input type="file" id="file" accept=".json,application/json"></label>
  </div>
  <div class="row">
    <span>Step: <b id="steplabel">none loaded</b></span>
    <span>State hash: <code id="hash">-</code></span>
    <fieldset class="belief" id="povset">
      <legend>View</legend>
      <label><input type="radio" autocomplete="off" name="pov" value="umpire" checked> Umpire</label>
      <label><input type="radio" autocomplete="off" name="pov" value="allied" disabled> Allied</label>
      <label><input type="radio" autocomplete="off" name="pov" value="japanese" disabled> Japanese</label>
    </fieldset>
    <fieldset class="belief" id="belief">
      <legend>Show</legend>
      <label><input type="radio" autocomplete="off" name="belief" value="truth" checked> Truth only</label>
      <label><input type="radio" autocomplete="off" name="belief" value="allied"> + Allied contacts</label>
      <label><input type="radio" autocomplete="off" name="belief" value="japanese"> + Japanese contacts</label>
    </fieldset>
  </div>
</header>
<div id="msg" role="alert" hidden></div>
<main>
  <section id="mapwrap" aria-label="Map">
    <svg id="map" role="img" aria-label="Hex map of the replay">
      <g id="world"><g id="gHexes"></g><g id="gClosed"></g><g id="gDyn"></g><g id="gMeasure"></g><g id="gHover"></g></g>
      <g id="gScreen"></g>

    </svg>
    <div id="mapbtns" class="maptool"><button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button><button id="zfit" title="Fit the map to the window">Fit</button><button id="measurebtn" aria-pressed="false" title="Measure: click two hexes (Escape leaves)">Measure</button><label id="airtoggle" title="Show or hide the air layer: search sightings and misses, raids, the fight over each target, reach rings"><input type="checkbox" id="airon" autocomplete="off" checked disabled> Air</label></div>
    <div id="measurebox" class="maptool" hidden></div>
    <div id="north" class="maptool" title="North is up"><svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1 L12 16 L7 12.5 L2 16 Z" fill="currentColor"/></svg><b>N</b></div>
    <div id="scalebar" class="maptool" hidden><div id="scalelabel"></div><div class="bar" id="scalebarbar"></div></div>
    <div id="readout" class="maptool"><div class="dim">Move the pointer over the map.</div></div>
    <details id="legend" class="maptool" open><summary>Legend</summary><ul id="legendlist"></ul></details>
  </section>
  <aside id="panel" aria-label="Events and details">
    <div id="evwrap">
      <div class="pane-head">
        <div class="line"><h2 id="evtitle">Events</h2><span class="dim" id="evinfo"></span></div>
        <div class="line"><input type="search" id="filter" placeholder="Filter events by text" aria-label="Filter events by text"></div>
        <div class="line">
          <label title="Only events about the selected force or ship"><input type="checkbox" id="onlysel"> only this force / ship <span class="dim" id="selname"></span></label>
          <label title="List matching events from every step, grouped by step"><input type="checkbox" id="allsteps"> all steps</label>
        </div>
      </div>
      <ul id="evlist"></ul>
    </div>
    <div id="detail"><div class="empty">Click an event to see why it happened, or a force counter on the map to see its ships.</div></div>
  </aside>
</main>
<footer id="controls">
  <button id="prev" title="Previous step (Left arrow)">&#9664; Prev</button>
  <button id="play" title="Play or pause (Space)">Play</button>
  <button id="next" title="Next step (Right arrow)">Next &#9654;</button>
  <label class="dim">Speed <select id="speed" aria-label="Playback speed"><option value="0.5">0.5 steps/s</option><option value="1" selected>1 step/s</option><option value="2">2 steps/s</option><option value="4">4 steps/s</option></select></label>
  <input type="range" id="slider" min="0" max="0" value="0" aria-label="Step">
  <span id="stepcount" class="dim">0 / 0</span>
</footer>

<script id="core">
'use strict';
// =====================================================================
// Core: pure functions. No DOM, no window. Run by the page and by check.js.
// =====================================================================

// ---- Geometry (nautical miles before scaling; y grows southward) ----
const HEX_SPACING = 40;
const ROW_SPACING = 34.641016;
const HEX_R = 40 / Math.sqrt(3); // circumradius, 23.094011
const LABEL_COS_LAT = Math.cos(12 * Math.PI / 180);

function hexKey(q, r) { return q + ',' + r; }

/** Centre of hex (q, r) as [x, y]. */
function hexCenter(q, r) { return [HEX_SPACING * (q + r / 2), ROW_SPACING * r]; }

/** Corner k (0..5) of hex (q, r): top first, then clockwise on screen. */
function hexCorner(q, r, k) {
  const c = hexCenter(q, r);
  const a = (-90 + 60 * k) * Math.PI / 180;
  return [c[0] + HEX_R * Math.cos(a), c[1] + HEX_R * Math.sin(a)];
}

function hexCorners(q, r) {
  const out = [];
  for (let k = 0; k < 6; k++) out.push(hexCorner(q, r, k));
  return out;
}

/**
 * The shared edge for direction d of hex (q, r), as [[x1, y1], [x2, y2]].
 * The neighbour offset comes from directions[d] = [dq, dr]; the edge is perpendicular to it.
 */
function edgeForDirection(q, r, d, directions) {
  const dq = directions[d][0], dr = directions[d][1];
  const ox = HEX_SPACING * (dq + dr / 2), oy = ROW_SPACING * dr;
  const theta = Math.atan2(oy, ox);
  const c = hexCenter(q, r);
  const a = theta - Math.PI / 6, b = theta + Math.PI / 6;
  return [
    [c[0] + HEX_R * Math.cos(a), c[1] + HEX_R * Math.sin(a)],
    [c[0] + HEX_R * Math.cos(b), c[1] + HEX_R * Math.sin(b)],
  ];
}

/** The hex whose cell contains the point (x, y) in nm. */
function pointToHex(x, y) {
  const rf = y / ROW_SPACING;
  const qf = x / HEX_SPACING - rf / 2;
  let q = Math.round(qf), r = Math.round(rf);
  const s = Math.round(-qf - rf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s + qf + rf);
  if (dq > dr && dq > ds) q = -r - s;
  else if (dr > ds) r = -q - s;
  return { q: q + 0, r: r + 0 };
}

/** Point at bearing b degrees (clockwise from north) and distance d from (x, y). */
function bearingPoint(x, y, deg, d) {
  const a = deg * Math.PI / 180;
  return [x + d * Math.sin(a), y - d * Math.cos(a)];
}

/** Width in degrees of the clockwise arc from..to; equal bearings mean the full 360 (as sim-core's arc_degrees). */
function arcWidth(fromDeg, toDeg) {
  const w = (((toDeg - fromDeg) % 360) + 360) % 360;
  return w === 0 ? 360 : w;
}

/** A search arc as drawing data: full circle, or two end points and the large-arc flag. */
function arcSpec(x, y, fromDeg, toDeg, range) {
  const width = arcWidth(fromDeg, toDeg);
  if (width >= 360) return { full: true, width, cx: x, cy: y, range };
  return { full: false, width, cx: x, cy: y, range, p1: bearingPoint(x, y, fromDeg, range), p2: bearingPoint(x, y, toDeg, range), large: width > 180 };
}

/** Place each label in the hex nearest by projected lat/lon. Only hexes with lat and lon count; ties go to file order. */
function placeLabels(hexes, labels) {
  const out = [];
  if (!Array.isArray(hexes) || !Array.isArray(labels)) return out;
  const located = hexes.filter(h => typeof h.lat === 'number' && typeof h.lon === 'number');
  if (!located.length) return out;
  for (const label of labels) {
    if (!label || typeof label.lat !== 'number' || typeof label.lon !== 'number') continue;
    let best = null, bestD = Infinity;
    for (const h of located) {
      const dx = (label.lon - h.lon) * LABEL_COS_LAT, dy = label.lat - h.lat;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = h; }
    }
    out.push({ label, q: best.q, r: best.r });
  }
  return out;
}

const SIDES = ['allied', 'japanese'];

// ---- A side's view ----
/**
 * What a side's page is built from: the replay with everything the side may not know left out.
 * Its events are the ones the engine gave the side (replay.side_views, decision 0047), numbered by the
 * side (n, never the log's number, which is kept as log_id for the checks only). Its units are its own,
 * exactly. The enemy is only what the side's events and contacts say, and the enemy's bases are public:
 * id, name, hex and side (decision 0048). The state hash is the umpire's, so there are no days.
 * Nothing here decides who sees what; the one rule is the engine's. Returns null for a version 1 file.
 */
function sideReplay(replay, side) {
  const sv = replay.side_views && replay.side_views[side];
  if (!sv) return null;
  const own = x => x && x.side === side;
  const initial = replay.initial || {}, final = replay.final || null;
  const ownShips = new Set((initial.ships || []).filter(own).map(s => s.id));
  // The reach figures of the types of the side's own groups only: nothing about the enemy's.
  let aircraft_types = replay.aircraft_types;
  if (Array.isArray(aircraft_types)) {
    const typeIds = new Set();
    for (const g of [...(initial.air_groups || []), ...((final && final.air_groups) || [])]) if (own(g) && g.aircraft_type_id !== undefined) typeIds.add(g.aircraft_type_id);
    aircraft_types = aircraft_types.filter(t => typeIds.has(t.id));
  }
  const out = Object.assign({}, replay, {
    aircraft_types,
    side_views: undefined, view_side: side,
    base_changes: undefined, // the umpire's list; a side's page follows base_changed_side events it was given
    orders: (replay.orders || []).filter(own),
    bases: (replay.bases || []).map(b => own(b) ? b : { id: b.id, name: b.name, side: b.side, q: b.q, r: b.r }),
    initial: {
      task_forces: (initial.task_forces || []).filter(own),
      ships: (initial.ships || []).filter(own),
      air_groups: (initial.air_groups || []).filter(own),
      bases: (initial.bases || []).filter(own),
      land_units: (initial.land_units || []).filter(own),
    },
    events: sv.events.map(e => ({
      id: e.n, log_id: e.log_id, day: e.day, pulse: e.pulse, kind: e.kind, text: e.text, causes: e.causes || [],
      entities: e.entities || [], breakdown: e.breakdown, data: e.data || {}, cut: !!e.cut, hidden_causes: !!e.hidden_causes,
    })),
    days: [],
    final: final ? {
      task_forces: (final.task_forces || []).filter(own),
      ships: (final.ships || []).filter(s => ownShips.has(s.id)),
      air_groups: (final.air_groups || []).filter(own),
      bases: (final.bases || []).filter(own),
      land_units: (final.land_units || []).filter(own),
      contacts: { [side]: (final.contacts && final.contacts[side]) || [] },
      claims: { [side]: (final.claims && final.claims[side]) || [] },
    } : null,
  });
  return out;
}

// ---- Time steps ----
const PHASES = ['orders', 'night', 'morning', 'afternoon', 'end'];
const PHASE_HOURS = { night: '18:00 to 06:00', morning: '06:00 to 12:00', afternoon: '12:00 to 18:00' };

function phaseRank(p) { const i = PHASES.indexOf(p); return i < 0 ? 3.5 : i; }

function stepLabel(day, phase) {
  if (phase === 'start') return 'Start';
  if (phase === 'orders') return 'Day ' + day + ', orders';
  if (phase === 'end') return 'Day ' + day + ', end of day';
  return 'Day ' + day + ', ' + phase + (PHASE_HOURS[phase] ? ' (' + PHASE_HOURS[phase] + ')' : '');
}

/**
 * Steps in order: index 0 is "Start"; then every (day, phase) that has events. Events on day 0, which
 * a scenario records before the first day (the contacts a side starts with, decision 0021), belong to
 * no day: they are the Start step's events, so Start has none when the scenario has none.
 * Each step lists positions into the events array, in log order. Every event is in exactly one step.
 */
function buildSteps(events) {
  const byDay = new Map();
  events.forEach((ev, i) => {
    if (!byDay.has(ev.day)) byDay.set(ev.day, []);
    byDay.get(ev.day).push(i);
  });
  const steps = [{ index: 0, day: 0, phase: 'start', label: 'Start', events: byDay.get(0) || [] }];
  for (const day of [...byDay.keys()].filter(d => d !== 0).sort((a, b) => a - b)) {
    const idxs = byDay.get(day);
    let first = -1, last = -1;
    idxs.forEach((ei, pos) => { if (events[ei].pulse) { if (first < 0) first = pos; last = pos; } });
    const groups = new Map();
    let lastPulse = null;
    idxs.forEach((ei, pos) => {
      const p = events[ei].pulse;
      let phase;
      if (p) { phase = p; lastPulse = p; }
      else if (first < 0 || pos < first) phase = 'orders';
      else if (pos > last) phase = 'end';
      else phase = lastPulse; // null-pulse event between pulsed ones: stays with the pulse before it
      if (!groups.has(phase)) groups.set(phase, []);
      groups.get(phase).push(ei);
    });
    [...groups.keys()].sort((a, b) => phaseRank(a) - phaseRank(b)).forEach(phase => {
      steps.push({ index: steps.length, day, phase, label: stepLabel(day, phase), events: groups.get(phase) });
    });
  }
  return steps;
}

// ---- Validation ----
/** Returns null when the replay can be read, otherwise a message saying what is wrong. */
function validateReplay(r) {
  if (r === null || typeof r !== 'object' || Array.isArray(r)) return 'This is JSON but not a replay: expected an object at the top level.';
  if (r.format !== 'flagplot-replay') return 'Not a Flag Plot replay: format is ' + JSON.stringify(r.format) + ', expected "flagplot-replay".';
  if (r.version !== 1 && r.version !== 2 && r.version !== 3) return 'Unsupported replay version: this file is version ' + JSON.stringify(r.version) + '; this viewer reads versions 1, 2 and 3.';
  if (r.version >= 2) {
    // Version 2 adds side_views: for each side, the events the engine let it see (decision 0047).
    if (!r.side_views || typeof r.side_views !== 'object') return 'Replay version ' + r.version + ' has no "side_views" object.';
    for (const side of SIDES) {
      const sv = r.side_views[side];
      if (!sv || !Array.isArray(sv.events)) return 'Replay "side_views" has no event list for ' + side + '.';
      for (const ev of sv.events) if (!ev || !Number.isInteger(ev.n) || !Number.isInteger(ev.log_id) || !Number.isInteger(ev.day) || typeof ev.kind !== 'string') return 'A ' + side + ' side event is missing its integer n, log_id or day, or its kind.';
    }
  }
  if (r.version === 3) {
    // Version 3 adds aircraft_types: the reach figures of each type, for the reach rings.
    if (!Array.isArray(r.aircraft_types)) return 'Replay version 3 has no "aircraft_types" list.';
    const num = x => typeof x === 'number' && Number.isFinite(x);
    for (const t of r.aircraft_types) {
      if (!t || typeof t !== 'object' || !Number.isInteger(t.id) || typeof t.name !== 'string') return 'An entry of "aircraft_types" is missing its integer id or its name.';
      if (!num(t.strike_radius_nm) || !num(t.extended_reach_nm) || !num(t.search_range_nm) || t.strike_radius_nm < 0 || t.search_range_nm < 0) return 'The "aircraft_types" entry ' + t.id + ' needs finite strike_radius_nm, extended_reach_nm and search_range_nm, none below 0.';
      if (t.extended_reach_nm < t.strike_radius_nm) return 'The "aircraft_types" entry ' + t.id + ' has an extended_reach_nm below its strike_radius_nm.';
    }
  }
  if (!r.scenario || typeof r.scenario !== 'object') return 'Replay has no "scenario" object.';
  if (!r.map || typeof r.map !== 'object' || !Array.isArray(r.map.hexes)) return 'Replay has no "map.hexes" list.';
  if (!Array.isArray(r.directions) || r.directions.length !== 6 || !r.directions.every(d => Array.isArray(d) && d.length === 2 && Number.isInteger(d[0]) && Number.isInteger(d[1]))) return 'Replay "directions" must be six [dq, dr] pairs.';
  if (!Array.isArray(r.events)) return 'Replay has no "events" list.';
  for (const h of r.map.hexes) {
    if (!h || !Number.isInteger(h.q) || !Number.isInteger(h.r)) return 'A map hex has no integer q and r.';
  }
  const seen = new Set();
  for (const ev of r.events) {
    if (!ev || typeof ev !== 'object' || !Number.isInteger(ev.id) || !Number.isInteger(ev.day) || typeof ev.kind !== 'string') return 'An event is missing its integer id, integer day or kind.';
    if (seen.has(ev.id)) return 'Two events share id ' + ev.id + '.';
    seen.add(ev.id);
    if (ev.pulse !== null && ev.pulse !== undefined && typeof ev.pulse !== 'string') return 'Event ' + ev.id + ' has a pulse that is not a string or null.';
  }
  for (const key of ['orders', 'bases', 'labels', 'days']) {
    if (r[key] !== undefined && !Array.isArray(r[key])) return 'Replay "' + key + '" is not a list.';
  }
  return null;
}

// ---- Entities and text ----
/** "task_force:1" -> { type: "task_force", id: 1 }; anything else -> null. */
function parseEntity(s) {
  const m = /^([a-z_]+):(\d+)$/.exec(String(s));
  return m ? { type: m[1], id: Number(m[2]) } : null;
}

/** Splits an event's log line into its body, with the "#id Dd pulse" prefix and "  <- causes" suffix removed. */
function splitText(text) {
  let body = String(text == null ? '' : text), causes = '';
  const i = body.lastIndexOf('  <- ');
  if (i >= 0) { causes = body.slice(i + 5); body = body.slice(0, i); }
  body = body.replace(/^#\d+\s+D\d+\s+\S+\s+/, '');
  return { body, causes };
}

function numEq(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) < 1e-9;
  return a === b;
}

// ---- Model: indexes and state rebuild ----
function cloneTrail(trail) { return trail.slice(); }

function snapshot(cur, aux) {
  const forces = new Map();
  for (const [id, f] of cur.forces) forces.set(id, { id, name: f.name, side: f.side, q: f.q, r: f.r, ships: f.ships.slice(), trail: cloneTrail(f.trail), detachedFrom: f.detachedFrom, readiness: f.readiness, alerted: f.alerted });
  const contacts = {};
  for (const side of Object.keys(cur.contacts)) {
    const m = new Map();
    for (const [id, c] of cur.contacts[side]) m.set(id, { id, side, hex: c.hex.slice(), ship_count: c.ship_count, kind: c.kind, age_pulses: c.age_pulses });
    contacts[side] = m;
  }
  // Land units (decision 0066): the men of each ashore and where, rebuilt from the events; the formed bases by hex.
  const landUnits = new Map();
  for (const [id, u] of cur.landUnits) landUnits.set(id, { id, name: u.name, side: u.side, men_ashore: u.men_ashore, hex: u.hex ? u.hex.slice() : null, posture: u.posture, fatigue: u.fatigue, fed_share: u.fed_share });
  return {
    forces, contacts, landUnits, formedBases: new Map(cur.formedBases), baseSide: new Map(cur.baseSide),
    sunk: new Set(cur.sunk),
    shipForce: new Map(cur.shipForce),
    moves: aux.moves, fights: aux.fights, searches: aux.searches,
    air: aux.air, reach: cur.reach, mission: cur.mission, groupBase: cur.groupBase,
  };
}

// ---- The air layer: built from the events of the model being built, nothing else ----
/** Where an air group is: its base's hex, or the hex of the force its ship is in; null when the ship is sunk or in no force. state has forces, shipForce and sunk (the rebuild's cur, or a step's state). */
function airGroupHex(bases, state, g) {
  if (!g) return null;
  // The base it is at in this state: a rebase (decision 0091) moves it from its starting base.
  const base = state.groupBase && state.groupBase.has(g.id) ? state.groupBase.get(g.id) : g.base;
  if (base != null) { const b = bases.get(base); return b ? [b.q, b.r] : null; }
  if (g.ship != null) {
    if (state.sunk.has(g.ship)) return null;
    const fid = state.shipForce.get(g.ship), f = fid !== undefined ? state.forces.get(fid) : null;
    return f ? [f.q, f.r] : null;
  }
  return null;
}

// The field that names the air group an event is about, for the kinds that belong to a raid by their group.
const RAID_GROUP_FIELD = {
  air_fight: 'firer', air_attack: 'air_group', base_attacked: 'air_group', strike_found_nothing: 'air_group', aircraft_lost: 'air_group', pilots_lost: 'air_group',
  aircraft_ditched: 'air_group', aircraft_ditched_no_deck: 'air_group', aircraft_landed_elsewhere: 'from', air_group_lost: 'air_group',
};

function emptyLost() { return { total: 0, patrol: 0, escorts: 0, guns: 0, unseen: 0 }; }

/**
 * The raids of one step, and the fight over each target hex, from that step's launches and events.
 * ctx: { events, eventById, groupTable, umpire }; air: what the step loop collected (launches, escorts, nothing).
 * A raid is the strikes launched in one step from one place (a ship or a base) at one hex (decision 0027); a
 * strike at a base is also named by the base. An event belongs to at most one raid: by the group it names (a
 * patrol's fire, and the losses, are decided by their causes first, because a fighter group can patrol and escort
 * at once), else by a cause that is already in the raid.
 */
function assembleAir(ctx, air, idxs, step) {
  const { events, eventById, groupTable, umpire } = ctx;
  const sideOf = g => { const x = groupTable.get(g); return x ? x.side : null; };
  const raids = [], byKey = new Map(), raidOfSeed = new Map(), raidOfStrike = new Map(), raidOfGroup = new Map();
  for (const L of air.launches) {
    const g = L.g;
    const origin = g ? (g.base != null ? 'b' + g.base : 's' + g.ship) : '?';
    const key = [L.kind, origin, L.launch ? L.launch.join(',') : '?', L.target ? L.target.join(',') : '?', L.kind === 'base' ? L.baseId : ''].join('|');
    let r = byKey.get(key);
    if (!r) {
      r = { id: step + ':' + raids.length, step, side: g ? g.side : null, kind: L.kind, launch: L.launch, target: L.target, baseId: L.kind === 'base' ? L.baseId : null,
        bombers: 0, escorts: 0, strikeGroups: [], escortGroups: [], launchEvents: [], outcome: 'none', events: [], keyEvent: null };
      if (umpire) { r.trueHex = null; r.trueNote = null; }
      byKey.set(key, r); raids.push(r);
    }
    r.bombers += L.d.aircraft || 0;
    r.strikeGroups.push(L.d.air_group); r.launchEvents.push(L.ev);
    raidOfSeed.set(L.ev, r);
    if (!raidOfStrike.has(L.d.air_group)) raidOfStrike.set(L.d.air_group, r);
    if (!raidOfGroup.has(L.d.air_group)) raidOfGroup.set(L.d.air_group, r);
  }
  for (const E of air.escorts) {
    const r = raidOfStrike.get(E.d.with_air_group);
    if (!r) continue;
    r.escorts += E.d.aircraft || 0;
    r.escortGroups.push(E.d.air_group);
    raidOfSeed.set(E.ev, r);
    if (!raidOfGroup.has(E.d.air_group)) raidOfGroup.set(E.d.air_group, r);
  }
  const assigned = new Map();
  for (const ei of idxs) {
    const ev = events[ei], d = ev.data || {};
    let r = raidOfSeed.get(ev.id) || null;
    if (!r && raids.length) {
      const byCause = () => { for (const c of ev.causes || []) if (c.event !== undefined) { const a = assigned.get(c.event); if (a) return a; } return null; };
      const field = RAID_GROUP_FIELD[ev.kind];
      const g = field !== undefined ? d[field] : undefined;
      if (field === undefined) r = byCause();
      else if (ev.kind === 'aircraft_lost' || ev.kind === 'pilots_lost' || (ev.kind === 'air_fight' && d.firing === 'patrol')) r = byCause() || (ev.kind === 'air_fight' || g === undefined ? null : raidOfGroup.get(g) || null);
      else r = (g !== undefined && raidOfGroup.get(g)) || byCause();
    }
    if (r) { assigned.set(ev.id, r); r.events.push(ev.id); }
  }
  for (const r of raids) {
    let found = false, nothing = false, first = null;
    for (const id of r.events) {
      const e = eventById.get(id);
      if (e.kind === 'air_attack' || e.kind === 'base_attacked') { found = true; if (!first) first = id; }
      else if (e.kind === 'strike_found_nothing') nothing = true;
    }
    r.outcome = found ? 'found' : nothing ? 'nothing' : 'none';
    if (!first && nothing) first = r.events.find(id => eventById.get(id).kind === 'strike_found_nothing');
    r.keyEvent = first || r.launchEvents[0] || null;
    if (umpire && r.outcome === 'nothing') {
      const hit = r.events.map(id => air.nothing.get(id)).find(x => x !== undefined);
      if (hit && hit.hex) r.trueHex = hit.hex.slice(); else r.trueNote = 'not traceable';
    }
  }
  // One tally per target hex: the raids that went there merged.
  const tallies = new Map();
  for (const r of raids) {
    if (!r.target) continue;
    const key = hexKey(r.target[0], r.target[1]);
    let t = tallies.get(key);
    if (!t) {
      t = { key, q: r.target[0], r: r.target[1], raids: [], sides: [], bombers: 0, escorts: 0, patrolEngaged: 0, patrolShots: 0, escortShots: 0, gunShots: 0, gunHits: null,
        lost: {}, ditched: 0, landed: 0, lostWithShip: 0, hits: null, sunk: 0, claims: [], events: [], keyEvent: null };
      tallies.set(key, t);
    }
    t.raids.push(r.id); t.bombers += r.bombers; t.escorts += r.escorts;
    if (r.side && !t.sides.includes(r.side)) t.sides.push(r.side);
    if (!t.keyEvent) t.keyEvent = r.keyEvent;
    const share = new Map();
    for (const id of r.events) {
      t.events.push(id);
      const e = eventById.get(id), d = e.data || {};
      switch (e.kind) {
        case 'air_fight':
          if (d.firing === 'patrol') {
            t.patrolShots += d.shots || 0;
            const f = e.breakdown && Array.isArray(e.breakdown.factors) ? e.breakdown.factors.find(x => x.name === 'patrol_share') : null;
            if (f && typeof f.value === 'number') share.set(d.firer, Math.max(share.get(d.firer) || 0, f.value)); else t.patrolEngaged = null;
          } else t.escortShots += d.shots || 0;
          break;
        case 'anti_aircraft_fire':
        case 'base_anti_aircraft_fire':
          t.gunShots += d.shots || 0;
          if (typeof d.hits === 'number') t.gunHits = (t.gunHits || 0) + d.hits;
          break;
        case 'aircraft_lost': {
          const side = sideOf(d.air_group) || 'unknown';
          const l = t.lost[side] || (t.lost[side] = emptyLost());
          let cause = 'unseen';
          for (const c of e.causes || []) {
            const ce = c.event !== undefined ? eventById.get(c.event) : null;
            if (!ce) continue;
            if (ce.kind === 'air_fight') { cause = ce.data && ce.data.firing === 'patrol' ? 'patrol' : 'escorts'; break; }
            if (ce.kind === 'anti_aircraft_fire' || ce.kind === 'base_anti_aircraft_fire') { cause = 'guns'; break; }
          }
          l.total += d.aircraft || 0; l[cause] += d.aircraft || 0;
          break;
        }
        case 'aircraft_ditched': t.ditched += d.ditched || 0; break;
        case 'aircraft_ditched_no_deck': t.ditched += d.aircraft || 0; break;
        case 'aircraft_landed_elsewhere': t.landed += d.aircraft || 0; break;
        case 'air_group_lost': t.lostWithShip += d.aircraft || 0; break;
        case 'air_attack':
        case 'base_attacked':
          if (typeof d.hits === 'number') t.hits = (t.hits || 0) + d.hits;
          break;
        case 'ship_sunk': t.sunk++; break;
        case 'claim_received': t.claims.push({ event: id, side: d.side, sunk: d.claimed_sunk, hits: d.claimed_hits, kind: d.claimed_kind, shot_down: d.claimed_shot_down, on_ground: d.claimed_on_ground }); break;
        default: break;
      }
    }
    if (t.patrolEngaged !== null) for (const v of share.values()) t.patrolEngaged += v;
  }
  // The tally lists its events in the order of the step.
  const order = new Map(); idxs.forEach((ei, i) => order.set(events[ei].id, i));
  for (const t of tallies.values()) t.events.sort((a, b) => order.get(a) - order.get(b));
  for (const r of raids) r.events.sort((a, b) => order.get(a) - order.get(b));
  return { raids, tallies: [...tallies.values()] };
}

/** Builds everything the page and the checker need from a validated replay. */
function buildModel(replay) {
  const events = replay.events || [];
  const initial = replay.initial || {};
  const final = replay.final || null;
  const hexes = (replay.map && replay.map.hexes) || [];
  const hexByKey = new Map();
  for (const h of hexes) hexByKey.set(hexKey(h.q, h.r), h);
  const bases = new Map();
  for (const b of replay.bases || []) bases.set(b.id, b);
  const airGroups = new Map();
  for (const g of initial.air_groups || []) airGroups.set(g.id, g);
  // Every air group the replay names: the starting ones, then any formed during the run (they are only in the final state).
  const groupTable = new Map();
  const addGroup = (g, formed) => groupTable.set(g.id, { id: g.id, name: g.name, side: g.side || null, base: g.base != null ? g.base : null, ship: g.ship != null ? g.ship : null,
    typeId: g.aircraft_type_id !== undefined ? g.aircraft_type_id : null, type: g.aircraft_type || null, mission: g.mission || null, reach0: g.reach === 'extended' ? 'extended' : 'normal', formedStep: formed ? -1 : undefined });
  for (const g of initial.air_groups || []) addGroup(g, false);
  for (const g of (replay.final && replay.final.air_groups) || []) if (!groupTable.has(g.id)) addGroup(g, true);
  const aircraftTypes = new Map();
  for (const t of replay.aircraft_types || []) aircraftTypes.set(t.id, t);
  const umpire = replay.view_side === undefined;
  const finalForces = new Map(), finalShips = new Map();
  if (final) {
    for (const f of final.task_forces || []) finalForces.set(f.id, f);
    for (const s of final.ships || []) finalShips.set(s.id, s);
  }
  const initShips = new Map();
  for (const s of initial.ships || []) initShips.set(s.id, s);

  const eventById = new Map(), orderById = new Map(), ledTo = new Map();
  events.forEach(ev => eventById.set(ev.id, ev));
  for (const o of replay.orders || []) orderById.set(o.id, o);
  for (const ev of events) {
    for (const c of ev.causes || []) {
      const key = c.order !== undefined ? 'order:' + c.order : 'event:' + c.event;
      if (!ledTo.has(key)) ledTo.set(key, []);
      ledTo.get(key).push(ev.id);
    }
  }

  const steps = buildSteps(events);
  const stepOfEvent = new Map();
  steps.forEach(s => s.events.forEach(ei => stepOfEvent.set(events[ei].id, s.index)));

  // Rebuild
  const cur = { forces: new Map(), shipForce: new Map(), sunk: new Set(), contacts: { allied: new Map(), japanese: new Map() }, reach: new Map(), mission: new Map(), landUnits: new Map(), formedBases: new Map(), baseSide: new Map() };
  for (const u of initial.land_units || []) cur.landUnits.set(u.id, { id: u.id, name: u.name, side: u.side, men_ashore: u.men_ashore || 0, hex: Array.isArray(u.hex) ? u.hex.slice() : (u.hex ? [u.hex.q, u.hex.r] : null), posture: u.posture || 'defend', fatigue: u.fatigue || 0, fed_share: u.fed_share !== undefined ? u.fed_share : 1 });
  // Who holds each base (decision 0090): the side the replay starts it with, changed by base_changed_side events.
  for (const b of replay.bases || []) cur.baseSide.set(b.id, b.side);
  cur.groupBase = new Map();
  for (const g of groupTable.values()) { cur.reach.set(g.id, g.reach0); cur.mission.set(g.id, g.mission); cur.groupBase.set(g.id, g.base); }
  // reach and mission are replaced, never changed in place, so each step's snapshot keeps its own.
  const setAirOrder = (map, id, v) => { const m = new Map(map); m.set(id, v); return m; };
  let hasAir = false;
  const airCtx = { events, eventById, groupTable, umpire };
  for (const f of initial.task_forces || []) {
    const pos = f.position || { q: 0, r: 0 };
    cur.forces.set(f.id, { id: f.id, name: f.name || ('TF ' + f.id), side: f.side, q: pos.q, r: pos.r, ships: (f.ships || []).slice(), trail: [[pos.q, pos.r]], detachedFrom: null, readiness: f.readiness || 'normal', alerted: !!f.alerted });
    for (const s of f.ships || []) cur.shipForce.set(s, f.id);
  }
  const eventForces = new Map(); // event id -> force ids it concerns, as of that moment
  const states = []; // one per step; step 0 is the initial state with the day-0 events applied

  const contactSide = (ev) => {
    const side = ev.data && ev.data.side;
    if (!side) return null;
    if (!cur.contacts[side]) cur.contacts[side] = new Map();
    return cur.contacts[side];
  };

  for (let si = 0; si < steps.length; si++) {
    const aux = { moves: new Map(), fights: [], searches: [], air: { sighted: [], misses: [], launches: [], escorts: [], nothing: new Map(), raids: [], tallies: [] } };
    const attempts = new Map(); // search_attempt event id -> where the force it looked for truly was (umpire only)
    for (const ei of steps[si].events) {
      const ev = events[ei], d = ev.data || {};
      // Which forces is this event about? Decided before it is applied (a sunk ship still counts for its force).
      const fset = new Set();
      for (const e of ev.entities || []) {
        const p = parseEntity(e);
        if (!p) continue;
        if (p.type === 'task_force') fset.add(p.id);
        else if (p.type === 'ship' && cur.shipForce.has(p.id)) fset.add(cur.shipForce.get(p.id));
      }
      if (ev.kind === 'ships_detached') { fset.add(d.parent); fset.add(d.new_force); }
      eventForces.set(ev.id, [...fset].filter(x => x !== undefined));

      switch (ev.kind) {
        case 'task_force_steamed': {
          const f = cur.forces.get(d.task_force);
          if (!f || !Array.isArray(d.to)) break;
          const path = [];
          if (Array.isArray(d.from)) path.push(d.from.slice());
          const entered = Array.isArray(d.hexes_entered) && d.hexes_entered.length ? d.hexes_entered : [d.to];
          for (const h of entered) { f.trail.push([h[0], h[1]]); path.push([h[0], h[1]]); }
          f.q = d.to[0]; f.r = d.to[1];
          if (!aux.moves.has(f.id)) aux.moves.set(f.id, []);
          aux.moves.get(f.id).push(path);
          break;
        }
        // A route order that turned a force round between two hexes can change the hex it is in (at exactly
        // 20 nm the hex ahead is the other one), with no steaming: the event says where it is now.
        case 'task_force_turned_back': {
          const f = cur.forces.get(d.task_force);
          if (!f || !Array.isArray(d.position)) break;
          if (f.q !== d.position[0] || f.r !== d.position[1]) f.trail.push([d.position[0], d.position[1]]);
          f.q = d.position[0]; f.r = d.position[1];
          break;
        }
        case 'ships_detached': {
          const parent = cur.forces.get(d.parent);
          const ships = [...(d.ships || []), ...(d.escorts || [])];
          if (!cur.forces.has(d.new_force)) {
            const fin = finalForces.get(d.new_force);
            const q = parent ? parent.q : 0, r = parent ? parent.r : 0;
            cur.forces.set(d.new_force, {
              id: d.new_force, name: fin ? fin.name : 'TF ' + d.new_force, side: fin ? fin.side : (parent ? parent.side : null),
              q, r, ships: [], trail: [[q, r]], detachedFrom: d.parent,
              readiness: parent ? parent.readiness : (fin && fin.readiness) || 'normal', alerted: parent ? parent.alerted : false,
            });
          }
          const nf = cur.forces.get(d.new_force);
          for (const s of ships) {
            if (parent) parent.ships = parent.ships.filter(x => x !== s);
            if (!nf.ships.includes(s)) nf.ships.push(s);
            cur.shipForce.set(s, d.new_force);
          }
          break;
        }
        // A force away at the yard has no ship on the map and is not sunk: its ships leave the force's list and come
        // back on its day of return (decision 0069). The force itself stays where it is.
        case 'force_left_for_yard': {
          const f = cur.forces.get(d.task_force);
          if (f) f.ships = f.ships.filter(x => !(d.ships || []).includes(x));
          break;
        }
        case 'force_returned_from_yard': {
          const f = cur.forces.get(d.task_force);
          if (f) for (const s of d.ships || []) if (!f.ships.includes(s)) f.ships.push(s);
          break;
        }
        // Readiness is set by an accepted order; alerted follows the alert and stand-down events and a successful
        // alarm roll, which are all the engine changes it by (a force that stays alerted from one pulse to the next
        // has no event, and a failed alarm roll changes nothing).
        case 'order_accepted': {
          const o = orderById.get(d.order), t = parseEntity(d.target), rd = o && /^readiness (normal|battle)$/.exec(o.text);
          const f = rd && t && t.type === 'task_force' ? cur.forces.get(t.id) : null;
          if (f) f.readiness = rd[1];
          // An accepted air-group order sets its reach and its mission the same way.
          const ar = o && t && t.type === 'air_group' ? /^reach (normal|extended)$/.exec(o.text) : null;
          if (ar) cur.reach = setAirOrder(cur.reach, t.id, ar[1]);
          const am = o && t && t.type === 'air_group' ? /^air mission (.+)$/.exec(o.text) : null;
          if (am) cur.mission = setAirOrder(cur.mission, t.id, am[1]);
          // An accepted posture order sets a land unit's posture (decision 0090).
          const lp = o && t && t.type === 'land_unit' ? /^posture (attack|defend)$/.exec(o.text) : null;
          const lu = lp ? cur.landUnits.get(t.id) : null;
          if (lu) lu.posture = lp[1];
          break;
        }
        // A group moved to another base by order (decision 0091): replaced, never changed in place, as the mission is.
        case 'air_group_rebased':
          cur.groupBase = setAirOrder(cur.groupBase, d.air_group, d.to);
          break;
        case 'force_became_alert':
        case 'force_alerted_by_contact':
        case 'alarm_roll':
        case 'force_stood_down': {
          const f = cur.forces.get(d.task_force);
          // A side is given an alarm roll only if it alarmed, and its cut form has no flag (decision 0065).
          if (f) f.alerted = ev.kind === 'alarm_roll' ? ((d.alarmed || ev.cut) ? true : f.alerted) : ev.kind !== 'force_stood_down';
          break;
        }
        case 'men_embarked':
        case 'men_landed':
        case 'men_lost_unfed':
        case 'men_lost_in_fight': {
          let u = cur.landUnits.get(d.unit);
          if (!u) { u = { id: d.unit, name: 'land unit ' + d.unit, side: d.side, men_ashore: 0, hex: null, posture: 'defend', fatigue: 0, fed_share: 1 }; cur.landUnits.set(d.unit, u); }
          u.men_ashore = d.ashore || 0;
          if (Array.isArray(d.hex)) u.hex = u.men_ashore > 0 ? d.hex.slice() : null;
          break;
        }
        case 'unit_divided': {
          const from = cur.landUnits.get(d.from);
          cur.landUnits.set(d.unit, { id: d.unit, name: (from ? from.name : 'land unit ' + d.from) + ' (part)', side: from ? from.side : undefined, men_ashore: 0, hex: null, posture: 'defend', fatigue: 0, fed_share: 1 });
          break;
        }
        case 'land_unit_destroyed': {
          const u = cur.landUnits.get(d.unit);
          if (u) { u.men_ashore = 0; u.hex = null; }
          break;
        }
        case 'men_fed': {
          // The fed share of each unit of the side ashore in the hex (decision 0090, 8): the men fed over the men charged.
          const share = d.men > 0 ? Math.floor(d.fed / d.men * 1e6) / 1e6 : 1;
          for (const u of cur.landUnits.values()) {
            if (u.side === d.side && u.men_ashore > 0 && Array.isArray(u.hex) && Array.isArray(d.hex) && u.hex[0] === d.hex[0] && u.hex[1] === d.hex[1]) u.fed_share = share;
          }
          break;
        }
        case 'fed_share_restored': { const u = cur.landUnits.get(d.unit); if (u) u.fed_share = 1; break; }
        case 'land_unit_fatigue': { const u = cur.landUnits.get(d.unit); if (u) u.fatigue = d.fatigue; break; }
        case 'land_unit_back_to_defend': { const u = cur.landUnits.get(d.unit); if (u) { u.posture = 'defend'; u.fatigue = d.fatigue; } break; }
        // A base changed side (decision 0090): its holder changes on the day of the event; a base a landing formed
        // is on both maps from now on, and is shown at its hex under its new holder.
        case 'base_changed_side':
          cur.baseSide.set(d.base, d.to);
          if (Array.isArray(d.hex)) {
            const key = d.hex[0] + ',' + d.hex[1];
            if (cur.formedBases.has(key) || !bases.has(d.base)) cur.formedBases.set(key, { id: d.base, side: d.to });
          }
          break;
        case 'base_formed':
          if (Array.isArray(d.hex)) cur.formedBases.set(d.hex[0] + ',' + d.hex[1], { id: d.base, side: d.side });
          break;
        // A ship in port at a base that changed side is sunk with it (decision 0090, 21).
        case 'ship_lost_with_base':
        case 'ship_sunk': {
          cur.sunk.add(d.ship);
          for (const f of cur.forces.values()) f.ships = f.ships.filter(x => x !== d.ship);
          break;
        }
        case 'report_received': {
          const m = contactSide(ev);
          if (m) m.set(d.contact, { id: d.contact, side: d.side, hex: Array.isArray(d.hex) ? d.hex.slice() : [0, 0], ship_count: d.ship_count, kind: d.kind, age_pulses: d.age_pulses !== undefined ? d.age_pulses : 0 });
          // A report that a search of this step made: the mark is where the side was told (the umpire also gets where the force truly was).
          if (Array.isArray(d.hex)) {
            for (const c of ev.causes || []) {
              const ce = c.event !== undefined ? eventById.get(c.event) : null;
              if (!ce || ce.kind !== 'search_attempt' || stepOfEvent.get(ce.id) !== si) continue;
              const at = attempts.get(ce.id);
              aux.air.sighted.push({ q: d.hex[0], r: d.hex[1], side: d.side, event: ev.id, attempt: ce.id, air_group: ce.data && ce.data.air_group, trueHex: at ? at.hex : null });
              break;
            }
          }
          break;
        }
        case 'contact_aged': {
          const m = contactSide(ev);
          const c = m && m.get(d.contact);
          if (c) { c.age_pulses = d.age_pulses; }
          break;
        }
        case 'contact_dropped':
        case 'contact_not_there': {
          const m = contactSide(ev);
          if (m) m.delete(d.contact);
          break;
        }
        case 'engagement_begun':
        case 'engagement_ended':
          if (Array.isArray(d.hex)) aux.fights.push({ q: d.hex[0], r: d.hex[1], a: d.a, b: d.b, kind: ev.kind, event: ev.id });
          break;
        case 'search_flown': {
          // From a base, the base's hex; from a ship, the hex the event records.
          const b = d.base != null ? bases.get(d.base) : null;
          const at = b ? { q: b.q, r: b.r } : (Array.isArray(d.hex) ? { q: d.hex[0], r: d.hex[1] } : null);
          hasAir = true;
          if (at) aux.searches.push({ event: ev.id, air_group: d.air_group, base: d.base, ship: d.ship, q: at.q, r: at.r, from_deg: d.from_deg, to_deg: d.to_deg, range_nm: d.range_nm, aircraft: d.aircraft, side: (airGroups.get(d.air_group) || b || {}).side });
          break;
        }
        // The umpire's uncut search attempt names the force it looked for: where that force truly was, at this moment.
        case 'search_attempt': {
          if (!umpire || d.task_force === undefined) break;
          const f = cur.forces.get(d.task_force), hex = f ? [f.q, f.r] : null;
          attempts.set(ev.id, { hex });
          if (d.sighted === false && hex) { const g = groupTable.get(d.air_group); aux.air.misses.push({ q: hex[0], r: hex[1], side: g ? g.side : null, event: ev.id, air_group: d.air_group, task_force: d.task_force }); }
          break;
        }
        case 'strike_launched':
        case 'base_strike_launched': {
          hasAir = true;
          const g = groupTable.get(d.air_group);
          aux.air.launches.push({ ev: ev.id, d, g, launch: airGroupHex(bases, cur, g), target: Array.isArray(d.hex) ? [d.hex[0], d.hex[1]] : null, kind: ev.kind === 'base_strike_launched' ? 'base' : 'ship', baseId: d.base });
          break;
        }
        case 'escorts_sent': aux.air.escorts.push({ ev: ev.id, d }); break;
        case 'aircraft_landed_elsewhere': {
          const g = d.formed ? groupTable.get(d.to) : null;
          if (g && g.formedStep === -1) g.formedStep = si;
          break;
        }
        case 'strike_found_nothing': {
          if (!umpire) break;
          // Where the force the strike was sent at truly is: launch -> the report behind it -> the sighting or attack that report was about -> that force, now.
          let hex = null;
          const launch = (ev.causes || []).map(c => c.event !== undefined ? eventById.get(c.event) : null).find(e => e && e.kind === 'strike_launched');
          if (launch) {
            const seen = new Set([launch.id]);
            let level = [launch];
            for (let depth = 0; depth < 4 && !hex && level.length; depth++) {
              const next = [];
              for (const e of level) for (const c of e.causes || []) {
                const ce = c.event !== undefined ? eventById.get(c.event) : null;
                if (!ce || seen.has(ce.id)) continue;
                seen.add(ce.id); next.push(ce);
                if (!hex && (ce.kind === 'search_attempt' || ce.kind === 'air_attack') && ce.data && ce.data.task_force !== undefined) {
                  const f = cur.forces.get(ce.data.task_force);
                  if (f) hex = [f.q, f.r];
                }
              }
              level = next;
            }
          }
          aux.air.nothing.set(ev.id, { hex });
          break;
        }
        default: break;
      }
    }
    if (aux.air.launches.length) { const a = assembleAir(airCtx, aux.air, steps[si].events, si); aux.air.raids = a.raids; aux.air.tallies = a.tallies; }
    states.push(snapshot(cur, aux));
  }

  // Bounds in nm
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const h of hexes) for (const c of hexCorners(h.q, h.r)) {
    if (c[0] < minX) minX = c[0]; if (c[0] > maxX) maxX = c[0];
    if (c[1] < minY) minY = c[1]; if (c[1] > maxY) maxY = c[1];
  }
  if (!hexes.length) { minX = -100; maxX = 100; minY = -100; maxY = 100; }

  const hexList = hexes;
  const hasLatLon = hexList.some(h => typeof h.lat === 'number' && typeof h.lon === 'number');
  const placements = placeLabels(hexList, replay.labels || []);
  const placementsByHex = new Map();
  for (const p of placements) {
    const k = hexKey(p.q, p.r);
    if (!placementsByHex.has(k)) placementsByHex.set(k, []);
    placementsByHex.get(k).push(p);
  }
  const days = new Map();
  for (const d of replay.days || []) days.set(d.day, d);
  const basesByHex = new Map();
  for (const b of bases.values()) {
    const k = hexKey(b.q, b.r);
    if (!basesByHex.has(k)) basesByHex.set(k, []);
    basesByHex.get(k).push(b);
  }

  return {
    replay, events, steps, stepOfEvent, states, eventById, orderById, ledTo, eventForces,
    hexes: hexList, hexByKey, bases, basesByHex, airGroups, initShips, finalForces, finalShips,
    groupTable, aircraftTypes, hasAir, umpire,
    placements, placementsByHex, hasLatLon, days, bounds: { minX, minY, maxX, maxY },
  };
}

/** Compares the rebuilt end state with replay.final. Returns a list of problems; empty means they agree. */
function compareWithFinal(model) {
  const problems = [];
  const final = model.replay.final;
  if (!final) return problems;
  const end = model.states[model.states.length - 1];
  const setEq = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  for (const f of final.task_forces || []) {
    const r = end.forces.get(f.id);
    if (!r) { problems.push('force ' + f.id + ' is in the final state but was never rebuilt'); continue; }
    if (!f.position || r.q !== f.position.q || r.r !== f.position.r) problems.push('force ' + f.id + ' rebuilt at (' + r.q + ',' + r.r + ') but final says ' + JSON.stringify(f.position));
    if (!setEq(r.ships, f.ships || [])) problems.push('force ' + f.id + ' ships rebuilt as [' + r.ships + '] but final says [' + (f.ships || []) + ']');

/** Cause trees for the Why box: a bounded, de-duplicated walk back through causes. */
function whyTree(model, eventId, opts) {

        else node.children = expand(obj.causes, depth + 1);
      }
      nodes.push(node);

    if (!hay.includes(text.toLowerCase())) return false;
  }

    if (sel.type === 'ship') return (ev.entities || []).includes('ship:' + sel.id);
  }

}

/** A group's reach at a step: the reach it is on then, and its type's figures (null when the replay carries none). */

// ---- Measuring (decisions 0040, 0017 and 0058) ----
// These repeat the engine's own functions with whole numbers. viewer/check.js
// runs them on viewer/measure_fixture.json, which the engine writes.
const HEX_NM = 40;
const SEA_KINDS = new Set(['deep_sea', 'shallow_sea', 'coast']);

/** The largest whole s with s * s <= n, for a whole n below 2^53. */
function isqrt(n) {
  let s = Math.floor(Math.sqrt(n));
  while (s * s > n) s--;
  while ((s + 1) * (s + 1) <= n) s++;
  return s;
}

/** Hex::air_distance_nm: the straight line between two hex centres in whole nautical miles. With x = 40 * 40 * (dq^2 + dr^2 + dq*dr) it is isqrt(4x) divided by 2, rounded up. */
function airDistanceNm(q1, r1, q2, r2) {
  const dq = q1 - q2, dr = r1 - r2;
  const x = HEX_NM * HEX_NM * (dq * dq + dr * dr + dq * dr);
  return Math.ceil(isqrt(4 * x) / 2);
}

/** What the sea path needs of the map: which hexes ships can enter and which sides are closed. */
function makeSeaMap(hexes, directions) {
  const cells = new Map();
  for (const h of hexes) {
    const closed = [false, false, false, false, false, false];
    for (const d of h.closed || []) if (Number.isInteger(d) && d >= 0 && d <= 5) closed[d] = true;
    cells.set(hexKey(h.q, h.r), { navigable: SEA_KINDS.has(h.kind), closed });
  }
  return { cells, directions };
}

/** Map::can_step: both hexes on the map and navigable, and the side between them open in both (a side is closed if either hex marks it). */
function canStep(sea, q, r, d) {
  const dir = sea.directions[d];
  if (!dir) return false;
  const here = sea.cells.get(hexKey(q, r)), there = sea.cells.get(hexKey(q + dir[0], r + dir[1]));
  return !!(here && there && here.navigable && there.navigable && !here.closed[d] && !there.closed[(d + 3) % 6]);

/** Map::sea_distances_to: fewest steps from every hex that can reach the target (breadth first from the target, directions in order). Empty if ships cannot enter the target. */
function seaDistancesTo(sea, tq, tr) {
  const dist = new Map();
  const t = sea.cells.get(hexKey(tq, tr));
  if (!t || !t.navigable) return dist;
  dist.set(hexKey(tq, tr), 0);
  const queue = [[tq, tr]];
  for (let head = 0; head < queue.length; head++) {
    const q = queue[head][0], r = queue[head][1];
    const next = dist.get(hexKey(q, r)) + 1;
    for (let d = 0; d < 6; d++) {
      const nq = q + sea.directions[d][0], nr = r + sea.directions[d][1], k = hexKey(nq, nr);
      if (!dist.has(k) && canStep(sea, q, r, d)) { dist.set(k, next); queue.push([nq, nr]); }
    }

  return dist;
}

/** Map::sea_path: every hex entered from (fq, fr) to the target, in order; [] for the same hex; null when ships cannot get there. */
function seaPath(sea, fq, fr, tq, tr) {
  const dist = seaDistancesTo(sea, tq, tr);
  if (!dist.has(hexKey(fq, fr))) return null;
  const out = [];
  let q = fq, r = fr;
  for (;;) {
    const here = dist.get(hexKey(q, r));
    if (here === 0) break;
    let step = null;
    for (let d = 0; d < 6 && !step; d++) {
      const nq = q + sea.directions[d][0], nr = r + sea.directions[d][1];
      if (dist.get(hexKey(nq, nr)) === here - 1 && canStep(sea, q, r, d)) step = [nq, nr];
    }
    if (!step) break;
    out.push(step);
    q = step[0]; r = step[1];
  }
  return out;
}

/** Hex::distance: the number of hex steps between two hexes. */
function hexDistance(q1, r1, q2, r2) {
  const dq = q1 - q2, dr = r1 - r2;
  return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
}

/** Map::step_charge_nm (decision 0058): what the step from (fq, fr) to its neighbour (nq, nr) is charged for a force steaming for (tq, tr). dist is seaDistancesTo the target. Where the way is clear (the sea path has as many steps as the hex distance) it is the miles the step brings the force closer in a straight line, at least 1; otherwise a hex. */
function stepChargeNm(dist, fq, fr, nq, nr, tq, tr) {
  if (dist.get(hexKey(fq, fr)) === hexDistance(fq, fr, tq, tr)) {
    return Math.max(1, airDistanceNm(fq, fr, tq, tr) - airDistanceNm(nq, nr, tq, tr));
  }
  return HEX_NM;
}

/** Both measures between two hexes a and b, each [q, r]: the air distance, and the sea route (null when there is none) with the charge of each of its steps and their sum in miles (decision 0058). */
function measureHexes(sea, a, b) {
  const path = seaPath(sea, a[0], a[1], b[0], b[1]);
  let sea_ = null;
  if (path) {
    const dist = seaDistancesTo(sea, b[0], b[1]);
    const charges = [];
    let q = a[0], r = a[1];
    for (const h of path) { charges.push(stepChargeNm(dist, q, r, h[0], h[1], b[0], b[1])); q = h[0]; r = h[1]; }
    sea_ = { path, steps: path.length, charges, nm: charges.reduce((x, y) => x + y, 0) };
  }
  return { air: airDistanceNm(a[0], a[1], b[0], b[1]), sea: sea_ };
}
